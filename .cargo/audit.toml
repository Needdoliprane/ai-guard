# cargo-audit configuration — ai-guard dependency advisory gate.
# Location: .cargo/audit.toml (project config dir read by cargo-audit >= 0.23).
# Reproducible review command, from the repository root: `cargo audit`
# (reads this file; scans Cargo.lock against the RustSec advisory database).
#
# Scoped exception — decided 2026-11-26, branch codex/rsa-audit-20261126,
# base 426b5aaf. Record: docs/engineering/RELEASE_CHECKLIST.md (26 nov. 2026).
#
# RUSTSEC-2023-0071 (CVE-2023-49092, "Marvin Attack", CVSS 5.9, patched
# >= 0.10.0) flags rsa 0.9.10, pulled ONLY by openidconnect =4.1.0.
# crates.io confirms openidconnect 4.1.0 (2026-10-31) is the latest release
# and still requires rsa ^0.9.2; rsa 0.10.0 was published 2026-11-08.
# No upstream migration target exists, so the pin cannot be lifted today.
#
# Justification (verified against the sources, not assumed): the Marvin
# attack recovers an RSA PRIVATE key via timing sidechannels in
# non-constant-time private-key operations (PKCS#1 v1.5 decryption/signing).
# In ai-guard, rsa 0.9.10 is reachable only for PUBLIC-key RS256 signature
# verification of provider JWTs:
#   - src/oidc/login.rs: public client (client secret None), Authorization
#     Code + PKCE S256, ID-token verifier restricted to RS256; no
#     private_key_jwt and no signed request objects.
#   - src/oidc/keys.rs: JWKS import rejects every private-key field
#     (d, p, q, dp, dq, qi, oth, k); only public RSA verify keys accepted.
#   - openidconnect 4.1.0 core/crypto.rs `verify_rsa_signature` builds
#     rsa::RsaPublicKey and calls verify(); JWE-encrypted ID tokens are
#     rejected as unsupported (verification/mod.rs): no RSA decryption path.
#   - Access-token verification uses jsonwebtoken 12.0.0, which already
#     depends on the patched rsa 0.10.0.
#   - The crate's private-key signing code (core/jwk/mod.rs) is never
#     invoked: no RsaPrivateKey / private-key JWK / ClientSecret usage in
#     src/, tests/ or examples/ of this repository.
#
# This ignore covers ONLY this advisory for this usage. Re-review and remove
# it when: (a) openidconnect publishes a release requiring rsa >= 0.10
# (upgrade and drop the ignore), (b) ai-guard adds private_key_jwt,
# request-object signing or JWE support, or (c) a new advisory affects the
# public-key verification path. Other advisories are never silenced here;
# informational warnings (e.g. chrono unmaintained) keep their defaults.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
