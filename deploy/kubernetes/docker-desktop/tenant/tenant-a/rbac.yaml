# Tenant A only: binds the namespaced Role to broker-tenant-a and grants
# the cluster-scoped reads ai-guard performs, each limited to exact names.
# broker-tenant-a receives no right in any other tenant namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-guard-session-broker
  labels:
    app.kubernetes.io/part-of: ai-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-guard-session-broker
subjects:
- kind: ServiceAccount
  name: broker-tenant-a
  namespace: ai-guard-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-guard-session-broker-tenant-a
  labels:
    app.kubernetes.io/part-of: ai-guard
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  resourceNames: ["kube-system", "ai-guard-tenant-a"]
  verbs: ["get"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  resourceNames: ["ai-guard-rwop"]
  verbs: ["get"]
- apiGroups: ["storage.k8s.io"]
  resources: ["csidrivers"]
  resourceNames: ["hostpath.csi.k8s.io"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-guard-session-broker-tenant-a
  labels:
    app.kubernetes.io/part-of: ai-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-guard-session-broker-tenant-a
subjects:
- kind: ServiceAccount
  name: broker-tenant-a
  namespace: ai-guard-control
