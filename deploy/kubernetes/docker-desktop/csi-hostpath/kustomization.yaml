# ai-guard LOCAL TEST recipe: CSI hostpath driver for Docker Desktop.
# Local test storage, not production; the client chooses its production
# storage. Render with `kubectl kustomize` and review before applying.
# Provenance, original hashes and every change: PROVENANCE.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every namespaced object below already names this namespace explicitly; the
# transformer only keeps the rendering consistent.
namespace: ai-guard-csi-hostpath

resources:
- namespace.yaml
# Unchanged upstream CSIDriver object (byte-identical copy).
- csi-hostpath-driverinfo.yaml
# Reviewed copies of the sidecar RBAC (ClusterRoles and leader-election Roles).
- external-attacher-rbac.yaml
- external-provisioner-rbac.yaml
# Reviewed copy of the plugin: ServiceAccount, bindings and StatefulSet.
- csi-hostpath-plugin.yaml

# Every image is pinned by the digest of its multi-architecture index
# (registry.k8s.io/sig-storage, observed on 21 November 2026; each index has a
# linux/arm64 child). The tag is kept for readability; the digest decides.
images:
- name: registry.k8s.io/sig-storage/hostpathplugin
  newTag: v1.19.0
  digest: sha256:3af7d1b51d7af6e1858fcb0f08d87c89b4cc64cc709adfa9d75320da8f2f175c
- name: registry.k8s.io/sig-storage/csi-node-driver-registrar
  newTag: v2.18.0
  digest: sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
- name: registry.k8s.io/sig-storage/livenessprobe
  newTag: v2.20.0
  digest: sha256:19f2cf2f40e1987c7943945deca5f65cd4e4bf5cc0657fc78a5df131861578e8
- name: registry.k8s.io/sig-storage/csi-attacher
  newTag: v4.13.0
  digest: sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
- name: registry.k8s.io/sig-storage/csi-provisioner
  newTag: v6.4.0
  digest: sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
