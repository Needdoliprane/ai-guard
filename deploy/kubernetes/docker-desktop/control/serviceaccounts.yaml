# One broker identity per tenant. Their rights are granted only by the
# tenant overlays (Role in the tenant namespace, ClusterRole with exact
# resource names). No token is ever mounted: credentials are requested by the
# operator with `kubectl create token --duration`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker-tenant-a
  namespace: ai-guard-control
  labels:
    app.kubernetes.io/part-of: ai-guard
    app.kubernetes.io/component: broker-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker-tenant-b
  namespace: ai-guard-control
  labels:
    app.kubernetes.io/part-of: ai-guard
    app.kubernetes.io/component: broker-identity
automountServiceAccountToken: false
