# Use with exactly one base (Docker or Podman), never a second judge override.
# Start the separate deploy/local-ai/compose.tls-volumes.yaml project first.
services:
  gateway:
    command: ["gateway", "--listen", "0.0.0.0:8787", "--control-listen", "0.0.0.0:8788", "--container-listen", "--data", "/data/audit.sqlite", "--runner-token-file", "/run/secrets/runner", "--viewer-token-file", "/run/secrets/viewer", "--policy", "/app/policies/default.json", "--jev-backend", "local-openai", "--jev-local-url", "https://${AI_GUARD_LOCAL_AI_TLS_SERVER_NAME:?Use volumes.env}:8443/v1/chat/completions", "--jev-local-model", "${AI_GUARD_LOCAL_AI_MODEL:-qwen2.5-0.5b-q4km}", "--jev-ca-file", "/run/ai-guard-trust/root-ca.pem"]
    image: ${AI_GUARD_CONTROL_IMAGE:?Use the inspected image ID from volumes.env}
    volumes:
      - type: volume
        source: local_judge_ca
        target: /run/ai-guard-trust
        read_only: true
        volume: {nocopy: true}
    networks: [control, judge_link]
networks:
  judge_link:
    external: true
    name: ${AI_GUARD_LOCAL_AI_TLS_NETWORK:?Use volumes.env}
volumes:
  local_judge_ca:
    external: true
    name: ${AI_GUARD_LOCAL_AI_TLS_CA_VOLUME:?Run model-tls provision first}
