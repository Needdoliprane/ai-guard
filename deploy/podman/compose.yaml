name: agentsandbox
services:
  gateway:
    image: ${AI_GUARD_CONTROL_IMAGE:-agentsandbox-control:local}
    command: ["gateway", "--listen", "0.0.0.0:8787", "--container-listen", "--data", "/data/audit.sqlite", "--runner-token-file", "/run/secrets/runner", "--viewer-token-file", "/run/secrets/viewer", "--policy", "/app/policies/default.json"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m
    cpus: "1.0"
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    volumes: ["audit_data:/data"]
    secrets: [runner, viewer]
    networks: [control]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "agentsandbox", "healthcheck", "--url", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  dashboard:
    image: ${AI_GUARD_CONTROL_IMAGE:-agentsandbox-control:local}
    command: ["dashboard", "--listen", "0.0.0.0:4000", "--container-listen", "--upstream", "http://gateway:8787", "--viewer-token-file", "/run/secrets/viewer", "--front-dir", "/app/front"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 192m
    cpus: "0.5"
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    secrets: [viewer]
    networks: [control]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "agentsandbox", "healthcheck", "--url", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  ingress:
    image: ${AI_GUARD_CONTROL_IMAGE:-agentsandbox-control:local}
    command: ["ingress", "--gateway-listen", "0.0.0.0:8787", "--dashboard-listen", "0.0.0.0:4000", "--container-listen", "--gateway-upstream", "http://gateway:8787", "--dashboard-upstream", "http://dashboard:4000"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 192m
    cpus: "0.5"
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    ports: ["127.0.0.1:${AI_GUARD_GATEWAY_PORT:-8787}:8787", "127.0.0.1:${AI_GUARD_DASHBOARD_PORT:-4000}:4000"]
    networks: [control, publication]
    depends_on:
      gateway:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "agentsandbox", "healthcheck", "--url", "http://127.0.0.1:8787/healthz", "--url", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  control:
    internal: true
  publication: {}
volumes:
  audit_data:
secrets:
  runner:
    file: ${AGENTSANDBOX_CONFIG_DIR:?Run agentsandbox init first}/mounted-secrets/runner
  viewer:
    file: ${AGENTSANDBOX_CONFIG_DIR:?Run agentsandbox init first}/mounted-secrets/viewer
