# Optional local inference, separate from the ai-guard data/identity projects.
name: ai-guard-local-ai
services:
  model:
    image: ${AI_GUARD_LOCAL_AI_IMAGE:-ai-guard-local-ai:qwen2.5-0.5b-q4km}
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - --model
      - /models/model.gguf
      - --ctx-size
      - "${AI_GUARD_LOCAL_AI_CONTEXT:-512}"
      - --batch-size
      - "32"
      - --ubatch-size
      - "32"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "0"
      - --predict
      - "${AI_GUARD_LOCAL_AI_DEFAULT_TOKENS:-64}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - "${AI_GUARD_LOCAL_AI_MODEL:-qwen2.5-0.5b-q4km}"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "${AI_GUARD_LOCAL_AI_CPUS:-2.0}"
    mem_limit: ${AI_GUARD_LOCAL_AI_MEMORY_BYTES:-1000000000}
    memswap_limit: ${AI_GUARD_LOCAL_AI_MEMORY_BYTES:-1000000000}
    pids_limit: 64
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    networks: [inference]
    healthcheck:
      disable: true
    logging:
      driver: none
    restart: "no"
  local-ai-ingress:
    image: ${AI_GUARD_CONTROL_IMAGE:-agentsandbox-control:local}
    command: ["http-relay", "--listen", "0.0.0.0:8080", "--container-listen", "--upstream", "http://model:8080"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "0.5"
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"]
    ports: ["127.0.0.1:${AI_GUARD_LOCAL_AI_PORT:-18090}:8080"]
    networks: [inference, publication]
    depends_on: [model]
    healthcheck:
      test: ["CMD", "agentsandbox", "healthcheck", "--url", "http://model:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    logging:
      driver: none
    restart: "no"
networks:
  inference:
    internal: true
  publication: {}
