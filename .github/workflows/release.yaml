name: Build tag and prepare GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New version tag matching Cargo and frontend (for example v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      # Binaries built by `cargo build --bins` that are not shipped in the native archives. The
      # test-CA generator stays a local tool (AGENTS.md); list names separated by spaces.
      EXCLUDED_BINARIES: ai-guard-demo-pki
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      sha: ${{ steps.gate.outputs.sha }}
      ci_url: ${{ steps.gate.outputs.ci_url }}
      native_binaries: ${{ steps.gate.outputs.native_binaries }}
      license_sha256: ${{ steps.gate.outputs.license_sha256 }}
    steps:
      - name: Validate manual release selection
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow on main"
            exit 1
          fi
          if [[ ${#RELEASE_TAG} -gt 64 || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Choose a new version tag such as v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the CI run and the declared version
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs" \
            -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -F per_page=1 \
            --jq '.workflow_runs[0] // {}')
          if ! jq -e --arg sha "$GITHUB_SHA" \
            '.head_sha == $sha and .status == "completed" and .conclusion == "success"' <<< "$run" >/dev/null; then
            echo "::error::The latest main push CI on this exact commit must finish successfully"
            exit 1
          fi
          ci_prefix="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/"
          if ! ci_url=$(jq -er --arg prefix "$ci_prefix" '
            .html_url | strings | select(startswith($prefix)) |
            select(ltrimstr($prefix) | test("^[1-9][0-9]*$"))
          ' <<< "$run"); then
            echo "::error::The CI run must report its GitHub Actions URL"
            exit 1
          fi
          version=${RELEASE_TAG#v}
          metadata=$(cargo metadata --locked --offline --no-deps --format-version 1)
          jq -e --arg version "$version" '.packages[] | select(.name == "agentsandbox") | .version == $version' <<< "$metadata" >/dev/null
          native_binaries=$(jq -er --arg excluded "$EXCLUDED_BINARIES" '
            [.packages[] | select(.name == "agentsandbox")] | select(length == 1)
            | [.[0].targets[] | select(.kind | index("bin")) | .name] | sort
            | . - ($excluded | split(" ") | map(select(length > 0)))
            | if index("agentsandbox") != null and length == (unique | length) and
                all(.[]; type == "string" and test("\\A[A-Za-z0-9_.-]+\\z") and . != "." and . != "..")
              then join(" ") else error("Invalid agentsandbox binary targets") end
          ' <<< "$metadata")
          jq -e --arg version "$version" '.version == $version' front/package.json >/dev/null
          jq -e --arg version "$version" '.version == $version and .packages[""].version == $version' front/package-lock.json >/dev/null
          if ! license_sum=$(git show --no-textconv "$GITHUB_SHA:LICENSE" | shasum -a 256) ||
            [[ ! ${license_sum%% *} =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Cannot hash LICENSE from the selected commit"
            exit 1
          fi
          printf 'tag=%s\nsha=%s\nci_url=%s\nnative_binaries=%s\nlicense_sha256=%s\n' \
            "$RELEASE_TAG" "$GITHUB_SHA" "$ci_url" "$native_binaries" "${license_sum%% *}" >> "$GITHUB_OUTPUT"

  # Describe the exact source before any tag exists: if this job fails, nothing is tagged.
  # The manifest is source-only; the archives are bound later by SHA256SUMS in the draft job.
  metadata:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      AI_GUARD_BUILD_REVISION: ${{ needs.verify.outputs.sha }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Produce and re-verify the release manifest and the CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          export AI_GUARD_VERSION="${RELEASE_TAG#v}"
          cargo fetch --locked
          cargo build --release --locked --offline --bin agentsandbox
          cli="$PWD/target/release/agentsandbox"

          mkdir -m 700 "$RUNNER_TEMP/private" "$RUNNER_TEMP/private/tmp" "$RUNNER_TEMP/private/parent"
          export TMPDIR="$RUNNER_TEMP/private/tmp"
          name="ai-guard-$RELEASE_TAG-release-metadata"
          package="$RUNNER_TEMP/package/$name"
          assets="$RUNNER_TEMP/release-assets"
          install -d "$package" "$assets"
          "$cli" release manifest --source . --output "$RUNNER_TEMP/private/parent/manifest"
          "$cli" release verify --source . --manifest "$RUNNER_TEMP/private/parent/manifest" --source-only
          install -d "$package/manifest"
          for file in release-manifest.json sbom.cdx.json SHA256SUMS; do
            install -m 0644 "$RUNNER_TEMP/private/parent/manifest/$file" "$package/manifest/$file"
          done
          jq -e --arg version "${RELEASE_TAG#v}" '
            .bomFormat == "CycloneDX" and .specVersion == "1.6" and .metadata.component.version == $version
          ' "$package/manifest/sbom.cdx.json" >/dev/null
          install -m 0644 LICENSE "$package/"
          printf 'tag=%s\ncommit=%s\nrun=%s\nrepository=%s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > "$package/BUILD-INFO"
          tar -C "$RUNNER_TEMP/package" -czf "$assets/$name.tar.gz" "$name"
          tar -tzf "$assets/$name.tar.gz" >/dev/null
          install -m 0644 "$package/manifest/sbom.cdx.json" "$assets/ai-guard-$RELEASE_TAG-sbom.cdx.json"
          cd "$assets"
          for file in "$name.tar.gz" "ai-guard-$RELEASE_TAG-sbom.cdx.json"; do
            test -s "$file"
            shasum -a 256 "$file" > "$file.sha256"
          done
      - name: Check third-party licence expressions against the reviewed list
        run: cargo run --quiet --locked --offline --example third_party_notices -- check --allowed .github/third-party-license-expressions.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  tag:
    needs: [verify, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      object_sha: ${{ steps.tag.outputs.object_sha }}
    steps:
      - name: Create or recover this run's annotated tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          marker="ai-guard-release-tag: $RELEASE_TAG $RELEASE_SHA $GITHUB_RUN_ID"
          endpoint="repos/$GITHUB_REPOSITORY/git"

          verify_tag_object() {
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_SHA" \
              --arg object "$object_sha" --arg marker "$marker" '
                .tag == $tag and .sha == $object and
                (.message == $marker or .message == ($marker + "\n")) and
                .object.type == "commit" and .object.sha == $commit
              ' >/dev/null
          }

          exact_ref=$(gh api "$endpoint/matching-refs/tags/$RELEASE_TAG" |
            jq -ce --arg ref "$tag_ref" '
              if type != "array" or any(.[]; (.ref | type) != "string")
              then error("Invalid tag reference response")
              else map(select(.ref == $ref))
              end
            ')
          if [[ "$exact_ref" == '[]' ]]; then
            tag_object=$(gh api --method POST "$endpoint/tags" \
              -f tag="$RELEASE_TAG" -f message="$marker" -f object="$RELEASE_SHA" -f type=commit)
            object_sha=$(jq -er '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$tag_object")
            verify_tag_object <<< "$tag_object"
            created_ref=$(gh api --method POST "$endpoint/refs" -f ref="$tag_ref" -f sha="$object_sha")
            jq -e --arg ref "$tag_ref" --arg object "$object_sha" '
              .ref == $ref and .object.type == "tag" and .object.sha == $object
            ' <<< "$created_ref" >/dev/null
          else
            if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
              echo "::error::A tag already exists; choose a new version"
              exit 1
            fi
            object_sha=$(jq -er '
              select(length == 1) | .[0].object | select(.type == "tag") |
              .sha | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<< "$exact_ref")
            tag_object=$(gh api "$endpoint/tags/$object_sha")
            if ! verify_tag_object <<< "$tag_object"; then
              echo "::error::The existing tag is not the annotated tag for this run and commit"
              exit 1
            fi
          fi
          printf 'object_sha=%s\n' "$object_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, tag]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_TAG_OBJECT: ${{ needs.tag.outputs.object_sha }}
      RUST_TARGET: ${{ matrix.target }}
      NATIVE_BINARIES: ${{ needs.verify.outputs.native_binaries }}
      AI_GUARD_BUILD_REVISION: ${{ needs.verify.outputs.sha }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - name: Build and package native binaries
        shell: bash
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$RELEASE_TAG_OBJECT"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RUST_TARGET"
          export AI_GUARD_VERSION="${RELEASE_TAG#v}"
          cargo fetch --locked --target "$RUST_TARGET"
          cargo build --release --locked --offline --bins --target "$RUST_TARGET"

          name="ai-guard-$RELEASE_TAG-$RUST_TARGET"
          package="$RUNNER_TEMP/package/$name"
          assets="$RUNNER_TEMP/release-assets"
          install -d "$package/bin" "$assets"
          install -m 0644 LICENSE "$package/"
          printf 'tag=%s\ncommit=%s\ntarget=%s\nrun=%s\nrepository=%s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$RUST_TARGET" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > "$package/BUILD-INFO"
          # Every crate source is needed to read the licence texts, whatever the target.
          cargo fetch --locked
          cargo run --quiet --release --locked --offline --target "$RUST_TARGET" \
            --example third_party_notices -- notices --allowed .github/third-party-license-expressions.txt \
            --output "$package/THIRD-PARTY-NOTICES"
          test -s "$package/THIRD-PARTY-NOTICES"
          read -r -a programs <<< "$NATIVE_BINARIES"
          test "${#programs[@]}" -gt 0
          for program in "${programs[@]}"; do
            install -m 0755 "target/$RUST_TARGET/release/$program" "$package/bin/"
          done
          "$package/bin/agentsandbox" --help >/dev/null
          if ! "$package/bin/agentsandbox" version --json |
            jq -es --arg version "${RELEASE_TAG#v}" --arg revision "$RELEASE_SHA" '
              length == 1 and (.[0] |
                .schema_version == 1 and .product == "ai-guard" and .component == "agentsandbox" and
                .version == $version and .build.revision == $revision)
            ' >/dev/null; then
            echo "::error::Packaged CLI identity does not match the release tag and commit"
            exit 1
          fi
          tar -C "$RUNNER_TEMP/package" -czf "$assets/$name.tar.gz" "$name"
          tar -tzf "$assets/$name.tar.gz" >/dev/null

      - name: Setup Node for the frontend bundle
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Build and package frontend assets
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        working-directory: front
        run: |
          export AI_GUARD_VERSION="${RELEASE_TAG#v}"
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s node_modules/vite/LICENSE.md
          name="ai-guard-$RELEASE_TAG-frontend"
          package="$RUNNER_TEMP/package/$name"
          install -d "$package/licenses"
          cp -R dist/. "$package/"
          install -m 0644 ../LICENSE "$package/"
          install -m 0644 node_modules/vite/LICENSE.md "$package/licenses/vite-LICENSE.md"
          printf 'tag=%s\ncommit=%s\nrun=%s\nrepository=%s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > "$package/BUILD-INFO"
          tar -C "$RUNNER_TEMP/package" -czf "$RUNNER_TEMP/release-assets/$name.tar.gz" "$name"

      - name: Record archive checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/release-assets"
          for archive in *.tar.gz; do
            test -s "$archive"
            test "$(wc -c < "$archive")" -lt 2147483648
            shasum -a 256 "$archive" > "$archive.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    needs: [verify, tag, metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_TAG_OBJECT: ${{ needs.tag.outputs.object_sha }}
      CI_URL: ${{ needs.verify.outputs.ci_url }}
      NATIVE_BINARIES: ${{ needs.verify.outputs.native_binaries }}
      LICENSE_SHA256: ${{ needs.verify.outputs.license_sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-download
          merge-multiple: true
      - name: Verify assets and prepare the draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_tag() {
            local ref
            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
            jq -e --arg ref "refs/tags/$RELEASE_TAG" --arg object "$RELEASE_TAG_OBJECT" '
              .ref == $ref and .object.type == "tag" and .object.sha == $object
            ' <<< "$ref" >/dev/null
          }

          verify_archive_members() {
            local archive=$1 name=$2 target=$3
            LC_ALL=C tar --numeric-owner -tvzf "$archive" |
              LC_ALL=C awk -v root="$name" -v target="$target" -v native_bins="$NATIVE_BINARIES" '
                function check_required(path, needs_execute) {
                  if (count[path] != 1 || !nonempty_regular[path] || (needs_execute && !owner_executable[path])) {
                    print "Expected one nonempty " (needs_execute ? "owner-executable " : "") "regular member: " path
                    failed = 1
                  }
                }
                BEGIN {
                  if (target != "frontend" && target != "release-metadata") {
                    n = split(native_bins, programs, " ")
                    for (i = 1; i <= n; i++) {
                      path = "bin/" programs[i]
                      if (programs[i] !~ /^[A-Za-z0-9_.-]+$/ || programs[i] == "." || programs[i] == ".." ||
                          (path in required_binaries)) failed = 1
                      required_binaries[path] = 1
                    }
                    if (failed || !("bin/agentsandbox" in required_binaries)) {
                      print "Missing or invalid verified native binary list"
                      failed = 1
                      exit 1
                    }
                  }
                }
                {
                  # GNU tar lists one uid/gid field. BSD tar lists link count, uid, and gid separately.
                  gnu = ($2 ~ /^[0-9]+\/[0-9]+$/)
                  size = gnu ? $3 : $5
                  fields = gnu ? 5 : 8
                  path = $0
                  for (i = 0; i < fields; i++) sub(/^[^[:blank:]]+[[:blank:]]+/, "", path)
                  type = substr($1, 1, 1)
                  if (type == "l") sub(/ -> .*/, "", path)
                  if (type == "h") sub(/ link to .*/, "", path)
                  if (type == "d") sub(/\/$/, "", path)
                  if (path == root) next
                  if (index(path, root "/") != 1 || path ~ /(^|\/)\.\.?($|\/)|\/\/|\/$/) {
                    print "Expected a member path under " root "/ without path aliases"
                    failed = 1
                    next
                  }
                  path = substr(path, length(root) + 2)
                  if (path == "BUILD-INFO" || path == "LICENSE" || (path in required_binaries) || path == "index.html" ||
                      path == "THIRD-PARTY-NOTICES" ||
                      (target == "release-metadata" && (path == "manifest/release-manifest.json" ||
                        path == "manifest/sbom.cdx.json" || path == "manifest/SHA256SUMS")) ||
                      (target == "frontend" && (path == "licenses/vite-LICENSE.md" || path ~ /^assets\/.+\.js$/))) {
                    count[path]++
                    nonempty_regular[path] = (type == "-" && size ~ /^[0-9]+$/ && size + 0 > 0)
                    owner_executable[path] = (substr($1, 4, 1) ~ /[xs]/)
                  }
                }
                END {
                  check_required("BUILD-INFO", 0)
                  check_required("LICENSE", 0)
                  if (target == "release-metadata") {
                    check_required("manifest/release-manifest.json", 0)
                    check_required("manifest/sbom.cdx.json", 0)
                    check_required("manifest/SHA256SUMS", 0)
                    if (count["index.html"] || count["THIRD-PARTY-NOTICES"]) {
                      print "Unexpected frontend or notices member in the metadata archive"
                      failed = 1
                    }
                  } else if (target == "frontend") {
                    check_required("index.html", 0)
                    check_required("licenses/vite-LICENSE.md", 0)
                    for (path in count) {
                      if (path ~ /^assets\/.+\.js$/ && count[path] == 1 && nonempty_regular[path]) has_script = 1
                    }
                    if (!has_script) {
                      print "Expected at least one nonempty regular JavaScript asset under assets/"
                      failed = 1
                    }
                  } else {
                    check_required("THIRD-PARTY-NOTICES", 0)
                    for (path in required_binaries) check_required(path, 1)
                  }
                  exit failed
                }
              '
          }

          cd "$RUNNER_TEMP/release-download"
          archives=(
            "ai-guard-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz"
            "ai-guard-$RELEASE_TAG-aarch64-apple-darwin.tar.gz"
            "ai-guard-$RELEASE_TAG-frontend.tar.gz"
            "ai-guard-$RELEASE_TAG-release-metadata.tar.gz"
          )
          sbom="ai-guard-$RELEASE_TAG-sbom.cdx.json"
          if [[ ! "$LICENSE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Missing or invalid LICENSE digest from the selected commit"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            test -s "$archive"
            test "$(wc -c < "$archive")" -lt 2147483648
            test "$(shasum -a 256 "$archive")" = "$(cat "$archive.sha256")"
            name=${archive%.tar.gz}
            target=${name#"ai-guard-$RELEASE_TAG-"}
            if ! verify_archive_members "$archive" "$name" "$target"; then
              echo "::error::$archive is missing required release content or contains invalid members"
              exit 1
            fi
            if ! license_sum=$(tar -xOzf "$archive" -- "$name/LICENSE" | shasum -a 256) ||
              [[ ${license_sum%% *} != "$LICENSE_SHA256" ]]; then
              echo "::error::$archive LICENSE does not match the selected commit"
              exit 1
            fi
            if ! tar -xOzf "$archive" -- "$name/BUILD-INFO" | cmp -s - <(
              printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$RELEASE_SHA"
              if [[ "$target" != frontend && "$target" != release-metadata ]]; then
                printf 'target=%s\n' "$target"
              fi
              printf 'run=%s\nrepository=%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
            ); then
              echo "::error::$archive BUILD-INFO does not match the selected tag, commit and target"
              exit 1
            fi
          done
          test -s "$sbom"
          test "$(shasum -a 256 "$sbom")" = "$(cat "$sbom.sha256")"
          metadata_archive="ai-guard-$RELEASE_TAG-release-metadata.tar.gz"
          if ! tar -xOzf "$metadata_archive" -- "ai-guard-$RELEASE_TAG-release-metadata/manifest/sbom.cdx.json" | cmp -s - "$sbom"; then
            echo "::error::The standalone SBOM differs from the SBOM inside the metadata archive"
            exit 1
          fi
          if ! jq -e --arg version "${RELEASE_TAG#v}" '
            .bomFormat == "CycloneDX" and .specVersion == "1.6" and
            (.components | type == "array" and length > 0) and .metadata.component.version == $version
          ' "$sbom" >/dev/null; then
            echo "::error::The SBOM is not a nonempty CycloneDX 1.6 document for the release version"
            exit 1
          fi
          shasum -a 256 "${archives[@]}" "$sbom" > SHA256SUMS
          files=("${archives[@]}" "$sbom" SHA256SUMS)
          expected=$(
            for file in "${files[@]}"; do
              checksum=$(shasum -a 256 "$file") || exit 1
              size=$(wc -c < "$file") || exit 1
              jq -cn --arg name "$file" --arg digest "sha256:${checksum%% *}" --argjson size "$size" '
                {key: $name, value: {size: $size, digest: $digest}}
              ' || exit 1
            done | jq -cs 'from_entries'
          )
          owner="ai-guard-release: $RELEASE_TAG $RELEASE_SHA $GITHUB_RUN_ID"
          upload_prefix="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/"

          find_release() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -ce --arg tag "$RELEASE_TAG" '
                [.[][] | select(.tag_name == $tag) | {
                  id, draft, body, upload_url,
                  assets: (.assets | map({id, name, state, size, digest}) | sort_by(.name))
                }]
              '
          }

          require_owned_draft() {
            if ! jq -e --arg owner "$owner" --argjson expected "$expected" --arg prefix "$upload_prefix" '
              length == 1 and (.[0] |
                .draft == true and (.id | type == "number" and (tostring | test("^[1-9][0-9]*$"))) and
                .upload_url == ($prefix + (.id | tostring) + "/assets{?name,label}") and
                ((.body // "" | split("\n") | map(select(startswith("ai-guard-release: ")))) == [$owner]) and
                ((.assets | map(.name) | unique | length) == (.assets | length)) and
                all(.assets[]; .state == "uploaded" and (({size, digest}) == $expected[.name]))
              )
            ' <<< "$1" >/dev/null; then
              echo "::error::Expected the current run's draft with only complete release assets"
              return 1
            fi
          }

          verify_tag
          draft=$(find_release)
          if [[ "$draft" == '[]' ]]; then
            printf 'Commit %s\n\nCI %s\n\n%s\n' "$RELEASE_SHA" "$CI_URL" "$owner" > "$RUNNER_TEMP/release-notes"
            verify_tag
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes"
            draft=$(find_release)
          fi
          require_owned_draft "$draft"
          draft_id=$(jq -er '.[0].id' <<< "$draft")
          upload_url=$(jq -er '.[0].upload_url | rtrimstr("{?name,label}")' <<< "$draft")

          missing=()
          for file in "${files[@]}"; do
            if jq -e --arg file "$file" 'any(.[0].assets[]; .name == $file)' <<< "$draft" >/dev/null; then
              if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --output - |
                cmp -s "$file" -; then
                echo "::error::Existing draft asset differs or cannot be verified: $file"
                exit 1
              fi
            else
              missing+=("$file")
            fi
          done
          verify_tag
          if [[ "${#missing[@]}" -gt 0 ]]; then
            if [[ "$(find_release)" != "$draft" ]]; then
              echo "::error::Draft changed while validating existing assets; inspect before retrying"
              exit 1
            fi
            for file in "${missing[@]}"; do
              current=$(find_release)
              require_owned_draft "$current"
              jq -e --argjson id "$draft_id" --arg file "$file" '
                .[0] | .id == $id and all(.assets[]; .name != $file)
              ' <<< "$current" >/dev/null
              verify_tag
              gh api "$upload_url" --hostname github.com --method POST \
                -H 'Content-Type: application/octet-stream' --input "$file" -f "name=$file" |
                jq -e --arg file "$file" --argjson expected "$expected" '
                  .name == $file and .state == "uploaded" and (({size, digest}) == $expected[$file])
                ' >/dev/null
            done
          fi
          final=$(find_release)
          require_owned_draft "$final"
          jq -e --argjson id "$draft_id" --argjson expected "$expected" '
            .[0] | .id == $id and ((.assets | map(.name)) == ($expected | keys))
          ' <<< "$final" >/dev/null
          verify_tag
