name: G09 Handoff timeout diagnostic

# The diagnostic branch carries this workflow. The recipe comes from the
# separate, pinned instrumentation commit.
'on':
  push:
    branches: [codex/g09-handoff-diagnostic-4914-20261127]
    paths: [.github/workflows/g09-handoff-timeout.yaml]

permissions:
  contents: read

env:
  HANDOFF_SOURCE_SHA: 2f7aed3f312eb2b0c8f058d794b890823f3f4a7e
  HANDOFF_ORACLE: software_broker_missing_receipt_expires_under_original_arm_without_exec

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HANDOFF_SOURCE_SHA }}
          persist-credentials: false
      - name: Run the exact Handoff expiry oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HANDOFF_SOURCE_SHA"
          export AI_GUARD_BUILD_REVISION="$HANDOFF_SOURCE_SHA"
          export TMPDIR="$(mktemp -d /tmp/aig.XXXXXX)"
          handoff_log=$(mktemp "${RUNNER_TEMP:?}/g09-handoff.XXXXXX")
          trap 'rm -f -- "$handoff_log"' EXIT

          printf 'source_sha=%s oracle=%s\n' "$HANDOFF_SOURCE_SHA" "$HANDOFF_ORACLE"
          if ! cargo fetch --locked --target host-tuple >"$handoff_log" 2>&1; then
            printf 'result=NOT_RUN phase=fetch_dependencies\n'
            exit 1
          fi

          handoff_status=0
          cargo test --locked --offline --test broker_relay_handoff "$HANDOFF_ORACLE" -- \
            --exact --test-threads=1 --show-output >"$handoff_log" 2>&1 || handoff_status=$?

          unconfirmed() {
            printf 'result=UNCONFIRMED phase=%s cargo_exit=%s\n' "$1" "$handoff_status"
            exit 1
          }
          test_count=$(grep -Fxc 'running 1 test' "$handoff_log" || true)
          pass_count=$(grep -Fxc "test $HANDOFF_ORACLE ... ok" "$handoff_log" || true)
          fail_count=$(grep -Fxc "test $HANDOFF_ORACLE ... FAILED" "$handoff_log" || true)
          (( test_count == 1 )) || unconfirmed oracle_result
          if (( handoff_status == 0 && pass_count == 1 && fail_count == 0 )); then
            oracle_result=PASS
          elif (( handoff_status != 0 && pass_count == 0 && fail_count == 1 )); then
            oracle_result=FAIL
          else
            unconfirmed oracle_result
          fi

          # Match whole records from the pinned oracle before publishing them.
          expected_steps=(
            fixture_start submit wait_endpoint read_original_fact check_original_arm
            wait_worker_terminal check_terminal_arm read_final_fact check_retained_arm
            check_no_exec check_no_auto_provision fixture_close
          )
          step_names=$(IFS='|'; printf '%s' "${expected_steps[*]}")
          progress_prefix='phase=handoff_progress step='
          progress_pattern="${progress_prefix}(${step_names})"
          start_failure='startup=(error|timeout) exercise=not_started cleanup=unobserved'
          start_success='startup=passed exercise=(passed|error|timeout|outer_timeout) cleanup=(passed|error|timeout)'
          outcome_pattern="phase=handoff_outcome (${start_failure}|${start_success})"
          phase='phase=handoff_(wait_endpoint|worker_terminal)'
          flag='(true|false)'
          number='[0-9]{1,20}'
          code='(Unauthorized|Forbidden|Unavailable|IncompatibleControl|Busy|InvalidInput|Conflict|Interrupted|LimitExceeded|NeedsReconciliation)'
          job_state='(Absent|ReservedInProcess|Interrupted|Rejected|Accepted)'
          worker_state='(Reserved|Preparing|Created|StartIssued|Running|Stopping|Terminal|InDoubt|Cancelled)'
          relay_phase='(AwaitingIssuedWorkload|Admitted|Unknown|Closed)'
          core_state='(Reserved|CancelledBeforeClaim|KnownRefusedBeforeSpawn|AcceptedBeforeExec|Ready|Closing|Unknown|Closed)'
          relay_error='(Unavailable|InvalidMaterial|Scope|Expired|Clock|Cancelled|Capacity|Unknown)'
          relay_view="configured=${flag} freshness=(RetainedAtLastObservation|NotObserved) attachment_phase=(None|Some\(${relay_phase}\)) endpoint_present=${flag} core_state=(None|Some\(${core_state}\)) last_error=(None|Some\(${relay_error}\)) reconciliation_required=${flag}"
          job_view="state=${job_state} head_revision=(None|Some\(${number}\)) pending_rpcs=(None|Some\(${number}\)) failure_count=${number} worker_state=(None|Some\(${worker_state}\)) quota_held=(None|Some\(${flag}\)) executor_running=${flag} executor_error=(None|Some\(${code}\))"
          grep -Ex \
            -e "$progress_pattern" \
            -e "$outcome_pattern" \
            -e "${phase} category=(timeout|error)" \
            -e "${phase} view=(relay_status|job_status) category=(request_error|probe_timeout|unexpected_reply|broker_refusal refusal=${code})" \
            -e "${phase} view=relay_status category=observed ${relay_view}" \
            -e "${phase} view=job_status category=observed ${job_view}" \
            -e "${phase} view=worker category=(endpoint_unavailable|identity_unconfirmed|absent|read_error|observed state=${worker_state} quota_held=${flag})" \
            -e 'phase=fixture_legacy_guardian_close category=(original_exit_observed|idle_acknowledged_exit|exact_fixture_signal_exit|exact_fixture_signal_exit_idle_unconfirmed)' \
            "$handoff_log" | sed -n '1,20p' || true

          outcome=$(grep -Ex "$outcome_pattern" "$handoff_log" || true)
          [[ -n $outcome && $outcome != *$'\n'* ]] || unconfirmed diagnostic_mismatch
          passed_outcome='phase=handoff_outcome startup=passed exercise=passed cleanup=passed'
          if [[ $oracle_result == PASS ]]; then
            [[ $outcome == "$passed_outcome" ]] || unconfirmed diagnostic_mismatch
          else
            [[ $outcome != "$passed_outcome" ]] || unconfirmed diagnostic_mismatch
          fi

          observed_steps=()
          step_count=0
          while IFS= read -r marker; do
            observed_steps[step_count]="${marker#"$progress_prefix"}"
            step_count=$((step_count + 1))
          done < <(grep -Ex "$progress_pattern" "$handoff_log")
          (( step_count > 0 && step_count <= ${#expected_steps[@]} )) || unconfirmed diagnostic_mismatch
          if [[ $outcome == *' exercise=not_started '* ]]; then
            (( step_count == 1 )) || unconfirmed diagnostic_mismatch
            prefix_count=1
          else
            (( step_count >= 2 )) || unconfirmed diagnostic_mismatch
            [[ ${observed_steps[step_count - 1]} == fixture_close ]] || unconfirmed diagnostic_mismatch
            prefix_count=$((step_count - 1))
            if [[ $outcome == *' exercise=passed '* ]]; then
              (( step_count == ${#expected_steps[@]} )) || unconfirmed diagnostic_mismatch
            elif [[ $outcome != *' exercise=outer_timeout '* ]]; then
              (( prefix_count > 1 )) || unconfirmed diagnostic_mismatch
            fi
          fi
          for (( i = 0; i < prefix_count; i++ )); do
            [[ ${observed_steps[i]} == "${expected_steps[i]}" ]] || unconfirmed diagnostic_mismatch
          done

          printf 'result=%s\n' "$oracle_result"
          exit "$handoff_status"
