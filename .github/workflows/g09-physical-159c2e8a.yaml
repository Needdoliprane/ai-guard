name: G09 physical qualification with executor evidence

# Two targeted Rust registration oracles precede one ignored Linux integration selector.
# The test SIGKILLs only its own run-client process; the workload has no network
# or provider. Docker inventory is read-only and fixture resources are retained.
on:
  push:
    branches:
      - codex/qualification-g09-159c2e8a

permissions:
  contents: read

concurrency:
  group: g09-physical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terminal-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SOURCE_SHA: 159c2e8a69d4dab3a001965359e8cef427ba7380
      SOURCE_TREE: 7fe953b44696f379dd5dd91df137bf15fcb41ef9
      EXPECTED_TEST_BLOB: 65023e8c7957ec68f51e4ac174283f6e291bbafc
      EXPECTED_SUPPORT_BLOB: da9a4270353d98c702754fc729811508a0c52954
      EXPECTED_CHECKPOINT_BLOB: 4d19e619339ea323d1867dceb289ae6b9928c186
      LOCK_SHA: 8a79f3875dbe4d7e509c1626bad33ea6824f59c4
      EXPECTED_BRANCH: codex/qualification-g09-159c2e8a
      SELECTOR: broker_run_cli_sigkill_preserves_original_deadline_without_second_start
      REGISTRATION_DIAGNOSTIC_SELECTOR: runner::broker::executor::diagnostics::tests::registration_failure_reports_only_the_coded_boundary_and_arm_state
      REGISTRATION_PROJECTION_SELECTOR: executor_failure_projection_keeps_only_closed_registration_evidence
      AI_GUARD_BUILD_REVISION: 159c2e8a69d4dab3a001965359e8cef427ba7380
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      DOCKER_HOST: unix:///var/run/docker.sock
      LC_ALL: C
    steps:
      - name: Initialize closed run-client receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          cat > "$receipt" <<EOF
          source_sha=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          baseline_run=45346384714
          workflow_sha=$WORKFLOW_SHA
          workflow_parent_sha=unknown
          source_guard=NOT_RUN
          rootful_preflight=NOT_RUN
          docker_server_version=unknown
          worker_image_id=unknown
          worker_image_build=NOT_RUN
          worker_image_uid=NOT_RUN
          worker_image_arch=NOT_RUN
          provider_cli_versions=NONE_SELECTED
          worker_network=none
          dependency_fetch=NOT_RUN
          build_no_run=NOT_RUN
          build_exit=unknown
          broker_runtime_test_sha256=unknown
          library_test_sha256=unknown
          build_error_codes=none
          test_selector=$SELECTOR
          registration_diagnostic_selector=$REGISTRATION_DIAGNOSTIC_SELECTOR
          registration_diagnostic_verdict=NOT_RUN
          registration_projection_selector=$REGISTRATION_PROJECTION_SELECTOR
          registration_projection_verdict=NOT_RUN
          pure_witnesses=RUN_EXACTLY_ONCE_BELOW
          test_selected=unknown
          test_passed=unknown
          test_failed=unknown
          test_ignored=unknown
          test_exit=unknown
          test_verdict=NOT_RUN
          evidence_root=NOT_VERIFIED
          result_file=NOT_READ
          run_client_state=NOT_READ
          run_client_stage=NOT_READ
          central_terminal_observed_within_window=unknown
          worker_deadline_evidence=unknown
          terminal_wait_sample_worker_write_state=NOT_READ
          terminal_wait_sample_status_write_state=NOT_READ
          terminal_wait_sample_projection=NOT_READ
          terminal_failure_step=NOT_READ_CONDITION_UNMET
          terminal_failure_read=unverified
          executor_failure_page=NOT_READ
          executor_failure_outbox=NOT_READ
          terminal_checkpoint.head_revision=unknown
          terminal_checkpoint.result_audit_at_head=unknown
          terminal_checkpoint.failure_audit_at_head=unknown
          outcome_diagnosis=NOT_RUN
          fixture_retention=TEST_DECLARED_PRIVATE
          containers_before=unknown
          containers_after=unknown
          containers_new=unknown
          volumes_before=unknown
          volumes_after=unknown
          volumes_new=unknown
          images_before=unknown
          images_after=unknown
          images_new=unknown
          engine_cleanup=NOT_PERFORMED
          receipt_closed=NO
          last_phase=initialized
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify frozen candidate and workflow-only child
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" &&
                "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$SOURCE_TREE" &&
                "$(git rev-parse "$SOURCE_SHA:Cargo.lock")" == "$LOCK_SHA" &&
                "$(git rev-parse "$SOURCE_SHA:tests/broker_runtime.rs")" == "$EXPECTED_TEST_BLOB" &&
                "$(git rev-parse "$SOURCE_SHA:tests/support/broker_runtime.rs")" == "$EXPECTED_SUPPORT_BLOB" &&
                "$(git rev-parse "$SOURCE_SHA:tests/support/broker_runtime_checkpoint.rs")" == "$EXPECTED_CHECKPOINT_BLOB" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/g09-physical-159c2e8a.yaml &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             grep -Fq "async fn $SELECTOR() -> Result<()>" tests/broker_runtime.rs &&
             grep -Fq 'let killed_status = run_cli.kill_owned()?;' tests/broker_runtime.rs &&
             grep -Fq '"network":"none"' tests/broker_runtime.rs &&
             grep -Fq 'retain enforcer, workspace and evidence' tests/broker_runtime.rs &&
             grep -Fq "fn ${REGISTRATION_DIAGNOSTIC_SELECTOR##*::}()" src/runner/broker/executor/diagnostics.rs &&
             grep -Fq "fn $REGISTRATION_PROJECTION_SELECTOR()" tests/broker_runtime.rs &&
             grep -Fq '"terminal_checkpoint":terminal_checkpoint' tests/broker_runtime.rs &&
             grep -Fq '"terminal_failure_read":observations.terminal_failure_read' tests/broker_runtime.rs &&
             grep -Fq 'head_revision: Option<NonZeroU64>' tests/support/broker_runtime_checkpoint.rs &&
             grep -Fq 'Directory::open_existing(&self.job_root)' tests/support/broker_runtime_checkpoint.rs &&
             grep -Fq 'file.revalidate().ok()?' tests/support/broker_runtime_checkpoint.rs; then
            set_field workflow_parent_sha "$SOURCE_SHA"
            set_field source_guard PASS
            set_field last_phase source_verified
          else
            set_field source_guard FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Prepare private Cargo scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=private_scratch_prepare/' "$receipt"
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private"
          canonical="$(realpath -- "$private")"
          [[ "$canonical" == "$private" && "$(stat -c '%a' "$private")" == 700 ]]
          mkdir -m 700 "$private/target" "$private/tmp"
          [[ "$(realpath -- "$private/target")" == "$private/target" && "$(stat -c '%a' "$private/target")" == 700 ]]
          [[ "$(realpath -- "$private/tmp")" == "$private/tmp" && "$(stat -c '%a' "$private/tmp")" == 700 ]]
          printf 'G09_PRIVATE=%s\nTMPDIR=%s\nCARGO_TARGET_DIR=%s/target\n' "$private" "$private/tmp" "$private" >> "$GITHUB_ENV"
          sed -i 's/^last_phase=.*/last_phase=private_scratch_ready/' "$receipt"

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=dependency_fetch/' "$receipt"
          if cargo fetch --locked > "$G09_PRIVATE/fetch.log" 2>&1; then
            sed -i 's/^dependency_fetch=NOT_RUN$/dependency_fetch=PASS/' "$receipt" || true
            sed -i 's/^last_phase=.*/last_phase=dependencies_fetched/' "$receipt"
          else
            rc=$?
            sed -i 's/^dependency_fetch=NOT_RUN$/dependency_fetch=FAIL/' "$receipt" || true
            sed -i "s/^last_phase=.*/last_phase=dependency_fetch_failed_exit_${rc}/" "$receipt"
            exit "$rc"
          fi

      - name: Prepare both test executables in one Cargo invocation
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase broker_runtime_no_run
          if cargo test --locked --offline --lib --test broker_runtime --no-run --message-format=json > "$G09_PRIVATE/build.jsonl" 2> "$G09_PRIVATE/build.stderr"; then
            broker_test="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "broker_runtime" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl" 2>/dev/null || true)"
            library_test="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl" 2>/dev/null || true)"
            [[ -n "$broker_test" && -x "$broker_test" && -n "$library_test" && -x "$library_test" ]]
            set_field broker_runtime_test_sha256 "$(sha256sum "$broker_test" | awk '{print $1}')"
            set_field library_test_sha256 "$(sha256sum "$library_test" | awk '{print $1}')"
            set_field build_no_run PASS
            set_field build_exit 0
            printf '%s\n' "$broker_test" > "$G09_PRIVATE/broker-runtime-test.path"
            printf '%s\n' "$library_test" > "$G09_PRIVATE/library-test.path"
            set_field last_phase broker_runtime_compiled_no_run
          else
            rc=$?
            set_field build_no_run FAIL
            set_field build_exit "$rc"
            jq -r 'select(.reason == "compiler-message" and .message.level == "error") | .message.code.code // empty | select(test("^E[0-9]{4}$"))' "$G09_PRIVATE/build.jsonl" 2>/dev/null | sort -u > "$G09_PRIVATE/build.codes" || true
            set_field build_error_codes "$(paste -sd, "$G09_PRIVATE/build.codes" | sed 's/^$/none/')"
            set_field last_phase broker_runtime_no_run_failed
            exit "$rc"
          fi

      - name: Run the two exact registration oracles
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          broker_test="$(<"$G09_PRIVATE/broker-runtime-test.path")"
          [[ -x "$broker_test" && "$(sha256sum "$broker_test" | awk '{print $1}')" == "$(grep '^broker_runtime_test_sha256=' "$receipt" | cut -d= -f2)" ]]
          library_test="$(<"$G09_PRIVATE/library-test.path")"
          [[ -x "$library_test" && "$(sha256sum "$library_test" | awk '{print $1}')" == "$(grep '^library_test_sha256=' "$receipt" | cut -d= -f2)" ]]
          pure_failed=0
          run_pure_selector() {
            local executable=$1 selector=$2 key=$3 log="$G09_PRIVATE/pure-$3.log" rc selected=0 passed=0 summary=0
            set_field last_phase "pure_$key"
            if timeout --signal=TERM --kill-after=5s 60s "$executable" "$selector" --exact --test-threads=1 > "$log" 2>&1; then rc=0; else rc=$?; fi
            grep -Fxq 'running 1 test' "$log" && selected=1 || true
            grep -Fxq "test $selector ... ok" "$log" && passed=1 || true
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log" && summary=1 || true
            if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$summary" == 1 ]]; then
              set_field "$key"_verdict PASS_1_0_0
              set_field last_phase "$key"_passed
            else
              set_field "$key"_verdict FAIL_OR_NOT_SELECTED
              set_field last_phase "$key"_failed_or_not_selected
              pure_failed=1
            fi
          }
          run_pure_selector "$library_test" "$REGISTRATION_DIAGNOSTIC_SELECTOR" registration_diagnostic
          run_pure_selector "$broker_test" "$REGISTRATION_PROJECTION_SELECTOR" registration_projection
          if (( pure_failed != 0 )); then
            set_field pure_witnesses FAIL_OR_NOT_SELECTED
            exit 1
          fi
          set_field pure_witnesses PASS_2_OF_2_EXACT_SOURCE
          set_field last_phase pure_registration_oracles_complete

      - name: Verify rootful Docker and inventory existing resources
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rootful_preflight
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' default)"
          security="$(docker info --format '{{json .SecurityOptions}}')"
          platform="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')"
          if [[ -S /var/run/docker.sock && "$endpoint" == unix:///var/run/docker.sock && "$platform" == linux/amd64 ]] &&
             jq -e 'all(.[]; (ascii_downcase | contains("rootless")) | not)' <<< "$security" >/dev/null; then
            docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$G09_PRIVATE/containers.before"
            docker volume ls -q | LC_ALL=C sort -u > "$G09_PRIVATE/volumes.before"
            docker image ls -q --no-trunc | LC_ALL=C sort -u > "$G09_PRIVATE/images.before"
            set_field containers_before "$(wc -l < "$G09_PRIVATE/containers.before" | tr -d ' ')"
            set_field volumes_before "$(wc -l < "$G09_PRIVATE/volumes.before" | tr -d ' ')"
            set_field images_before "$(wc -l < "$G09_PRIVATE/images.before" | tr -d ' ')"
            version="$(docker version --format '{{.Server.Version}}')"
            [[ "$version" =~ ^[0-9][a-zA-Z0-9.+~-]*$ ]]
            set_field docker_server_version "$version"
            set_field rootful_preflight PASS
            set_field last_phase rootful_preflight_complete
          else
            set_field rootful_preflight FAIL
            set_field last_phase rootful_preflight_failed
            exit 1
          fi

      - name: Build the private UID 1000 worker image without provider clients
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          tag="ai-guard-g09-run-client:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field last_phase worker_image_build
          if docker build --file images/worker.Dockerfile --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= --tag "$tag" . > "$G09_PRIVATE/worker-build.log" 2>&1; then
            image_id="$(docker image inspect --format '{{.Id}}' "$tag")"
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$(docker image inspect --format '{{.Config.User}}' "$image_id")" == 1000:1000 ]]
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" == linux/amd64 ]]
            printf '%s\n' "$image_id" > "$G09_PRIVATE/image.id"
            printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_ALLOW_ROOTFUL=1\nAGENTSANDBOX_TEST_RETAIN_ENFORCER=1\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=unix:///var/run/docker.sock\nAGENTSANDBOX_TEST_IMAGE=%s\nAGENTSANDBOX_TEST_BROKER_NATIVE_START=1\nAGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS=30\n' "$image_id" >> "$GITHUB_ENV"
            set_field worker_image_id "$image_id"
            set_field worker_image_build PASS
            set_field worker_image_uid 1000:1000
            set_field worker_image_arch linux/amd64
            set_field provider_cli_versions NONE_SELECTED
            set_field last_phase worker_image_verified
          else
            set_field worker_image_build FAIL
            set_field last_phase worker_image_build_failed
            exit 1
          fi

      - name: Run the single client-disappearance Docker selector and classify its result
        shell: bash
        env:
          AGENTSANDBOX_TEST_RUNTIME: docker
          AGENTSANDBOX_TEST_ALLOW_ROOTFUL: '1'
          AGENTSANDBOX_TEST_RETAIN_ENFORCER: '1'
          AGENTSANDBOX_TEST_RUNTIME_PROGRAM: /usr/bin/docker
          AGENTSANDBOX_TEST_RUNTIME_ENDPOINT: unix:///var/run/docker.sock
          AGENTSANDBOX_TEST_BROKER_NATIVE_START: '1'
          AGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS: '30'
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector="$SELECTOR"
          log="$G09_PRIVATE/test.log"
          set_field last_phase targeted_terminal_audit_recovery
          broker_test="$(<"$G09_PRIVATE/broker-runtime-test.path")"
          [[ -x "$broker_test" && "$(sha256sum "$broker_test" | awk '{print $1}')" == "$(grep '^broker_runtime_test_sha256=' "$receipt" | cut -d= -f2)" ]]
          if timeout --signal=TERM --kill-after=30s 660s "$broker_test" "$selector" --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1; then rc=0; else rc=$?; fi
          selected=0 passed=0 failed=0 ignored=0 summary_ok=0
          [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] && selected=1 || true
          if grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log"; then
            passed=1
            summary_ok=1
          elif grep -Eq '^test result: FAILED\. [0-9]+ passed; [1-9][0-9]* failed; [0-9]+ ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log"; then
            failed=1
          fi
          grep -Fxc "test $selector ... FAILED" "$log" >/dev/null 2>&1 && failed=1 || true
          set_field test_selected "$selected"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"
          if [[ "$(grep -Fxc 'running 1 test' "$log" || true)" != 1 ]]; then
            set_field selected_test_status SELECTOR_NOT_ATTESTED
            set_field run_client_state NOT_ATTESTED
            set_field run_client_stage NOT_ATTESTED
            set_field outcome_diagnosis SELECTOR_NOT_ATTESTED
            set_field test_verdict FAIL
            exit 1
          fi
          evidence_root="$(sed -nE "s|^test $selector \.\.\. retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\1|p; s|^retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\1|p" "$log" | LC_ALL=C sort -u)"
          if [[ "$(printf '%s\n' "$evidence_root" | sed '/^$/d' | wc -l | tr -d ' ')" != 1 ||
                ! "$evidence_root" =~ ^/tmp/br-[[:alnum:]]{6}$ || ! -d "$evidence_root" || -L "$evidence_root" ||
                "$(realpath -- "$evidence_root")" != "$evidence_root" ||
                "$(stat -c '%u %a' "$evidence_root")" != "$(id -u) 700" ]]; then
            set_field evidence_root PRIVATE_ROOT_NOT_VERIFIED
            set_field run_client_state NOT_READ
            set_field run_client_stage NOT_READ
            set_field outcome_diagnosis PRIVATE_ROOT_NOT_VERIFIED
            set_field test_verdict FAIL
            exit 1
          fi
          set_field evidence_root VERIFIED_PRIVATE
          set_field result_file PRIVATE_VERIFIED
          read_result_field() {
            local pointer=$1
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -ers --arg pointer "$pointer" '
              if length == 1 and (.[0] | type == "object") and
                 (.[0].run_client_recovery | type == "object") then
                .[0].run_client_recovery | .[$pointer] | select(type == "string")
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          read_executor_projection() {
            local field=$1
            [[ "$field" == executor_failure_page || "$field" == executor_failure_outbox ]] || return 1
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" &&
               "$(stat -c '%s' "$evidence_root/result.json")" -le 65536 ]] || return 1
            jq -cers -r --arg field "$field" '
              def flag: type == "boolean";
              def count: type == "number" and . >= 0 and . <= 512 and . == floor;
              def phase:
                . == null or IN("decision", "workspace_preparation", "admission", "import",
                                "import_verification", "worker", "final_scan", "export", "cleanup");
              def step:
                . == null or IN("activity_spool", "failure_observed", "ownership_commit",
                                "ownership_reload", "created_inspection", "created_exchange",
                                "arm_exchange", "registration", "load_after_registration",
                                "readiness_before_claim", "clock_before_claim", "claim_exchange",
                                "generation_before_prepare", "prepare", "terminal_observation_ack",
                                "result_audit", "cleanup_confirmation", "cleanup_ack");
              def registration:
                type == "object" and keys == ["arm_state", "stage"] and
                (((.stage | IN("reserve_prospective", "begin_exchange")) and .arm_state == "pending") or
                 ((.stage | IN("build_registration", "bind_prospective", "restore_assigned", "register_legacy")) and
                  .arm_state == "acknowledged"));
              def row:
                type == "object" and
                ((keys - ["registration"]) == ["after_admission", "broker_step", "observed_provenance",
                                                "phase", "runner_source", "session_matches"]) and
                (if has("registration") then
                   .broker_step == "registration" and .after_admission and .runner_source and
                   .session_matches and .observed_provenance and .phase != null and
                   (.registration | registration)
                 else true end) and
                (.after_admission | flag) and (.runner_source | flag) and
                (.session_matches | flag) and (.observed_provenance | flag) and
                (.phase | phase) and (.broker_step | step);
              def valid_page:
                type == "object" and keys == ["cursor", "rows"] and
                (.cursor | IN("complete", "present", "unknown")) and
                (.rows == null or (.rows | type == "array" and length <= 2 and all(.[]; row)));
              def valid_outbox:
                type == "object" and
                keys == ["acknowledged", "central_ack_matches", "pending", "unexpected_identity"] and
                (.acknowledged | count) and (.pending | count) and (.unexpected_identity | count) and
                (.acknowledged + .pending + .unexpected_identity <= 512) and
                (.acknowledged as $acked |
                 .central_ack_matches == null or
                 (.central_ack_matches | type == "array" and length <= 2 and
                  all(.[]; . == null or (count and . <= $acked))));
              select(length == 1) | .[0] | select(type == "object") |
              select(.run_client_recovery.state == "failed" and .run_client_recovery.stage == "executor") |
              .[$field] |
              if . == null then "NOT_OBSERVED"
              elif $field == "executor_failure_page" then select(valid_page)
              else select(valid_outbox) end
            ' "$evidence_root/result.json" 2>/dev/null
          }
          read_terminal_wait_sample_field() {
            local field=$1
            [[ "$field" == worker || "$field" == status ]] || return 1
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -ers --arg field "$field" '
              if length == 1 and (.[0] | type == "object") and
                 (.[0].run_client_recovery | type == "object") then
                .[0].run_client_recovery
                | select(.state == "failed" and .stage == "terminal_wait")
                | .terminal_wait_sample
                | select(type == "object")
                | .[$field]
                | select(type == "string")
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          read_central_terminal_observation() {
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -rs '
              if length == 1 and (.[0] | type == "object") and
                 (.[0].central_terminal_observed_within_window | type == "boolean") then
                .[0].central_terminal_observed_within_window | tostring
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          read_worker_deadline_evidence() {
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -rs '
              if length == 1 and (.[0] | type == "object") then
                .[0].worker_deadline_evidence
                | select(. == "attested" or . == "not_attested")
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          read_terminal_checkpoint_field() {
            local field=$1
            [[ "$field" == result_audit_at_head || "$field" == failure_audit_at_head ]] || return 1
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -ers --arg field "$field" '
              if length == 1 and (.[0] | type == "object") and
                 (.[0].terminal_checkpoint | type == "object") and
                 (.[0].terminal_checkpoint | keys == ["failure_audit_at_head", "head_revision", "result_audit_at_head"]) then
                .[0].terminal_checkpoint[$field] as $value
                | select(($value | type) == "string" and
                  (["unknown", "absent", "pending", "acknowledged"] | index($value)) != null)
                | $value
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          read_terminal_checkpoint_head_revision() {
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -ers '
              if length == 1 and (.[0] | type == "object") and
                 (.[0].terminal_checkpoint | type == "object") and
                 (.[0].terminal_checkpoint | has("head_revision")) then
                .[0].terminal_checkpoint.head_revision
                | if . == null then "unknown"
                  elif type == "number" and floor == . and . >= 1 then tostring
                  else empty end
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          read_terminal_failure_read() {
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -ers '
              if length == 1 and (.[0] | type == "object") then
                .[0].terminal_failure_read as $value
                | select(($value | type) == "string" and
                  (["not_attempted", "admission_unconfirmed", "budget_unavailable", "read_failed",
                    "absent", "ambiguous", "unverified", "observed"] | index($value)) != null)
                | $value
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          read_terminal_failure_step() {
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -csr '
              if length == 1 and (.[0] | type == "object") then
                .[0] as $root
                | if ($root | has("terminal_failure_step")) then
                    $root.terminal_failure_step as $step
                    | if $step == null then "not_observed"
                      elif ($step | type) == "string" and
                        (["terminal_observation_ack","result_audit","cleanup_confirmation","cleanup_ack"] | index($step)) != null
                      then $step
                      else "unrecognized" end
                  else "not_observed" end
              else "unrecognized" end' "$evidence_root/result.json" 2>/dev/null
          }
          state="$(read_result_field state || true)"
          stage="$(read_result_field stage || true)"
          central_terminal="$(read_central_terminal_observation || true)"
          deadline_evidence="$(read_worker_deadline_evidence || true)"
          checkpoint_revision="$(read_terminal_checkpoint_head_revision || true)"
          checkpoint_result="$(read_terminal_checkpoint_field result_audit_at_head || true)"
          checkpoint_failure="$(read_terminal_checkpoint_field failure_audit_at_head || true)"
          terminal_failure_read="$(read_terminal_failure_read || true)"
          if [[ "$checkpoint_revision" =~ ^[1-9][0-9]*$ ]]; then
            set_field terminal_checkpoint.head_revision "$checkpoint_revision"
          else
            checkpoint_revision=unknown
            set_field terminal_checkpoint.head_revision unknown
          fi
          case "$checkpoint_result" in unknown|absent|pending|acknowledged) ;; *) checkpoint_result=unknown ;; esac
          case "$checkpoint_failure" in unknown|absent|pending|acknowledged) ;; *) checkpoint_failure=unknown ;; esac
          case "$terminal_failure_read" in
            not_attempted|admission_unconfirmed|budget_unavailable|read_failed|absent|ambiguous|unverified|observed) ;;
            *) terminal_failure_read=unverified ;;
          esac
          set_field terminal_checkpoint.result_audit_at_head "$checkpoint_result"
          set_field terminal_checkpoint.failure_audit_at_head "$checkpoint_failure"
          set_field terminal_failure_read "$terminal_failure_read"
          case "$state" in passed|failed|timed_out) ;; *) state=UNRECOGNIZED ;; esac
          case "$stage" in
            not_reached|reap_clock|broker_liveness|worker_read|status_read|terminal_wait|executor|result_read|result_outcome|terminal_correlation|post_terminal_checks|control_shutdown|complete) ;;
            *) stage=UNRECOGNIZED ;;
          esac
          set_field run_client_state "$state"
          set_field run_client_stage "$stage"
          case "$central_terminal" in
            true|false) set_field central_terminal_observed_within_window "$central_terminal" ;;
            *) central_terminal=unknown; set_field central_terminal_observed_within_window unknown ;;
          esac
          case "$deadline_evidence" in
            attested|not_attested) set_field worker_deadline_evidence "$deadline_evidence" ;;
            *) deadline_evidence=unknown; set_field worker_deadline_evidence unknown ;;
          esac
          set_field terminal_wait_sample_worker_write_state NOT_READ_CONDITION_UNMET
          set_field terminal_wait_sample_status_write_state NOT_READ_CONDITION_UNMET
          set_field terminal_wait_sample_projection NOT_READ_CONDITION_UNMET
          if [[ "$state" == failed && "$stage" == terminal_wait ]]; then
            worker_sample="$(read_terminal_wait_sample_field worker || true)"
            status_sample="$(read_terminal_wait_sample_field status || true)"
            case "$worker_sample" in
              not_terminal|terminal_quota_held|terminal_quota_released) worker_write=PRESENT_WHITELISTED ;;
              "") worker_write=ABSENT_OR_NONSTRING ;;
              *) worker_write=UNRECOGNIZED_REJECTED ;;
            esac
            case "$status_sample" in
              executor_running|executor_stopped|executor_stopped_with_error|broker_error|other_reply) status_write=PRESENT_WHITELISTED ;;
              "") status_write=ABSENT_OR_NONSTRING ;;
              *) status_write=UNRECOGNIZED_REJECTED ;;
            esac
            set_field terminal_wait_sample_worker_write_state "$worker_write"
            set_field terminal_wait_sample_status_write_state "$status_write"
            if [[ "$worker_write" == PRESENT_WHITELISTED && "$status_write" == PRESENT_WHITELISTED ]]; then
              set_field terminal_wait_sample_projection EMITTED_WHITELISTED_PAIR
              set_field 'terminal_wait_sample.worker' "$worker_sample"
              set_field 'terminal_wait_sample.status' "$status_sample"
              set_field outcome_diagnosis TERMINAL_WAIT_SAMPLE_CLASSIFIED
              set_field test_verdict FAIL_TERMINAL_WAIT
              set_field last_phase run_client_terminal_wait_expired
            else
              set_field terminal_wait_sample_projection PAIR_ABSENT_OR_REJECTED_NOT_EMITTED
              set_field outcome_diagnosis TERMINAL_WAIT_SAMPLE_ABSENT_OR_REJECTED
              set_field test_verdict FAIL_TERMINAL_WAIT_SAMPLE_UNATTESTED
              set_field last_phase run_client_terminal_wait_sample_rejected
            fi
            exit 1
          elif [[ "$state" == failed && "$stage" == executor ]]; then
            for field in executor_failure_page executor_failure_outbox; do
              projection="$(read_executor_projection "$field")" || projection=UNVERIFIED
              set_field "$field" "$projection"
            done
            terminal_failure_step="$(read_terminal_failure_step || true)"
            case "$terminal_failure_step" in
              not_observed|terminal_observation_ack|result_audit|cleanup_confirmation|cleanup_ack) ;;
              *) terminal_failure_step=unrecognized ;;
            esac
            set_field terminal_failure_step "$terminal_failure_step"
            cleanup_sample="$(read_result_field central_cleanup_sample || true)"
            executor_error="$(read_result_field executor_error || true)"
            case "$cleanup_sample" in
              not_observed|reported_unconfirmed|reported_removed) ;;
              *)
                set_field outcome_diagnosis UNRECOGNIZED_EXECUTOR_METADATA
                set_field test_verdict FAIL_UNRECOGNIZED_EXECUTOR_METADATA
                set_field last_phase run_client_executor_metadata_rejected
                exit 1
                ;;
            esac
            case "$executor_error" in
              unauthorized|forbidden|unavailable|incompatible_control|busy|invalid_input|conflict|interrupted|limit_exceeded|needs_reconciliation) ;;
              *)
                set_field outcome_diagnosis UNRECOGNIZED_EXECUTOR_METADATA
                set_field test_verdict FAIL_UNRECOGNIZED_EXECUTOR_METADATA
                set_field last_phase run_client_executor_metadata_rejected
                exit 1
                ;;
            esac
            set_field central_cleanup_sample "$cleanup_sample"
            set_field executor_error "$executor_error"
            case "$terminal_failure_step" in
              not_observed|terminal_observation_ack|result_audit|cleanup_confirmation|cleanup_ack)
                set_field outcome_diagnosis EXECUTOR_FAILURE_CLASSIFIED
                set_field test_verdict FAIL_EXECUTOR
                ;;
              unrecognized)
                set_field outcome_diagnosis UNRECOGNIZED_TERMINAL_FAILURE_STEP
                set_field test_verdict FAIL_UNRECOGNIZED_TERMINAL_FAILURE_STEP
                ;;
            esac
            set_field last_phase run_client_executor_failure
            exit 1
          elif [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 &&
                  "$summary_ok" == 1 && "$state" == passed && "$stage" == complete &&
                  ( "$central_terminal" == true || "$central_terminal" == false ) &&
                  "$deadline_evidence" == attested ]]; then
            set_field outcome_diagnosis PASS_PASSED_COMPLETE
            set_field test_verdict PASS_1_0_0
            set_field last_phase targeted_test_complete
          else
            set_field outcome_diagnosis "${state}_${stage}_exit_${rc}"
            set_field test_verdict FAIL_OR_INCOMPLETE
            set_field last_phase run_client_recovery_incomplete
            exit 1
          fi

      - name: Record read-only Docker inventory and close receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-audit-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$private" && -f "$private/containers.before" && -f "$private/volumes.before" && -f "$private/images.before" ]] && docker info >/dev/null 2>&1; then
            if docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.after" &&
               docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.after" &&
               docker image ls -q --no-trunc | LC_ALL=C sort -u > "$private/images.after" &&
               comm -13 "$private/containers.before" "$private/containers.after" > "$private/containers.new" &&
               comm -13 "$private/volumes.before" "$private/volumes.after" > "$private/volumes.new" &&
               comm -13 "$private/images.before" "$private/images.after" > "$private/images.new"; then
              set_field containers_after "$(wc -l < "$private/containers.after" | tr -d ' ')"
              set_field containers_new "$(wc -l < "$private/containers.new" | tr -d ' ')"
              set_field volumes_after "$(wc -l < "$private/volumes.after" | tr -d ' ')"
              set_field volumes_new "$(wc -l < "$private/volumes.new" | tr -d ' ')"
              set_field images_after "$(wc -l < "$private/images.after" | tr -d ' ')"
              set_field images_new "$(wc -l < "$private/images.new" | tr -d ' ')"
            else
              set_field containers_after unknown
              set_field containers_new unknown
              set_field volumes_after unknown
              set_field volumes_new unknown
              set_field images_after unknown
              set_field images_new unknown
            fi
          else
            set_field containers_after unknown
            set_field containers_new unknown
            set_field volumes_after unknown
            set_field volumes_new unknown
            set_field images_after unknown
            set_field images_new unknown
          fi
          set_field engine_cleanup NOT_PERFORMED
          set_field receipt_closed YES
          {
            printf 'G09 terminal checkpoint outcome=%s source=%s\n' \
              "$(grep '^test_verdict=' "$receipt" | cut -d= -f2)" "$SOURCE_SHA"
            printf 'pure_witnesses=%s registration_diagnostic=%s registration_projection=%s\n' \
              "$(grep '^pure_witnesses=' "$receipt" | cut -d= -f2)" \
              "$(grep '^registration_diagnostic_verdict=' "$receipt" | cut -d= -f2)" \
              "$(grep '^registration_projection_verdict=' "$receipt" | cut -d= -f2)"
            printf 'selected=%s passed=%s failed=%s ignored=%s exit=%s state=%s stage=%s diagnosis=%s\n' \
              "$(grep '^test_selected=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_passed=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_failed=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_ignored=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_exit=' "$receipt" | cut -d= -f2)" \
              "$(grep '^run_client_state=' "$receipt" | cut -d= -f2)" \
              "$(grep '^run_client_stage=' "$receipt" | cut -d= -f2)" \
              "$(grep '^outcome_diagnosis=' "$receipt" | cut -d= -f2)"
            printf 'central_terminal_observed_within_window=%s worker_deadline_evidence=%s\n' \
              "$(grep '^central_terminal_observed_within_window=' "$receipt" | cut -d= -f2)" \
              "$(grep '^worker_deadline_evidence=' "$receipt" | cut -d= -f2)"
            printf 'terminal_checkpoint.head_revision=%s terminal_checkpoint.result_audit_at_head=%s terminal_checkpoint.failure_audit_at_head=%s terminal_failure_read=%s\n' \
              "$(grep '^terminal_checkpoint.head_revision=' "$receipt" | cut -d= -f2)" \
              "$(grep '^terminal_checkpoint.result_audit_at_head=' "$receipt" | cut -d= -f2)" \
              "$(grep '^terminal_checkpoint.failure_audit_at_head=' "$receipt" | cut -d= -f2)" \
              "$(grep '^terminal_failure_read=' "$receipt" | cut -d= -f2)"
            printf 'terminal_sample_write_states=%s/%s projection=%s\n' \
              "$(grep '^terminal_wait_sample_worker_write_state=' "$receipt" | cut -d= -f2)" \
              "$(grep '^terminal_wait_sample_status_write_state=' "$receipt" | cut -d= -f2)" \
              "$(grep '^terminal_wait_sample_projection=' "$receipt" | cut -d= -f2)"
            if [[ "$(grep '^outcome_diagnosis=' "$receipt" | cut -d= -f2)" == TERMINAL_WAIT_SAMPLE_CLASSIFIED ]]; then
              printf 'terminal_wait_sample.worker=%s terminal_wait_sample.status=%s\n' \
                "$(grep '^terminal_wait_sample[.]worker=' "$receipt" | cut -d= -f2)" \
                "$(grep '^terminal_wait_sample[.]status=' "$receipt" | cut -d= -f2)"
            fi
            if [[ "$(grep '^outcome_diagnosis=' "$receipt" | cut -d= -f2)" == EXECUTOR_FAILURE_CLASSIFIED ||
                  "$(grep '^outcome_diagnosis=' "$receipt" | cut -d= -f2)" == UNRECOGNIZED_TERMINAL_FAILURE_STEP ]]; then
              printf 'central_cleanup_sample=%s executor_error=%s terminal_failure_step=%s\n' \
                "$(grep '^central_cleanup_sample=' "$receipt" | cut -d= -f2)" \
                "$(grep '^executor_error=' "$receipt" | cut -d= -f2)" \
                "$(grep '^terminal_failure_step=' "$receipt" | cut -d= -f2)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-physical-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g09-terminal-audit-receipt.txt
          if-no-files-found: error
          retention-days: 14
