name: G06 R2 central SQLite fixture

on:
  push:
    branches: ['claude/v1-g06-retention-r2-central-diagnostic-20261122']

permissions:
  contents: read

concurrency:
  group: g06-retention-r2-central-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  central-sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Diagnose the exact SQLite supervision fixture
        shell: bash
        run: |
          set -o pipefail
          selector=supervised_api_arms_import_and_worker_claims_once_then_maintenance_blocks_new_effects
          printf '### G06 R2 central SQLite fixture on Linux\n\n' >> "$GITHUB_STEP_SUMMARY"
          fail() {
            printf 'FAIL %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          revision=$(git rev-parse HEAD 2>/dev/null) || fail CHECKOUT_REVISION_MISMATCH
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ || "$revision" != "$GITHUB_SHA" ]]; then
            fail CHECKOUT_REVISION_MISMATCH
          fi
          printf 'Commit `%s`\n\n' "$revision" >> "$GITHUB_STEP_SUMMARY"

          capture_dir=$(mktemp -d "$RUNNER_TEMP/r2-central.XXXXXX" 2>/dev/null) || fail CAPTURE_FAILED
          trap 'rm -rf -- "$capture_dir" 2>/dev/null || true' EXIT
          # Limit diagnostic output without limiting the compiler's other files.
          capture() {
            local output=$1 limit=$2 phase=$3 bytes status=0
            shift 3
            "$@" 2>&1 | head -c "$((limit + 1))" > "$output" || status=$?
            bytes=$(wc -c < "$output") || fail "${phase}_CAPTURE_FAILED"
            if (( bytes > limit )); then
              fail "${phase}_OUTPUT_LIMIT"
            fi
            return "$status"
          }

          capture "$capture_dir/fetch" 1048576 FETCH cargo fetch --locked || fail FETCH_FAILED
          build="$capture_dir/build"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          if ! capture "$build" 33554432 BUILD cargo test --locked --offline --no-default-features \
              --test supervision_api --no-run --message-format=json; then
            codes=$(jq -Rrs '
              [split("\n")[] | fromjson? | objects
                | select(.reason == "compiler-message" and .message.level == "error")
                | .message.code.code | strings | select(test("^E[0-9]{4}$"))]
              | unique | .[:8] | join(",")
            ' "$build" 2>/dev/null) || fail BUILD_FAILED
            if [[ "$codes" =~ ^E[0-9]{4}(,E[0-9]{4}){0,7}$ ]]; then
              fail "RUSTC_ERROR $codes"
            fi
            fail BUILD_FAILED
          fi

          binary=$(jq -Rers '
            [split("\n")[] | fromjson? | objects] as $messages
            | select([$messages[] | select(.reason == "build-finished") | .success] == [true])
            | [$messages[] | select(.reason == "compiler-artifact"
                  and .target.name == "supervision_api" and .target.kind == ["test"]
                  and .profile.test == true) | .executable | strings]
            | select(length == 1) | .[0]
          ' "$build" 2>/dev/null) || fail BUILD_RECEIPT_REJECTED
          if [[ "${binary%/*}" != "$CARGO_TARGET_DIR/debug/deps" \
              || ! "${binary##*/}" =~ ^supervision_api-[0-9a-f]+$ || ! -f "$binary" || ! -x "$binary" ]]; then
            fail BUILD_RECEIPT_REJECTED
          fi
          checksum=$(sha256sum -- "$binary" 2>/dev/null) || fail BUILD_RECEIPT_REJECTED
          checksum=${checksum%% *}
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || fail BUILD_RECEIPT_REJECTED
          printf 'Test binary SHA-256 `%s`\n\n' "$checksum" >> "$GITHUB_STEP_SUMMARY"

          output="$capture_dir/fixture"
          if ! capture "$output" 1048576 FIXTURE "$binary" "$selector" --exact; then
            if [[ "$(grep -Fxc 'running 1 test' "$output")" == 1 ]] \
                && [[ "$(grep -Fxc "test $selector ... FAILED" "$output")" == 1 ]] \
                && [[ "$(grep -c '^test result: ' "$output")" == 1 ]] \
                && grep -Eq '^test result: FAILED\. 0 passed; 1 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$output"; then
              position=$(sed -nE "s/^thread '$selector'( \([0-9]+\))? panicked at tests\/supervision_api\.rs:([1-9][0-9]{0,5}):([1-9][0-9]{0,3}):$/\2:\3/p" "$output")
              if [[ "$position" =~ ^[1-9][0-9]{0,5}:[1-9][0-9]{0,3}$ ]]; then
                fail "FIXTURE_FAILED panic $position"
              fi
              fail FIXTURE_FAILED
            fi
            fail LIBTEST_ABORTED
          fi
          if [[ "$(grep -Fxc 'running 1 test' "$output")" != 1 ]] \
              || [[ "$(grep -Fxc "test $selector ... ok" "$output")" != 1 ]] \
              || [[ "$(grep -c '^test result: ' "$output")" != 1 ]] \
              || ! grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$output"; then
            fail RECEIPT_REJECTED
          fi
          printf 'PASS `%s` (1/1, 0 ignored)\n' "$selector" >> "$GITHUB_STEP_SUMMARY"
