name: G04 first guarded IPC write Linux QA

on:
  push:
    branches: [codex/g04-first-write-linux-qa-20261128]
    paths: [.github/workflows/g04-first-write-linux-qa.yaml]

permissions:
  contents: read

jobs:
  first-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 4778eb525b5360d259c6a38612dcf9399dfea1cb
      SOURCE_TREE: 66860db2f4a24879ecb39adf3ef4aafa75972f6e
      ENFORCER_CLIENT_BLOB: 2453df60172159dde1c1785ca28978c915538553
      LOCAL_IPC_BLOB: 5da32d786deed8f2736f33282774cafdc67d7128
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Build one libtest and verify guarded local IPC writes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          selectors=(
            broker::enforcer::client::named_request_invalidated_while_waiting_to_write_sends_no_frame
            broker::enforcer::client::guarded_named_request_keeps_the_existing_frame_bytes
            broker::enforcer::client::stale_named_generation_writes_no_business_frame
          )
          report_not_run() {
            local selector
            for selector in "${selectors[@]}"; do printf 'test=%s status=NOT_RUN\n' "$selector"; done
          }
          if [[ "${GITHUB_REF:-}" != refs/heads/codex/g04-first-write-linux-qa-20261128 ||
                "$(git rev-parse HEAD)" != "$SOURCE_SHA" ||
                "$(git rev-parse 'HEAD^{tree}')" != "$SOURCE_TREE" ||
                "$(git rev-parse HEAD:src/broker/enforcer/client.rs)" != "$ENFORCER_CLIENT_BLOB" ||
                "$(git rev-parse HEAD:src/broker/local_ipc.rs)" != "$LOCAL_IPC_BLOB" ]]; then
            printf 'source=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'source=PASS\nsource_sha=%s\nsource_tree=%s\nenforcer_client_blob=%s\nlocal_ipc_blob=%s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" "$ENFORCER_CLIENT_BLOB" "$LOCAL_IPC_BLOB"

          scratch=$(mktemp -d "${RUNNER_TEMP:-/tmp}/g04-first-write.XXXXXXXX")
          chmod 700 "$scratch"
          trap 'find "$scratch" -depth -mindepth 1 -delete; rmdir "$scratch"' EXIT
          export TMPDIR="$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"
          if ! cargo fetch --locked >"$scratch/fetch.log" 2>&1; then
            printf 'fetch=FAIL\nbuild=NOT_RUN\n'
            report_not_run
            exit 1
          fi
          printf 'fetch=PASS\n'
          if cargo test --locked --offline -j1 --no-default-features --lib --no-run \
              --message-format=json >"$build_json" 2>"$scratch/build.stderr"; then
            printf 'build=PASS\n'
          else
            rc=$?
            printf 'build=FAIL\nbuild_exit=%s\n' "$rc"
            report=$(jq -cs '[.[] | select(.reason == "compiler-message" and .message.level == "error") | .message |
              {code: ((.code.code // "uncoded") | if test("^E[0-9]{4}$") then . else "uncoded" end),
               site: ([.spans[]? | select(.is_primary == true and (.file_name | test("^(src|tests)(/[A-Za-z0-9_-]+)+[.]rs$"))
                 and (.line_start | type) == "number" and (.column_start | type) == "number")
                 | {file: .file_name, line: .line_start, column: .column_start}] | .[0])}]
              | .[0:12]' "$build_json" 2>/dev/null) || report=unavailable
            printf 'rust_diagnostics=%s\n' "$report"
            report_not_run
            exit 1
          fi
          if ! libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox"
              and .target.kind == ["lib"] and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$libtest" != "$CARGO_TARGET_DIR"/debug/deps/agentsandbox-* || ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          checksum=$(sha256sum -- "$libtest")
          libtest_sha=${checksum%% *}
          if [[ ! "$libtest_sha" =~ ^[0-9a-f]{64}$ ]]; then printf 'libtest=FAIL\n'; report_not_run; exit 1; fi
          printf 'libtest=PASS\nlibtest_sha256=%s\n' "$libtest_sha"

          failed=0
          for selector in "${selectors[@]}"; do
            test_log="$scratch/test.log"
            test_exit=0
            { timeout --kill-after=10s 180s "$libtest" --exact "$selector" --test-threads=1 --color never; } \
              >"$test_log" 2>&1 || test_exit=$?
            if [[ "$test_exit" == 0 ]] &&
                [[ "$(grep -Fxc 'running 1 test' "$test_log" || true)" == 1 ]] &&
                [[ "$(grep -Fxc "test $selector ... ok" "$test_log" || true)" == 1 ]] &&
                [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$test_log" || true)" == 1 ]]; then
              printf 'test=%s status=PASS\ntest_exit=0\ntest_pass_count=1\ntest_fail_count=0\n' "$selector"
            else
              printf 'test=%s status=FAIL\ntest_exit=%s\n' "$selector" "$test_exit"
              grep -m 1 -Eo 'panicked at (src|tests)(/[A-Za-z0-9_-]+)+[.]rs:[0-9]+:[0-9]+' "$test_log" || true
              if grep -q '^Error: ' "$test_log"; then printf 'libtest_result_error=true\n'; fi
              failed=1
            fi
          done
          exit "$failed"
