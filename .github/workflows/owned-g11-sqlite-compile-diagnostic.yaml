name: Owned G11 SQLite compile diagnostic

on:
  push:
    branches: ['claude/v1-owned-g11-compile-diagnostic-20261122']

permissions:
  contents: read

concurrency:
  group: owned-g11-sqlite-compile-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the single SQLite profile
        id: check
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/g11-sqlite.XXXXXX")"
          receipt="$scratch/summary.txt"
          json="$scratch/cargo.jsonl"
          stderr="$scratch/cargo.stderr"
          printf 'source_revision=601a2b4c1d02b2911bf07859d9867bd6916a7ea8\nworkflow_revision=%s\nprofile=sqlite-only\ncheck=all-targets\n' "$GITHUB_SHA" > "$receipt"
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" \
              || "$(git rev-parse HEAD^)" != 735aee320c5512137f0ae8c9ddd7803638b570e7 ]] \
              || ! git diff --quiet 601a2b4c1d02b2911bf07859d9867bd6916a7ea8 HEAD -- . ':(exclude).github/workflows/owned-g11-sqlite-compile-diagnostic.yaml'; then
            printf 'source_check=FAIL\n' >> "$receipt"
            echo 'check_result=source_mismatch' >> "$GITHUB_OUTPUT"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'source_check=PASS\n' >> "$receipt"
          rustc --version | sed -nE 's/^rustc ([0-9]+\.[0-9]+\.[0-9]+).*/toolchain=\1/p' >> "$receipt"
          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            printf 'locked_fetch=FAIL\ncheck=NOT_RUN\n' >> "$receipt"
            echo 'check_result=fetch_failed' >> "$GITHUB_OUTPUT"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'locked_fetch=PASS\n' >> "$receipt"
          set +e
          cargo check --locked --offline --no-default-features --all-targets --keep-going \
            --message-format=json > "$json" 2> "$stderr"
          status=$?
          set -e
          printf 'cargo_exit=%s\n' "$status" >> "$receipt"
          # Only primary Rust spans within repository source trees, numeric
          # coordinates, safe target names and closed rustc error codes escape.
          if ! jq -r '
            select(.reason == "compiler-message" and .message.level == "error")
            | .target.name as $target
            | .message.code.code as $code
            | .message.spans[]? | select(.is_primary == true)
            | select(($target | type) == "string" and ($target | test("^[A-Za-z0-9_-]+$")))
            | select(($code | type) == "string" and ($code | test("^E[0-9]{4}$")))
            | select((.file_name | type) == "string" and (.file_name | test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.rs$")))
            | select((.line_start | type) == "number" and (.line_start | floor) == .line_start and .line_start > 0)
            | select((.column_start | type) == "number" and (.column_start | floor) == .column_start and .column_start > 0)
            | "error target=\($target) code=\($code) location=\(.file_name):\(.line_start):\(.column_start)"
          ' "$json" > "$scratch/diagnostics.txt"; then
            printf 'diagnostics=unavailable\n' >> "$receipt"
            echo 'check_result=diagnostic_parse_failed' >> "$GITHUB_OUTPUT"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -s "$scratch/diagnostics.txt" ]]; then
            sort -u "$scratch/diagnostics.txt" >> "$receipt"
            count="$(wc -l < "$scratch/diagnostics.txt" | tr -d ' ')"
          else
            count=0
          fi
          printf 'sanitized_error_spans=%s\n' "$count" >> "$receipt"
          if [[ "$status" -eq 0 ]]; then
            printf 'check=PASS\n' >> "$receipt"
            result=pass
          else
            printf 'check=FAIL\n' >> "$receipt"
            result=fail
          fi
          cp "$receipt" "$RUNNER_TEMP/owned-g11-sqlite-summary.txt"
          echo "check_result=$result" >> "$GITHUB_OUTPUT"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          test "$status" -eq 0
      - name: Upload sanitized compile diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-g11-sqlite-compile-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/owned-g11-sqlite-summary.txt
          if-no-files-found: ignore
          retention-days: 14
