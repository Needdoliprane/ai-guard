name: G04 named Import verification plan Linux QA

on:
  push:
    branches: [codex/g04-verification-plan-lean-writer-qa-20261128]
    paths: [.github/workflows/g04-named-import-verification-plan-linux-qa.yaml]

permissions:
  contents: read

jobs:
  named-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: a7b20fbe377ce15081c5e5303eb8e76bffe03289
      SOURCE_TREE: 73f700bf1fb98ac293ec8b4efe00e71d34796ebb
      CHECKPOINT_MODULE_BLOB: 07879b98039c9d73fcbdac6d824e06df1ca1fcc7
      CHECKPOINT_BLOB: 7348db4ddf47e37bba8179555fa12f99c685f2f9
      WRITER_MODULE_BLOB: ed059f5532dcb31415972004c6131df3a235b052
      WRITER_BLOB: de303f43680a906a108af10bd5698e2525de45cf
      LIFECYCLE_BLOB: f7d3449ffcd5684acd1a7d6d601f5d4c03721288
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Build one libtest and verify plan replay, Writer CAS, and STOP
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # The oracle uses a private SQLite journal and synthetic runtime facts.
          # It does not start a runtime, provider, model, or external service.
          selector=broker::checkpoint::legacy_named::tests::explicit_named_admission_requires_an_immutable_archive_digest

          report_not_run() {
            printf 'test=%s status=NOT_RUN\n' "$selector"
          }

          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ||
                "$(git rev-parse 'HEAD^{tree}')" != "$SOURCE_TREE" ||
                "$(git rev-parse HEAD:src/broker/checkpoint.rs)" != "$CHECKPOINT_MODULE_BLOB" ||
                "$(git rev-parse HEAD:src/broker/checkpoint/legacy_named.rs)" != "$CHECKPOINT_BLOB" ||
                "$(git rev-parse HEAD:src/broker/writer.rs)" != "$WRITER_MODULE_BLOB" ||
                "$(git rev-parse HEAD:src/broker/writer/legacy_named_admission.rs)" != "$WRITER_BLOB" ||
                "$(git rev-parse HEAD:src/broker/lifecycle.rs)" != "$LIFECYCLE_BLOB" ]]; then
            printf 'source=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'source=PASS\nsource_sha=%s\nsource_tree=%s\ncheckpoint_module_blob=%s\ncheckpoint_blob=%s\nwriter_module_blob=%s\nwriter_blob=%s\nlifecycle_blob=%s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" "$CHECKPOINT_MODULE_BLOB" "$CHECKPOINT_BLOB" \
            "$WRITER_MODULE_BLOB" "$WRITER_BLOB" "$LIFECYCLE_BLOB"
          export AI_GUARD_BUILD_REVISION="$SOURCE_SHA"

          scratch=$(mktemp -d /tmp/aig-g04-verification-plan.XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"

          if ! cargo fetch --locked >"$scratch/fetch.log" 2>&1; then
            printf 'fetch=FAIL\nbuild=NOT_RUN\n'
            report_not_run
            exit 1
          fi
          printf 'fetch=PASS\n'

          if cargo test --locked --offline -j1 --no-default-features --lib --no-run \
              --message-format=json >"$build_json" 2>"$scratch/build.stderr"; then
            printf 'build=PASS\n'
          else
            rc=$?
            printf 'build=FAIL\nbuild_exit=%s\n' "$rc"
            jq -Rr 'fromjson? | objects
              | select(.reason == "compiler-message" and .message.level == "error")
              | .message.code.code // empty | strings | select(test("^E[0-9]{4}$"))
              | "compiler_error=" + .' "$build_json" 2>/dev/null | sort -u || true
            report_not_run
            exit 1
          fi

          if ! libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "agentsandbox" and .target.kind == ["lib"]
              and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$libtest" != "$CARGO_TARGET_DIR"/debug/deps/agentsandbox-* ||
                 ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          checksum=$(sha256sum -- "$libtest")
          libtest_sha=${checksum%% *}
          if [[ ! "$libtest_sha" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'libtest=PASS\nlibtest_sha256=%s\n' "$libtest_sha"

          log="$scratch/test.log"
          test_exit=0
          "$libtest" --exact "$selector" --test-threads=1 --color never >"$log" 2>&1 || test_exit=$?
          if [[ "$test_exit" == 0 ]] &&
              [[ "$(grep -Fxc "running 1 test" "$log" || true)" == 1 ]] &&
              [[ "$(grep -Fxc "test $selector ... ok" "$log" || true)" == 1 ]] &&
              [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$log" || true)" == 1 ]]; then
            printf 'test=%s status=PASS\ntest_exit=0\ntest_pass_count=1\ntest_fail_count=0\n' "$selector"
          else
            printf 'test=%s status=FAIL\ntest_exit=%s\n' "$selector" "$test_exit"
            rg -o 'panicked at src/[A-Za-z0-9_./-]+[.]rs:[0-9]+:[0-9]+' "$log" || true
            exit 1
          fi
