name: G04 named Writer Linux QA

on:
  push:
    branches: [codex/g04-named-writer-qa-20261127]
    paths: [.github/workflows/g04-named-writer-qa.yaml]

permissions:
  contents: read

jobs:
  writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 08cd996c017db24ec0e816d79816a1c8e2e68684
      SOURCE_TREE: 50c78f8371861804bd83c06e9f9e494781ae11d8
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 08cd996c017db24ec0e816d79816a1c8e2e68684
          persist-credentials: false

      - name: Build one library and integration harness, verify three exact tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          lib_selectors=(
            workspace::authorized::authorized_workspace_tests::authorized_source_identity_distinguishes_copies_and_path_replacement
            audit::legacy_session_prepare::bootstrap::tests::legacy_named_cancel_releases_an_unarmed_reservation_after_revocation
          )
          integration_selector=legacy_local_confirmation_survives_reopen_without_admission

          report_not_run() {
            local selector
            for selector in "${lib_selectors[@]}"; do
              printf 'test=lib:%s status=NOT_RUN\n' "$selector"
            done
            printf 'test=human_rights_migration:%s status=NOT_RUN\n' "$integration_selector"
          }

          if [[ "$(git rev-parse HEAD 2>/dev/null)" != "$SOURCE_SHA" ||
                "$(git rev-parse 'HEAD^{tree}' 2>/dev/null)" != "$SOURCE_TREE" ]]; then
            printf 'source=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'source=PASS\nsource_sha=%s\nsource_tree=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"
          export AI_GUARD_BUILD_REVISION="$SOURCE_SHA"

          # Keep fixture paths short for Unix sockets and keep all raw output private.
          scratch=$(mktemp -d /tmp/aig-g04.XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"

          if ! cargo fetch --locked --target host-tuple >"$scratch/fetch.log" 2>&1; then
            printf 'fetch=FAIL\nbuild=NOT_RUN\n'
            report_not_run
            exit 1
          fi
          printf 'fetch=PASS\n'

          if ! cargo test --locked --offline --features mysql-storage --lib \
              --test human_rights_migration --no-run --message-format=json \
              >"$build_json" 2>"$scratch/build.stderr"; then
            printf 'build=FAIL\n'
            jq -Rr 'fromjson? | objects
              | select(.reason == "compiler-message" and .message.level == "error")
              | .message.code.code // empty | strings | select(test("\\AE[0-9]{4}\\z"))
              | "compiler_error=" + .' "$build_json" 2>/dev/null | sort -u || true
            report_not_run
            exit 1
          fi
          printf 'build=PASS\n'

          if ! libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "agentsandbox" and .target.kind == ["lib"]
              and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$libtest" != "$CARGO_TARGET_DIR"/debug/deps/agentsandbox-* ||
                 ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi

          if ! integration_test=$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "human_rights_migration" and .target.kind == ["test"]
              and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$integration_test" != "$CARGO_TARGET_DIR"/debug/deps/human_rights_migration-* ||
                 ! -f "$integration_test" || ! -x "$integration_test" || -L "$integration_test" ]]; then
            printf 'integration_test=FAIL\n'
            report_not_run
            exit 1
          fi

          # The integration test uses env!("CARGO_BIN_EXE_agentsandbox"); require Cargo's
          # corresponding binary artifact and exact path before running that test.
          if ! cli_bin=$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "agentsandbox" and .target.kind == ["bin"]
              and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$cli_bin" != "$CARGO_TARGET_DIR"/debug/agentsandbox ||
                 ! -f "$cli_bin" || ! -x "$cli_bin" || -L "$cli_bin" ]]; then
            printf 'cli_bin=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'artifacts=PASS\n'

          check_selector() {
            local executable=$1 selector=$2
            local log="$scratch/test.log"
            if ! "$executable" --exact "$selector" --test-threads=1 --color never >"$log" 2>&1; then
              printf 'FAIL'
            elif grep -Fqx 'running 0 tests' "$log"; then
              printf 'NO_TEST'
            elif grep -Fqx 'running 1 test' "$log" &&
                grep -Fqx "test $selector ... ok" "$log" &&
                grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$log"; then
              printf 'PASS'
            else
              printf 'FAIL'
            fi
          }

          failed=0
          for selector in "${lib_selectors[@]}"; do
            status=$(check_selector "$libtest" "$selector")
            printf 'test=lib:%s status=%s\n' "$selector" "$status"
            [[ "$status" == PASS ]] || failed=1
          done
          status=$(check_selector "$integration_test" "$integration_selector")
          printf 'test=human_rights_migration:%s status=%s\n' "$integration_selector" "$status"
          [[ "$status" == PASS ]] || failed=1
          exit "$failed"
