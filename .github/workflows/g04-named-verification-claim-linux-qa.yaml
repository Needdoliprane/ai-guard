name: G04 named verification Claim Linux QA

on:
  push:
    branches: [codex/g04-named-verification-claim-linux-qa-20261128]
    paths: [.github/workflows/g04-named-verification-claim-linux-qa.yaml]

permissions:
  contents: read

jobs:
  verification-claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 2ed5cb4ee6cf6ebb8f4d2e080a386ac7b2a7c20d
      SOURCE_TREE: 0546bfe9a573c63fdd6f351919a549b8dc6f6a8c
      IDENTITY_BLOB: dbe7f45751021e42f3c0610161b57ef963e9426a
      PREPARE_BLOB: 429e1533b49a1af91a0910e4694e24f7b980fb87
      BOOTSTRAP_TESTS_BLOB: ff32e6accf1978bb7c9f1642086bd22f0b85d329
      CLAIM_TESTS_BLOB: 7706cdf0171424a1a3e9258a37f153d47198b7a6
      CONFIRMATION_BLOB: 324b624e23b440a452130191ee922a680ef2740d
      ADMISSION_BLOB: 94142c8aab1aed3ccc22bbe041fd9f0fddefef6b
      CLAIM_BLOB: 33ba3d628c3efa659fbdf7c998cc172a5be4e199
      SUPERVISION_BLOB: 9f39f3f604feb25afdc1fc37459f3649e330f266
      SESSION_CONTROL_BLOB: c250e40b694e7ee5ff0317090fd3fc7baf49a6c4
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Build one libtest and verify the named Import Claim oracle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          selector=audit::legacy_session_prepare::bootstrap::tests::verification_claim_tests::legacy_named_import_verification_claim_emits_once_and_replays_exactly

          report_not_run() {
            printf 'test=%s status=NOT_RUN\n' "$selector"
          }

          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ||
                "$(git rev-parse 'HEAD^{tree}')" != "$SOURCE_TREE" ||
                "$(git rev-parse HEAD:src/audit/identity.rs)" != "$IDENTITY_BLOB" ||
                "$(git rev-parse HEAD:src/audit/legacy_session_prepare.rs)" != "$PREPARE_BLOB" ||
                "$(git rev-parse HEAD:src/audit/legacy_session_prepare/bootstrap/tests.rs)" != "$BOOTSTRAP_TESTS_BLOB" ||
                "$(git rev-parse HEAD:src/audit/legacy_session_prepare/bootstrap/verification_claim_tests.rs)" != "$CLAIM_TESTS_BLOB" ||
                "$(git rev-parse HEAD:src/audit/legacy_session_prepare/confirmation.rs)" != "$CONFIRMATION_BLOB" ||
                "$(git rev-parse HEAD:src/audit/legacy_session_prepare/confirmation/admission.rs)" != "$ADMISSION_BLOB" ||
                "$(git rev-parse HEAD:src/audit/legacy_session_prepare/confirmation/admission/claim.rs)" != "$CLAIM_BLOB" ||
                "$(git rev-parse HEAD:src/audit/supervision.rs)" != "$SUPERVISION_BLOB" ||
                "$(git rev-parse HEAD:src/control/session_control.rs)" != "$SESSION_CONTROL_BLOB" ]]; then
            printf 'source=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'source=PASS\nsource_sha=%s\nsource_tree=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"
          printf 'identity_blob=%s\nprepare_blob=%s\nbootstrap_tests_blob=%s\nclaim_tests_blob=%s\n' \
            "$IDENTITY_BLOB" "$PREPARE_BLOB" "$BOOTSTRAP_TESTS_BLOB" "$CLAIM_TESTS_BLOB"
          printf 'confirmation_blob=%s\nadmission_blob=%s\nclaim_blob=%s\nsupervision_blob=%s\nsession_control_blob=%s\n' \
            "$CONFIRMATION_BLOB" "$ADMISSION_BLOB" "$CLAIM_BLOB" "$SUPERVISION_BLOB" "$SESSION_CONTROL_BLOB"
          export AI_GUARD_BUILD_REVISION="$SOURCE_SHA"

          scratch=$(mktemp -d /tmp/aig-g04-verification-claim.XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"

          if ! cargo fetch --locked >"$scratch/fetch.log" 2>&1; then
            printf 'fetch=FAIL\nbuild=NOT_RUN\n'
            report_not_run
            exit 1
          fi
          printf 'fetch=PASS\n'

          if cargo test --locked --offline -j1 --no-default-features --lib --no-run \
              --message-format=json >"$build_json" 2>"$scratch/build.stderr"; then
            printf 'build=PASS\n'
          else
            rc=$?
            printf 'build=FAIL\nbuild_exit=%s\n' "$rc"
            if grep -Fq 'Error:' "$scratch/build.stderr"; then printf 'build_error_present=true\n'; else printf 'build_error_present=false\n'; fi
            report_not_run
            exit 1
          fi

          if ! libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "agentsandbox" and .target.kind == ["lib"]
              and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$libtest" != "$CARGO_TARGET_DIR"/debug/deps/agentsandbox-* ||
                 ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          checksum=$(sha256sum -- "$libtest")
          libtest_sha=${checksum%% *}
          if [[ ! "$libtest_sha" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'libtest=PASS\nlibtest_sha256=%s\n' "$libtest_sha"

          log="$scratch/test.log"
          test_exit=0
          "$libtest" --exact "$selector" --test-threads=1 --color never >"$log" 2>&1 || test_exit=$?
          if [[ "$test_exit" == 0 ]] &&
              [[ "$(grep -Fxc "running 1 test" "$log" || true)" == 1 ]] &&
              [[ "$(grep -Fxc "test $selector ... ok" "$log" || true)" == 1 ]] &&
              [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$log" || true)" == 1 ]]; then
            printf 'test=%s status=PASS\ntest_exit=0\ntest_pass_count=1\ntest_fail_count=0\n' "$selector"
          else
            printf 'test=%s status=FAIL\ntest_exit=%s\n' "$selector" "$test_exit"
            panic_at=$(grep -Eo 'panicked at src/[^[:space:]]+:[0-9]+:[0-9]+' "$log" | head -n 1 || true)
            if [[ -n "$panic_at" ]]; then printf 'panic_at=%s\n' "$panic_at"; else printf 'panic_at=unavailable\n'; fi
            if grep -Fq 'Error:' "$log"; then printf 'error_present=true\n'; else printf 'error_present=false\n'; fi
            exit 1
          fi
