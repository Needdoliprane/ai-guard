name: G11 scoped relay journal and terminal receipt check

on:
  push:
    branches: ['claude/v1-g11-terminal-recovery-observation-check-20261123']

permissions:
  contents: read

concurrency:
  group: g11-terminal-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AI_GUARD_BUILD_REVISION: 526d1037fcf4b723d683b263a401757727a67fa0
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize closed G11 receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g11-terminal-receipt.txt"
          cat > "$receipt" <<EOF
          source_sha=526d1037fcf4b723d683b263a401757727a67fa0
          workflow_sha=$WORKFLOW_SHA
          workflow_parent_sha=526d1037fcf4b723d683b263a401757727a67fa0
          feature_mode=no-default-features
          target=broker_relay_handoff
          selector=software_broker_scoped_relay_ipc_refuses_before_private_detail
          source_check=NOT_RUN
          workflow_check=NOT_RUN
          toolchain=NOT_RUN
          toolchain_version=unknown
          dependency_fetch=NOT_RUN
          build_verdict=NOT_RUN
          build_exit=unknown
          libtest_sha256=unknown
          test_selected=unknown
          test_passed=unknown
          test_failed=unknown
          test_ignored=unknown
          test_exit=unknown
          test_result=NOT_RUN
          terminal_receipt=UNKNOWN
          fixture_phase=unknown
          fixture_cleanup=unknown
          terminal_a_wait=unknown
          terminal_a_store=unknown
          terminal_a_state=unknown
          terminal_a_quota_held=unknown
          terminal_a_same_attempt=unknown
          terminal_a_witness=unknown
          terminal_a_store_receipt=unknown
          terminal_a_journal_head=unknown
          terminal_a_post_cancel_failure=unknown
          terminal_a_executor_task_running=unknown
          terminal_b_wait=unknown
          terminal_b_store=unknown
          terminal_b_state=unknown
          terminal_b_quota_held=unknown
          terminal_b_same_attempt=unknown
          terminal_b_witness=unknown
          terminal_b_store_receipt=unknown
          terminal_b_journal_head=unknown
          terminal_b_post_cancel_failure=unknown
          terminal_b_executor_task_running=unknown
          last_phase=initialized
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify exact G11 source and workflow-only child
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g11-terminal-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -F= -v k="$key" -v v="$value" '$1 == k { $0 = k "=" v } { print }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source=526d1037fcf4b723d683b263a401757727a67fa0
          parent=4b6ae87a712f782e28e035432967c0bed270e0fc
          expected_paths=$'tests/broker_relay_handoff.rs\ntests/support/broker_relay_handoff.rs\ntests/support/broker_relay_runtime.rs'
          test_source=tests/broker_relay_handoff.rs
          support_source=tests/support/broker_relay_handoff.rs
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g11-terminal-recovery-observation-check-20261123 &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git rev-parse HEAD^)" == "$source" && "$(git rev-parse "$source^")" == "$parent" &&
                "$(git show -s --format=%P "$parent")" == "bbe39996997332a8c6aed7a8551c45258abb8100 076d69add0efcae7f9870630a47c110bc89373c2" &&
                "$(git diff --name-only "$parent" "$source")" == "$expected_paths" &&
                "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             git merge-base --is-ancestor "$source" HEAD &&
             grep -Fq 'async fn software_broker_scoped_relay_ipc_refuses_before_private_detail()' "$test_source" &&
             grep -Fq 'let receipt = serde_json::json!({"phase": phase, "cleanup": cleanup_status, "a": a, "b": b});' "$test_source" &&
             grep -Fq 'eprintln!("g11_relay_terminal_receipt {receipt}");' "$test_source" &&
             grep -Fq 'Fixture::new(90).await' "$test_source" &&
             grep -Fq 'pub(super) struct TerminalWorkerSample' "$support_source" &&
             grep -Fq 'pub(super) async fn sample_worker_terminal' "$support_source" &&
             grep -Fq 'fn terminal_store_receipt(' "$support_source" &&
             grep -Fq 'Real service/Core/helper composition, software only.' "$support_source" &&
             grep -Fq 'engine, provider, project command or privileged host action is executed.' "$support_source"; then
            set_field source_check PASS
            set_field workflow_check PASS
            set_field last_phase source_verified
          else
            set_field source_check FAIL
            set_field workflow_check FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Install and verify the exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g11-terminal-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -F= -v k="$key" -v v="$value" '$1 == k { $0 = k "=" v } { print }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rustup_toolchain_install
          rustup toolchain install 1.99.1 --profile minimal --no-self-update > "$RUNNER_TEMP/g11-rustup.log" 2>&1
          version="$(rustc +1.99.1 --version | awk '{print $2}')"
          [[ "$version" == 1.99.1 ]]
          set_field toolchain PASS
          set_field toolchain_version "$version"
          set_field last_phase toolchain_verified

      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g11-terminal-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -F= -v k="$key" -v v="$value" '$1 == k { $0 = k "=" v } { print }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase dependency_fetch
          if cargo +1.99.1 fetch --locked > "$RUNNER_TEMP/g11-fetch.log" 2>&1; then
            set_field dependency_fetch PASS
            set_field last_phase dependencies_fetched
          else
            rc=$?
            set_field dependency_fetch FAIL
            set_field last_phase dependency_fetch_failed
            exit "$rc"
          fi

      - name: Compile the single integration libtest
        id: build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g11-terminal-receipt.txt"
          scratch="$RUNNER_TEMP/g11-terminal-build"
          mkdir -m 700 "$scratch"
          set_field() {
            local key=$1 value=$2
            awk -F= -v k="$key" -v v="$value" '$1 == k { $0 = k "=" v } { print }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase single_target_build
          build_rc=0
          timeout --kill-after=10s 20m cargo +1.99.1 test --locked --offline --no-default-features \
            --test broker_relay_handoff --no-run --message-format=json \
            > "$scratch/build.jsonl" 2> "$scratch/build.stderr" || build_rc=$?
          set_field build_exit "$build_rc"
          if (( build_rc != 0 )); then
            set_field build_verdict FAIL
            set_field test_result NOT_RUN
            set_field last_phase single_target_build_failed
            exit "$build_rc"
          fi
          libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "broker_relay_handoff" and .target.kind == ["test"]
              and .profile.test == true and .features == [] and .executable != null)
              | .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/build.jsonl" 2>/dev/null || true)"
          if [[ ! -x "$libtest" ]]; then
            set_field build_verdict FAIL
            set_field test_result NOT_RUN
            set_field last_phase single_libtest_artifact_not_unique
            exit 1
          fi
          digest="$(sha256sum "$libtest" | awk '{print $1}')"
          set_field build_verdict PASS
          set_field libtest_sha256 "$digest"
          set_field last_phase single_libtest_ready
          printf 'libtest=%s\n' "$libtest" >> "$GITHUB_OUTPUT"

      - name: Run one exact scoped relay selector and parse its closed receipt
        if: steps.build.outputs.libtest != ''
        shell: bash
        env:
          LIBTEST: ${{ steps.build.outputs.libtest }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g11-terminal-receipt.txt"
          scratch="$RUNNER_TEMP/g11-terminal-private"
          mkdir -m 700 "$scratch"
          set_field() {
            local key=$1 value=$2
            awk -F= -v k="$key" -v v="$value" '$1 == k { $0 = k "=" v } { print }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector=software_broker_scoped_relay_ipc_refuses_before_private_detail
          set_field last_phase exact_test
          test_rc=0
          timeout --kill-after=5s 180s "$LIBTEST" "$selector" --exact --show-output --test-threads=1 --color=never \
            > "$scratch/test.log" 2>&1 || test_rc=$?

          selected="$(grep -Fxc 'running 1 test' "$scratch/test.log" || true)"
          counts="$(sed -nE 's/^test result: [^ ]+\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/p' "$scratch/test.log" | tail -n 1)"
          passed=unknown
          failed=unknown
          ignored=unknown
          if [[ -n "$counts" ]]; then read -r passed failed ignored <<< "$counts"; fi
          set_field test_selected "${selected:-0}"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$test_rc"

          if (( test_rc == 0 )) && [[ "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]] \
              && grep -Fqx "test $selector ... ok" "$scratch/test.log" \
              && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$scratch/test.log"; then
            set_field test_result PASS
          else
            set_field test_result FAIL
          fi

          marker_count="$(grep -c '^g11_relay_terminal_receipt ' "$scratch/test.log" || true)"
          if [[ "$marker_count" == 1 ]]; then
            marker="$(grep -E '^g11_relay_terminal_receipt \{.*\}$' "$scratch/test.log" || true)"
            marker_bytes="$(printf '%s\n' "$marker" | wc -c | tr -d '[:space:]')"
            payload="${marker#g11_relay_terminal_receipt }"
            if [[ -n "$marker" && "$marker_bytes" =~ ^[0-9]+$ && "$marker_bytes" -le 1024 ]] && \
              jq -s -e '
                def enum($value; $allowed): ($value | type) == "string" and (($allowed | index($value)) != null);
                def sample:
                  type == "object" and keys == ["executor_task_running","journal_head","post_cancel_failure","quota_held","same_attempt","state","store","store_receipt","wait","witness"] and
                  enum(.wait; ["not_sampled","completed","timeout","read_failed"]) and
                  enum(.store; ["unknown","present","absent","error"]) and
                  ((.state == null) or enum(.state; ["reserved","preparing","created","start_issued","running","stopping","terminal","in_doubt","cancelled"])) and
                  ((.quota_held == null) or ((.quota_held | type) == "boolean")) and
                  ((.same_attempt == null) or ((.same_attempt | type) == "boolean")) and
                  enum(.witness; ["unknown","created","running","terminal","absent"]) and
                  enum(.store_receipt; ["not_checked","confirmed","absent","mismatch","error"]) and
                  enum(.journal_head; ["not_sampled","unavailable","no_result","result_without_observe","observe_pending","observe_acknowledged"]) and
                  enum(.post_cancel_failure; ["not_sampled","unavailable","no_retry_evidence","decision_after_failure","multiple_worker_failures","decision_after_failure_and_multiple_worker_failures"]) and
                  (if .post_cancel_failure == "not_sampled" or .post_cancel_failure == "unavailable"
                   then .executor_task_running == null else (.executor_task_running | type) == "boolean" end);
                length == 1 and
                (.[0] |
                  type == "object" and keys == ["a","b","cleanup","phase"] and
                  enum(.phase; ["fixture_open","submit_a","awaiting_a","submit_b","running_b","scoped_reads","cancel_a","cancel_b","terminal_a","terminal_b","verified"]) and
                  enum(.cleanup; ["not_started","confirmed","unconfirmed"]) and
                  (.a | sample) and (.b | sample) and
                  .b.journal_head == "not_sampled" and .b.post_cancel_failure == "not_sampled" and .b.executor_task_running == null)
              ' <<< "$payload" >/dev/null; then
              set_field terminal_receipt VALID
              set_field fixture_phase "$(jq -r '.phase' <<< "$payload")"
              set_field fixture_cleanup "$(jq -r '.cleanup' <<< "$payload")"
              for tenant in a b; do
                prefix="terminal_$tenant"
                set_field "${prefix}_wait" "$(jq -r ".${tenant}.wait" <<< "$payload")"
                set_field "${prefix}_store" "$(jq -r ".${tenant}.store" <<< "$payload")"
                set_field "${prefix}_state" "$(jq -r ".${tenant}.state // \"unknown\"" <<< "$payload")"
                set_field "${prefix}_quota_held" "$(jq -r ".${tenant}.quota_held | if . == null then \"unknown\" else tostring end" <<< "$payload")"
                set_field "${prefix}_same_attempt" "$(jq -r ".${tenant}.same_attempt | if . == null then \"unknown\" else tostring end" <<< "$payload")"
                set_field "${prefix}_witness" "$(jq -r ".${tenant}.witness" <<< "$payload")"
                set_field "${prefix}_store_receipt" "$(jq -r ".${tenant}.store_receipt" <<< "$payload")"
                set_field "${prefix}_journal_head" "$(jq -r ".${tenant}.journal_head" <<< "$payload")"
                set_field "${prefix}_post_cancel_failure" "$(jq -r ".${tenant}.post_cancel_failure" <<< "$payload")"
                set_field "${prefix}_executor_task_running" "$(jq -r ".${tenant}.executor_task_running | if . == null then \"unknown\" else tostring end" <<< "$payload")"
              done
            else
              set_field terminal_receipt INVALID
            fi
          elif [[ "$marker_count" =~ ^[0-9]+$ ]] && (( marker_count > 1 )); then
            set_field terminal_receipt DUPLICATE
          else
            set_field terminal_receipt UNKNOWN
          fi
          set_field last_phase test_and_receipt_complete
          if [[ "$(awk -F= '$1 == "test_result" {print $2}' "$receipt")" == PASS &&
                "$(awk -F= '$1 == "terminal_receipt" {print $2}' "$receipt")" == VALID ]]; then
            exit 0
          fi
          echo 'Exact selector or its closed receipt was not confirmed; only closed counts and validated observations were retained.' >&2
          exit 1

      - name: Add the closed receipt to the run summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/g11-terminal-receipt.txt" ]]; then
            {
              echo '### G11 scoped relay terminal observation'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/g11-terminal-receipt.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g11-terminal-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/g11-terminal-receipt.txt
          if-no-files-found: error
          retention-days: 14
