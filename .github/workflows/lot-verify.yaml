name: G09 Legacy RecoveryStatus availability

on:
  push:
    branches: ['claude/v1-g09-legacy-recovery-status-check-20261123']

permissions:
  contents: read

concurrency:
  group: g09-legacy-recovery-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AI_GUARD_BUILD_REVISION: 8a51fbc94b4d9f54c17be4771376343a771f193c
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Initialize a closed receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          printf 'source_sha=8a51fbc94b4d9f54c17be4771376343a771f193c\nsource_tree=dde18d91b73f0fec0183ee14807226bec12afa10\nsource_parent_sha=8c0df8e677a09b08df3cb72c54a4b4979062df25\nworkflow_sha=%s\nworkflow_parent_sha=unknown\nsource_check=NOT_RUN\nworkflow_check=NOT_RUN\nrootful_preflight=NOT_RUN\nworker_image_uid=NOT_RUN\nworker_network=none\nworker_image_sha256=unknown\nbuild_no_run=NOT_RUN\nbuild_exit=unknown\nlibtest_sha256=unknown\ntest_verdict=NOT_RUN\ntest_selected=unknown\ntest_passed=unknown\ntest_failed=unknown\ntest_ignored=unknown\ntest_exit=unknown\nlegacy_recovery_stage=not_reached\nlegacy_oracle_attestation=NOT_ATTESTED\nbroker_closure=unknown\ngateway_closure=unknown\nguardian_shutdown=unknown\nfixture_evidence_root=NOT_VERIFIED\ncontainers_before=unknown\ncontainers_after=unknown\ncontainers_new=unknown\nvolumes_before=unknown\nvolumes_after=unknown\nvolumes_new=unknown\nengine_cleanup=NOT_PERFORMED\nreceipt_closed=NO\nlast_phase=initialized\n' "$WORKFLOW_SHA" > "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact source and workflow-only child
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source=8a51fbc94b4d9f54c17be4771376343a771f193c
          parent=8c0df8e677a09b08df3cb72c54a4b4979062df25
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g09-legacy-recovery-status-check-20261123 &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$source" && "$(git rev-parse "$source^{tree}")" == dde18d91b73f0fec0183ee14807226bec12afa10 &&
                "$(git show -s --format=%P "$source")" == "$parent" &&
                "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git diff --name-only "$parent" "$source" | LC_ALL=C sort)" == $'tests/broker_runtime.rs\ntests/support/broker_runtime.rs' &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             git diff --quiet "$parent" "$source" -- Cargo.lock &&
             grep -Fq 'async fn broker_sigkill_legacy_recovery_status_attests_original_worker_arm() -> Result<()>' tests/broker_runtime.rs &&
             grep -Fq 'LostProcess::LegacyRecoveryStatus' tests/broker_runtime.rs &&
             grep -Fq '"legacy-recovery-stage.json"' tests/broker_runtime.rs &&
             grep -Fq '"legacy-recovery-closure.json"' tests/broker_runtime.rs &&
             grep -Fq 'enum LegacyRecoveryStage' tests/broker_runtime.rs &&
             grep -Fq 'pub fn has_exited(&mut self) -> io::Result<bool>' tests/support/broker_runtime.rs; then
            set_field workflow_parent_sha "$source"
            set_field source_check PASS
            set_field workflow_check PASS
            set_field last_phase source_verified
          else
            set_field source_check FAIL
            set_field workflow_check FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Prepare private short scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=private_tmp_prepare/' "$receipt"
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private"
          canonical=$(realpath -- "$private")
          [[ "$canonical" == "$private" && ${#canonical} -le 80 && "$(stat -c '%a' "$private")" == 700 ]]
          mkdir -m 700 "$private/tmp"
          [[ "$(realpath -- "$private/tmp")" == "$private/tmp" && "$(stat -c '%a' "$private/tmp")" == 700 ]]
          printf 'G09_PRIVATE=%s\nTMPDIR=%s\n' "$private" "$private/tmp" >> "$GITHUB_ENV"

      - name: Verify local rootful Docker and inventory existing resources
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rootful_preflight
          endpoint=$(docker context inspect --format '{{.Endpoints.docker.Host}}' default)
          security=$(docker info --format '{{json .SecurityOptions}}')
          platform=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          if test -S /var/run/docker.sock && [[ "$endpoint" == unix:///var/run/docker.sock && "$platform" == linux/amd64 ]] &&
             jq -e 'all(.[]; (ascii_downcase | contains("rootless")) | not)' <<< "$security" >/dev/null; then
            docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$G09_PRIVATE/containers.before"
            docker volume ls -q | LC_ALL=C sort -u > "$G09_PRIVATE/volumes.before"
            set_field containers_before "$(wc -l < "$G09_PRIVATE/containers.before" | tr -d ' ')"
            set_field volumes_before "$(wc -l < "$G09_PRIVATE/volumes.before" | tr -d ' ')"
            set_field rootful_preflight PASS
            set_field last_phase rootful_preflight_complete
          else
            set_field rootful_preflight FAIL
            set_field last_phase rootful_preflight_failed
            exit 1
          fi

      - name: Build private UID 1000 worker fixture
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          tag="ai-guard-g09-legacy-recovery:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field last_phase worker_image_build
          if docker build --file images/worker.Dockerfile --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= --tag "$tag" . > "$G09_PRIVATE/worker-build.log" 2>&1; then
            image_id=$(docker image inspect --format '{{.Id}}' "$tag")
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$(docker image inspect --format '{{.Config.User}}' "$image_id")" == 1000:1000 ]]
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" == linux/amd64 ]]
            printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_ALLOW_ROOTFUL=1\nAGENTSANDBOX_TEST_RETAIN_ENFORCER=1\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=unix:///var/run/docker.sock\nAGENTSANDBOX_TEST_IMAGE=%s\nAGENTSANDBOX_TEST_BROKER_NATIVE_START=1\nAGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS=30\n' "$image_id" >> "$GITHUB_ENV"
            printf '%s\n' "$image_id" > "$G09_PRIVATE/image.id"
            set_field worker_image_uid PASS
            set_field worker_image_sha256 "${image_id#sha256:}"
            set_field last_phase worker_image_verified
          else
            set_field worker_image_uid FAIL
            set_field last_phase worker_image_build_failed
            exit 1
          fi

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=dependency_fetch/' "$receipt"
          if cargo fetch --locked > "$G09_PRIVATE/fetch.log" 2>&1; then
            sed -i 's/^last_phase=.*/last_phase=dependencies_fetched/' "$receipt"
          else
            rc=$?
            sed -i "s/^last_phase=.*/last_phase=dependency_fetch_failed_exit_${rc}/" "$receipt"
            exit "$rc"
          fi

      - name: Compile one broker libtest executable
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase libtest_no_run
          if cargo test --locked --offline --test broker_runtime --no-run --message-format=json > "$G09_PRIVATE/build.jsonl" 2> "$G09_PRIVATE/build.stderr"; then
            libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "broker_runtime" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl")
            [[ -x "$libtest" ]]
            sha=$(sha256sum "$libtest" | awk '{print $1}')
            set_field libtest_sha256 "$sha"
            set_field build_no_run PASS
            set_field build_exit 0
            set_field last_phase compiled_no_run
            printf '%s\n' "$libtest" > "$G09_PRIVATE/libtest.path"
          else
            rc=$?
            set_field build_no_run FAIL
            set_field build_exit "$rc"
            set_field last_phase no_run_build_failed
            exit "$rc"
          fi

      - name: Run exact Legacy RecoveryStatus availability selector
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector=broker_sigkill_legacy_recovery_status_attests_original_worker_arm
          log="$G09_PRIVATE/test.log"
          set_field last_phase targeted_legacy_recovery_status
          libtest=$(<"$G09_PRIVATE/libtest.path")
          if "$libtest" "$selector" --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1; then rc=0; else rc=$?; fi
          selected=0 passed=0 failed=0 ignored=0
          grep -Fqx 'running 1 test' "$log" && selected=1 || true
          grep -Fqx "test $selector ... ok" "$log" && passed=1 || true
          grep -Fqx "test $selector ... FAILED" "$log" && failed=1 || true
          summary=$(grep -E '^test result:' "$log" | tail -n 1 | sed -E 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/' || true)
          if [[ "$summary" =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then read -r passed failed ignored <<< "$summary"; fi
          if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then verdict=PASS; else verdict=FAIL; fi
          set_field test_verdict "$verdict"
          set_field test_selected "$selected"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"
          evidence_root=$(sed -nE "s|^test $selector \.\.\. retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\\1|p; s|^retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\\1|p" "$log" | LC_ALL=C sort -u)
          if [[ $(printf '%s\n' "$evidence_root" | sed '/^$/d' | wc -l | tr -d ' ') == 1 && "$evidence_root" =~ ^/tmp/br-[[:alnum:]]{6}$ && -d "$evidence_root" && ! -L "$evidence_root" && "$(realpath -- "$evidence_root")" == "$evidence_root" && "$(stat -c '%u %a' "$evidence_root")" == "$(id -u) 700" ]]; then
            set_field fixture_evidence_root VERIFIED_PRIVATE
            read_enum() {
              local file=$1 field=$2 value
              if [[ -f "$evidence_root/$file" && ! -L "$evidence_root/$file" && "$(realpath -- "$evidence_root/$file")" == "$evidence_root/$file" && "$(stat -c '%u %a' "$evidence_root/$file")" == "$(id -u) 600" ]]; then
                value=$(jq -ser --arg field "$field" 'if length == 1 then (if $field == "stage" then .[0] else .[0][$field] end) else empty end' "$evidence_root/$file" 2>/dev/null) || value=unknown
              else
                value=unknown
              fi
              case "$field:$value" in
                stage:not_reached|stage:spawn_failed|stage:spawned|stage:child_exited|stage:child_wait_failed|stage:availability_timed_out|stage:status_refused|stage:unexpected_reply|stage:original_arm_mismatch|stage:recovery_attested) ;;
                broker:not_spawned|broker:already_exited|broker:confirmed|broker:unconfirmed) ;;
                gateway:not_spawned|gateway:already_exited|gateway:confirmed|gateway:unconfirmed) ;;
                guardian_shutdown:not_requested) ;;
                *) value=unknown ;;
              esac
              printf '%s\n' "$value"
            }
            set_field legacy_recovery_stage "$(read_enum legacy-recovery-stage.json stage '')"
            set_field broker_closure "$(read_enum legacy-recovery-closure.json broker '')"
            set_field gateway_closure "$(read_enum legacy-recovery-closure.json gateway '')"
            set_field guardian_shutdown "$(read_enum legacy-recovery-closure.json guardian_shutdown '')"
            if [[ "$verdict" == PASS && "$(grep '^legacy_recovery_stage=' "$receipt" | cut -d= -f2)" == recovery_attested ]]; then
              set_field legacy_oracle_attestation VERIFIED_ORIGINAL_WORKER_ARM_AND_DEADLINE
            else
              if [[ "$verdict" == PASS ]]; then
                verdict=FAIL
                set_field test_verdict FAIL
              fi
              set_field legacy_oracle_attestation NOT_ATTESTED
            fi
          else
            set_field fixture_evidence_root UNKNOWN
            set_field legacy_recovery_stage unknown
            set_field broker_closure unknown
            set_field gateway_closure unknown
            set_field guardian_shutdown unknown
          fi
          set_field last_phase legacy_recovery_status_complete
          [[ "$verdict" == PASS ]]

      - name: Record separate read-only engine inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-legacy-recovery-status-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field engine_cleanup INVENTORY_UNAVAILABLE
          if [[ -d "$private" && -f "$private/containers.before" && -f "$private/volumes.before" ]] && docker info >/dev/null 2>&1; then
            if docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.after" &&
               docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.after" &&
               comm -13 "$private/containers.before" "$private/containers.after" > "$private/containers.new" &&
               comm -13 "$private/volumes.before" "$private/volumes.after" > "$private/volumes.new"; then
              set_field containers_after "$(wc -l < "$private/containers.after" | tr -d ' ')"
              set_field containers_new "$(wc -l < "$private/containers.new" | tr -d ' ')"
              set_field volumes_after "$(wc -l < "$private/volumes.after" | tr -d ' ')"
              set_field volumes_new "$(wc -l < "$private/volumes.new" | tr -d ' ')"
              set_field engine_cleanup NOT_PERFORMED
            fi
          fi
          set_field receipt_closed YES

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-legacy-recovery-status-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/g09-legacy-recovery-status-receipt.txt
          if-no-files-found: error
          retention-days: 14
