name: G08 owned shares transport

on:
  push:
    branches:
      - claude/v1-g08-owned-grants-bff-green-check-20261123

permissions:
  contents: read

concurrency:
  group: g08-owned-grants-bff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-membership-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_SHA: 1c8d9b323c2dc89c3d0804a8b86e36a1cad1a5ef
      SOURCE_TREE: 744e0afdf3a6e1c0d71ea1c7562ef6672383d689
      SOURCE_PARENT: f4a5126f374d4b28f16f376ded01c4ac2fd4b77a
      SOURCE_PARENT_TREE: e38bc4edba6afccdc7c821747173e8252efdaca3
      SOURCE_RED_PARENT_TREE: 2d3d42755f760acdac512810e4bf7d85be8811c6
      SOURCE_BASE_SHA: 05f778bd072f8faf053ddab411ed9771d8899edd
      SOURCE_BASE_TREE: 7cc59be478ff42a60c0a53f6eb76d46b57fd3d1f
      LOCK_SHA: 05847a300405860df8f860d5dc1c39ca423dfa0d
      EXPECTED_BRANCH: claude/v1-g08-owned-grants-bff-green-check-20261123
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
    steps:
      - name: Initialize closed transport receipt
        shell: bash
        run: |
          umask 077
          receipt="$RUNNER_TEMP/g08-owned-grants-bff.txt"
          cat > "$receipt" <<'EOF'
          green_source_sha=1c8d9b323c2dc89c3d0804a8b86e36a1cad1a5ef
          green_source_tree=744e0afdf3a6e1c0d71ea1c7562ef6672383d689
          source_parent=f4a5126f374d4b28f16f376ded01c4ac2fd4b77a
          source_parent_tree=e38bc4edba6afccdc7c821747173e8252efdaca3
          workflow_sha=NOT_RUN
          source_guard=NOT_RUN
          checkout_shallow=NOT_RUN
          toolchain=NOT_RUN
          dependency_fetch=NOT_RUN
          green_build=NOT_RUN
          green_libtest_sha256=unknown
          selector_1=NOT_RUN
          selector_2=NOT_RUN
          selector_3=NOT_RUN
          selector_4=NOT_RUN
          selector_5=NOT_RUN
          selector_6=NOT_RUN
          selected=0
          passed=0
          failed=0
          ignored=0
          private_cleanup=NOT_RUN
          last_phase=NOT_RUN
          result=NOT_RUN
          scope=six exact owned shares and membership transport library selectors using only SQLite and loopback fixtures
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 4

      - name: Check source lineage and run six exact selectors
        id: verify
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g08-owned-grants-bff.txt"
          private_root=
          phase=source_guard
          result=FAIL
          selected_count=0
          passed_count=0
          failed_count=0
          ignored_count=0
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            chmod 600 "$receipt.tmp"
            mv -- "$receipt.tmp" "$receipt"
          }
          finish() {
            local code=$? cleanup_rc=0 final_phase
            trap - EXIT
            set +e
            if [[ -n "$private_root" && "$private_root" == /tmp/g08om.* ]]; then
              rm -rf -- "$private_root" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$private_root" ]] || cleanup_rc=1
            fi
            case "$phase" in
              source_guard|toolchain|scratch_setup|dependency_fetch|green_compile|green_selectors|complete)
                final_phase="$phase" ;;
              *) final_phase=unknown ;;
            esac
            if (( cleanup_rc != 0 )); then final_phase=private_cleanup; fi
            if (( cleanup_rc == 0 )); then set_receipt private_cleanup PASS; else set_receipt private_cleanup FAIL; fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; else result=FAIL; fi
            set_receipt last_phase "$final_phase"
            set_receipt result "$result"
            {
              printf 'G08 owned shares transport=%s source=%s\n' "$result" "$SOURCE_SHA"
              printf 'Exact tests selected=%s passed=%s failed=%s ignored=%s cleanup=%s phase=%s\n' \
                "$selected_count" "$passed_count" "$failed_count" "$ignored_count" \
                "$(awk -F= '$1=="private_cleanup"{print $2}' "$receipt")" "$final_phase"
            } >> "$GITHUB_STEP_SUMMARY"
            if (( code == 0 && cleanup_rc != 0 )); then code=1; fi
            exit "$code"
          }
          trap finish EXIT

          set_receipt workflow_sha "$GITHUB_SHA"
          expected_paths=$'src/api.rs\nsrc/api/human.rs\nsrc/api/human/admin.rs\nsrc/api/human_sources.rs\nsrc/api/human_sources/journal_tests/dashboard.rs\nsrc/api/human_sources/tests.rs'
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
             "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
             "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
             "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
             "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
             "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
             "$(git show -s --format=%P "$SOURCE_SHA" 2>/dev/null)" == "$SOURCE_PARENT" &&
             "$(git rev-parse "$SOURCE_PARENT^{tree}" 2>/dev/null)" == "$SOURCE_PARENT_TREE" &&
             "$(git show -s --format=%P "$SOURCE_PARENT" 2>/dev/null)" == "$SOURCE_BASE_SHA" &&
             "$(git rev-parse "$SOURCE_BASE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_BASE_TREE" &&
             "$(git rev-parse "$SOURCE_SHA:Cargo.lock" 2>/dev/null)" == "$LOCK_SHA" &&
             "$(git diff --name-only "$SOURCE_PARENT" "$SOURCE_SHA" 2>/dev/null)" == "$expected_paths" &&
             "$(git diff --name-only "$SOURCE_BASE_SHA" "$SOURCE_PARENT" 2>/dev/null)" == src/api/human_sources/journal_tests/dashboard.rs &&
             "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
             "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" ]] || {
            set_receipt source_guard FAIL
            echo 'G08 source/ref guard failed; details omitted.' >&2
            exit 1
          }
          set_receipt source_guard PASS
          set_receipt checkout_shallow PASS

          phase=toolchain
          rustc_line="$(rustc --version 2>/dev/null || true)"
          [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]] || { set_receipt toolchain MISMATCH; exit 1; }
          set_receipt toolchain 1.99.1

          phase=scratch_setup
          private_root="$(mktemp -d /tmp/g08om.XXXXXX)" || exit 1
          private_root="$(realpath -e "$private_root")" || exit 1
          chmod 700 "$private_root"
          mkdir -m 700 "$private_root/target" "$private_root/tmp"
          export TMPDIR="$private_root/tmp" CARGO_TARGET_DIR="$private_root/target"

          phase=dependency_fetch
          if cargo fetch --locked > "$private_root/fetch.log" 2>&1; then
            set_receipt dependency_fetch PASS
          else
            set_receipt dependency_fetch FAIL
            exit 1
          fi

          phase=green_compile
          if ! git switch --detach "$SOURCE_SHA" >/dev/null 2>&1; then
            set_receipt green_build CHECKOUT_FAIL
            exit 1
          fi
          if AI_GUARD_BUILD_REVISION="$SOURCE_SHA" timeout --kill-after=15s 45m \
              cargo test --locked --offline --no-default-features --lib --no-run --message-format=json \
              > "$private_root/green-build.jsonl" 2> "$private_root/green-build.stderr"; then
            green_libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$private_root/green-build.jsonl" 2>/dev/null || true)"
            [[ -n "$green_libtest" && -x "$green_libtest" ]] || { set_receipt green_build ARTIFACT_MISMATCH; exit 1; }
            set_receipt green_build PASS
            set_receipt green_libtest_sha256 "$(sha256sum "$green_libtest" | awk '{print $1}')"
          else
            set_receipt green_build FAIL
            exit 1
          fi

          phase=green_selectors
          selectors=(
            api::human_sources::journal_tests::dashboard::owned_dashboard_relays_the_exact_delegated_grant_change
            api::human_sources::journal_tests::dashboard::owned_dashboard_grants_get_still_relays_the_exact_read
            api::human_sources::journal_tests::dashboard::owned_dashboard_relays_the_delegated_membership_change_and_gateway_receipt
            api::human_sources::tests::delegated_grant_private_post_requires_an_owned_gateway
            api::human_sources::tests::modern_route_matrix_closes_before_body_extractors_and_store
            api::human_sources::journal_tests::owned_admin_reads::owned_grant_change_format14_returns_one_durable_receipt_and_keeps_the_source_available
          )
          [[ "${#selectors[@]}" == 6 ]] || { set_receipt green_build INVALID_SELECTOR_TABLE; exit 1; }
          run_failed=0
          index=0
          for selector in "${selectors[@]}"; do
            ((index += 1))
            test_log="$private_root/green-${index}.log"
            test_rc=0
            timeout --kill-after=5s 300s "$green_libtest" "$selector" --exact --test-threads=1 \
              > "$test_log" 2>&1 || test_rc=$?
            selected_here=0
            [[ "$(grep -Fxc 'running 1 test' "$test_log" || true)" == 1 ]] && selected_here=1 || true
            summary_line="$(grep -E '^test result: ' "$test_log" | tail -n 1 || true)"
            summary_state=UNKNOWN
            summary_passed=0
            summary_failed=0
            summary_ignored=0
            if [[ "$summary_line" =~ ^test\ result:\ (ok|FAILED)\.\ ([0-9]+)\ passed\;\ ([0-9]+)\ failed\;\ ([0-9]+)\ ignored\; ]]; then
              summary_state="${BASH_REMATCH[1]}"
              summary_passed="${BASH_REMATCH[2]}"
              summary_failed="${BASH_REMATCH[3]}"
              summary_ignored="${BASH_REMATCH[4]}"
            fi
            selected_count=$((selected_count + selected_here))
            passed_count=$((passed_count + summary_passed))
            failed_count=$((failed_count + summary_failed))
            ignored_count=$((ignored_count + summary_ignored))
            if [[ "$test_rc" == 0 && "$selected_here" == 1 && "$summary_state" == ok &&
                  "$summary_passed" == 1 && "$summary_failed" == 0 && "$summary_ignored" == 0 &&
                  "$(grep -Fxc "test $selector ... ok" "$test_log" || true)" == 1 ]]; then
              set_receipt "selector_$index" PASS_1_0_0
            else
              set_receipt "selector_$index" FAIL
              run_failed=1
            fi
          done
          set_receipt selected "$selected_count"
          set_receipt passed "$passed_count"
          set_receipt failed "$failed_count"
          set_receipt ignored "$ignored_count"
          [[ "$run_failed" == 0 && "$selected_count" == 6 && "$passed_count" == 6 &&
             "$failed_count" == 0 && "$ignored_count" == 0 ]] || exit 1
          phase=complete

      - name: Upload only the closed transport receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g08-owned-grants-bff-${{ github.sha }}
          path: ${{ runner.temp }}/g08-owned-grants-bff.txt
          if-no-files-found: error
          retention-days: 14
