name: S6 human oracles

on:
  push:
    branches: ['claude/v1-s6-human-oracles-check-20261122']

permissions:
  contents: read

concurrency:
  group: s6-human-oracles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the three exact SQLite integration tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d /tmp/aig.XXXXXX)"
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          build_json="$scratch/build.jsonl"
          test_log="$scratch/selector.log"
          summary=cargo-test-summary.txt
          : > "$summary"

          checks=(
            'human_admin_changes a_delegated_share_change_never_raises_a_right'
            'human_brokers broker_capability_cannot_be_persisted_before7_or_delegated_by_org_admin'
            'human_brokers organization_admin_can_retain_or_remove_but_never_introduce_or_reactivate_broker_grants'
          )

          not_run() {
            for check in "${checks[@]}"; do
              printf 'NOT_RUN %s reason=%s\n' "$check" "$1" | tee -a "$summary"
            done
            exit 1
          }

          printf 'Revision %s\n' "$GITHUB_SHA" | tee -a "$summary"
          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            not_run dependency_fetch
          fi
          if ! cargo test --locked --offline --no-default-features --no-run \
              --test human_admin_changes --test human_brokers --message-format=json \
              > "$build_json" 2> "$scratch/build.stderr"; then
            not_run test_build
          fi

          for target in human_admin_changes human_brokers; do
            if ! executable="$(jq -ers --arg target "$target" '[.[] | select(
                .reason == "compiler-artifact" and .target.name == $target
                and .target.kind == ["test"] and .profile.test == true and .executable != null)
                | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null)" \
                || [[ ! -x "$executable" ]]; then
              not_run test_executable
            fi
            printf '%s\n' "$executable" > "$scratch/$target"
            digest="$(sha256sum "$executable")"
            printf 'Test executable %s SHA-256 %s\n' "$target" "${digest%% *}" | tee -a "$summary"
          done

          passed=0
          for check in "${checks[@]}"; do
            read -r target selector <<< "$check"
            executable="$(< "$scratch/$target")"
            status=0
            "$executable" "$selector" --exact --test-threads=1 > "$test_log" 2>&1 || status=$?
            if (( status == 0 )) \
                && grep -Fxq 'running 1 test' "$test_log" \
                && grep -Fxq "test $selector ... ok" "$test_log" \
                && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' "$test_log"; then
              printf 'PASS %s passed=1 failed=0 ignored=0\n' "$check" | tee -a "$summary"
              ((passed += 1))
            elif grep -Fxq 'running 0 tests' "$test_log" \
                || grep -Fq "test $selector ... ignored" "$test_log"; then
              printf 'NOT_RUN %s reason=missing_or_ignored\n' "$check" | tee -a "$summary"
            elif grep -Fxq 'running 1 test' "$test_log" \
                && grep -Fxq "test $selector ... FAILED" "$test_log" \
                && grep -Eq '^test result: FAILED\. 0 passed; 1 failed; 0 ignored; 0 measured;' "$test_log"; then
              printf 'FAIL %s passed=0 failed=1 ignored=0\n' "$check" | tee -a "$summary"
            else
              printf 'FAIL %s reason=invalid_result exit=%s\n' "$check" "$status" | tee -a "$summary"
            fi
          done
          printf 'Passed %s of %s exact selectors\n' "$passed" "${#checks[@]}" | tee -a "$summary"
          (( passed == ${#checks[@]} ))
      - name: Publish the test receipt
        if: always()
        shell: bash
        run: |
          if [[ -f cargo-test-summary.txt ]]; then
            cat cargo-test-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the test receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lot-verify-rust-${{ github.sha }}
          path: cargo-test-summary.txt
          if-no-files-found: ignore
          retention-days: 14
