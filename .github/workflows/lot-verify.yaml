name: G10 live dashboard readiness only
'on':
  push:
    branches:
    - claude/v1-g10-live-dashboard-short-tmp-check-20261123
permissions:
  contents: read
concurrency:
  group: g10-live-dashboard-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SOURCE_SHA: 90bd1f6bddc6c4f09f5812d50620e4a33674d6a3
      SOURCE_TREE: cdd78df4d725a06cee1873989f8ab50a75c9cce0
      SOURCE_PARENT: 152070cbd63882c37a4bbb58a63a5fe92778d0a3
      EXPECTED_BRANCH: claude/v1-g10-live-dashboard-short-tmp-check-20261123
      SELECTOR: real_cli_live_dashboard_readiness_two_tenants
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
      LC_ALL: C
    steps:
    - name: Initialize closed readiness receipt
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        cat > "$receipt" <<'EOF'
        source_sha=90bd1f6bddc6c4f09f5812d50620e4a33674d6a3
        source_tree=cdd78df4d725a06cee1873989f8ab50a75c9cce0
        source_parent=152070cbd63882c37a4bbb58a63a5fe92778d0a3
        workflow_sha=NOT_RUN
        source_guard=NOT_RUN
        rustc=NOT_RUN
        cargo=NOT_RUN
        cargo_fetch=NOT_RUN
        runner_user=NOT_RUN
        browser_node=NOT_RUN
        frontend_install=NOT_RUN
        frontend_build=NOT_RUN
        playwright=NOT_RUN
        chromium=NOT_RUN
        chromium_version=NOT_RUN
        chromium_probe=NOT_RUN
        chromium_probe_phase=NOT_RUN
        chromium_probe_uid=NOT_ATTESTED
        chromium_probe_sandbox=NOT_ATTESTED
        chromium_probe_loopback=NOT_ATTESTED
        chromium_probe_external_requests=NOT_ATTESTED
        chromium_probe_context_close=NOT_ATTESTED
        chromium_probe_browser_close=NOT_ATTESTED
        chromium_probe_server_close=NOT_ATTESTED
        libtest=NOT_RUN
        rust_libtest_sha256=NOT_RUN
        last_phase=initialized
        selector=real_cli_live_dashboard_readiness_two_tenants
        selector_inventory=NOT_RUN
        selected=NOT_ATTESTED
        running_one=NOT_ATTESTED
        test_exit=NOT_RUN
        passed=unknown
        failed=unknown
        ignored=unknown
        summary=UNKNOWN
        test_verdict=NOT_RUN
        failure_phase=UNKNOWN
        readiness=NOT_ATTESTED
        selector_tmp=NOT_CREATED
        selector_tmp_length=NOT_RUN
        selector_tmp_owner=NOT_ATTESTED
        selector_tmp_mode=NOT_ATTESTED
        selector_tmp_canonical=NOT_ATTESTED
        selector_tmp_cleanup=NOT_STARTED
        browser_close=NOT_ATTESTED
        gateway_close=NOT_ATTESTED
        worker_commands=NOT_REQUESTED
        cleanup=NOT_STARTED
        result=NOT_RUN
        EOF
        chmod 600 "$receipt"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact readiness source and workflow lineage
      shell: bash
      run: |-
        set +x
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        set_field workflow_sha "$GITHUB_SHA"
        if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
              "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
              "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
              "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
              "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
              "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
              "$(git cat-file commit "$SOURCE_SHA" 2>/dev/null | awk '$1 == "parent" { parent[++n] = $2 } END { if (n == 1) print parent[1] }')" == "$SOURCE_PARENT" &&
              "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
              -z "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" &&
              "$(grep -Fxc 'async fn real_cli_live_dashboard_readiness_two_tenants() -> Result<()> {' tests/runtime_user_journey.rs || true)" == 1 &&
              "$(grep -Fxc '#[ignore = "requires the hosted dashboard browser fixture and a local loopback gateway; no workers are started"]' tests/runtime_user_journey.rs || true)" == 1 &&
              "$(grep -Fxc '            live.send(json!({"phase":"readiness_close","workers":[]}))' tests/runtime_user_journey.rs || true)" == 1 &&
              "$(grep -Fxc '  if (peak.phase === "readiness_close") {' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '  stage = "document";' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '  stage = "form";' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '  stage = "identity";' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '  stage = "registry";' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '  stage = "views";' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '    const pageFailed = sessions.some(({ errors }) => errors !== 0);' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '    status = pageFailed ? "FAIL" : "CLOSED";' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '    outcome.and(gateway_close)' tests/runtime_user_journey.rs || true)" == 1 &&
              "$(grep -Fxc '            && created.network == NetworkV1::None' tests/runtime_user_journey.rs || true)" == 1 &&
              "$(grep -Fxc '      args: ["--no-sandbox"]' front/tests/browser_runtime_live_window.mjs || true)" == 0 ]]; then
          set_field source_guard PASS
          set_field last_phase source_verified
        else
          set_field source_guard FAIL
          set_field last_phase source_guard_failed
          echo 'Readiness source/ref guard failed; details omitted.' >&2
          exit 1
        fi
    - name: Prepare private browser and Rust scratch
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        private="$RUNNER_TEMP/g10-live-dashboard-readiness"
        if [[ -e "$private" || -L "$private" ]]; then set_field result FAIL; exit 1; fi
        mkdir -m 700 "$private" "$private/tmp" "$private/cargo-target" "$private/playwright" "$private/probe-home" "$private/probe-tmp"
        : > "$private/.workflow-owned"
        chmod 600 "$private/.workflow-owned"
        printf 'G10_PRIVATE=%s\nTMPDIR=%s/tmp\nCARGO_TARGET_DIR=%s/cargo-target\nG10_RUNNER_UID=%s\n' "$private" "$private" "$private" "$(id -u)" >> "$GITHUB_ENV"
        set_field runner_user "$(id -u)"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.2
        package-manager-cache: false
    - name: Install frontend and pinned Playwright driver
      shell: bash
      working-directory: front
      run: |
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        private="$G10_PRIVATE"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        node_version="$(node --version 2>/dev/null || true)"
        if [[ "$node_version" == v24.22.2 ]]; then set_field browser_node 24.22.2; else set_field browser_node MISMATCH; set_field last_phase node_version_mismatch; exit 1; fi
        set_field last_phase frontend_dependencies
        if npm ci --no-audit --no-fund > "$private/npm-ci.log" 2>&1; then
          set_field frontend_install PASS
        else
          set_field frontend_install FAIL; set_field last_phase frontend_install_failed; exit 1
        fi
        if npm run build > "$private/frontend-build.log" 2>&1 && [[ -s dist/index.html ]]; then
          set_field frontend_build PASS
        else
          set_field frontend_build FAIL; set_field last_phase frontend_build_failed; exit 1
        fi
        set_field last_phase playwright_install
        if (cd "$private/playwright" && npm init -y > "$private/playwright-init.log" 2>&1 &&
            npm install --no-save --no-package-lock --ignore-scripts playwright@1.65.1 > "$private/playwright-install.log" 2>&1); then
          version="$(node -p "require('$private/playwright/node_modules/playwright/package.json').version" 2>/dev/null || true)"
          if [[ "$version" == 1.65.1 ]]; then set_field playwright 1.65.1; else set_field playwright MISMATCH; set_field last_phase playwright_version_mismatch; exit 1; fi
        else
          set_field playwright FAIL; set_field last_phase playwright_install_failed; exit 1
        fi
        chrome=/opt/google/chrome/chrome
        if [[ -x "$chrome" ]]; then
          version_rc=0
          version_line="$(timeout --kill-after=5s 10s "$chrome" --product-version 2>/dev/null)" || version_rc=$?
          if [[ "$version_rc" == 0 && "$version_line" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            set_field chromium HOST_CHROME
            set_field chromium_version "$version_line"
            set_field last_phase host_chrome_version_verified
            printf 'AGENTSANDBOX_TEST_BROWSER_DIST=%s/dist\nAGENTSANDBOX_TEST_BROWSER_NODE=%s\nCODEX_PRIMARY_RUNTIME_NODE_MODULES=%s/playwright/node_modules\nPLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\nAGENTSANDBOX_TEST_BROWSER_LIVE=1\n' \
              "$GITHUB_WORKSPACE/front" "$(command -v node)" "$private" "$chrome" >> "$GITHUB_ENV"
          else
            set_field chromium FAIL; set_field chromium_version UNKNOWN; set_field last_phase host_chrome_version_invalid; exit 1
          fi
        else
          set_field chromium MISSING; set_field last_phase host_chrome_missing; exit 1
        fi
    - name: Probe hosted Chrome sandbox on loopback before Rust build
      shell: bash
      run: |
        set +x
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        private="$G10_PRIVATE"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        set_field last_phase chromium_sandbox_probe
        cat > "$private/chrome-sandbox-probe.mjs" <<'NODE'
        import assert from "node:assert/strict";
        import { createRequire } from "node:module";
        import { createServer } from "node:http";
        import { join } from "node:path";

        const require = createRequire(import.meta.url);
        const report = {
          status: "FAIL", phase: "identity", uid_match: "NOT_ATTESTED",
          sandbox: "NOT_ATTESTED", loopback: "NOT_ATTESTED", external_requests: "NOT_ATTESTED",
          context_close: "NOT_ATTESTED", browser_close: "NOT_ATTESTED", server_close: "NOT_ATTESTED",
        };
        let browser, context, server, origin, violations = 0, completedResponses = 0;
        const bounded = async (promise, milliseconds) => {
          let timer;
          try {
            return await Promise.race([promise, new Promise((_, reject) => {
              timer = setTimeout(() => reject(new Error("bounded timeout")), milliseconds);
            })]);
          } finally { clearTimeout(timer); }
        };
        try {
          const expectedUid = Number(process.env.G10_RUNNER_UID);
          report.uid_match = process.getuid?.() === expectedUid && expectedUid > 0 ? "PASS" : "FAIL";
          assert.equal(report.uid_match, "PASS");
          report.phase = "playwright";
          const { chromium } = require(join(process.env.CODEX_PRIMARY_RUNTIME_NODE_MODULES, "playwright"));
          report.phase = "loopback_server";
          server = createServer((_request, response) => {
            response.writeHead(200, { "content-type": "text/html; charset=utf-8", "cache-control": "no-store" });
            response.end("<!doctype html><title>ai-guard sandbox probe</title><main>loopback ready</main>");
            response.once("finish", () => { completedResponses += 1; });
          });
          await bounded(new Promise((resolve, reject) => {
            server.once("error", reject);
            server.listen(0, "127.0.0.1", resolve);
          }), 5000);
          origin = `http://127.0.0.1:${server.address().port}`;
          report.phase = "chrome_launch";
          browser = await chromium.launch({
            headless: true,
            chromiumSandbox: true,
            timeout: 10000,
            executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE,
            args: ["--no-proxy-server", "--no-first-run", "--no-default-browser-check",
              "--disable-background-networking", "--disable-component-update", "--disable-sync",
              "--host-resolver-rules=EXCLUDE 127.0.0.1, MAP * ~NOTFOUND"],
          });
          report.sandbox = "PASS";
          context = await browser.newContext({ serviceWorkers: "block" });
          if (typeof context.routeWebSocket !== "function") throw new Error("websocket route unavailable");
          await context.routeWebSocket("**/*", async (socket) => {
            violations += 1;
            await socket.close();
          });
          await context.route("**/*", async (route) => {
            const request = route.request();
            let allowed = false;
            try { allowed = new URL(request.url()).origin === origin && request.method() === "GET"; } catch {}
            if (!allowed) {
              violations += 1;
              await route.abort("blockedbyclient");
            } else await route.continue();
          });
          report.phase = "loopback_page";
          const page = await context.newPage();
          const response = await page.goto(origin, { waitUntil: "load", timeout: 7000 });
          assert.equal(response?.status(), 200);
          assert.equal(await page.title(), "ai-guard sandbox probe");
          assert.equal(await page.locator("main").innerText(), "loopback ready");
          assert.equal(violations, 0);
          assert.ok(completedResponses >= 1);
          report.loopback = "PASS";
          report.external_requests = "0";
          report.phase = "complete";
          report.status = "PASS";
        } catch {
          report.status = "FAIL";
          if (report.phase === "loopback_page" && violations > 0) report.phase = "network_guard";
        } finally {
          if (context) {
            try { await bounded(context.close(), 5000); report.context_close = "PASS"; }
            catch { report.context_close = "FAIL"; report.status = "FAIL"; if (report.phase === "complete") report.phase = "flush_close"; }
          } else report.context_close = "NOT_STARTED";
          if (browser) {
            try { await bounded(browser.close(), 5000); report.browser_close = "PASS"; }
            catch { report.browser_close = "FAIL"; report.status = "FAIL"; if (report.phase === "complete") report.phase = "flush_close"; }
          } else report.browser_close = "NOT_STARTED";
          if (server?.listening) {
            try {
              await bounded(new Promise((resolve, reject) => {
                server.close((error) => error ? reject(error) : resolve());
                server.closeAllConnections();
              }), 5000);
              report.server_close = "PASS";
            } catch { report.server_close = "FAIL"; report.status = "FAIL"; if (report.phase === "complete") report.phase = "flush_close"; }
          } else report.server_close = server ? "PASS" : "NOT_STARTED";
          if (report.status === "PASS" && [report.context_close, report.browser_close, report.server_close].some((value) => value !== "PASS")) {
            report.status = "FAIL";
            report.phase = "flush_close";
          }
          if (violations > 0) {
            report.external_requests = "BLOCKED";
            report.status = "FAIL";
            report.phase = "network_guard";
          }
          process.stdout.write(`${JSON.stringify(report)}\n`);
        }
        process.exitCode = report.status === "PASS" ? 0 : 1;
        NODE
        chmod 600 "$private/chrome-sandbox-probe.mjs"
        probe_rc=0
        node_bin="$(command -v node)"
        timeout --signal=TERM --kill-after=5s 35s env -i \
          PATH=/usr/bin:/bin \
          HOME="$private/probe-home" \
          TMPDIR="$private/probe-tmp" \
          G10_RUNNER_UID="$G10_RUNNER_UID" \
          CODEX_PRIMARY_RUNTIME_NODE_MODULES="$CODEX_PRIMARY_RUNTIME_NODE_MODULES" \
          PLAYWRIGHT_CHROMIUM_EXECUTABLE="$PLAYWRIGHT_CHROMIUM_EXECUTABLE" \
          "$node_bin" "$private/chrome-sandbox-probe.mjs" \
          > "$private/chrome-sandbox-probe.json" 2> "$private/chrome-sandbox-probe.stderr" || probe_rc=$?
        if [[ -s "$private/chrome-sandbox-probe.json" ]] && jq -e '
          type == "object" and
          (keys | sort) == ["browser_close","context_close","external_requests","loopback","phase","sandbox","server_close","status","uid_match"] and
          (.status == "PASS" or .status == "FAIL") and
          (.phase | IN("identity","playwright","loopback_server","chrome_launch","loopback_page","network_guard","complete","flush_close")) and
          (.uid_match | IN("PASS","FAIL","NOT_ATTESTED")) and
          (.sandbox | IN("PASS","FAIL","NOT_ATTESTED")) and
          (.loopback | IN("PASS","FAIL","NOT_ATTESTED")) and
          (.external_requests | IN("0","BLOCKED","NOT_ATTESTED")) and
          (.context_close | IN("PASS","FAIL","NOT_STARTED","NOT_ATTESTED")) and
          (.browser_close | IN("PASS","FAIL","NOT_STARTED","NOT_ATTESTED")) and
          (.server_close | IN("PASS","FAIL","NOT_STARTED","NOT_ATTESTED"))' "$private/chrome-sandbox-probe.json" >/dev/null; then
          set_field chromium_probe "$(jq -r '.status' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_phase "$(jq -r '.phase' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_uid "$(jq -r '.uid_match' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_sandbox "$(jq -r '.sandbox' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_loopback "$(jq -r '.loopback' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_external_requests "$(jq -r '.external_requests' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_context_close "$(jq -r '.context_close' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_browser_close "$(jq -r '.browser_close' "$private/chrome-sandbox-probe.json")"
          set_field chromium_probe_server_close "$(jq -r '.server_close' "$private/chrome-sandbox-probe.json")"
          if [[ "$probe_rc" == 0 && "$(jq -r '.status' "$private/chrome-sandbox-probe.json")" == PASS &&
                "$(jq -r '.uid_match' "$private/chrome-sandbox-probe.json")" == PASS &&
                "$(jq -r '.sandbox' "$private/chrome-sandbox-probe.json")" == PASS &&
                "$(jq -r '.loopback' "$private/chrome-sandbox-probe.json")" == PASS &&
                "$(jq -r '.external_requests' "$private/chrome-sandbox-probe.json")" == 0 &&
                "$(jq -r '.context_close' "$private/chrome-sandbox-probe.json")" == PASS &&
                "$(jq -r '.browser_close' "$private/chrome-sandbox-probe.json")" == PASS &&
                "$(jq -r '.server_close' "$private/chrome-sandbox-probe.json")" == PASS ]]; then
            set_field last_phase chromium_sandbox_probe_passed
          else
            set_field last_phase "chromium_sandbox_probe_$(jq -r '.phase' "$private/chrome-sandbox-probe.json")"
            echo 'Hosted Chrome sandbox probe failed; phase and closed status retained.' >&2
            exit 1
          fi
        else
          set_field chromium_probe FAIL
          set_field chromium_probe_phase probe_conduit
          set_field last_phase chromium_sandbox_probe_no_closed_result
          echo 'Hosted Chrome probe produced no valid closed result.' >&2
          exit 1
        fi
    - name: Fetch locked Rust dependencies
      shell: bash
      run: |
        set -euo pipefail
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        private="$G10_PRIVATE"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        rustc_line="$(rustc --version 2>/dev/null || true)"
        cargo_line="$(cargo --version 2>/dev/null || true)"
        if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then set_field rustc 1.99.1; else set_field rustc MISMATCH; set_field last_phase rustc_mismatch; exit 1; fi
        if [[ "$cargo_line" =~ ^cargo\ 1\.99\.1($|[[:space:]]) ]]; then set_field cargo 1.99.1; else set_field cargo MISMATCH; set_field last_phase cargo_mismatch; exit 1; fi
        set_field last_phase dependency_fetch
        if cargo fetch --locked > "$private/cargo-fetch.log" 2>&1; then set_field cargo_fetch PASS; set_field last_phase dependencies_fetched; else set_field cargo_fetch FAIL; set_field last_phase dependency_fetch_failed; exit 1; fi
    - name: Compile one exact readiness libtest
      shell: bash
      run: |
        set +x
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        private="$G10_PRIVATE"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        current_uid="$(id -u)"
        if [[ "$current_uid" =~ ^[0-9]+$ && "$current_uid" != 0 && "$current_uid" == "$G10_RUNNER_UID" ]]; then
          set_field runner_user NON_ROOT_SAME_UID_AS_CHROME_PROBE
        else
          set_field runner_user FAIL
          set_field last_phase rust_user_identity_mismatch
          echo 'Rust test user differs from the successful Chrome probe user.' >&2
          exit 1
        fi
        set_field last_phase rust_compile
        if ! cargo test --locked --offline --no-default-features --test runtime_user_journey --no-run --message-format=json > "$private/build.jsonl" 2> "$private/build.stderr"; then
          set_field last_phase rust_compile_failed
          echo 'Exact runtime journey compilation failed; compiler output withheld.' >&2
          exit 1
        fi
        if ! jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "runtime_user_journey" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$private/build.jsonl" > "$private/libtest.path"; then
          set_field last_phase libtest_artifact_ambiguous; exit 1
        fi
        libtest="$(cat "$private/libtest.path")"
        if [[ ! -x "$libtest" ]]; then set_field last_phase libtest_not_executable; exit 1; fi
        set_field rust_libtest_sha256 "$(sha256sum "$libtest" | awk '{print $1}')"
        set_field last_phase rust_compiled
    - name: Run the exact ignored dashboard readiness selector
      shell: bash
      run: |-
        set +x
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        private="$G10_PRIVATE"
        selector="$SELECTOR"
        libtest="$(cat "$private/libtest.path")"
        log="$private/readiness-test.log"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        set_field last_phase selector_inventory
        list_rc=0
        timeout --signal=TERM --kill-after=5s 30s "$libtest" "$selector" --ignored --exact --list > "$private/selector-list.log" 2>&1 || list_rc=$?
        list_matches="$(grep -Fxc "$selector: test" "$private/selector-list.log" || true)"
        list_total="$(grep -Fxc '1 test, 0 benchmarks' "$private/selector-list.log" || true)"
        if [[ "$list_rc" == 0 && "$list_matches" == 1 && "$list_total" == 1 ]]; then
          set_field selector_inventory PASS
        else
          set_field selector_inventory FAIL
          set_field last_phase selector_inventory_failed
          echo 'Readiness selector inventory failed; output withheld.' >&2
          exit 1
        fi
        if ! short_tmp="$(mktemp -d /tmp/ag-r.XXXXXX 2>/dev/null)"; then
          set_field selector_tmp CREATION_FAILED
          set_field selector_tmp_owner FAIL
          set_field selector_tmp_mode FAIL
          set_field selector_tmp_canonical FAIL
          set_field last_phase short_tmp_creation_failed
          exit 1
        fi
        printf 'G10_SELECTOR_TMP=%s\n' "$short_tmp" >> "$GITHUB_ENV"
        canonical_tmp="$(readlink -f -- "$short_tmp" 2>/dev/null || true)"
        tmp_owner="$(stat -c '%u' -- "$short_tmp" 2>/dev/null || true)"
        tmp_mode="$(stat -c '%a' -- "$short_tmp" 2>/dev/null || true)"
        tmp_length="$(printf %s "$short_tmp" | wc -c | tr -d ' ')"
        [[ "$tmp_owner" == "$G10_RUNNER_UID" ]] && set_field selector_tmp_owner PASS || set_field selector_tmp_owner FAIL
        [[ "$tmp_mode" == 700 ]] && set_field selector_tmp_mode PASS || set_field selector_tmp_mode FAIL
        if [[ "$tmp_length" =~ ^[0-9]+$ ]] && (( tmp_length > 0 && tmp_length <= 24 )); then set_field selector_tmp_length "$tmp_length"; else set_field selector_tmp_length OUT_OF_RANGE; fi
        [[ "$short_tmp" =~ ^/tmp/ag-r\.[[:alnum:]]{6}$ && "$canonical_tmp" == "$short_tmp" && -d "$short_tmp" && ! -L "$short_tmp" ]] \
          && set_field selector_tmp_canonical PASS || set_field selector_tmp_canonical FAIL
        if [[ "$(awk -F= '$1=="selector_tmp_owner"{print $2}' "$receipt")" != PASS ||
              "$(awk -F= '$1=="selector_tmp_mode"{print $2}' "$receipt")" != PASS ||
              "$(awk -F= '$1=="selector_tmp_length"{print $2}' "$receipt")" == OUT_OF_RANGE ||
              "$(awk -F= '$1=="selector_tmp_canonical"{print $2}' "$receipt")" != PASS ]]; then
          set_field selector_tmp INVALID
          set_field last_phase short_tmp_validation_failed
          exit 1
        fi
        set_field selector_tmp PRIVATE_READY
        set_field last_phase readiness_test
        test_rc=0
        timeout --signal=TERM --kill-after=15s 30m env TMPDIR="$short_tmp" "$libtest" "$selector" --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1 || test_rc=$?
        set_field test_exit "$test_rc"
        running_count="$(grep -Fxc 'running 1 test' "$log" || true)"
        selected=0
        [[ "$running_count" == 1 && "$list_matches" == 1 ]] && selected=1 || true
        set_field running_one "$([[ "$running_count" == 1 ]] && echo PASS || echo FAIL)"
        set_field selected "$selected"
        summary="$(grep -E '^test result: ' "$log" | tail -n 1 || true)"
        passed=unknown; failed=unknown; ignored=unknown; summary_state=UNKNOWN
        if [[ "$summary" =~ ^test\ result:\ (ok|FAILED)\.\ ([0-9]+)\ passed\;\ ([0-9]+)\ failed\;\ ([0-9]+)\ ignored\;\ [0-9]+\ measured\;\ [0-9]+\ filtered\ out\;\ finished\ in\ [0-9]+(\.[0-9]+)?s$ ]]; then
          summary_state="${BASH_REMATCH[1]}"; passed="${BASH_REMATCH[2]}"; failed="${BASH_REMATCH[3]}"; ignored="${BASH_REMATCH[4]}"
        fi
        set_field passed "$passed"; set_field failed "$failed"; set_field ignored "$ignored"; set_field summary "$summary_state"
        phase_lines=()
        while IFS= read -r line; do phase_lines+=("$line"); done < <(grep -Eo 'live dashboard (BLOCKED|FAIL) at (setup|launch|ready|document|form|identity|registry|views|cleanup|network);' "$log" || true)
        phase=UNKNOWN
        if (( ${#phase_lines[@]} == 1 )); then
          phase="${phase_lines[0]##* at }"
          phase="${phase%;}"
        elif (( ${#phase_lines[@]} > 1 )); then
          phase=AMBIGUOUS
        fi
        set_field failure_phase "$phase"
        verdict=INCONCLUSIVE
        if [[ "$test_rc" == 0 && "$selected" == 1 && "$running_count" == 1 && "$summary_state" == ok && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then
          verdict=PASS
        elif [[ "$summary_state" == FAILED ]]; then
          verdict=FAIL
        fi
        set_field test_verdict "$verdict"
        if [[ "$verdict" == PASS ]]; then
          set_field readiness PASS
          set_field browser_close PASS
          set_field gateway_close PASS
          set_field last_phase readiness_closed
        else
          set_field last_phase readiness_failed_or_unattested
        fi
        printf 'G10 readiness result=%s source=%s selector=%s selected=%s passed=%s failed=%s ignored=%s exit=%s phase=%s browser_close=%s gateway_close=%s workers=%s\n' \
          "$verdict" "$SOURCE_SHA" "$selector" "$selected" "$passed" "$failed" "$ignored" "$test_rc" "$phase" \
          "$(awk -F= '$1=="browser_close"{print $2}' "$receipt")" \
          "$(awk -F= '$1=="gateway_close"{print $2}' "$receipt")" \
          "$(awk -F= '$1=="worker_commands"{print $2}' "$receipt")" >> "$GITHUB_STEP_SUMMARY"
        [[ "$verdict" == PASS ]]
    - name: Close private scratch
      if: always()
      shell: bash
      run: |-
        set +x
        set -uo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-live-dashboard-readiness-receipt.txt"
        private="$RUNNER_TEMP/g10-live-dashboard-readiness"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending" || return 1
          chmod 600 "$receipt.pending" || return 1
          mv -- "$receipt.pending" "$receipt" || return 1
        }
        cleanup=PASS
        selector_cleanup=NOT_CREATED
        test_tmp="${G10_SELECTOR_TMP:-}"
        test_verdict="$(awk -F= '$1=="test_verdict"{print $2}' "$receipt")"
        if [[ -n "$test_tmp" ]]; then
          test_tmp_canonical="$(readlink -f -- "$test_tmp" 2>/dev/null || true)"
          test_tmp_owner="$(stat -c '%u' -- "$test_tmp" 2>/dev/null || true)"
          test_tmp_mode="$(stat -c '%a' -- "$test_tmp" 2>/dev/null || true)"
          if [[ "$test_tmp" =~ ^/tmp/ag-r\.[[:alnum:]]{6}$ && "$test_tmp_canonical" == "$test_tmp" &&
                -d "$test_tmp" && ! -L "$test_tmp" && "$test_tmp_owner" == "$G10_RUNNER_UID" && "$test_tmp_mode" == 700 ]]; then
            if rmdir -- "$test_tmp" >/dev/null 2>&1; then
              if [[ "$test_verdict" == PASS ]]; then selector_cleanup=PASS; else selector_cleanup=TEST_FAILED; fi
            else
              selector_cleanup=NOT_EMPTY
            fi
          else
            selector_cleanup=OWNERSHIP_UNVERIFIED
          fi
        fi
        set_field selector_tmp_cleanup "$selector_cleanup" || exit 1
        if [[ ! -e "$private" && ! -L "$private" ]]; then
          cleanup=PASS
        elif [[ -d "$private" && ! -L "$private" && -f "$private/.workflow-owned" && ! -L "$private/.workflow-owned" &&
              "$private" == "$RUNNER_TEMP/g10-live-dashboard-readiness" ]]; then
          /bin/rm -rf -- "$private" >/dev/null 2>&1 || cleanup=FAIL
        else
          cleanup=FAIL
        fi
        [[ ! -e "$private" && ! -L "$private" ]] || cleanup=FAIL
        set_field cleanup "$cleanup" || exit 1
        verdict="$(awk -F= '$1=="test_verdict"{print $2}' "$receipt")"
        if [[ "$verdict" == PASS && "$selector_cleanup" == PASS && "$cleanup" == PASS ]]; then result=PASS; else result=FAIL; fi
        set_field result "$result" || exit 1
        printf 'Readiness receipt result=%s test=%s phase=%s ready=%s browser_close=%s gateway_close=%s selector_tmp_cleanup=%s cleanup=%s\n' \
          "$result" "$verdict" "$(awk -F= '$1=="failure_phase"{print $2}' "$receipt")" \
          "$(awk -F= '$1=="readiness"{print $2}' "$receipt")" \
          "$(awk -F= '$1=="browser_close"{print $2}' "$receipt")" \
          "$(awk -F= '$1=="gateway_close"{print $2}' "$receipt")" "$selector_cleanup" "$cleanup" >> "$GITHUB_STEP_SUMMARY"
        [[ "$result" == PASS ]]
    - name: Upload only the closed readiness receipt
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: g10-live-dashboard-readiness-${{ github.run_id }}
        path: ${{ runner.temp }}/g10-live-dashboard-readiness-receipt.txt
        if-no-files-found: error
        retention-days: 14
