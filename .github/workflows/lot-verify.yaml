name: G03 Linux rootless systemd export check
permissions:
  contents: read
concurrency:
  group: g03-linux-rootless-systemd-export-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rootless-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      AI_GUARD_BUILD_REVISION: 4b6ae87a712f782e28e035432967c0bed270e0fc
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
    - name: Initialize a closed rootless receipt
      shell: bash
      env:
        WORKFLOW_SHA: ${{ github.sha }}
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        cat > "$receipt" <<EOF_RECEIPT
        source_sha=4b6ae87a712f782e28e035432967c0bed270e0fc
        source_parent_shas=bbe39996997332a8c6aed7a8551c45258abb8100+076d69add0efcae7f9870630a47c110bc89373c2
        workflow_sha=$WORKFLOW_SHA
        expected_parent_sha=4b6ae87a712f782e28e035432967c0bed270e0fc
        source_guard=NOT_RUN
        runner_platform=unknown
        cgroup_mode=unknown
        user_bus_socket=NOT_RUN
        user_manager_access=NOT_RUN
        control_group_verified=NOT_RUN
        delegate_cpu=NOT_RUN
        delegate_memory=NOT_RUN
        delegate_pids=NOT_RUN
        controller_cpu=NOT_RUN
        controller_memory=NOT_RUN
        controller_pids=NOT_RUN
        subtree_cpu=unknown
        subtree_memory=unknown
        subtree_pids=unknown
        preflight=NOT_RUN
        blocked_reason=not_checked
        rootless_prerequisite=NOT_RUN
        prerequisite_source=unknown
        engine_package_version=unknown
        required_extras_version=unknown
        extras_package_version=unknown
        tools_present=NOT_RUN
        apparmor_scope=rootlesskit
        apparmor_profile=NOT_RUN
        apparmor_restrict=NOT_RUN
        rootless_preflight=NOT_RUN
        systemd_unit_start=NOT_STARTED
        systemd_unit_delegate_cpu=NOT_RUN
        systemd_unit_delegate_memory=NOT_RUN
        systemd_unit_delegate_pids=NOT_RUN
        systemd_unit_controller_cpu=NOT_RUN
        systemd_unit_controller_memory=NOT_RUN
        systemd_unit_controller_pids=NOT_RUN
        systemd_unit_subtree_cpu=unknown
        systemd_unit_subtree_memory=unknown
        systemd_unit_subtree_pids=unknown
        rootless_mode=NOT_RUN
        cgroup_driver=unknown
        cgroup_version=unknown
        worker_image_uid=NOT_RUN
        worker_image_id_sha256=unknown
        resource_limit_probe=NOT_RUN
        resource_limit_exit=unknown
        libtest=NOT_RUN
        test_selected=unknown
        test_passed=unknown
        test_failed=unknown
        test_ignored=unknown
        test_exit=unknown
        systemd_unit_cleanup=NOT_STARTED
        private_cleanup=NOT_STARTED
        apparmor_cleanup=NOT_STARTED
        last_phase=initialized
        EOF_RECEIPT
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 3
        persist-credentials: false
    - name: Verify exact merged source and workflow-only commit
      shell: bash
      run: |-
        set -euo pipefail
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        source=4b6ae87a712f782e28e035432967c0bed270e0fc
        expected_parents='bbe39996997332a8c6aed7a8551c45258abb8100 076d69add0efcae7f9870630a47c110bc89373c2'
        selector=real_cli_copies_a_project_and_exports_after_one_audited_worker
        if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
              "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g03-linux-rootless-systemd-export-check-20261122 &&
              "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
              "$(git rev-parse HEAD^)" == "$source" && "$(git show -s --format=%P "$source")" == "$expected_parents" &&
              "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
              -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
           git merge-base --is-ancestor "$source" HEAD &&
           git cat-file -e bbe39996997332a8c6aed7a8551c45258abb8100^{commit} &&
           git cat-file -e 076d69add0efcae7f9870630a47c110bc89373c2^{commit} &&
           grep -Fq 'async fn real_cli_copies_a_project_and_exports_after_one_audited_worker()' tests/runtime_user_journey.rs &&
           grep -Fq 'run.args(["--", "/usr/bin/id"]);' tests/runtime_user_journey.rs &&
           grep -Fq 'assert_eq!(worker["launch"]["network"], "none");' tests/runtime_user_journey.rs &&
           grep -Fq 'assert_eq!(worker["launch"]["image_id"], image);' tests/runtime_user_journey.rs &&
           grep -Fq 'stdout.contains("uid=1000")' tests/runtime_user_journey.rs &&
           grep -Fq 'USER 1000:1000' images/worker.Dockerfile &&
           grep -Fq 'CMD ["/usr/bin/id"]' images/worker.Dockerfile; then
          set_field source_guard PASS
          set_field runner_platform ubuntu-24.04-x64-hosted
          set_field last_phase source_verified
        else
          set_field source_guard FAIL
          set_field rootless_preflight BLOCKED
          set_field blocked_reason source_or_runner_guard_failed
          set_field last_phase source_guard_failed
          exit 1
        fi
      timeout-minutes: 2
    - name: Read systemd user manager and cgroup delegation
      id: systemd-preflight
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        set_field phase systemd_read_only_preflight
        cgroup_root=$(realpath -e /sys/fs/cgroup 2>/dev/null || true)
        fs_type=$(stat -fc '%T' /sys/fs/cgroup 2>/dev/null || true)
        if [[ "$fs_type" == cgroup2fs ]]; then set_field cgroup_mode v2
        elif [[ -n "$fs_type" ]]; then set_field cgroup_mode other
        else set_field cgroup_mode unknown
        fi

        uid=$(id -u)
        user_runtime_dir="/run/user/$uid"
        if [[ -S "$user_runtime_dir/bus" ]]; then
          set_field user_bus_socket PRESENT
          if timeout --signal=TERM --kill-after=1s 3s env \
              XDG_RUNTIME_DIR="$user_runtime_dir" \
              DBUS_SESSION_BUS_ADDRESS="unix:path=$user_runtime_dir/bus" \
              systemctl --user show-environment >/dev/null 2>&1; then
            set_field user_manager_access PASS
          else
            set_field user_manager_access UNAVAILABLE
          fi
        elif [[ -e "$user_runtime_dir/bus" ]]; then
          set_field user_bus_socket NOT_SOCKET
          set_field user_manager_access NOT_CHECKED
        else
          set_field user_bus_socket ABSENT
          set_field user_manager_access NOT_CHECKED
        fi

        control_group=''
        delegate_value=''
        if control_group=$(timeout --signal=TERM --kill-after=1s 3s systemctl show "user@${uid}.service" --property=ControlGroup --value 2>/dev/null) &&
           [[ "$control_group" =~ ^/user\.slice/user-[0-9]+\.slice/user@[0-9]+\.service(/[^/]*)*$ ]]; then
          resolved_group=$(realpath -e -- "$cgroup_root$control_group" 2>/dev/null || true)
          if [[ -n "$cgroup_root" && -n "$resolved_group" && "$resolved_group" == "$cgroup_root"/* && -d "$resolved_group" ]]; then
            set_field control_group_verified PASS
            if delegate_value=$(timeout --signal=TERM --kill-after=1s 3s systemctl show "user@${uid}.service" --property=Delegate --value 2>/dev/null); then :; else delegate_value=''; fi
            case "$delegate_value" in
              yes|true)
                set_field delegate_cpu PASS
                set_field delegate_memory PASS
                set_field delegate_pids PASS
                ;;
              no|false)
                set_field delegate_cpu FAIL
                set_field delegate_memory FAIL
                set_field delegate_pids FAIL
                ;;
              *)
                for controller in cpu memory pids; do
                  if [[ " $delegate_value " == *" $controller "* ]]; then set_field "delegate_$controller" PASS
                  else set_field "delegate_$controller" FAIL
                  fi
                done
                ;;
            esac
            available=''
            subtree=''
            if [[ -r "$resolved_group/cgroup.controllers" ]]; then available=$(<"$resolved_group/cgroup.controllers"); fi
            if [[ -r "$resolved_group/cgroup.subtree_control" ]]; then subtree=$(<"$resolved_group/cgroup.subtree_control"); fi
            for controller in cpu memory pids; do
              if [[ " $available " == *" $controller "* ]]; then set_field "controller_$controller" PASS
              else set_field "controller_$controller" FAIL
              fi
              if [[ " $subtree " == *" +$controller "* || " $subtree " == *" $controller "* ]]; then
                set_field "subtree_$controller" enabled
              elif [[ -r "$resolved_group/cgroup.subtree_control" ]]; then
                set_field "subtree_$controller" disabled
              else
                set_field "subtree_$controller" unavailable
              fi
            done
          else
            set_field control_group_verified FAIL
          fi
        else
          set_field control_group_verified FAIL
        fi

        reason=none
        if [[ "$fs_type" != cgroup2fs ]]; then reason=unified_cgroup_v2_unavailable
        elif grep -Fxq user_bus_socket=ABSENT "$receipt"; then reason=user_systemd_bus_socket_absent
        elif grep -Fxq user_bus_socket=NOT_SOCKET "$receipt"; then reason=user_systemd_bus_socket_invalid
        elif ! grep -Fxq user_manager_access=PASS "$receipt"; then reason=user_systemd_manager_unreachable
        elif ! grep -Fxq control_group_verified=PASS "$receipt"; then reason=user_control_group_unavailable_or_unverified
        elif grep -Eq '^(delegate|controller)_(cpu|memory|pids)=FAIL$' "$receipt"; then reason=required_controller_not_delegated_or_available
        elif grep -Eq '^(delegate|controller)_(cpu|memory|pids)=NOT_RUN$' "$receipt"; then reason=delegation_evidence_incomplete
        fi
        if [[ "$reason" == none ]]; then
          set_field preflight READY_FOR_NEXT_GATE
          set_field blocked_reason none
          set_field phase read_only_systemd_preflight_complete
        else
          set_field preflight BLOCKED
          set_field blocked_reason "$reason"
          set_field phase read_only_systemd_preflight_blocked
          exit 1
        fi
      timeout-minutes: 2
    - name: Prepare private rootless job paths
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
          set_field rootless_preflight BLOCKED
          set_field blocked_reason invalid_job_identity
          exit 1
        fi
        uid=$(id -u)
        user_runtime="/run/user/$uid"
        private="$RUNNER_TEMP/g03-rootless-systemd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        runtime="$user_runtime/ai-guard-g03-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -m 700 "$private"
        mkdir -m 700 "$private/tmp" "$private/data" "$private/execroot"
        mkdir -m 700 "$runtime"
        printf 'G03_PRIVATE=%s\nG03_USER_RUNTIME_DIR=%s\nG03_RUNTIME_DIR=%s\nG03_SOCKET=%s/docker.sock\nG03_SOCKET_URI=unix://%s/docker.sock\nG03_UNIT=aig-g03-%s-%s.service\nG03_TMPDIR=%s/tmp\nTMPDIR=%s/tmp\n' \
          "$private" "$user_runtime" "$runtime" "$runtime" "$runtime" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$private" "$private" >> "$GITHUB_ENV"
        set_field systemd_unit_start NOT_STARTED
        set_field last_phase private_paths_prepared
      timeout-minutes: 2
    - name: Install matched rootless Docker prerequisites
      shell: bash
      run: |
        set -euo pipefail
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        rootless_result=BLOCKED
        rootless_source=unavailable
        rootless_reason=preflight_not_complete
        rootless_exit=0
        engine_version=unknown
        required_extras_version=unknown
        extras_version=unknown
        tools_present=false
        finish_prerequisite_receipt() {
          rc=$?
          if [[ "$rootless_result" != PASS && "$rc" != 0 ]]; then rootless_exit=$rc; fi
          set_field rootless_prerequisite "$rootless_result"
          set_field prerequisite_source "$rootless_source"
          set_field engine_package_version "$engine_version"
          set_field required_extras_version "$required_extras_version"
          set_field extras_package_version "$extras_version"
          if [[ "$tools_present" == true ]]; then set_field tools_present PASS; else set_field tools_present FAIL; fi
          set_field apparmor_scope rootlesskit
          set_field prerequisite_reason "$rootless_reason"
          set_field prerequisite_exit "$rootless_exit"
          set_field last_phase rootless_prerequisites
          if [[ "$rootless_result" != PASS ]]; then
            set_field rootless_preflight BLOCKED
            set_field blocked_reason "$rootless_reason"
          fi
        }
        trap finish_prerequisite_receipt EXIT

        . /etc/os-release
        architecture=$(dpkg --print-architecture)
        if [[ "$ID" != ubuntu || "$VERSION_ID" != 24.04 || "$VERSION_CODENAME" != noble || "$architecture" != amd64 ]]; then
          rootless_reason=unsupported_ubuntu_platform
          exit 1
        fi
        set_field runner_platform ubuntu/24.04/noble/amd64
        engine_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce 2>/dev/null || true)
        observed_engine_version=unknown
        if [[ "$engine_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then
          candidate_engine_version=${BASH_REMATCH[1]}
          if [[ "$candidate_engine_version" =~ ^5:[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.~+_-]+~ubuntu\.24\.04~noble$ ]]; then
            observed_engine_version=$candidate_engine_version
            engine_version=$candidate_engine_version
          fi
        fi
        if [[ "$engine_version" == unknown ]]; then
          rootless_reason=compatible_docker_ce_package_absent
          exit 1
        fi
        required_extras_version="$engine_version"
        extras_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce-rootless-extras 2>/dev/null || true)
        if [[ "$extras_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then
          candidate_extras_version=${BASH_REMATCH[1]}
          if [[ "$candidate_extras_version" =~ ^5:[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.~+_-]+~ubuntu\.24\.04~noble$ ]]; then
            extras_version=$candidate_extras_version
          fi
        fi
        rootless_tools=(/usr/bin/dockerd-rootless.sh /usr/bin/dockerd-rootless-setuptool.sh /usr/bin/rootlesskit)
        tools_present=true
        for tool in "${rootless_tools[@]}"; do [[ -x "$tool" ]] || tools_present=false; done
        if [[ "$extras_version" == "$required_extras_version" && "$tools_present" == true ]]; then
          rootless_source=runner-preinstalled
          rootless_reason=runner_package_matches_installed_engine
          if ! sudo apt-get update > "$RUNNER_TEMP/g03-rootless-prerequisites.log" 2>&1; then
            rootless_reason=ubuntu_package_index_update_failed
            exit 1
          fi
          if ! sudo apt-get install --yes --no-install-recommends --no-upgrade \
            uidmap dbus-user-session slirp4netns fuse-overlayfs apparmor >> "$RUNNER_TEMP/g03-rootless-prerequisites.log" 2>&1; then
            rootless_reason=base_prerequisites_install_failed
            exit 1
          fi
        elif [[ "$extras_version" != unknown ]]; then
          rootless_reason=installed_rootless_extras_version_mismatch
          exit 1
        else
          rootless_source=official-signed-apt
          rootless_reason=checking_signed_candidate
          if ! sudo apt-get update > "$RUNNER_TEMP/g03-rootless-apt.log" 2>&1; then
            rootless_reason=ubuntu_package_index_update_failed
            exit 1
          fi
          if ! sudo apt-get install --yes --no-install-recommends --no-upgrade \
            uidmap dbus-user-session slirp4netns fuse-overlayfs apparmor ca-certificates curl gnupg \
            > "$RUNNER_TEMP/g03-rootless-apt-install.log" 2>&1; then
            rootless_reason=base_prerequisites_install_failed
            exit 1
          fi
          key="$RUNNER_TEMP/docker-g03.asc"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://download.docker.com/linux/ubuntu/gpg --output "$key" 2>> "$RUNNER_TEMP/g03-rootless-apt.log"
          test -s "$key"
          gpg --show-keys --with-colons "$key" > "$RUNNER_TEMP/docker-g03-key-metadata" 2>/dev/null
          test "$(grep -c '^pub:' "$RUNNER_TEMP/docker-g03-key-metadata")" = 1
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo install -m 0644 "$key" /etc/apt/keyrings/docker-g03.asc
          sudo tee /etc/apt/sources.list.d/docker-g03.sources >/dev/null <<'EOF'
        Types: deb
        URIs: https://download.docker.com/linux/ubuntu
        Suites: noble
        Components: stable
        Architectures: amd64
        Signed-By: /etc/apt/keyrings/docker-g03.asc
        EOF
          if ! sudo apt-get update >> "$RUNNER_TEMP/g03-rootless-apt.log" 2>&1; then
            rootless_reason=signed_docker_repository_metadata_failed
            exit 1
          fi
          apt-cache madison docker-ce-rootless-extras > "$RUNNER_TEMP/g03-rootless-candidates"
          awk -v version="$required_extras_version" \
            '$3 == version && $5 == "https://download.docker.com/linux/ubuntu" { found=1 } END { exit !found }' \
            "$RUNNER_TEMP/g03-rootless-candidates" || {
              rootless_reason=signed_candidate_matching_engine_unavailable
              exit 1
            }
          plan="$RUNNER_TEMP/g03-rootless-install-plan"
          if ! sudo apt-get --simulate install --yes --no-install-recommends --no-upgrade \
            "docker-ce-rootless-extras=$required_extras_version" > "$plan" 2>&1; then
            rootless_reason=apt_plan_failed
            exit 1
          fi
          if grep -Eq '^(Inst|Remv) (docker-ce|docker-ce-cli|containerd.io)([[:space:]]|$)' "$plan"; then
            rootless_reason=apt_plan_would_change_existing_engine
            exit 1
          fi
          if ! sudo apt-get install --yes --no-install-recommends --no-upgrade \
            "docker-ce-rootless-extras=$required_extras_version" >> "$RUNNER_TEMP/g03-rootless-apt.log" 2>&1; then
            rootless_reason=matching_extras_install_failed
            exit 1
          fi
          extras_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce-rootless-extras 2>/dev/null || true)
          if [[ "$extras_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then
            candidate_extras_version=${BASH_REMATCH[1]}
            if [[ "$candidate_extras_version" =~ ^5:[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.~+_-]+~ubuntu\.24\.04~noble$ ]]; then
              extras_version=$candidate_extras_version
            fi
          fi
          current_engine_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce 2>/dev/null || true)
          current_engine_version=unknown
          if [[ "$current_engine_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then current_engine_version=${BASH_REMATCH[1]}; fi
          tools_present=true
          for tool in "${rootless_tools[@]}"; do [[ -x "$tool" ]] || tools_present=false; done
          if [[ "$extras_version" != "$required_extras_version" || "$current_engine_version" != "$engine_version" || "$tools_present" != true ]]; then
            rootless_reason=installed_package_engine_or_tools_verification_failed
            exit 1
          fi
          rootless_reason=matching_official_package_installed
        fi
        if ! command -v apparmor_parser >/dev/null 2>&1; then
          rootless_reason=apparmor_parser_unavailable
          exit 1
        fi
        user=$(id -un)
        range_ok() {
          local file=$1
          awk -F: -v user="$user" '$1 == user && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ && $3 >= 65536 {found=1} END {exit !found}' "$file"
        }
        if ! range_ok /etc/subuid || ! range_ok /etc/subgid; then
          rootless_reason=preflight_subid_range_changed
          exit 1
        fi
        rootless_result=PASS
        tools_present=true
      timeout-minutes: 15
    - name: Allow user namespaces only for rootlesskit
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        result=BLOCKED
        finish_apparmor_receipt() {
          rc=$?
          if [[ "$result" == PASS ]]; then return; fi
          if grep -Fxq apparmor_profile=NOT_RUN "$receipt"; then set_field apparmor_profile FAIL; fi
          if grep -Fxq apparmor_restrict=NOT_RUN "$receipt"; then set_field apparmor_restrict FAIL; fi
          set_field rootless_preflight BLOCKED
          if grep -Fxq apparmor_profile=FAIL "$receipt"; then set_field blocked_reason apparmor_profile_install_failed
          else set_field blocked_reason apparmor_userns_restriction_unverified
          fi
          set_field last_phase apparmor_rootlesskit_profile_failed
          [[ "$rc" == 0 ]] || true
        }
        trap finish_apparmor_receipt EXIT
        set_field last_phase apparmor_rootlesskit_profile
        profile=qa-g03-rootlesskit
        profile_file="/etc/apparmor.d/$profile"
        if [[ -e "$profile_file" ]]; then exit 1; fi
        {
          echo 'abi <abi/4.0>,'
          echo 'include <tunables/global>'
          echo 'profile qa-g03-rootlesskit /usr/bin/rootlesskit flags=(unconfined) {'
          echo '  userns,'
          echo '}'
        } | sudo tee "$profile_file" >/dev/null
        set_field apparmor_file_created PASS
        sudo apparmor_parser -r "$profile_file"
        set_field apparmor_profile PASS
        sysctl_value=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>> "$G03_PRIVATE/apparmor.log" || true)
        test "$sysctl_value" = 1
        set_field apparmor_restrict PASS
        result=PASS
        trap - EXIT
      timeout-minutes: 2
    - name: Start dockerd-rootless in one transient user unit
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        userctl() {
          timeout --signal=TERM --kill-after=1s 3s env \
            XDG_RUNTIME_DIR="$G03_USER_RUNTIME_DIR" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$G03_USER_RUNTIME_DIR/bus" \
            systemctl --user "$@"
        }
        set_field last_phase transient_rootless_unit_start
        if [[ ! -d "$G03_RUNTIME_DIR" || ! -d "$G03_PRIVATE/data" || ! -S "$G03_USER_RUNTIME_DIR/bus" ]]; then
          set_field rootless_preflight BLOCKED
          set_field blocked_reason private_runtime_or_user_bus_unavailable
          exit 1
        fi
        if ! timeout --signal=TERM --kill-after=2s 10s env \
            XDG_RUNTIME_DIR="$G03_USER_RUNTIME_DIR" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=$G03_USER_RUNTIME_DIR/bus" \
            systemd-run --user --collect --no-block --unit="$G03_UNIT" \
              --property='Delegate=cpu memory pids' \
              --property=Type=exec \
              --property=KillMode=control-group \
              --property=TimeoutStopSec=10s \
              --property=RuntimeMaxSec=110min \
              --setenv="HOME=$HOME" \
              --setenv="PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              --setenv="XDG_RUNTIME_DIR=$G03_RUNTIME_DIR" \
              --setenv="DBUS_SESSION_BUS_ADDRESS=unix:path=$G03_USER_RUNTIME_DIR/bus" \
              --setenv="TMPDIR=$G03_TMPDIR" \
              --setenv="DOCKERD_ROOTLESS_ROOTLESSKIT_STATE_DIR=$G03_RUNTIME_DIR/rootlesskit" \
              /usr/bin/dockerd-rootless.sh \
              --host="unix://$G03_SOCKET" \
              --data-root="$G03_PRIVATE/data" \
              --exec-root="$G03_PRIVATE/execroot" \
              --pidfile="$G03_PRIVATE/dockerd.pid" \
              >"$G03_PRIVATE/systemd-run.log" 2>&1; then
          set_field systemd_unit_start UNKNOWN
          set_field rootless_preflight BLOCKED
          set_field blocked_reason transient_unit_start_request_failed
          exit 1
        fi
        set_field systemd_unit_start REQUESTED
        ready=0
        for _ in $(seq 1 45); do
          active=$(userctl show "$G03_UNIT" --property=ActiveState --value 2>/dev/null || true)
          if [[ "$active" == active ]]; then
            info=$(timeout --signal=TERM --kill-after=1s 3s env DOCKER_HOST="$G03_SOCKET_URI" /usr/bin/docker info \
              --format '{{json .SecurityOptions}}|{{.CgroupDriver}}|{{.CgroupVersion}}' 2>/dev/null || true)
            if [[ -n "$info" ]]; then
              IFS='|' read -r security_options driver version <<< "$info"
              if jq -e 'any(.[]?; contains("rootless"))' <<< "$security_options" >/dev/null 2>&1 &&
                 [[ "$driver" == systemd && "$version" == 2 && -S "$G03_SOCKET" ]]; then
                ready=1
                break
              fi
            fi
          elif [[ "$active" == failed || "$active" == inactive ]]; then
            break
          fi
          sleep 2
        done
        if [[ "$ready" != 1 ]]; then
          set_field rootless_preflight BLOCKED
          set_field rootless_mode FAIL
          set_field blocked_reason rootless_systemd_cgroup_daemon_unavailable
          set_field last_phase transient_rootless_unit_start_failed
          exit 1
        fi
        set_field systemd_unit_start PASS
        set_field rootless_mode PASS
        set_field cgroup_driver systemd
        set_field cgroup_version 2
        set_field last_phase rootless_daemon_mode_verified

        unit_group=$(userctl show "$G03_UNIT" --property=ControlGroup --value 2>/dev/null || true)
        cgroup_root=$(realpath -e /sys/fs/cgroup 2>/dev/null || true)
        unit_resolved=''
        if [[ "$unit_group" =~ ^/user\.slice/user-[0-9]+\.slice/user@[0-9]+\.service/.+ && "$unit_group" != *..* && -n "$cgroup_root" ]]; then
          unit_resolved=$(realpath -e -- "$cgroup_root$unit_group" 2>/dev/null || true)
        fi
        if [[ -z "$unit_resolved" || "$unit_resolved" != "$cgroup_root"/* || ! -d "$unit_resolved" ]]; then
          set_field rootless_preflight BLOCKED
          set_field blocked_reason transient_unit_cgroup_unavailable
          exit 1
        fi
        unit_delegate=$(userctl show "$G03_UNIT" --property=Delegate --value 2>/dev/null || true)
        unit_available=''
        unit_subtree=''
        if [[ -r "$unit_resolved/cgroup.controllers" ]]; then unit_available=$(<"$unit_resolved/cgroup.controllers"); fi
        if [[ -r "$unit_resolved/cgroup.subtree_control" ]]; then unit_subtree=$(<"$unit_resolved/cgroup.subtree_control"); fi
        for controller in cpu memory pids; do
          if [[ "$unit_delegate" == yes || "$unit_delegate" == true || " $unit_delegate " == *" $controller "* ]]; then set_field "systemd_unit_delegate_$controller" PASS
          else set_field "systemd_unit_delegate_$controller" FAIL
          fi
          if [[ " $unit_available " == *" $controller "* ]]; then set_field "systemd_unit_controller_$controller" PASS
          else set_field "systemd_unit_controller_$controller" FAIL
          fi
          if [[ " $unit_subtree " == *" +$controller "* || " $unit_subtree " == *" $controller "* ]]; then set_field "systemd_unit_subtree_$controller" enabled
          else set_field "systemd_unit_subtree_$controller" disabled
          fi
        done
        if grep -Eq '^systemd_unit_(delegate|controller|subtree)_(cpu|memory|pids)=FAIL$' "$receipt"; then
          set_field rootless_preflight BLOCKED
          set_field blocked_reason transient_unit_controller_delegation_incomplete
          exit 1
        fi
        printf 'DOCKER_HOST=%s
        G03_UNIT_CONTROL_GROUP=%s
        ' "$G03_SOCKET_URI" "$unit_resolved" >> "$GITHUB_ENV"
        set_field rootless_preflight PASS
        set_field last_phase transient_rootless_daemon_ready
      timeout-minutes: 5
    - name: Build the official UID 1000 worker image without providers
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        set_field last_phase worker_image_build
        if timeout --signal=TERM --kill-after=15s 45m docker build --file images/worker.Dockerfile \
            --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= \
            --tag ai-guard-g03-worker:ci . > "$G03_PRIVATE/worker-build.log" 2>&1; then
          worker_id=$(docker image inspect --format '{{.Id}}' ai-guard-g03-worker:ci 2>/dev/null || true)
          image_user=$(docker image inspect --format '{{.Config.User}}' ai-guard-g03-worker:ci 2>/dev/null || true)
          if [[ "$worker_id" =~ ^sha256:[0-9a-f]{64}$ && "$image_user" == 1000:1000 ]]; then
            printf 'AGENTSANDBOX_TEST_RUNTIME=docker
        AGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker
        AGENTSANDBOX_TEST_RUNTIME_ENDPOINT=%s
        AGENTSANDBOX_TEST_IMAGE=%s
        ' \
              "$DOCKER_HOST" "$worker_id" >> "$GITHUB_ENV"
            set_field worker_image_uid PASS
            set_field worker_image_id_sha256 "${worker_id#sha256:}"
            set_field last_phase worker_image_verified
          else
            set_field worker_image_uid FAIL
            set_field rootless_preflight BLOCKED
            set_field blocked_reason worker_image_identity_unverified
            exit 1
          fi
        else
          rc=$?
          set_field worker_image_uid FAIL
          set_field worker_image_build_exit "$rc"
          set_field rootless_preflight BLOCKED
          set_field blocked_reason worker_image_build_failed
          exit "$rc"
        fi
      timeout-minutes: 50
    - name: Verify effective cgroup resource limits without network
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        fixture="$G03_PRIVATE/resource-limit-fixture.txt"
        printf 'g03-resource-limit-fixture-v1\n' > "$fixture"
        chmod 0444 "$fixture"
        set_field last_phase resource_limit_probe
        if timeout --signal=TERM --kill-after=3s 30s docker run --rm --network=none --read-only \
            --cpu-period=100000 --cpu-quota=50000 --memory=134217728 --pids-limit=32 \
            --mount "type=bind,src=$fixture,dst=/run/g03-resource-fixture,readonly" \
            --entrypoint /bin/sh "$AGENTSANDBOX_TEST_IMAGE" -eu -c \
            'test "$(cat /run/g03-resource-fixture)" = g03-resource-limit-fixture-v1 && test "$(cat /sys/fs/cgroup/cpu.max)" = "50000 100000" && test "$(cat /sys/fs/cgroup/memory.max)" = 134217728 && test "$(cat /sys/fs/cgroup/pids.max)" = 32' \
            > "$G03_PRIVATE/resource-limit-probe.log" 2>&1; then
          set_field resource_limit_probe PASS
          set_field resource_limit_exit 0
          set_field last_phase effective_resource_limits_verified
        else
          rc=$?
          set_field resource_limit_probe FAIL
          set_field resource_limit_exit "$rc"
          set_field rootless_preflight BLOCKED
          set_field blocked_reason effective_resource_limits_unverified
          set_field last_phase resource_limit_probe_failed
          exit "$rc"
        fi
      timeout-minutes: 2
    - name: Fetch locked Rust dependencies
      shell: bash
      run: |-
        set -euo pipefail
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$RUNNER_TEMP/g03-rootless-export-receipt.txt" > "$RUNNER_TEMP/g03-rootless-export-receipt.txt.pending"
          mv -- "$RUNNER_TEMP/g03-rootless-export-receipt.txt.pending" "$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        }
        set_field last_phase dependency_fetch
        if timeout --signal=TERM --kill-after=10s 15m cargo fetch --locked > "$G03_PRIVATE/cargo-fetch.log" 2>&1; then
          set_field dependency_fetch PASS
        else
          rc=$?
          set_field dependency_fetch FAIL
          set_field dependency_fetch_exit "$rc"
          set_field last_phase dependency_fetch_failed
          exit "$rc"
        fi
      timeout-minutes: 15
    - name: Run the single rootless export journey
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        selector=real_cli_copies_a_project_and_exports_after_one_audited_worker
        log="$G03_PRIVATE/targeted-test.log"
        set_field last_phase targeted_libtest
        if timeout --signal=TERM --kill-after=15s 30m cargo test --locked --offline --test runtime_user_journey \
            -- --ignored --exact --test-threads=1 "$selector" > "$log" 2>&1; then rc=0; else rc=$?; fi
        selected=0
        passed=0
        failed=0
        ignored=0
        if [[ "$(grep -Fxc "test $selector ... ok" "$log" || true)" == 1 ]]; then selected=1; passed=1; fi
        if [[ "$(grep -Fxc "test $selector ... FAILED" "$log" || true)" == 1 ]]; then selected=1; failed=1; fi
        result=$(grep -E '^test result:' "$log" | tail -n 1 || true)
        if [[ "$result" =~ ^test\ result:\ ok\.\ ([0-9]+)\ passed\;\ ([0-9]+)\ failed\;\ ([0-9]+)\ ignored\; ]]; then
          passed=${BASH_REMATCH[1]}
          failed=${BASH_REMATCH[2]}
          ignored=${BASH_REMATCH[3]}
        fi
        set_field test_selected "$selected"
        set_field test_passed "$passed"
        set_field test_failed "$failed"
        set_field test_ignored "$ignored"
        set_field test_exit "$rc"
        if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 &&
              "$result" =~ ^test\ result:\ ok\.\ 1\ passed\;\ 0\ failed\;\ 0\ ignored\;(\ [0-9]+\ measured\;\ [0-9]+\ filtered\ out\;)?\ finished\ in\ [0-9]+(\.[0-9]+)?s$ ]]; then
          set_field libtest PASS
          set_field last_phase targeted_test_passed
        else
          set_field libtest FAIL
          set_field last_phase targeted_test_failed_or_unconfirmed
          exit 1
        fi
      timeout-minutes: 35
    - name: Stop only this transient unit and remove private state
      if: always()
      shell: bash
      run: |-
        set -uo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
        [[ -f "$receipt" ]] || exit 0
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        expected_private="$RUNNER_TEMP/g03-rootless-systemd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        expected_runtime="/run/user/$(id -u)/ai-guard-g03-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        unit_expected="aig-g03-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
        unit_state=$(awk -F= '$1=="systemd_unit_start" {print $2}' "$receipt")
        unit_cleanup=NOT_STARTED
        private_cleanup=NOT_STARTED
        apparmor_cleanup=NOT_STARTED
        userctl() {
          timeout --signal=TERM --kill-after=1s 3s env \
            XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus" \
            systemctl --user "$@"
        }
        if [[ "$unit_state" == REQUESTED || "$unit_state" == PASS || "$unit_state" == UNKNOWN ]]; then
          if [[ "${G03_UNIT:-}" != "$unit_expected" ]]; then
            unit_cleanup=UNKNOWN
          else
            if load=$(userctl show "$unit_expected" --property=LoadState --value 2>/dev/null); then query_ok=1; else query_ok=0; fi
            if [[ "$load" == not-found ]]; then
              unit_cleanup=CONFIRMED
            elif [[ "$query_ok" != 1 || -z "$load" ]]; then
              unit_cleanup=UNKNOWN
            else
              if userctl stop "$unit_expected" >/dev/null 2>&1; then stop_result=PASS; else stop_result=UNKNOWN; fi
              unit_cleanup=UNKNOWN
              for _ in $(seq 1 12); do
                load=$(userctl show "$unit_expected" --property=LoadState --value 2>/dev/null || true)
                active=$(userctl show "$unit_expected" --property=ActiveState --value 2>/dev/null || true)
                main_pid=$(userctl show "$unit_expected" --property=MainPID --value 2>/dev/null || true)
                if [[ "$load" == not-found ]]; then unit_cleanup=CONFIRMED; break; fi
                if [[ "$stop_result" == PASS && ( "$active" == inactive || "$active" == failed ) && "$main_pid" == 0 ]]; then
                  cgroup_path="${G03_UNIT_CONTROL_GROUP:-}"
                  busy=0
                  if [[ -n "$cgroup_path" && -d "$cgroup_path" ]]; then
                    while IFS= read -r procs_file; do
                      if grep -Eq '^[0-9]+$' "$procs_file" 2>/dev/null; then busy=1; fi
                    done < <(find "$cgroup_path" -type f -name cgroup.procs -print 2>/dev/null)
                  fi
                  if [[ "$busy" == 0 ]]; then unit_cleanup=CONFIRMED; break; fi
                fi
                sleep 1
              done
            fi
          fi
        elif [[ "$unit_state" == NOT_STARTED ]]; then
          unit_cleanup=NOT_STARTED
        else
          unit_cleanup=UNKNOWN
        fi
        set_field systemd_unit_cleanup "$unit_cleanup"
        if [[ "$unit_cleanup" == CONFIRMED || "$unit_cleanup" == NOT_STARTED ]]; then
          private_cleanup=CONFIRMED
          if [[ -d "$expected_runtime" ]]; then
            rm -rf -- "$expected_runtime"
            [[ ! -e "$expected_runtime" ]] || private_cleanup=UNKNOWN
          fi
          if [[ -d "$expected_private" ]]; then
            rm -rf -- "$expected_private"
            [[ ! -e "$expected_private" ]] || private_cleanup=UNKNOWN
          fi
          if grep -Fxq apparmor_file_created=PASS "$receipt"; then
            profile_file=/etc/apparmor.d/qa-g03-rootlesskit
            if [[ -f "$profile_file" ]]; then
              if sudo apparmor_parser -R "$profile_file" >/dev/null 2>&1; then
                if sudo rm -f -- "$profile_file"; then apparmor_cleanup=CONFIRMED; else apparmor_cleanup=UNKNOWN; fi
              else
                apparmor_cleanup=UNKNOWN
              fi
            else
              apparmor_cleanup=UNKNOWN
            fi
          else
            apparmor_cleanup=NOT_STARTED
          fi
        else
          private_cleanup=UNKNOWN
          apparmor_cleanup=UNKNOWN
        fi
        set_field private_cleanup "$private_cleanup"
        set_field apparmor_cleanup "$apparmor_cleanup"
        if [[ "$unit_cleanup" == UNKNOWN || "$private_cleanup" == UNKNOWN || "$apparmor_cleanup" == UNKNOWN ]]; then
          set_field last_phase cleanup_unconfirmed
        else
          set_field last_phase cleanup_complete
        fi
      timeout-minutes: 10
    - name: Upload the closed receipt only
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: g03-rootless-systemd-export-${{ github.run_id }}
        path: ${{ runner.temp }}/g03-rootless-export-receipt.txt
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - claude/v1-g03-linux-rootless-systemd-export-check-20261122
