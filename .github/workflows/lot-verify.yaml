name: G06 safety composition checks

on:
  push:
    branches: ['claude/v1-g06-safety-composition-check-20261122']

permissions:
  contents: read

concurrency:
  group: g06-safety-composition-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: SQLite preflight and qualification
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/g06-sqlite.XXXXXX")"
          receipt="$RUNNER_TEMP/g06-sqlite-summary.txt"
          printf 'candidate=7d468e5921285f645eaf4e55187f8950cdacd755\nprofile=sqlite-only\n' > "$receipt"
          failed=0
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" \
              || "$(git rev-parse HEAD^)" != 7d468e5921285f645eaf4e55187f8950cdacd755 ]] \
              || ! git diff --quiet 7d468e5921285f645eaf4e55187f8950cdacd755 HEAD -- . ':(exclude).github/workflows/lot-verify.yaml'; then
            printf 'source_check=FAIL\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'source_check=PASS\n' >> "$receipt"
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          printf 'preflight_free_kb=%s\n' "$free_kb" >> "$receipt"
          if [[ ! "$free_kb" =~ ^[0-9]+$ ]] || (( free_kb < 5242880 )); then
            printf 'disk_gate=FAIL threshold_kb=5242880\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'disk_gate=PASS\n' >> "$receipt"
          rustc --version | sed -nE 's/^rustc ([0-9]+\.[0-9]+\.[0-9]+).*/toolchain=\1/p' >> "$receipt"
          if ! cargo fmt --all -- --check > "$scratch/fmt.log" 2>&1; then
            printf 'format=FAIL\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'format=PASS\n' >> "$receipt"
          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            printf 'locked_fetch=FAIL\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'locked_fetch=PASS\n' >> "$receipt"
          emit_diagnostics() {
            local profile="$1" json="$2" out="$3"
            jq -r --arg profile "$profile" '
              select(.reason == "compiler-message" and .message.level == "error")
              | .target.name as $target | .message.code.code as $code
              | .message.spans[]? | select(.is_primary == true)
              | select(($target | type) == "string" and ($target | test("^[A-Za-z0-9_-]+$")))
              | select(($code | type) == "string" and ($code | test("^E[0-9]{4}$")))
              | select((.file_name | type) == "string" and (.file_name | test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.rs$")))
              | select((.line_start | type) == "number" and (.line_start | floor) == .line_start and .line_start > 0)
              | select((.column_start | type) == "number" and (.column_start | floor) == .column_start and .column_start > 0)
              | "error profile=\($profile) target=\($target) code=\($code) location=\(.file_name):\(.line_start):\(.column_start)"
            ' "$json" > "$out"
          }
          cargo_stage() {
            local profile="$1"; shift
            local json="$scratch/$profile-check.jsonl" diagnostics="$scratch/$profile-check.diagnostics" rc=0
            "$@" --message-format=json > "$json" 2> "$scratch/$profile-check.stderr" || rc=$?
            printf '%s_check=%s cargo_exit=%s\n' "$profile" "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$receipt"
            if ! emit_diagnostics "$profile" "$json" "$diagnostics"; then
              printf '%s_diagnostics=unavailable\n' "$profile" >> "$receipt"
              failed=1
            elif [[ -s "$diagnostics" ]]; then
              sort -u "$diagnostics" >> "$receipt"
              printf '%s_sanitized_error_spans=%s\n' "$profile" "$(wc -l < "$diagnostics" | tr -d ' ')" >> "$receipt"
            else
              printf '%s_sanitized_error_spans=0\n' "$profile" >> "$receipt"
            fi
            if (( rc != 0 )); then failed=1; fi
          }
          cargo_stage sqlite cargo check --locked --offline --no-default-features --all-targets --keep-going
          build_json="$scratch/sqlite-tests.jsonl"
          build_rc=0
          cargo test --locked --offline --no-default-features --lib --test audit_retention --no-run \
            --message-format=json > "$build_json" 2> "$scratch/sqlite-tests.stderr" || build_rc=$?
          printf 'sqlite_test_build=%s cargo_exit=%s\n' "$([[ "$build_rc" == 0 ]] && echo PASS || echo FAIL)" "$build_rc" >> "$receipt"
          if ! emit_diagnostics sqlite_test_build "$build_json" "$scratch/sqlite-tests.diagnostics"; then
            printf 'sqlite_test_build_diagnostics=unavailable\n' >> "$receipt"
            failed=1
          elif [[ -s "$scratch/sqlite-tests.diagnostics" ]]; then
            sort -u "$scratch/sqlite-tests.diagnostics" >> "$receipt"
          fi
          (( build_rc == 0 )) || failed=1
          libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          retention_test="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "audit_retention" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          if (( build_rc == 0 )) && [[ -n "$libtest" && -x "$libtest" && -n "$retention_test" && -x "$retention_test" ]]; then
            printf 'libtest_artifact=unique sha256=%s\naudit_retention_artifact=unique sha256=%s\n' \
              "$(sha256sum "$libtest" | cut -d ' ' -f1)" "$(sha256sum "$retention_test" | cut -d ' ' -f1)" >> "$receipt"
            run_exact() {
              local label="$1" exe="$2" selector="$3" log="$scratch/$1.log" rc=0
              timeout --kill-after=5s 240s "$exe" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1 || rc=$?
              if (( rc == 0 )) && [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] \
                  && grep -Fqx "test $selector ... ok" "$log" \
                  && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;$' "$log"; then
                printf 'selector=%s result=PASS selected=1 ignored=0 exit=0\n' "$label" >> "$receipt"
              else
                printf 'selector=%s result=FAIL selected=not_one_or_failed ignored=not_zero exit=%s\n' "$label" "$rc" >> "$receipt"
                failed=1
              fi
            }
            run_exact egress_retention "$libtest" 'audit::egress_decisions::tests::egress_store_retention_preserves_decision_and_channel_receipts'
            run_exact egress_sibling_redaction "$libtest" 'audit::egress_decisions::tests::sqlite_sibling_keeps_egress_policy_when_gateway_expands_redaction'
            run_exact sibling_main_identity "$libtest" 'audit::storage::tests::sibling_preparation_requires_the_retained_main_identity'
            run_exact owned_scope_conflicts "$libtest" 'api::human_sources::owned_policy_tests::expected_scope_conflicts_before_fresh_and_replayed_policy_with_no_neighbor_sql'
            run_exact owned_revocation "$libtest" 'api::human_sources::owned_policy_tests::binding_revoked_after_real_policy_commit_cannot_publish_a_receipt'
            run_exact archived_horizon "$retention_test" 'batch_at_the_archived_horizon_rolls_back_and_keeps_the_typed_conflict'
          else
            printf 'selectors=NOT_RUN reason=test_artifact_not_unique_or_build_failed\n' >> "$receipt"
            failed=1
          fi
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Upload sanitized SQLite receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g06-safety-sqlite-${{ github.sha }}
          path: ${{ runner.temp }}/g06-sqlite-summary.txt
          if-no-files-found: ignore
          retention-days: 14

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: MySQL preflight and pure configuration selector
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/g06-mysql.XXXXXX")"
          receipt="$RUNNER_TEMP/g06-mysql-summary.txt"
          printf 'candidate=7d468e5921285f645eaf4e55187f8950cdacd755\nprofile=mysql-storage\n' > "$receipt"
          failed=0
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" \
              || "$(git rev-parse HEAD^)" != 7d468e5921285f645eaf4e55187f8950cdacd755 ]] \
              || ! git diff --quiet 7d468e5921285f645eaf4e55187f8950cdacd755 HEAD -- . ':(exclude).github/workflows/lot-verify.yaml'; then
            printf 'source_check=FAIL\ncheck=NOT_RUN\nselector=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'source_check=PASS\n' >> "$receipt"
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          printf 'preflight_free_kb=%s\n' "$free_kb" >> "$receipt"
          if [[ ! "$free_kb" =~ ^[0-9]+$ ]] || (( free_kb < 5242880 )); then
            printf 'disk_gate=FAIL threshold_kb=5242880\ncheck=NOT_RUN\nselector=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'disk_gate=PASS\n' >> "$receipt"
          rustc --version | sed -nE 's/^rustc ([0-9]+\.[0-9]+\.[0-9]+).*/toolchain=\1/p' >> "$receipt"
          if ! cargo fmt --all -- --check > "$scratch/fmt.log" 2>&1; then
            printf 'format=FAIL\ncheck=NOT_RUN\nselector=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'format=PASS\n' >> "$receipt"
          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            printf 'locked_fetch=FAIL\ncheck=NOT_RUN\nselector=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'locked_fetch=PASS\n' >> "$receipt"
          emit_diagnostics() {
            local profile="$1" json="$2" out="$3"
            jq -r --arg profile "$profile" '
              select(.reason == "compiler-message" and .message.level == "error")
              | .target.name as $target | .message.code.code as $code
              | .message.spans[]? | select(.is_primary == true)
              | select(($target | type) == "string" and ($target | test("^[A-Za-z0-9_-]+$")))
              | select(($code | type) == "string" and ($code | test("^E[0-9]{4}$")))
              | select((.file_name | type) == "string" and (.file_name | test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.rs$")))
              | select((.line_start | type) == "number" and (.line_start | floor) == .line_start and .line_start > 0)
              | select((.column_start | type) == "number" and (.column_start | floor) == .column_start and .column_start > 0)
              | "error profile=\($profile) target=\($target) code=\($code) location=\(.file_name):\(.line_start):\(.column_start)"
            ' "$json" > "$out"
          }
          cargo_stage() {
            local profile="$1"; shift
            local json="$scratch/$profile-check.jsonl" diagnostics="$scratch/$profile-check.diagnostics" rc=0
            "$@" --message-format=json > "$json" 2> "$scratch/$profile-check.stderr" || rc=$?
            printf '%s_check=%s cargo_exit=%s\n' "$profile" "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$receipt"
            if ! emit_diagnostics "$profile" "$json" "$diagnostics"; then
              printf '%s_diagnostics=unavailable\n' "$profile" >> "$receipt"
              failed=1
            elif [[ -s "$diagnostics" ]]; then
              sort -u "$diagnostics" >> "$receipt"
              printf '%s_sanitized_error_spans=%s\n' "$profile" "$(wc -l < "$diagnostics" | tr -d ' ')" >> "$receipt"
            else
              printf '%s_sanitized_error_spans=0\n' "$profile" >> "$receipt"
            fi
            if (( rc != 0 )); then failed=1; fi
          }
          cargo_stage mysql cargo check --locked --offline --no-default-features --features mysql-storage --all-targets --keep-going
          build_json="$scratch/mysql-bin-test.jsonl"
          build_rc=0
          cargo test --locked --offline --no-default-features --features mysql-storage --bin agentsandbox \
            --no-run --message-format=json > "$build_json" 2> "$scratch/mysql-bin-test.stderr" || build_rc=$?
          printf 'mysql_bin_test_build=%s cargo_exit=%s\n' "$([[ "$build_rc" == 0 ]] && echo PASS || echo FAIL)" "$build_rc" >> "$receipt"
          if ! emit_diagnostics mysql_bin_test_build "$build_json" "$scratch/mysql-bin-test.diagnostics"; then
            printf 'mysql_bin_test_diagnostics=unavailable\n' >> "$receipt"
            failed=1
          elif [[ -s "$scratch/mysql-bin-test.diagnostics" ]]; then
            sort -u "$scratch/mysql-bin-test.diagnostics" >> "$receipt"
          fi
          (( build_rc == 0 )) || failed=1
          bin="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["bin"] and .profile.test == true and (.features | index("mysql-storage") != null) and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          if (( build_rc == 0 )) && [[ -n "$bin" && -x "$bin" ]]; then
            printf 'mysql_bin_test_artifact=unique sha256=%s\n' "$(sha256sum "$bin" | cut -d ' ' -f1)" >> "$receipt"
            status=0
            timeout --kill-after=5s 240s cargo test --locked --offline --no-default-features \
              --features mysql-storage --bin agentsandbox --message-format=json \
              gateway_config::tests::mysql_preflight_refuses_sqlite_only_kubernetes_policies -- \
              --exact --test-threads=1 --color=never > "$scratch/mysql-selector.log" 2>&1 || status=$?
            log="$scratch/mysql-selector.log"
            if (( status == 0 )) && [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] \
                && grep -Fqx 'test gateway_config::tests::mysql_preflight_refuses_sqlite_only_kubernetes_policies ... ok' "$log" \
                && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;$' "$log"; then
              printf 'selector=mysql_preflight_refuses_sqlite_only_kubernetes_policies result=PASS selected=1 ignored=0 exit=0\n' >> "$receipt"
            else
              printf 'selector=mysql_preflight_refuses_sqlite_only_kubernetes_policies result=FAIL selected=not_one_or_failed ignored=not_zero exit=%s\n' "$status" >> "$receipt"
              failed=1
            fi
          else
            printf 'selector=NOT_RUN reason=mysql_bin_test_artifact_not_unique_or_build_failed\n' >> "$receipt"
            failed=1
          fi
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Upload sanitized MySQL receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g06-safety-mysql-${{ github.sha }}
          path: ${{ runner.temp }}/g06-mysql-summary.txt
          if-no-files-found: ignore
          retention-days: 14
