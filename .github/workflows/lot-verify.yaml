name: G11 relay fixture verification

# This child workflow validates exactly one fixture on one fresh candidate.
# Provider credentials and container engines are not used.
on:
  push:
    branches:
      - claude/v1-g11-relay-fresh-fixture-check-20261122

permissions:
  contents: read

concurrency:
  group: g11-relay-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize sanitized artifact
        shell: bash
        run: |
          printf 'Revision: %s\n' "$GITHUB_SHA" > cargo-test-summary.txt
          printf 'Fixture: software_broker_scoped_relay_ipc_refuses_before_private_detail\n' >> cargo-test-summary.txt
          printf 'Scope: synthetic loopback CLI fixture; no provider or real engine.\n' >> cargo-test-summary.txt

      - name: Guard the source commit and workflow-only diff
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=0f99ed24a17d3a891af29ca45dd01c28e0540843
          actual_parent="$(git rev-parse "$GITHUB_SHA^")"
          [[ "$actual_parent" == "$expected_parent" ]] || {
            printf 'Source guard failed: unexpected parent commit.\n' >> cargo-test-summary.txt
            echo 'Source guard failed: unexpected parent commit.' >&2
            exit 1
          }
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          [[ "$changed" == '.github/workflows/lot-verify.yaml' ]] || {
            printf 'Source guard failed: expected only the relay workflow change.\n' >> cargo-test-summary.txt
            echo 'Source guard failed: expected only the relay workflow change.' >&2
            exit 1
          }
          echo "Verified parent $actual_parent and workflow-only change."

      - name: Fetch and run the single exact relay fixture
        id: fixture
        shell: bash
        run: |
          set -uo pipefail
          summary=cargo-test-summary.txt

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if ! cargo fetch --locked > /dev/null 2> "$tmp/fetch.stderr"; then
            printf 'Bootstrap: cargo fetch failed; fixture was not compiled or run.\n' >> "$summary"
            echo 'Cargo dependency fetch failed; details are omitted from the artifact.' >> "$summary"
            exit 1
          fi
          printf 'Bootstrap: cargo fetch succeeded.\n' >> "$summary"

          build_json="$tmp/build.jsonl"
          if cargo test --locked --offline --no-default-features --test broker_relay_handoff --no-run --message-format=json > "$build_json" 2> "$tmp/build.stderr"; then
            printf 'Bootstrap: targeted test binary compiled.\n' >> "$summary"
          else
            printf 'Bootstrap: targeted test binary compilation failed; fixture was not run.\n' >> "$summary"
            jq -r '
              select(.reason == "compiler-message" and .message.level == "error")
              | .message as $m
              | "rustc " + ($m.code.code // "<no-code>")
                + ([$m.spans[]? | select(.is_primary == true)
                    | select(.file_name | startswith("src/") or startswith("tests/"))
                    | "\(.file_name):\(.line_start):\(.column_start)-\(.line_end):\(.column_end)"]
                   | if length > 0 then " " + (join(", ")) else "" end)
            ' "$build_json" 2>/dev/null | sort -u >> "$summary" || true
            printf 'Compiler diagnostics were limited to rustc codes and primary spans in src/ or tests/.\n' >> "$summary"
            exit 1
          fi

          if ! test_bin="$(jq -ers '[.[] | select(.reason == "compiler-artifact"
                and .target.name == "broker_relay_handoff" and .target.kind == ["test"]
                and .profile.test == true and .executable != null) | .executable]
                | unique | if length == 1 then .[0] else empty end' "$build_json")" \
              || [[ ! -x "$test_bin" ]]; then
            printf 'Bootstrap: expected exactly one targeted test binary; fixture was not run.\n' >> "$summary"
            exit 1
          fi

          selector=software_broker_scoped_relay_ipc_refuses_before_private_detail
          test_log="$tmp/fixture.log"
          set +e
          "$test_bin" "$selector" --exact --test-threads=1 > "$test_log" 2>&1
          test_status=$?
          set -e
          if grep -Fxq 'running 1 test' "$test_log"; then
            printf 'Fixture execution: test body entered (a failing assertion is a fixture result, not bootstrap).\n' >> "$summary"
          else
            printf 'Bootstrap: libtest did not confirm entry into exactly one fixture; no fixture result claimed.\n' >> "$summary"
          fi
          if [[ "$test_status" -eq 0 ]] \
              && grep -Fxq "test $selector ... ok" "$test_log" \
              && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$test_log"; then
            printf 'Result: PASS; 1 passed; 0 failed; 0 ignored; exact selector only.\n' >> "$summary"
          else
            printf 'Result: FAIL; exit code %s; no raw fixture output retained.\n' "$test_status" >> "$summary"
            if grep -Eo 'at (src|tests)/[A-Za-z0-9_./-]+\.rs:[0-9]+:[0-9]+' "$test_log" | sed 's/^at //' | sort -u >> "$summary"; then
              :
            fi
            exit 1
          fi

      - name: Add sanitized result to run summary
        if: always()
        shell: bash
        run: |
          if [[ -f cargo-test-summary.txt ]]; then
            {
              echo '### G11 relay fixture'
              echo
              echo '```text'
              cat cargo-test-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized result, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g11-relay-fixture-${{ github.sha }}
          path: cargo-test-summary.txt
          if-no-files-found: warn
          retention-days: 14
