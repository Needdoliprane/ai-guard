name: G11 relay terminal diagnostic check

on:
  push:
    branches: ['claude/v1-g11-relay-terminal-check-20261122']

permissions:
  contents: read

concurrency:
  group: g11-relay-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-terminal-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize sanitized receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          printf 'workflow_sha=%s\nworkflow_parent_initial=NOT_VERIFIED\ncandidate=c0f323d4d41631ecb0448fd2ee00ac6a6f474477\ncandidate_parent=5e9f8994d4360ab7bd3a64be120cd04539397af4\nsource_delta=tests/broker_relay_handoff.rs,tests/support/broker_relay_handoff.rs\nsource_initial=NOT_RUN\nworkflow_lineage_initial=NOT_RUN\nfetch_initial=NOT_RUN\nbuild_initial=NOT_RUN\nlibtest_initial=NOT_RUN\ncanary_initial=NOT_RUN\nphase_initial=unknown\nterminal_marker_initial=unknown\n' "$WORKFLOW_SHA" > "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c0f323d4d41631ecb0448fd2ee00ac6a6f474477
          fetch-depth: 0
          persist-credentials: false
      - name: Guard the exact candidate and workflow-only delta
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          receipt="$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
          source_status=FAIL
          lineage_status=FAIL
          source_delta="$(git diff --name-only 5e9f8994d4360ab7bd3a64be120cd04539397af4 c0f323d4d41631ecb0448fd2ee00ac6a6f474477)"
          expected_delta=$'tests/broker_relay_handoff.rs\ntests/support/broker_relay_handoff.rs'
          if [[ "$(git rev-parse HEAD)" == c0f323d4d41631ecb0448fd2ee00ac6a6f474477 &&
                "$(git rev-parse HEAD^)" == 5e9f8994d4360ab7bd3a64be120cd04539397af4 &&
                "$source_delta" == "$expected_delta" ]] &&
              grep -Fq 'async fn software_broker_scoped_relay_ipc_refuses_before_private_detail()' tests/broker_relay_handoff.rs &&
              grep -Fq 'Self::TerminalA => "terminal_a"' tests/broker_relay_handoff.rs &&
              grep -Fq 'Self::TerminalB => "terminal_b"' tests/broker_relay_handoff.rs &&
              grep -Fq 'g11_relay_cancel_code phase={label} code={code:?}' tests/broker_relay_handoff.rs &&
              grep -Fq 'g11_relay_fixture_cleanup status={status}' tests/broker_relay_handoff.rs; then
            source_status=PASS
          fi
          workflow_delta="$(git diff --name-only c0f323d4d41631ecb0448fd2ee00ac6a6f474477 "$WORKFLOW_SHA")"
          if [[ "$(git rev-parse "$WORKFLOW_SHA^")" == 1199591dbf0f67f9600e420f1e7088fdf0836b1b &&
                "$(git rev-parse "$WORKFLOW_SHA^^")" == c0f323d4d41631ecb0448fd2ee00ac6a6f474477 &&
                "$(git diff --name-only "$WORKFLOW_SHA^" "$WORKFLOW_SHA")" == '.github/workflows/lot-verify.yaml' &&
                "$workflow_delta" == '.github/workflows/lot-verify.yaml' ]]; then
            lineage_status=PASS
          fi
          printf 'source=%s\nworkflow_lineage=%s\nworkflow_parent=1199591dbf0f67f9600e420f1e7088fdf0836b1b\nworkflow_base=c0f323d4d41631ecb0448fd2ee00ac6a6f474477\nsource_delta=%s\n' \
            "$source_status" "$lineage_status" "$(printf '%s' "$source_delta" | tr '\n' ',')" >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          [[ "$source_status" == PASS && "$lineage_status" == PASS ]]
      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -uo pipefail
          if cargo fetch --locked > "$RUNNER_TEMP/g11-relay-fetch-private.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'fetch=%s fetch_exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
          exit "$rc"
      - name: Compile one targeted relay libtest executable
        id: build
        shell: bash
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/g11-relay-private"
          mkdir -m 700 "$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          if cargo test --locked --offline --no-default-features --test broker_relay_handoff \
              --no-run --message-format=json > "$scratch/build.jsonl" 2> "$scratch/build.stderr"; then
            rc=0
          else
            rc=$?
          fi
          printf 'build=%s build_exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" != 0 ]]; then
            diagnostics_status=unavailable
            diagnostics_count=0
            if jq -r '
                select(.reason == "compiler-message" and .message.level == "error")
                | .message as $message
                | ($message.code.code // "") as $code
                | select(($code | type) == "string" and ($code | test("^E[0-9]{4}$")))
                | $message.spans[]? | select(.is_primary == true) | . as $span
                | select(($span.file_name | type) == "string" and
                    ($span.file_name | test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.rs$")))
                | select(($span.line_start | type) == "number" and $span.line_start >= 1 and
                    $span.line_start <= 1000000 and ($span.line_start | floor) == $span.line_start)
                | select(($span.column_start | type) == "number" and $span.column_start >= 1 and
                    $span.column_start <= 1000000 and ($span.column_start | floor) == $span.column_start)
                | "code=\($code) span=\($span.file_name):\($span.line_start):\($span.column_start)"
              ' "$scratch/build.jsonl" > "$scratch/diagnostics.txt" 2>/dev/null; then
              /usr/bin/sort -u "$scratch/diagnostics.txt" -o "$scratch/diagnostics.txt"
              diagnostics_count="$(/usr/bin/wc -l < "$scratch/diagnostics.txt" | /usr/bin/tr -d ' ')"
              diagnostics_status=filtered
            fi
            printf 'compiler_diagnostics=%s count=%s\n' "$diagnostics_status" "$diagnostics_count" >> "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
            if [[ "$diagnostics_status" == filtered && "$diagnostics_count" -gt 0 ]]; then
              while IFS= read -r diagnostic; do
                printf 'compiler_%s\n' "$diagnostic" >> "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
              done < <(/usr/bin/sed -n '1,8p' "$scratch/diagnostics.txt")
            fi
          else
            printf 'compiler_diagnostics=not_applicable count=0\n' >> "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
          fi
          if [[ "$rc" == 0 ]]; then
            if binary="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "broker_relay_handoff" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/build.jsonl" 2>/dev/null)" && [[ -x "$binary" ]]; then
              digest="$(sha256sum "$binary" | cut -d ' ' -f1)"
              printf 'libtest=PASS\nlibtest_sha256=%s\n' "$digest" >> "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
              echo "binary=$binary" >> "$GITHUB_OUTPUT"
            else
              printf 'libtest=FAIL artifact_resolution=FAIL\n' >> "$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
              exit 1
            fi
          fi
          exit "$rc"
      - name: Run exact relay terminal canary and filter diagnostics
        id: canary
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          TEST_BINARY: ${{ steps.build.outputs.binary }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$RUNNER_TEMP/g11-relay-private"
          receipt="$RUNNER_TEMP/g11-relay-terminal-receipt.txt"
          selector=software_broker_scoped_relay_ipc_refuses_before_private_detail
          log="$scratch/canary.log"
          if timeout --kill-after=5s 180s "$TEST_BINARY" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1; then test_exit=0; else test_exit=$?; fi
          selection_banners="$(grep -Ec '^running [0-9]+ tests?$' "$log" || true)"
          selected="$(awk '/^running [0-9]+ tests?$/ { count += $2 } END { print count + 0 }' "$log")"
          case_results="$(grep -Ec '^test .+ \.\.\. (ok|FAILED|ignored)(,.*)?$' "$log" || true)"
          exact_pass="$(grep -Fxc "test $selector ... ok" "$log" || true)"
          exact_failure="$(grep -Fxc "test $selector ... FAILED" "$log" || true)"
          ignored="$(grep -Ec '^test .* \.\.\. ignored(,.*)?$' "$log" || true)"
          result_summaries="$(grep -c '^test result: ' "$log" || true)"
          marker_lines="$(grep -F 'g11_relay_fixture_failure phase=' "$log" || true)"
          phase_marker_count="$(printf '%s\n' "$marker_lines" | awk 'NF { count++ } END { print count + 0}')"
          allowed_phase_lines="$(printf '%s\n' "$marker_lines" | grep -E '^Error: g11_relay_fixture_failure phase=(fixture_open|submit_a|awaiting_a|submit_b|running_b|scoped_reads|cancel_a|cancel_b|terminal_a|terminal_b|guardian_shutdown|fixture_close)$' || true)"
          allowed_phase_count="$(printf '%s\n' "$allowed_phase_lines" | awk 'NF { count++ } END { print count + 0}')"
          phase=unknown
          if [[ "$phase_marker_count" == 1 && "$allowed_phase_count" == 1 ]]; then
            phase="${allowed_phase_lines#Error: g11_relay_fixture_failure phase=}"
          fi
          pass_summary=false
          if [[ "$test_exit" == 0 && "$selection_banners" == 1 && "$selected" == 1 &&
                "$case_results" == 1 && "$exact_pass" == 1 && "$exact_failure" == 0 &&
                "$ignored" == 0 && "$result_summaries" == 1 ]] &&
              grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log"; then
            pass_summary=true
          fi
          unique_failure=false
          if [[ "$test_exit" != 0 && "$selection_banners" == 1 && "$selected" == 1 &&
                "$case_results" == 1 && "$exact_failure" == 1 && "$exact_pass" == 0 &&
                "$ignored" == 0 && "$result_summaries" == 1 ]] &&
              grep -Eq '^test result: FAILED\. 0 passed; 1 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log"; then
            unique_failure=true
          fi
          cancel_code_status=not_applicable
          cancel_code=unknown
          cancel_lines="$(grep -F 'g11_relay_cancel_code ' "$log" || true)"
          cancel_count="$(printf '%s\n' "$cancel_lines" | awk 'NF { count++ } END { print count + 0}')"
          if [[ "$unique_failure" == true && ( "$phase" == cancel_a || "$phase" == cancel_b ) && "$cancel_count" == 1 ]] &&
             [[ "$cancel_lines" =~ ^g11_relay_cancel_code\ phase=(cancel_a|cancel_b)\ code=(Unauthorized|Forbidden|Unavailable|IncompatibleControl|Busy|InvalidInput|Conflict|Interrupted|LimitExceeded|NeedsReconciliation)$ ]]; then
            cancel_code_status=filtered
            cancel_code="${BASH_REMATCH[2]}"
            if [[ "${BASH_REMATCH[1]}" != "$phase" ]]; then cancel_code_status=unknown; cancel_code=unknown; fi
          elif [[ "$unique_failure" == true && ( "$phase" == cancel_a || "$phase" == cancel_b ) ]]; then
            cancel_code_status=unknown
          fi
          cleanup_status=not_applicable
          cleanup_marker_status=unknown
          cleanup_lines="$(grep -F 'g11_relay_fixture_cleanup status=' "$log" || true)"
          cleanup_count="$(printf '%s\n' "$cleanup_lines" | awk 'NF { count++ } END { print count + 0}')"
          if [[ "$unique_failure" == true && ( "$phase" == terminal_a || "$phase" == terminal_b ) ]]; then
            cleanup_status=unknown
            if [[ "$cleanup_count" == 1 && "$cleanup_lines" =~ ^g11_relay_fixture_cleanup\ status=(confirmed|guardian_shutdown_unconfirmed|fixture_close_unconfirmed)$ ]]; then
              cleanup_status=filtered
              cleanup_marker_status="${BASH_REMATCH[1]}"
            fi
          fi
          canary_status=FAIL
          if [[ "$pass_summary" == true ]]; then canary_status=PASS; fi
          if [[ "$unique_failure" == true ]]; then canary_status=FAIL_UNIQUE; fi
          {
            printf 'canary=%s\ncanary_exit=%s\n' "$canary_status" "$test_exit"
            printf 'selection_banners=%s\nselected=%s\ncase_results=%s\n' "$selection_banners" "$selected" "$case_results"
            printf 'exact_pass=%s\nexact_failure=%s\nignored=%s\nresult_summaries=%s\n' "$exact_pass" "$exact_failure" "$ignored" "$result_summaries"
            printf 'phase=%s\nphase_marker_count=%s\nallowed_phase_count=%s\n' "$phase" "$phase_marker_count" "$allowed_phase_count"
            printf 'cancel_code_status=%s\ncancel_code=%s\ncancel_code_marker_count=%s\n' "$cancel_code_status" "$cancel_code" "$cancel_count"
            printf 'cleanup_status=%s\ncleanup_marker_status=%s\ncleanup_marker_count=%s\n' "$cleanup_status" "$cleanup_marker_status" "$cleanup_count"
          } >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "canary_status=$canary_status" >> "$GITHUB_OUTPUT"
          test "$canary_status" = PASS
      - name: Upload sanitized relay result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g11-relay-terminal-${{ github.sha }}
          path: ${{ runner.temp }}/g11-relay-terminal-receipt.txt
          if-no-files-found: warn
          retention-days: 14
