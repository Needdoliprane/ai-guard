name: MySQL gateway batch transport verification

on:
  push:
    branches: ['claude/v1-g07-mysql-activity-physical-check-20261122']

permissions:
  contents: read

concurrency:
  group: lot-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mysql-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QA_PRODUCT_SHA: 7d468e5921285f645eaf4e55187f8950cdacd755
      QA_SELECTOR: identity::gateway::gateway_commits_ordinary_batch_and_replays_after_restart
      QA_MYSQL_IMAGE_DIGEST: 72c368d898861f3b3a07af0e6d690400f44f048799ed46822783d9224cc2c86d
      QA_COMMON_PHASES: runner_scope checkout private_directory fetch build local_engine recipe_source job_pki
      QA_PROFILE_PHASES: fixture_material disposable_server verified_transport fresh_schemas gateway_oracle project_cleanup
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Run the exact gateway test with fresh TLS and mTLS fixtures
        id: verify
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          product_sha=$QA_PRODUCT_SHA
          selector=$QA_SELECTOR
          image="mysql:8.4@sha256:$QA_MYSQL_IMAGE_DIGEST"
          stage=runner_scope
          receipt="$RUNNER_TEMP/mysql-gateway-receipt.txt"
          read -r -a phases <<< "$QA_COMMON_PHASES"
          read -r -a profile_phases <<< "$QA_PROFILE_PHASES"
          declare -A result test_exit test_counts transport client_certificate
          project_owned=0
          libtest_hash=unknown
          gateway_hash=unknown
          qa=

          exec 3>&1
          report() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY" >&3; }
          begin() { result["$stage"]=pass; stage=$1; }
          write_receipt() {
            local phase name verification_sha=unknown
            if [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]; then verification_sha=$GITHUB_SHA; fi
            {
              printf 'schema=1\nproduct_sha=%s\nverification_sha=%s\nimage_digest=%s\nselector=%s\n' \
                "$product_sha" "$verification_sha" "$QA_MYSQL_IMAGE_DIGEST" "$selector"
              printf 'verification=%s\nfailure_stage=%s\nverification_exit=%s\n' "$1" "$2" "$3"
              printf 'test_binary_sha256=%s\ngateway_binary_sha256=%s\n' "$libtest_hash" "$gateway_hash"
              for phase in "${phases[@]}"; do
                printf 'phase=%s outcome=%s\n' "$phase" "${result[$phase]:-unknown}"
              done
              for name in password mtls; do
                for phase in "${profile_phases[@]}"; do
                  printf 'profile=mysql-%s phase=%s outcome=%s\n' "$name" "$phase" "${result[$name:$phase]:-unknown}"
                done
                printf 'profile=mysql-%s tls=%s client_certificate=%s\n' "$name" \
                  "${transport[$name]:-unknown}" "${client_certificate[$name]:-unknown}"
                printf 'profile=mysql-%s test_exit=%s test_counts_pass_fail_ignore=%s\n' "$name" \
                  "${test_exit[$name]:-unknown}" "${test_counts[$name]:-unknown}"
              done
              printf 'phase=private_directory_cleanup outcome=%s\n' "${result[private_directory_cleanup]:-unknown}"
            } > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          docker() { timeout --kill-after=5s 60s docker "$@"; }
          docker_qa() { docker --context desktop-linux "$@"; }
          compose_qa() {
            docker_qa compose --env-file /dev/null --project-name "$QA_MYSQL_PROJECT" \
              -f tests/e2e/mysql/compose.yaml --profile "$QA_MYSQL_PROFILE" "$@"
          }
          project_empty() {
            local resources named label="com.docker.compose.project=$QA_MYSQL_PROJECT"
            resources=$(docker_qa ps -aq --filter "label=$label") && [[ -z $resources ]] &&
              resources=$(docker_qa volume ls -q --filter "label=$label") && [[ -z $resources ]] &&
              resources=$(docker_qa network ls -q --filter "label=$label") && [[ -z $resources ]] &&
              resources=$(docker_qa ps -aq --filter "label=ai-guard.qa.project=$QA_MYSQL_PROJECT") &&
              [[ -z $resources ]] || return 1
            named=$(docker_qa ps -a --format '{{.Names}}' && docker_qa volume ls --format '{{.Name}}' &&
              docker_qa network ls --format '{{.Name}}') || return 1
            ! grep -qE "^$QA_MYSQL_PROJECT[-_]" <<< "$named"
          }
          cleanup_project() {
            local probe
            probe=$(docker_qa ps -a --format '{{.Names}}' \
              --filter "label=ai-guard.qa.project=$QA_MYSQL_PROJECT") || return 1
            if [[ -n $probe ]]; then
              [[ $probe == "$QA_MYSQL_PROJECT-probe" ]] && docker_qa rm -f "$probe" || return 1
            fi
            compose_qa down --timeout 10 --volumes && project_empty || return 1
            project_owned=0
          }
          finish() {
            local status=$? failure_stage=none outcome=pass
            trap - EXIT
            if (( status == 130 || status == 143 )); then
              outcome=unknown
            elif (( status )); then
              failure_stage=$stage
              result["$stage"]=fail
              outcome=fail
            fi
            if (( project_owned )); then
              if cleanup_project >> "$qa/cleanup.log" 2>&1; then
                result["$profile:project_cleanup"]=pass
              else
                result["$profile:project_cleanup"]=fail
                if [[ $failure_stage == none ]]; then failure_stage="$profile:project_cleanup"; fi
                outcome=fail
                status=1
              fi
            fi
            if [[ -n $qa ]]; then
              if [[ $qa =~ ^/tmp/aig-sql\.[A-Za-z0-9]{6}$ ]] && rm -rf -- "$qa" && [[ ! -e $qa ]]; then
                result[private_directory_cleanup]=pass
              else
                result[private_directory_cleanup]=fail
                if [[ $failure_stage == none ]]; then failure_stage=private_directory_cleanup; fi
                outcome=fail
                status=1
              fi
            fi
            if [[ $outcome == fail ]]; then
              report "FAIL stage=$failure_stage exit=$status"
            elif [[ $outcome == pass ]]; then
              report 'PASS private_directory_cleanup'
            fi
            write_receipt "$outcome" "$failure_stage" "$status"
            exit "$status"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          verify_checkout() {
            local worktree_status
            worktree_status=$(git status --porcelain=v1 --untracked-files=all 2>/dev/null) || return 1
            [[ -z $worktree_status && $GITHUB_SHA =~ ^[0-9a-f]{40}$ &&
               $(git rev-parse HEAD 2>/dev/null) == "$GITHUB_SHA" &&
               $(git show -s --format=%P HEAD 2>/dev/null) == "$product_sha" &&
               $(git diff --name-only "$product_sha" HEAD 2>/dev/null) == .github/workflows/lot-verify.yaml ]]
          }
          [[ $RUNNER_ENVIRONMENT == github-hosted && $RUNNER_OS == Linux && $RUNNER_ARCH == X64 &&
             $GITHUB_EVENT_NAME == push &&
             $GITHUB_REF == refs/heads/claude/v1-g07-mysql-activity-physical-check-20261122 &&
             -S /var/run/docker.sock ]]
          begin checkout
          verify_checkout
          report "product_sha=$product_sha verification_sha=$GITHUB_SHA"

          begin private_directory
          qa=$(mktemp -d /tmp/aig-sql.XXXXXX)
          [[ $(realpath "$qa") == "$qa" && $(stat -c '%a' "$qa") == 700 ]]
          mkdir -m 700 "$qa/tmp" "$qa/docker" "$qa/ca" "$qa/password" "$qa/mtls" "$qa/client"
          export TMPDIR="$qa/tmp" QA_MYSQL_PRIVATE_DIR="$qa" DOCKER_CONFIG="$qa/docker"
          export AI_GUARD_BUILD_REVISION="$product_sha" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          exec > "$qa/diagnostics.log" 2>&1

          [[ ! -e $CARGO_TARGET_DIR && ! -L $CARGO_TARGET_DIR ]]
          begin fetch
          cargo fetch --locked
          begin build
          if ! cargo test --locked --offline --no-default-features --features mysql-storage \
            --test mysql_audit_store --no-run --message-format=json > "$qa/cargo.jsonl"; then
            codes=$(jq -r 'select(.reason == "compiler-message") | .message.code.code // empty |
              select(test("^E[0-9]{4}$"))' "$qa/cargo.jsonl" | sort -u | paste -sd, -)
            report "FAIL compile codes=${codes:-unavailable}"
            exit 1
          fi
          libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and
            .target.name == "mysql_audit_store" and .target.kind == ["test"] and .profile.test) |
            .executable | select(. != null)] | if length == 1 then .[0] else error("test artifact count") end' \
            "$qa/cargo.jsonl")
          gateway="$CARGO_TARGET_DIR/debug/agentsandbox"
          [[ $libtest == "$CARGO_TARGET_DIR"/debug/deps/mysql_audit_store-* && -x $libtest && -x $gateway ]]
          read -r test_sha256 _ < <(sha256sum "$libtest")
          read -r gateway_sha256 _ < <(sha256sum "$gateway")
          [[ $test_sha256 =~ ^[0-9a-f]{64}$ && $gateway_sha256 =~ ^[0-9a-f]{64}$ ]]
          libtest_hash=$test_sha256
          gateway_hash=$gateway_sha256
          report "PASS compile test_sha256=$libtest_hash gateway_sha256=$gateway_hash"

          begin local_engine
          unset DOCKER_HOST DOCKER_CONTEXT DOCKER_TLS DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_DEFAULT_PLATFORM
          unset COMPOSE_FILE COMPOSE_PROJECT_NAME COMPOSE_PROFILES COMPOSE_ENV_FILES MYSQL_PWD
          docker context create desktop-linux --docker 'host=unix:///var/run/docker.sock'
          [[ $(docker_qa context inspect desktop-linux --format '{{.Endpoints.docker.Host}}') == unix:///var/run/docker.sock &&
             $(docker_qa version --format '{{.Server.Os}}/{{.Server.Arch}}') == linux/amd64 ]]
          timeout --kill-after=10s 300s docker --context desktop-linux pull --platform linux/amd64 "$image"
          image_id=$(docker_qa image inspect --format '{{.Id}}' "$image")
          [[ $image_id =~ ^sha256:[0-9a-f]{64}$ &&
             $(docker_qa image inspect --format '{{.Os}}/{{.Architecture}}' "$image") == linux/amd64 ]]

          begin recipe_source
          # Load only the named functions from the exact checked-in QA recipes.
          copy_recipe() {
            awk -v start="$1" -v end="$2" '
              $0 == start { copying = 1 }
              copying { print }
              copying && $0 == end { found = 1; exit }
              END { if (!found) exit 1 }
            ' "$3"
          }
          recipe=tests/e2e/mysql/README.md
          {
            copy_recipe 'make_ca() {' '}' "$recipe"
            copy_recipe 'issue_leaf() {' '}' "$recipe"
            copy_recipe 'mysql_case() (' ')' "$recipe"
            copy_recipe 'wait_mysql_ready() {' '}' "$recipe"
            copy_recipe 'prepare_gateway_fixture() (' ')' tests/e2e/mysql/GATEWAY_FIXTURE.md
          } > "$qa/recipe.sh"
          bash -n "$qa/recipe.sh"
          source "$qa/recipe.sh"
          uuidgen() { cat /proc/sys/kernel/random/uuid; }
          # Use the pinned 8.4 client on the already checked server's loopback.
          # Only the probe option file and its public CA or client material are mounted.
          mysql() {
            timeout --kill-after=3s 12s docker --context desktop-linux run --rm --pull never \
              --name "$QA_MYSQL_PROJECT-probe" --label "ai-guard.qa.project=$QA_MYSQL_PROJECT" \
              --network "container:$container" --read-only --cap-drop ALL \
              --user "$(id -u):$(id -g)" --entrypoint mysql \
              --mount "type=bind,src=$qa/client,dst=$qa/client,readonly" \
              --mount "type=bind,src=$qa/ca/ca.pem,dst=$qa/ca/ca.pem,readonly" "$image" "$@"
          }

          begin job_pki
          printf '[req]\ndistinguished_name=dn\n[dn]\n' > "$qa/req.cnf"
          make_ca ca 'ai-guard ephemeral MySQL QA'
          chmod 0444 "$qa/ca/ca.pem"
          export QA_MYSQL_PORT=13306 QA_MYSQL_HOST=localhost QA_MYSQL_CLIENT_PORT=3306

          for profile in password mtls; do
            begin "$profile:fixture_material"
            export QA_MYSQL_PROFILE="mysql-$profile"
            project_random=$(openssl rand -hex 12)
            export QA_MYSQL_PROJECT="aig-sql-$profile-$project_random"
            container="$QA_MYSQL_PROJECT-$QA_MYSQL_PROFILE-1"
            issue_leaf "$profile/server" "$QA_MYSQL_PROFILE" ca serverAuth "DNS:localhost,DNS:$QA_MYSQL_PROFILE"
            openssl rand -hex 24 > "$qa/$profile/root.password"
            openssl rand -hex 24 > "$qa/$profile/probe.password"
            openssl verify -CAfile "$qa/ca/ca.pem" -purpose sslserver -verify_hostname localhost "$qa/$profile/server.pem"
            chmod 0444 "$qa/$profile/"{server.pem,server.key,root.password,probe.password}
            tls_args=(--ssl-ca="$qa/ca/ca.pem")
            if [[ $profile == mtls ]]; then
              issue_leaf client/probe qa-probe ca clientAuth
              openssl verify -CAfile "$qa/ca/ca.pem" -purpose sslclient "$qa/client/probe.pem"
              tls_args+=(--ssl-cert="$qa/client/probe.pem" --ssl-key="$qa/client/probe.key")
            fi

            begin "$profile:disposable_server"
            [[ $QA_MYSQL_PROJECT =~ ^aig-sql-(password|mtls)-[0-9a-f]{24}$ ]]
            project_empty
            listeners=$(ss -H -ltn 'sport = :13306')
            [[ -z $listeners ]]
            compose_qa config --quiet
            project_owned=1
            compose_qa up -d --pull never "$QA_MYSQL_PROFILE"
            [[ $(docker_qa inspect --type container --format \
              '{{index .Config.Labels "com.docker.compose.project"}} {{index .Config.Labels "com.docker.compose.service"}} {{.Image}} {{.State.Running}}' \
              "$container") == "$QA_MYSQL_PROJECT $QA_MYSQL_PROFILE $image_id true" &&
              $(docker_qa port "$container" 3306/tcp) == "127.0.0.1:$QA_MYSQL_PORT" ]]

            begin "$profile:verified_transport"
            probe_secret="$qa/$profile/probe.password"
            proof=$(wait_mysql_ready verified ok "$probe_secret" VERIFY_IDENTITY "${tls_args[@]}")
            [[ $proof =~ ^verified\ PASS\ 8\.4\.13\ (TLSv1\.[23])$ ]]
            tls_version=${BASH_REMATCH[1]}
            client_cert=not_used
            if [[ $profile == mtls ]]; then
              [[ $(mysql_case missing-cert credentials "$probe_secret" VERIFY_IDENTITY "${tls_args[0]}") == 'missing-cert PASS refused=1045' ]]
              [[ $(mysql_case verified ok "$probe_secret" VERIFY_IDENTITY "${tls_args[@]}") == "$proof" ]]
              client_cert=required
            fi
            transport["$profile"]=$tls_version
            client_certificate["$profile"]=$client_cert

            begin "$profile:fresh_schemas"
            config_a=$(prepare_gateway_fixture writer)
            config_b=$(prepare_gateway_fixture witness)
            begin "$profile:gateway_oracle"
            status=0
            AI_GUARD_MYSQL_IDENTITY_QA_CONFIG_A="$config_a" AI_GUARD_MYSQL_IDENTITY_QA_CONFIG_B="$config_b" \
              timeout --kill-after=10s 180s "$libtest" --ignored --exact --test-threads=1 "$selector" \
              > "$qa/test.log" 2>&1 || status=$?
            test_exit["$profile"]=$status
            counts=$(sed -nE 's/^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored; [0-9]+ measured; [0-9]+ filtered out;.*/\2 \3 \4/p' "$qa/test.log")
            if [[ $counts =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then
              test_counts["$profile"]=${counts// /,}
            fi
            if (( status != 0 )) || [[ $counts != '1 0 0' ]] || ! grep -Fxq "test $selector ... ok" "$qa/test.log"; then
              [[ $counts =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]] || counts=unavailable
              report "FAIL profile=$QA_MYSQL_PROFILE selector=$selector exit=$status counts=$counts"
              exit 1
            fi

            begin "$profile:project_cleanup"
            cleanup_project
            report "PASS profile=$QA_MYSQL_PROFILE mysql=8.4.13 digest=$QA_MYSQL_IMAGE_DIGEST tls=$tls_version client_cert=$client_cert selector=$selector passed=1 failed=0 ignored=0 cleanup=confirmed"
          done
          begin finished

      - name: Finalize the redacted verification receipt
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/mysql-gateway-receipt.txt"
          outcome() {
            case "$1" in
              success) printf '%s' pass ;;
              failure) printf '%s' fail ;;
              *) printf '%s' unknown ;;
            esac
          }
          if [[ ! -f $receipt ]]; then
            verification_sha=unknown
            if [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]; then verification_sha=$GITHUB_SHA; fi
            read -r -a phases <<< "$QA_COMMON_PHASES"
            read -r -a profile_phases <<< "$QA_PROFILE_PHASES"
            {
              printf 'schema=1\nproduct_sha=%s\nverification_sha=%s\nimage_digest=%s\nselector=%s\n' \
                "$QA_PRODUCT_SHA" "$verification_sha" "$QA_MYSQL_IMAGE_DIGEST" "$QA_SELECTOR"
              printf 'verification=unknown\nfailure_stage=none\nverification_exit=unknown\n'
              printf 'test_binary_sha256=unknown\ngateway_binary_sha256=unknown\n'
              for phase in "${phases[@]}"; do
                printf 'phase=%s outcome=unknown\n' "$phase"
              done
              for profile in mysql-password mysql-mtls; do
                for phase in "${profile_phases[@]}"; do
                  printf 'profile=%s phase=%s outcome=unknown\n' "$profile" "$phase"
                done
                printf 'profile=%s tls=unknown client_certificate=unknown\n' "$profile"
                printf 'profile=%s test_exit=unknown test_counts_pass_fail_ignore=unknown\n' "$profile"
              done
              printf 'phase=private_directory_cleanup outcome=unknown\n'
            } > "$receipt"
          fi
          printf 'checkout_action=%s\nverification_action=%s\n' \
            "$(outcome "$CHECKOUT_OUTCOME")" "$(outcome "$VERIFY_OUTCOME")" >> "$receipt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mysql-gateway-receipt
          path: ${{ runner.temp }}/mysql-gateway-receipt.txt
          if-no-files-found: error
          retention-days: 14
