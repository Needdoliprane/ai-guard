name: G07 CleanupResult acknowledgement oracles

on:
  push:
    branches: ['claude/v1-g07-cleanup-ack-oracle-check-r2-20261122']

permissions:
  contents: read

concurrency:
  group: g07-cleanup-ack-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-ack-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize sanitized receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          printf 'workflow_sha=%s\nworkflow_parent=NOT_VERIFIED\ncandidate=75bdd7af33e40e60b9586e1a12cb2530225ee414\ncandidate_parent=8e34ce0449e5c6f0be394a3103f9cfdd594c3adf\nsource=NOT_RUN\nworkflow_lineage=NOT_RUN\nfetch=NOT_RUN\nlibtest_build=NOT_RUN\nlibtest_artifact=NOT_RUN\noracles=NOT_RUN\n' "$WORKFLOW_SHA" > "$RUNNER_TEMP/g07-cleanup-ack-receipt.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 75bdd7af33e40e60b9586e1a12cb2530225ee414
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate, module path, and workflow-only ancestry
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          receipt="$RUNNER_TEMP/g07-cleanup-ack-receipt.txt"
          source_status=FAIL
          lineage_status=FAIL
          test_source=src/runner/broker/executor/export_retirement_tests.rs
          source_delta="$(git diff --name-only 8e34ce0449e5c6f0be394a3103f9cfdd594c3adf 75bdd7af33e40e60b9586e1a12cb2530225ee414)"
          if [[ "$(git rev-parse HEAD)" == 75bdd7af33e40e60b9586e1a12cb2530225ee414 &&
                "$(git rev-parse HEAD^)" == 8e34ce0449e5c6f0be394a3103f9cfdd594c3adf &&
                "$source_delta" == "$test_source" ]] &&
              grep -Fq '#[path = "journal_tests.rs"]' src/runner/broker/executor/journal.rs &&
              grep -Fq '#[path = "export_retirement_tests.rs"]' src/runner/broker/executor/journal_tests.rs &&
              grep -Fq 'async fn worker_cleanup_replays_the_exact_store_receipt_after_lost_http_response()' "$test_source" &&
              grep -Fq 'async fn worker_cleanup_retains_the_published_ack_after_lost_writer_reply()' "$test_source"; then
            source_status=PASS
          fi
          workflow_delta="$(git diff --name-only 75bdd7af33e40e60b9586e1a12cb2530225ee414 "$WORKFLOW_SHA")"
          if [[ "$(git rev-parse "$WORKFLOW_SHA^")" == 0443be0fe0fcaeaad6972484f89fe9b7bac6e92a &&
                "$workflow_delta" == '.github/workflows/lot-verify.yaml' ]]; then
            lineage_status=PASS
          fi
          printf 'source=%s\nworkflow_lineage=%s\nworkflow_parent=0443be0fe0fcaeaad6972484f89fe9b7bac6e92a\n' \
            "$source_status" "$lineage_status" >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          [[ "$source_status" == PASS && "$lineage_status" == PASS ]]
      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -uo pipefail
          if cargo fetch --locked > "$RUNNER_TEMP/g07-cleanup-fetch-private.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'fetch=%s fetch_exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g07-cleanup-ack-receipt.txt"
          exit "$rc"
      - name: Compile one no-default-features libtest executable
        id: build
        shell: bash
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/g07-cleanup-ack-private"
          mkdir -m 700 "$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          cargo test --locked --offline --no-default-features --lib --no-run --message-format=json \
            > "$scratch/build.jsonl" 2> "$scratch/build.stderr"
          rc=$?
          printf 'libtest_build=%s build_exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g07-cleanup-ack-receipt.txt"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" == 0 ]]; then
            binary="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/build.jsonl")"
            if [[ -x "$binary" ]]; then
              digest="$(sha256sum "$binary" | cut -d ' ' -f1)"
              printf 'libtest_artifact=PASS\nlibtest_sha256=%s\n' "$digest" >> "$RUNNER_TEMP/g07-cleanup-ack-receipt.txt"
              echo "binary=$binary" >> "$GITHUB_OUTPUT"
            else
              printf 'libtest_artifact=FAIL\n' >> "$RUNNER_TEMP/g07-cleanup-ack-receipt.txt"
              exit 1
            fi
          fi
          exit "$rc"
      - name: Run only the two exact CleanupResult oracles
        id: oracle
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          TEST_BINARY: ${{ steps.build.outputs.binary }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$RUNNER_TEMP/g07-cleanup-ack-private"
          receipt="$RUNNER_TEMP/g07-cleanup-ack-receipt.txt"
          selectors=(
            'runner::broker::executor::journal::tests::export_retirement_tests::worker_cleanup_replays_the_exact_store_receipt_after_lost_http_response'
            'runner::broker::executor::journal::tests::export_retirement_tests::worker_cleanup_retains_the_published_ack_after_lost_writer_reply'
          )
          checked=0
          passed=0
          failed=0
          ignored_total=0
          for selector in "${selectors[@]}"; do
            label="${selector##*::}"
            log="$scratch/$label.log"
            if timeout --kill-after=10s 360s "$TEST_BINARY" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1; then rc=0; else rc=$?; fi
            banners="$(grep -Ec '^running [0-9]+ tests?$' "$log" || true)"
            selected="$(awk '/^running [0-9]+ tests?$/ { count += $2 } END { print count + 0 }' "$log")"
            case_results="$(grep -Ec '^test .+ \.\.\. (ok|FAILED|ignored)(,.*)?$' "$log" || true)"
            result_summaries="$(grep -c '^test result: ' "$log" || true)"
            ignored="$(grep -Ec '^test .* \.\.\. ignored(,.*)?$' "$log" || true)"
            passed_case=0
            failed_case=0
            if grep -Fqx "test $selector ... ok" "$log"; then passed_case=1; fi
            if grep -Fqx "test $selector ... FAILED" "$log"; then failed_case=1; fi
            panic_locations="$(sed -nE 's/^thread .* panicked at ((src|tests)\/([A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.rs:[0-9]+:[0-9]+):.*/\1/p' "$log" | sort -u | awk 'NR <= 3' | paste -sd ';' -)"
            status=FAIL
            if [[ "$rc" == 0 && "$banners" == 1 && "$selected" == 1 && "$case_results" == 1 &&
                  "$result_summaries" == 1 && "$ignored" == 0 && "$passed_case" == 1 && "$failed_case" == 0 ]] &&
                grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out(; finished in [0-9]+(\.[0-9]+)?s)?$' "$log"; then
              status=PASS
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
            fi
            checked=$((checked + 1))
            ignored_total=$((ignored_total + ignored))
            printf 'selector=%s status=%s exit=%s selected=%s passed=%s failed=%s ignored=%s panic_spans=%s\n' \
              "$label" "$status" "$rc" "$selected" "$passed_case" "$failed_case" "$ignored" "${panic_locations:-none}" >> "$receipt"
          done
          verdict=FAIL
          if [[ "$checked" == 2 && "$passed" == 2 && "$failed" == 0 && "$ignored_total" == 0 ]]; then verdict=PASS; fi
          printf 'checked=%s passed=%s failed=%s ignored=%s verdict=%s\n' \
            "$checked" "$passed" "$failed" "$ignored_total" "$verdict" >> "$receipt"
          printf 'oracles=%s\n' "$verdict" >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          test "$verdict" = PASS
      - name: Upload sanitized CleanupResult receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-cleanup-ack-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/g07-cleanup-ack-receipt.txt
          if-no-files-found: warn
          retention-days: 14
