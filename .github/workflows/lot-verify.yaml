name: G01 1c9e8e01 storage all-targets compile check

on:
  push:
    branches:
      - codex/v1-g01-transfer-1c9e8e01

permissions:
  contents: read

concurrency:
  group: g01-1c9e8e01-storage-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storage-check:
    name: all-targets (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sqlite
            features: --no-default-features
          - profile: mysql
            features: --no-default-features --features mysql-storage
    env:
      SOURCE_SHA: 1c9e8e016bc8f1dca24147958858e9997cd0794e
      SOURCE_TREE_SHA: 4b23dfafe825fd9f0398fdcbf7dc7321cfd40560
      SOURCE_PARENT_SHA: 48f81d2043ea0b1153986df05d8b85cbd4999890
      SOURCE_PARENT_TREE_SHA: dc61d1b31fa56cbdf7368583908d03766e6c9972
      EXPECTED_BRANCH: codex/v1-g01-transfer-1c9e8e01
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Checkout exact source and workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Fetch dependencies and check one storage profile
        id: check
        shell: bash
        env:
          CHECK_PROFILE: ${{ matrix.profile }}
          CHECK_FEATURES: ${{ matrix.features }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g01-1c9e8e01-$CHECK_PROFILE-receipt.txt"
          scratch=""
          printf 'schema=1\nprofile=%s\nsource_sha=%s\nsource_tree_sha=%s\nsource_parents=%s\nworkflow_sha=%s\nworkflow_parent=unknown\ncargo_lock_sha256=unknown\ncargo_manifest_sha256=unknown\nrust_toolchain_sha256=unknown\nrustc_version=NOT_RUN\ncheckout=NOT_RUN\nsource_guard=NOT_RUN\nmanifest_guard=NOT_RUN\ndisk_preflight=NOT_RUN\ndependency_fetch=NOT_RUN\ndependency_fetch_exit=NOT_RUN\nall_targets_check=NOT_RUN\ncheck_exit=NOT_RUN\nrust_error_code_status=NOT_RUN\nrust_error_code_count=0\nrust_error_codes=none\nprivate_scratch_cleanup=NOT_RUN\nresult=NOT_RUN\nscope=compile-only; no tests, engine, provider, or database runtime executed\n' \
            "$CHECK_PROFILE" "$SOURCE_SHA" "$SOURCE_TREE_SHA" \
            "$SOURCE_PARENT_SHA" "$GITHUB_SHA" > "$receipt"
          chmod 600 "$receipt"
          result=FAIL
          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1==key{$0=key "=" value} {print}' "$receipt" > "$receipt.next"
            mv -- "$receipt.next" "$receipt"
          }
          finish() {
            local code=$? cleanup_rc=0
            trap - EXIT
            set +e
            if [[ -n "$scratch" && "$scratch" == "$RUNNER_TEMP/g01-1c9e8e01-$CHECK_PROFILE."* ]]; then
              rm -rf -- "$scratch" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$scratch" ]] || cleanup_rc=1
            fi
            if (( cleanup_rc == 0 )); then set_field private_scratch_cleanup PASS; else set_field private_scratch_cleanup FAIL; code=1; fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; fi
            set_field result "$result"
            {
              printf 'G01 1c9e8e01 storage compile profile=%s result=%s\n' "$CHECK_PROFILE" "$result"
              grep -E '^(source_guard|manifest_guard|disk_preflight|rustc_version|dependency_fetch|dependency_fetch_exit|all_targets_check|check_exit|rust_error_code_status|rust_error_code_count|rust_error_codes|private_scratch_cleanup|result)=' "$receipt"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
          trap finish EXIT

          expected_ref="refs/heads/$EXPECTED_BRANCH"
          workflow_parent="$(git show -s --format=%P HEAD 2>/dev/null || true)"
          set_field workflow_parent "$workflow_parent"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "$expected_ref" &&
                "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
                "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" &&
                "$workflow_parent" == "$SOURCE_SHA" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_SHA" 2>/dev/null)" == "$SOURCE_PARENT_SHA" &&
                "$(git rev-parse "$SOURCE_PARENT_SHA^{tree}" 2>/dev/null)" == "$SOURCE_PARENT_TREE_SHA" &&
                "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true ]]; then
            set_field source_guard PASS
          else
            set_field source_guard FAIL
            exit 1
          fi
          set_field checkout PASS

          lock_sha="$(git show "$SOURCE_SHA:Cargo.lock" | sha256sum | awk '{print $1}')"
          toolchain_sha="$(git show "$SOURCE_SHA:rust-toolchain.toml" | sha256sum | awk '{print $1}')"
          manifest_sha="$(git show "$SOURCE_SHA:Cargo.toml" | sha256sum | awk '{print $1}')"
          set_field cargo_lock_sha256 "$lock_sha"
          set_field rust_toolchain_sha256 "$toolchain_sha"
          set_field cargo_manifest_sha256 "$manifest_sha"
          if [[ "$lock_sha" == 635794600f553a27f65c2061381ee04eac3c69d57a88d6e33e2579abed01e4b4 &&
                "$toolchain_sha" == d13306be0ecda81ce779baa290ffb417380d525928477f16200884b5169cca33 &&
                "$manifest_sha" == 555bbe5fdca395ea367c151bf33eb1adb78280824522efe523eed67b30465cf0 ]]; then
            set_field manifest_guard PASS
          else
            set_field manifest_guard FAIL
            exit 1
          fi

          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$free_kb" =~ ^[0-9]+$ ]] && (( free_kb >= 5242880 )); then set_field disk_preflight PASS; else set_field disk_preflight FAIL; exit 1; fi
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then set_field rustc_version 1.99.1; else set_field rustc_version MISMATCH; exit 1; fi

          scratch="$(mktemp -d "$RUNNER_TEMP/g01-1c9e8e01-$CHECK_PROFILE.XXXXXX")" || exit 1
          chmod 700 "$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          fetch_rc=0
          timeout --kill-after=10s 20m cargo fetch --locked > "$scratch/fetch.log" 2>&1 || fetch_rc=$?
          set_field dependency_fetch_exit "$fetch_rc"
          if (( fetch_rc == 0 )); then set_field dependency_fetch PASS; else set_field dependency_fetch FAIL; exit 1; fi

          check_rc=0
          # CHECK_FEATURES is a fixed matrix value, never a user-controlled string.
          # shellcheck disable=SC2086
          timeout --kill-after=10s 90m cargo check --locked --offline --all-targets $CHECK_FEATURES --message-format=json \
            > "$scratch/check.jsonl" 2> "$scratch/check.stderr" || check_rc=$?
          set_field check_exit "$check_rc"
          code_list="$scratch/error-codes.txt"
          if jq -r 'select(.reason == "compiler-message" and .message.level == "error") | .message.code.code // empty | select(test("^E[0-9]{4}$"))' \
              "$scratch/check.jsonl" 2>/dev/null | sort -u > "$code_list"; then
            count="$(awk 'END {print NR+0}' "$code_list")"
            codes=none
            if (( count > 0 )); then codes="$(paste -sd, "$code_list")"; fi
            set_field rust_error_code_status filtered
            set_field rust_error_code_count "$count"
            set_field rust_error_codes "$codes"
          else
            set_field rust_error_code_status unavailable
          fi
          if (( check_rc == 0 )); then set_field all_targets_check PASS; else set_field all_targets_check FAIL; exit 1; fi

      - name: Upload only the closed profile receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g01-1c9e8e01-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/g01-1c9e8e01-${{ matrix.profile }}-receipt.txt
          if-no-files-found: error
          retention-days: 14
