name: G10 dashboard temporary path comparison
'on':
  push:
    branches:
    - claude/v1-g10-live-dashboard-tmp-depth-check-20261123
permissions:
  contents: read
concurrency:
  group: g10-dashboard-tmp-depth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chrome_tmp_comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_SHA: 90bd1f6bddc6c4f09f5812d50620e4a33674d6a3
      SOURCE_TREE: cdd78df4d725a06cee1873989f8ab50a75c9cce0
      SOURCE_PARENT: 152070cbd63882c37a4bbb58a63a5fe92778d0a3
      EXPECTED_BRANCH: claude/v1-g10-live-dashboard-tmp-depth-check-20261123
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
    - name: Initialize closed comparison receipt
      shell: bash
      run: |-
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-dashboard-tmp-receipt.txt"
        cat > "$receipt" <<'EOF'
        source_sha=90bd1f6bddc6c4f09f5812d50620e4a33674d6a3
        source_tree=cdd78df4d725a06cee1873989f8ab50a75c9cce0
        source_parent=152070cbd63882c37a4bbb58a63a5fe92778d0a3
        workflow_sha=NOT_RUN
        source_guard=NOT_RUN
        runner_uid=NOT_RUN
        node=NOT_RUN
        playwright=NOT_RUN
        chrome=NOT_RUN
        chrome_version=NOT_RUN
        shared_home_length=NOT_RUN
        short_tmp_length=NOT_RUN
        deep_tmp_length=NOT_RUN
        short_launch=NOT_RUN
        short_error_class=NOT_RUN
        short_loopback=NOT_RUN
        short_browser_close=NOT_RUN
        short_server_close=NOT_RUN
        deep_launch=NOT_RUN
        deep_error_class=NOT_RUN
        deep_loopback=NOT_RUN
        deep_browser_close=NOT_RUN
        deep_server_close=NOT_RUN
        comparison=NOT_RUN
        cleanup=NOT_STARTED
        result=NOT_RUN
        EOF
        chmod 600 "$receipt"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact source and workflow lineage
      shell: bash
      run: |-
        set +x
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-dashboard-tmp-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        set_field workflow_sha "$GITHUB_SHA"
        if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
              "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
              "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
              "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
              "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
              "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
              "$(git cat-file commit "$SOURCE_SHA" 2>/dev/null | awk '$1 == "parent" { p[++n] = $2 } END { if (n == 1) print p[1] }')" == "$SOURCE_PARENT" &&
              "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
              -z "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" &&
              "$(grep -Fxc '    tempfile::Builder::new()' tests/support/mod.rs || true)" == 1 &&
              "$(grep -Fxc '        .tempdir()' tests/support/mod.rs || true)" == 1 &&
              "$(grep -Fxc '            .env("TMPDIR", tmp.path())' tests/runtime_user_journey.rs || true)" == 1 &&
              "$(grep -Fxc '  stage = "launch";' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '  browser = await chromium.launch({ headless: true, chromiumSandbox: true, timeout: 15_000,' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '    args: ["--no-proxy-server", "--host-resolver-rules=EXCLUDE 127.0.0.1, MAP * ~NOTFOUND"] });' front/tests/browser_runtime_live_window.mjs || true)" == 1 &&
              "$(grep -Fxc '  for (const [index, tenant] of ["tenant-a", "tenant-b"].entries()) await openViewer(tenant, secrets[index]);' front/tests/browser_runtime_live_window.mjs || true)" == 1 ]]; then
          set_field source_guard PASS
        else
          set_field source_guard FAIL
          echo 'Exact source/ref guard failed; details omitted.' >&2
          exit 1
        fi
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.2
        package-manager-cache: false
    - name: Prepare private scratch and pinned browser driver
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-dashboard-tmp-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        private="$RUNNER_TEMP/g10-dashboard-tmp"
        if [[ -e "$private" || -L "$private" ]]; then set_field result FAIL; exit 1; fi
        mkdir -m 700 "$private" "$private/tmp" "$private/playwright" "$private/control"
        : > "$private/.workflow-owned"
        chmod 600 "$private/.workflow-owned"
        printf 'G10_PRIVATE=%s\nG10_RUNNER_UID=%s\n' "$private" "$(id -u)" >> "$GITHUB_ENV"
        set_field runner_uid "$(id -u)"
        node_version="$(node --version 2>/dev/null || true)"
        if [[ "$node_version" == v24.22.2 ]]; then set_field node 24.22.2; else set_field node MISMATCH; exit 1; fi
        printf 'G10_NODE_BIN=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
        if (cd "$private/playwright" && npm init -y > "$private/control/npm-init.log" 2>&1 &&
            npm install --no-save --no-package-lock --ignore-scripts playwright@1.65.1 > "$private/control/npm-install.log" 2>&1); then
          version="$(node -p "require('$private/playwright/node_modules/playwright/package.json').version" 2>/dev/null || true)"
          if [[ "$version" == 1.65.1 ]]; then set_field playwright 1.65.1; else set_field playwright MISMATCH; exit 1; fi
        else
          set_field playwright FAIL
          exit 1
        fi
        chrome=/opt/google/chrome/chrome
        if [[ -x "$chrome" ]]; then
          version_rc=0
          version_line="$(timeout --kill-after=5s 10s "$chrome" --product-version 2>/dev/null)" || version_rc=$?
          if [[ "$version_rc" == 0 && "$version_line" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            set_field chrome HOST_CHROME
            set_field chrome_version "$version_line"
          else set_field chrome FAIL; set_field chrome_version UNKNOWN; exit 1; fi
        else set_field chrome MISSING; exit 1; fi
    - name: Compare Chrome launch with short and conductor-depth TMPDIR
      shell: bash
      run: |
        set +x
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-dashboard-tmp-receipt.txt"
        private="$G10_PRIVATE"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        deep_root="$(mktemp -d "$private/tmp/.tmpXXXXXX")"
        mkdir -m 700 "$deep_root/dashboard-live" "$deep_root/dashboard-live/home" "$deep_root/dashboard-live/tmp" "$deep_root/dashboard-live/artifacts"
        home="$deep_root/dashboard-live/home"
        deep_tmp="$deep_root/dashboard-live/tmp"
        artifact_dir="$deep_root/dashboard-live/artifacts"
        short_tmp="$private/tmp/probe-tmp"
        mkdir -m 700 "$short_tmp"
        set_field shared_home_length "$(printf %s "$home" | wc -c | tr -d ' ')"
        set_field short_tmp_length "$(printf %s "$short_tmp" | wc -c | tr -d ' ')"
        deep_length="$(printf %s "$deep_tmp" | wc -c | tr -d ' ')"
        if [[ "$deep_length" =~ ^[0-9]+$ ]] && (( deep_length <= 240 )); then set_field deep_tmp_length "$deep_length"; else set_field deep_tmp_length OUT_OF_RANGE; exit 1; fi
        cat > "$private/chrome-tmp-probe.mjs" <<'NODE'
        import { createRequire } from "node:module";
        import { createServer } from "node:http";
        import { join } from "node:path";

        const report = { launch: "NOT_RUN", error_class: "NONE", loopback: "NOT_RUN", browser_close: "NOT_RUN", server_close: "NOT_RUN", tmp_length: 0 };
        let server, browser;
        const require = createRequire(import.meta.url);
        const finishServer = async () => {
          if (!server?.listening) { report.server_close = "PASS"; return; }
          await new Promise((resolve) => server.close(() => resolve()));
          report.server_close = server.listening ? "FAIL" : "PASS";
        };
        try {
          if (process.getuid?.() !== Number(process.env.G10_RUNNER_UID)) throw new Error("uid mismatch");
          report.tmp_length = Buffer.byteLength(process.env.TMPDIR);
          const { chromium } = require(join(process.env.CODEX_PRIMARY_RUNTIME_NODE_MODULES, "playwright"));
          server = createServer((_request, response) => {
            response.writeHead(200, { "content-type": "text/html; charset=utf-8", "cache-control": "no-store" });
            response.end("<!doctype html><title>local probe</title><main>ready</main>");
          });
          await new Promise((resolve, reject) => { server.once("error", reject); server.listen(0, "127.0.0.1", resolve); });
          const origin = `http://127.0.0.1:${server.address().port}`;
          report.launch = "RUNNING";
          browser = await chromium.launch({ headless: true, chromiumSandbox: true, timeout: 15_000,
            executablePath: process.env.PLAYWRIGHT_CHROMIUM_EXECUTABLE,
            args: ["--no-proxy-server", "--host-resolver-rules=EXCLUDE 127.0.0.1, MAP * ~NOTFOUND"] });
          report.launch = "PASS";
          const context = await browser.newContext({ serviceWorkers: "block" });
          let outsideRequests = 0;
          await context.route("**/*", async (route) => {
            if (route.request().url().startsWith(origin + "/")) await route.continue();
            else { outsideRequests += 1; await route.abort(); }
          });
          const page = await context.newPage();
          await page.goto(origin, { waitUntil: "domcontentloaded", timeout: 5000 });
          report.loopback = (await page.title()) === "local probe" && outsideRequests === 0 ? "PASS" : "FAIL";
          await context.close();
          await browser.close();
          browser = undefined;
          report.browser_close = "PASS";
        } catch (error) {
          if (report.launch === "RUNNING") {
            report.launch = "FAIL";
            report.error_class = String(error?.message ?? "").includes("Socket path too long") ? "SOCKET_PATH_LENGTH" : "OTHER_LAUNCH_FAILURE";
          } else {
            report.launch = report.launch === "NOT_RUN" ? "FAIL" : report.launch;
            report.error_class = "OTHER_FAILURE";
          }
        } finally {
          if (browser) {
            try { await browser.close(); report.browser_close = "PASS"; }
            catch { report.browser_close = "FAIL"; }
          }
          await finishServer().catch(() => { report.server_close = "FAIL"; });
        }
        process.stdout.write(JSON.stringify(report) + "\n");
        if (report.launch !== "PASS" || report.loopback !== "PASS" || report.browser_close !== "PASS" || report.server_close !== "PASS") process.exitCode = 1;
        NODE
        chmod 600 "$private/chrome-tmp-probe.mjs"
        run_case() {
          local label=$1 tmp=$2 out="$private/control/$1.json" err="$private/control/$1.stderr" rc=0
          env -i PATH=/usr/bin:/bin HOME="$home" TMPDIR="$tmp" G10_RUNNER_UID="$G10_RUNNER_UID" \
            CODEX_PRIMARY_RUNTIME_NODE_MODULES="$private/playwright/node_modules" \
            PLAYWRIGHT_CHROMIUM_EXECUTABLE=/opt/google/chrome/chrome \
            AI_GUARD_TEST_ARTIFACT_DIR="$artifact_dir" \
            "$G10_NODE_BIN" "$private/chrome-tmp-probe.mjs" > "$out" 2> "$err" || rc=$?
          chmod 600 "$out" "$err"
          if [[ "$(wc -l < "$out" | tr -d ' ')" == 1 ]] && jq -e 'type == "object" and keys == ["browser_close","error_class","launch","loopback","server_close","tmp_length"] and (.launch|IN("PASS","FAIL")) and (.error_class|IN("NONE","SOCKET_PATH_LENGTH","OTHER_LAUNCH_FAILURE","OTHER_FAILURE")) and (.loopback|IN("NOT_RUN","PASS","FAIL")) and (.browser_close|IN("NOT_RUN","PASS","FAIL")) and (.server_close|IN("NOT_RUN","PASS","FAIL")) and (.tmp_length|type == "number" and . >= 1 and . <= 240)' "$out" >/dev/null; then
            local launch error_class loopback browser_close server_close actual_length
            launch="$(jq -r .launch "$out")"; error_class="$(jq -r .error_class "$out")"
            loopback="$(jq -r .loopback "$out")"; browser_close="$(jq -r .browser_close "$out")"
            server_close="$(jq -r .server_close "$out")"; actual_length="$(jq -r .tmp_length "$out")"
            set_field "${label}_launch" "$launch"; set_field "${label}_error_class" "$error_class"
            set_field "${label}_loopback" "$loopback"; set_field "${label}_browser_close" "$browser_close"
            set_field "${label}_server_close" "$server_close"
            if [[ "$actual_length" == "$(printf %s "$tmp" | wc -c | tr -d ' ')" ]]; then :; else set_field "${label}_launch" MALFORMED_RECEIPT; fi
            [[ "$launch" == PASS && "$loopback" == PASS && "$browser_close" == PASS && "$server_close" == PASS ]]
          else
            set_field "${label}_launch" MALFORMED_RECEIPT
            set_field "${label}_error_class" UNKNOWN
            return 1
          fi
        }
        short_rc=0; run_case short "$short_tmp" || short_rc=$?
        deep_rc=0; run_case deep "$deep_tmp" || deep_rc=$?
        short_launch="$(awk -F= '$1=="short_launch" {print $2}' "$receipt")"
        deep_launch="$(awk -F= '$1=="deep_launch" {print $2}' "$receipt")"
        short_err="$(awk -F= '$1=="short_error_class" {print $2}' "$receipt")"
        deep_err="$(awk -F= '$1=="deep_error_class" {print $2}' "$receipt")"
        if [[ "$short_launch" == PASS && "$deep_launch" == FAIL && "$deep_err" == SOCKET_PATH_LENGTH ]]; then
          set_field comparison DEPTH_SENSITIVE_SOCKET_PATH
        elif [[ "$short_launch" == PASS && "$deep_launch" == PASS ]]; then
          set_field comparison NO_DIFFERENCE_OBSERVED
        elif [[ "$short_launch" != PASS ]]; then
          set_field comparison BASELINE_FAILED
        elif [[ "$deep_launch" == FAIL && "$deep_err" == OTHER_LAUNCH_FAILURE ]]; then
          set_field comparison DEPTH_LAUNCH_FAILURE_OTHER
        else
          set_field comparison UNKNOWN
        fi
        if (( short_rc == 0 && deep_rc == 0 )); then
          set_field result PASS
        else
          set_field result INVESTIGATE
          exit 1
        fi
    - name: Close private scratch
      if: always()
      shell: bash
      run: |
        set +x
        set -euo pipefail
        umask 077
        receipt="$RUNNER_TEMP/g10-dashboard-tmp-receipt.txt"
        set_field() {
          local key=$1 value=$2
          awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
          chmod 600 "$receipt.pending"
          mv -- "$receipt.pending" "$receipt"
        }
        private="$RUNNER_TEMP/g10-dashboard-tmp"
        if [[ -f "$private/.workflow-owned" && ! -L "$private/.workflow-owned" && "$(stat -c '%a' "$private/.workflow-owned" 2>/dev/null)" == 600 && "$(stat -c '%a' "$private" 2>/dev/null)" == 700 ]]; then
          if rm -rf -- "$private"; then set_field cleanup PASS; else set_field cleanup FAIL; set_field result FAIL; fi
        elif [[ -e "$private" || -L "$private" ]]; then
          set_field cleanup OWNERSHIP_UNVERIFIED
          set_field result FAIL
        else set_field cleanup NOT_NEEDED; fi
        if [[ "$(awk -F= '$1=="cleanup" {print $2}' "$receipt")" == FAIL || "$(awk -F= '$1=="cleanup" {print $2}' "$receipt")" == OWNERSHIP_UNVERIFIED ]]; then exit 1; fi
    - name: Upload closed comparison receipt
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: g10-dashboard-tmp-${{ github.sha }}
        path: ${{ runner.temp }}/g10-dashboard-tmp-receipt.txt
        if-no-files-found: error
        retention-days: 14
