name: G04 control builder check

on:
  push:
    branches: [claude/v1-g04-control-builder-check-20261122]

permissions:
  contents: read

jobs:
  rust-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 5e092e7e01ca70bbdc491401283dd1321117e514
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Require the GitHub-hosted runner
        id: hosted_runner
        shell: bash
        run: |
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 &&
            "${GITHUB_EVENT_NAME:-}" == push && "${GITHUB_REF:-}" == refs/heads/claude/v1-g04-control-builder-check-20261122 &&
            "$(id -u)" =~ ^[1-9][0-9]*$ ]] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Observe the pinned Rust builder in isolation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/g04-rust-builder-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$private" "$private/receipt"
          receipt="$private/receipt"
          phase=source
          builder_exit=null
          builder_seconds=null

          finish() {
            local code=$? status=FAIL
            trap - EXIT
            if [[ "$code" == 0 ]]; then status=PASS; fi
            jq -n --arg source "$SOURCE_SHA" --arg workflow "$GITHUB_SHA" --arg phase "$phase" \
              --arg status "$status" --argjson exit_code "$builder_exit" --argjson elapsed_seconds "$builder_seconds" \
              '{source_sha:$source,workflow_sha:$workflow,phase:$phase,status:$status,builder_exit_code:$exit_code,builder_elapsed_seconds:$elapsed_seconds}' \
              > "$receipt/result.json"
            printf 'G04 Rust builder %s (%s)\n' "$status" "$phase"
            exit "$code"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" ]] || exit 1
          [[ "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/lot-verify.yaml ]] || exit 1
          source_tree="$private/source"
          mkdir "$source_tree"
          git archive --format=tar "$SOURCE_SHA" | tar -xf - -C "$source_tree"

          phase=builder_recipe
          base='FROM rust:1.99.1-bookworm@sha256:e6f2cff35d0f309acf8433b4f05878ed77092602c5065cc81801177da0bb3a9c AS rust-build'
          official_build='RUN cargo build --release --locked --bin agentsandbox --bin ai-guard-audit-checkpoint --bin ai-guard-diagnose'
          diagnostic="$private/diagnostic.Dockerfile"
          # Keep the pinned FROM, COPY, workdir and build identity from the exact recipe.
          awk -v base="$base" -v build="$official_build" '
            $0 == base { found = 1; print; next }
            found && /^FROM / { exit }
            found && $0 == build { matched = 1; exit }
            found { print }
            END { if (!matched) exit 1 }
          ' "$source_tree/images/control.Dockerfile" > "$diagnostic" || exit 1
          cat >> "$diagnostic" <<'G04_DOCKERFILE'
          RUN <<'G04_PROBE'
          #!/bin/bash
          set -euo pipefail
          umask 077
          export CARGO_TERM_COLOR=never
          step_dir="$(mktemp -d)"
          export G04_METRICS="$step_dir/metrics"
          step_log="$step_dir/step.log"
          trap 'rm -f "$G04_METRICS" "$step_log"; rmdir "$step_dir"' EXIT

          toolchain() {
            local name=$1 rust_info rustc cargo rustup host installed rustfmt=0 clippy=0
            local version='^[0-9]+\.[0-9]+\.[0-9]+$'
            rust_info="$(rustc -vV)" || return $?
            rustc="$(awk '/^release: / {print $2}' <<< "$rust_info")"
            host="$(awk '/^host: / {print $2}' <<< "$rust_info")"
            cargo="$(cargo --version | awk '$1 == "cargo" {print $2}')" || return $?
            rustup="$(rustup --version | awk '$1 == "rustup" {print $2}')" || return $?
            installed="$(rustup component list --installed)" || return $?
            [[ "$rustup" =~ $version && "$rustc" =~ $version && "$cargo" =~ $version &&
              "$host" == x86_64-unknown-linux-gnu ]] || return 1
            if grep -Fxq "rustfmt-$host" <<< "$installed"; then rustfmt=1; fi
            if grep -Fxq "clippy-$host" <<< "$installed"; then clippy=1; fi
            printf 'G04 {"kind":"toolchain","phase":"%s","rustup":"%s","rustc":"%s","cargo":"%s","host":"%s","rustfmt":%s,"clippy":%s}\n' \
              "$name" "$rustup" "$rustc" "$cargo" "$host" "$rustfmt" "$clippy" > "$G04_METRICS"
            [[ "$rustc" == 1.99.1 ]] || return 1
            [[ "$name" == base_toolchain || "$rustfmt$clippy" == 11 ]]
          }

          release_bins() {
            local binary count=0
            cargo build --release --locked --offline --bin agentsandbox --bin ai-guard-audit-checkpoint --bin ai-guard-diagnose ||
              return $?
            for binary in agentsandbox ai-guard-audit-checkpoint ai-guard-diagnose; do
              if [[ -x "target/release/$binary" && -s "target/release/$binary" ]]; then count=$((count + 1)); fi
            done
            printf 'G04 {"kind":"bins","phase":"compile","count":%s}\n' "$count" > "$G04_METRICS"
            [[ "$count" == 3 ]]
          }
          export -f toolchain release_bins

          run_phase() {
            local name=$1 budget=$2 started=$SECONDS code=0
            shift 2
            : > "$G04_METRICS"
            printf 'G04 {"kind":"begin","phase":"%s"}\n' "$name"
            timeout -k 5s "$budget" "$@" > "$step_log" 2>&1 || code=$?
            cat "$G04_METRICS"
            if [[ "$name" == compile ]]; then
              tail -c 262144 "$step_log" | LC_ALL=C awk '
                /^error\[E[0-9][0-9][0-9][0-9]\]:/ { lines++; seen[substr($0, 7, 5)] = 1 }
                END {
                  printf "G04 {\"kind\":\"rust_errors\",\"phase\":\"compile\",\"lines\":%d,\"codes\":[", lines
                  for (i = 0; i < 10000 && emitted < 16; i++) {
                    code = sprintf("E%04d", i)
                    if (code in seen) printf "%s\"%s\"", emitted++ ? "," : "", code
                  }
                  print "]}"
                }
              '
            fi
            printf 'G04 {"kind":"end","phase":"%s","exit_code":%s,"elapsed_seconds":%s}\n' \
              "$name" "$code" "$((SECONDS - started))"
            return "$code"
          }

          run_phase base_toolchain 45s bash -euo pipefail -c 'cd / && toolchain base_toolchain'
          run_phase project_toolchain 90s bash -euo pipefail -c 'toolchain project_toolchain'
          run_phase metadata 30s cargo metadata --locked --offline --no-deps --format-version 1
          run_phase fetch 4m cargo fetch --locked --target host-tuple
          run_phase compile 23m bash -euo pipefail -c release_bins
          G04_PROBE
          G04_DOCKERFILE

          parse_markers() {
            LC_ALL=C awk '
              /^#[0-9]+ [0-9]+(\.[0-9]+)? G04 \{/ {
                if (!vertex) vertex = $1
                if ($1 != vertex) { print "null"; next }
                sub(/^#[0-9]+ [0-9]+(\.[0-9]+)? G04 /, "")
                print
              }
            ' "$1" 2>/dev/null | jq -es '
              def number_between($a;$b): type == "number" and floor == . and . >= $a and . <= $b;
              def version: type == "string" and test("^[0-9]{1,6}\\.[0-9]{1,6}\\.[0-9]{1,6}$");
              ["base_toolchain","project_toolchain","metadata","fetch","compile"] as $phases
              | . as $events
              | if length > 15 or any(.[]; type != "object") then error("invalid markers") else . end
              | (reduce .[] as $e ({next:0,active:null,ends:{},tools:{},bins:null,rust_errors:null,halted:false};
                  if .halted then error("marker after failure")
                  elif $e.kind == "begin" and ($e|keys) == ["kind","phase"] and .active == null and
                       .next < ($phases|length) and $e.phase == $phases[.next] then
                    .active = $e.phase
                  elif .active == null or $e.phase != .active then error("phase mismatch")
                  elif $e.kind == "toolchain" and (.active == "base_toolchain" or .active == "project_toolchain") and
                       ($e|keys) == ["cargo","clippy","host","kind","phase","rustc","rustfmt","rustup"] and
                       .tools[.active] == null and ($e.rustc|version) and ($e.cargo|version) and ($e.rustup|version) and
                       $e.host == "x86_64-unknown-linux-gnu" and ($e.rustfmt|number_between(0;1)) and
                       ($e.clippy|number_between(0;1)) then
                    .tools[.active] = ($e|del(.kind,.phase))
                  elif $e.kind == "bins" and .active == "compile" and ($e|keys) == ["count","kind","phase"] and
                       .bins == null and ($e.count|number_between(0;3)) then
                    .bins = $e.count
                  elif $e.kind == "rust_errors" and .active == "compile" and ($e|keys) == ["codes","kind","lines","phase"] and
                       .rust_errors == null and ($e.lines|number_between(0;262144)) and ($e.codes|type) == "array" and
                       ($e.codes|length) <= 16 and ($e.codes|length) <= $e.lines and
                       $e.codes == ($e.codes|unique) and all($e.codes[]; type == "string" and test("^E[0-9]{4}$")) then
                    .rust_errors = ($e|del(.kind,.phase))
                  elif $e.kind == "end" and ($e|keys) == ["elapsed_seconds","exit_code","kind","phase"] and
                       ($e.exit_code|number_between(0;255)) and ($e.elapsed_seconds|number_between(0;2100)) then
                    if $e.exit_code == 0 and (
                         ((.active == "base_toolchain" or .active == "project_toolchain") and .tools[.active].rustc != "1.99.1")
                         or (.active == "project_toolchain" and (.tools[.active].rustfmt != 1 or .tools[.active].clippy != 1))
                         or (.active == "compile" and (.bins != 3 or .rust_errors == null))
                       ) then error("missing witness") else . end
                    | .ends[.active] = ($e|del(.kind,.phase))
                    | .active = null | .next += 1 | .halted = ($e.exit_code != 0)
                  else error("invalid marker") end
                )) as $state
              | {observation:(if ($events|length) == 0 then "no_phases" else "recorded" end),
                 phases:[$phases[] as $p |
                   {phase:$p, status:(if $state.ends[$p] != null then
                      (if $state.ends[$p].exit_code == 0 then "PASS" else "FAIL" end)
                    elif $state.active == $p then "INCOMPLETE" else "NOT_RUN" end)}
                   + ($state.ends[$p] // {})],
                 toolchains:$state.tools, release_bins:$state.bins, rust_errors:$state.rust_errors}
            ' 2>/dev/null
          }

          phase=local_engine
          unset DOCKER_CONTEXT DOCKER_TLS DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_DEFAULT_PLATFORM DOCKER_AUTH_CONFIG
          unset BUILDX_BUILDER BUILDKIT_HOST
          [[ "${DOCKER_HOST:-}" == unix:///var/run/docker.sock && -S /var/run/docker.sock ]] || exit 1
          export DOCKER_CONFIG="$private/docker"
          mkdir "$DOCKER_CONFIG"

          phase=rust_builder
          started=$SECONDS
          builder_exit=0
          BUILDKIT_PROGRESS=plain timeout -k 5s 33m docker build --no-cache --target rust-build \
            --file - --build-arg AI_GUARD_BUILD_REVISION="$SOURCE_SHA" "$source_tree" \
            < "$diagnostic" > "$private/builder.log" 2>&1 || builder_exit=$?
          builder_seconds=$((SECONDS - started))
          log_bytes="$(wc -c < "$private/builder.log")"
          if [[ "$log_bytes" -gt 4194304 ]] || ! parse_markers "$private/builder.log" > "$receipt/probe.json"; then
            jq -n '{observation:"unavailable"}' > "$receipt/probe.json"
          fi
          [[ "$builder_exit" == 0 ]] || exit "$builder_exit"
          phase=observations
          jq -e '.observation == "recorded" and (.phases|length) == 5 and all(.phases[]; .status == "PASS")' \
            "$receipt/probe.json" >/dev/null
          phase=complete

      - name: Upload the closed builder receipts
        if: always() && steps.hosted_runner.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g04-control-builder
          path: ${{ runner.temp }}/g04-rust-builder-${{ github.run_id }}-${{ github.run_attempt }}/receipt/*.json
          if-no-files-found: error
          retention-days: 7
