name: G12 native archive verification

on:
  push:
    branches: ['claude/v1-g12-native-archive-check-20261122']

permissions:
  contents: read

concurrency:
  group: g12-native-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: 72fa713f7c0295d9582fa4439e88e5250c4ac8b5
      RUST_TARGET: x86_64-unknown-linux-gnu
      EXCLUDED_BINARIES: ai-guard-demo-pki
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      RECEIPT: ${{ runner.temp }}/g12-native-receipt.txt
      PRIVATE_DIR: ${{ runner.temp }}/g12-native-private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify source lineage and build native archive privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          phase=preflight
          source_guard=FAIL
          native_build=NOT_RUN
          native_exit=0
          cli_identity=NOT_RUN
          notices=NOT_RUN
          archive_check=NOT_RUN
          archive_sha256=unknown
          notices_sha256=unknown
          license_sha256=unknown
          archive_bytes=0
          license_check=NOT_RUN
          build_info_check=NOT_RUN
          native_count=0
          native_names=unknown
          version=unknown
          rustc_version=unknown
          cargo_version=unknown
          mkdir -m 700 -p "$PRIVATE_DIR"
          finish() {
            result=FAIL
            if [[ "$phase" == complete && "$source_guard" == PASS && "$native_build" == PASS && "$cli_identity" == PASS &&
                  "$notices" == PASS && "$archive_check" == PASS && "$license_check" == PASS &&
                  "$build_info_check" == PASS ]]; then result=PASS; fi
            {
              printf 'schema=g12-native-archive-v1\n'
              printf 'candidate_sha=%s\nworkflow_sha=%s\nworkflow_parent=%s\n' \
                "$CANDIDATE_SHA" "${GITHUB_SHA:-unknown}" "$CANDIDATE_SHA"
              printf 'target=%s\nversion=%s\nrustc_version=%s\ncargo_version=%s\n' \
                "$RUST_TARGET" "$version" "$rustc_version" "$cargo_version"
              printf 'phase=%s\n' "$phase"
              printf 'source_guard=%s\nnative_build=%s\nnative_exit=%s\n' \
                "$source_guard" "$native_build" "$native_exit"
              printf 'native_binary_count=%s\nnative_binary_names=%s\n' "$native_count" "$native_names"
              printf 'cli_identity=%s\nnotices=%s\narchive_check=%s\n' \
                "$cli_identity" "$notices" "$archive_check"
              printf 'archive_sha256=%s\narchive_bytes=%s\nnotices_sha256=%s\nlicense_sha256=%s\n' \
                "$archive_sha256" "$archive_bytes" "$notices_sha256" "$license_sha256"
              printf 'license_check=%s\nbuild_info_check=%s\n' "$license_check" "$build_info_check"
              printf 'result=%s\n' "$result"
            } > "$RECEIPT"
          }
          trap finish EXIT

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = true
          test "$(git rev-list --count HEAD)" = 3
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/lot-verify.yaml
          test -z "$(git status --porcelain)"
          git checkout --detach "$CANDIDATE_SHA" >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = e7ace9772bc8e8399bb57e5688d147dcd8ca66ac
          test "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" = 1.99.1
          rustc_version=$(rustc --version | awk '{print $2}')
          cargo_version=$(cargo --version | awk '{print $2}')
          test "$rustc_version" = 1.99.1
          test "$cargo_version" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RUST_TARGET"
          phase=metadata
          metadata=$(cargo metadata --locked --offline --no-deps --format-version 1 2>"$PRIVATE_DIR/metadata.err")
          version=$(jq -er '[.packages[] | select(.name == "agentsandbox")] | select(length == 1) | .[0].version' <<< "$metadata")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          jq -e --arg version "$version" '.version == $version' front/package.json >/dev/null
          jq -e --arg version "$version" '.version == $version and .packages[""].version == $version' front/package-lock.json >/dev/null
          native_names=$(jq -er --arg excluded "$EXCLUDED_BINARIES" '
            [.packages[] | select(.name == "agentsandbox")] | select(length == 1)
            | [.[0].targets[] | select(.kind | index("bin")) | .name] | sort
            | . - ($excluded | split(" ") | map(select(length > 0)))
            | if index("agentsandbox") != null and length == 6 and length == (unique | length) and
                all(.[]; type == "string" and test("\\A[A-Za-z0-9_.-]+\\z") and . != "." and . != "..")
              then join(" ") else error("Unexpected native binary target list") end
          ' <<< "$metadata")
          native_count=$(wc -w <<< "$native_names" | tr -d ' ')
          test "$native_count" = 6
          source_guard=PASS

          phase=package
          RELEASE_TAG="v$version"
          RELEASE_SHA="$CANDIDATE_SHA"
          RELEASE_TAG_OBJECT=not-used-no-tag-created
          AI_GUARD_BUILD_REVISION="$CANDIDATE_SHA"
          export RELEASE_TAG RELEASE_SHA RELEASE_TAG_OBJECT AI_GUARD_BUILD_REVISION
          export RUST_TARGET NATIVE_BINARIES="$native_names" CARGO_BUILD_JOBS
          export GITHUB_RUN_ID GITHUB_REPOSITORY
          export RUNNER_TEMP="$PRIVATE_DIR"
          export AI_GUARD_VERSION="$version"
          native_script="$PRIVATE_DIR/native-package.sh"
          awk '
            /^      - name: Build and package native binaries$/ { in_step=1; next }
            in_step && /^        run: \|$/ { in_run=1; next }
            in_run && /^      - name:/ { exit }
            in_run && /^          / { print substr($0, 11); next }
            in_run && /^$/ { print; next }
            in_run && !/^          / { exit }
          ' .github/workflows/release.yaml > "$native_script"
          test -s "$native_script"
          sed -i '/^test "$(git rev-parse "refs\/tags\/\$RELEASE_TAG")" = "\$RELEASE_TAG_OBJECT"$/d' "$native_script"
          if bash "$native_script" >"$PRIVATE_DIR/native-package.out" 2>&1; then
            native_build=PASS
            cli_identity=PASS
            notices=PASS
          else
            native_exit=$?
            native_build=FAIL
            exit 1
          fi
          archive="$PRIVATE_DIR/release-assets/ai-guard-$RELEASE_TAG-$RUST_TARGET.tar.gz"
          phase=archive
          test -s "$archive"
          archive_bytes=$(stat -c '%s' "$archive")
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          helper="$PRIVATE_DIR/archive-helper.sh"
          awk '
            /^          verify_archive_members\(\) \{$/ { in_fn=1 }
            in_fn { print substr($0, 11) }
            in_fn && /^          \}$/ { exit }
          ' .github/workflows/release.yaml > "$helper"
          test -s "$helper"
          source "$helper"
          name="ai-guard-$RELEASE_TAG-$RUST_TARGET"
          if verify_archive_members "$archive" "$name" "$RUST_TARGET" >"$PRIVATE_DIR/archive-check.out" 2>&1; then
            archive_check=PASS
          else
            exit 1
          fi
          tar -xOf "$archive" "$name/THIRD-PARTY-NOTICES" > "$PRIVATE_DIR/archive-notices"
          test -s "$PRIVATE_DIR/archive-notices"
          notices_sha256=$(sha256sum "$PRIVATE_DIR/archive-notices" | awk '{print $1}')
          [[ "$notices_sha256" =~ ^[0-9a-f]{64}$ ]]
          license_check=FAIL
          phase=license
          tar -xOf "$archive" "$name/LICENSE" > "$PRIVATE_DIR/archive-license"
          cmp -s LICENSE "$PRIVATE_DIR/archive-license"
          license_sha256=$(sha256sum "$PRIVATE_DIR/archive-license" | awk '{print $1}')
          [[ "$license_sha256" =~ ^[0-9a-f]{64}$ ]]
          license_check=PASS
          phase=build-info
          expected_build_info=$(printf 'tag=%s\ncommit=%s\ntarget=%s\nrun=%s\nrepository=%s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$RUST_TARGET" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY")
          actual_build_info=$(tar -xOf "$archive" "$name/BUILD-INFO")
          test "$actual_build_info" = "$expected_build_info"
          build_info_check=PASS
          archive_sha256=$(sha256sum "$archive" | awk '{print $1}')
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          phase=complete
      - name: Ensure a closed receipt exists
        if: always()
        shell: bash
        run: |
          if [[ ! -f "$RECEIPT" ]]; then
            umask 077
            {
              printf 'schema=g12-native-archive-v1\ncandidate_sha=%s\nworkflow_sha=%s\n' \
                "$CANDIDATE_SHA" "${GITHUB_SHA:-unknown}"
              printf 'target=%s\nresult=FAIL\nsource_guard=NOT_RUN\nnative_build=NOT_RUN\n' "$RUST_TARGET"
              printf 'native_exit=0\nnative_binary_count=0\nnative_binary_names=unknown\nversion=unknown\n'
              printf 'rustc_version=unknown\ncargo_version=unknown\ncli_identity=NOT_RUN\nnotices=NOT_RUN\n'
              printf 'phase=preflight\narchive_check=NOT_RUN\narchive_sha256=unknown\narchive_bytes=0\n'
              printf 'notices_sha256=unknown\nlicense_sha256=unknown\nlicense_check=NOT_RUN\nbuild_info_check=NOT_RUN\n'
            } > "$RECEIPT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g12-native-verification-receipt
          path: ${{ runner.temp }}/g12-native-receipt.txt
          if-no-files-found: error
          retention-days: 14
