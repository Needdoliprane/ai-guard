name: Owned maintenance and G11 composition

# This branch runs the two SQL compilation checks and eight exact software
# oracles. The selected tests use synthetic data and local fixtures.

on:
  push:
    branches: ['claude/v1-owned-g11-composition-check-20261122']

permissions:
  contents: read

concurrency:
  group: owned-g11-composition-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Free disk on the hosted test runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check both SQL profiles and run eight exact SQLite oracles
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_revision=735aee320c5512137f0ae8c9ddd7803638b570e7
          receipt="$RUNNER_TEMP/owned-g11-composition-check.txt"
          printf 'source_revision=%s\nworkflow_revision=%s\nrun_id=%s\nrun_attempt=%s\nrunner=%s/%s\ntest_profile=sqlite-only\n' \
            "$source_revision" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" > "$receipt"

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$(git rev-parse HEAD^)" != "$source_revision" ]] \
              || ! git diff --quiet "$source_revision" HEAD -- . ':(exclude).github/workflows/lot-verify.yaml'; then
            printf 'source_check=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          printf 'source_check=PASS\n' >> "$receipt"

          # The fixtures need short IPC paths. Raw output stays on the runner.
          scratch=$(mktemp -d /tmp/aig.XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          export AI_GUARD_TEST_D5_IPC_ROOT="$scratch"

          if ! cargo fmt --all -- --check > "$scratch/format.log" 2>&1; then
            printf 'format=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          printf 'format=PASS\n' >> "$receipt"
          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            printf 'locked_fetch=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          printf 'locked_fetch=PASS\n' >> "$receipt"

          cargo_stage() {
            local stage=$1
            shift
            if "$@" --message-format=json > "$scratch/$stage.jsonl" 2> "$scratch/$stage.stderr"; then
              printf '%s=PASS\n' "$stage" >> "$receipt"
            else
              local status=$?
              printf '%s=FAIL cargo_exit=%s\n' "$stage" "$status" >> "$receipt"
              jq -r 'select(.reason == "compiler-message" and .message.level == "error")
                | .message.code.code // empty | select(test("^E[0-9]{4}$"))' "$scratch/$stage.jsonl" \
                2>/dev/null | sort -u | sed "s/^/$stage rustc_error=/" >> "$receipt" || true
              return 1
            fi
          }

          failed=0
          cargo_stage sqlite_all_targets cargo check --locked --offline --all-targets \
            --no-default-features --keep-going || failed=1
          cargo_stage mysql_all_targets cargo check --locked --offline --all-targets \
            --no-default-features --features mysql-storage --keep-going || failed=1
          if ! cargo_stage sqlite_test_build cargo test --locked --offline --no-default-features \
              --lib --test audit_retention --test control_cli --test schema13_protocol_contract \
              --test worker_relay_api --test diagnose_cli --no-run; then
            printf 'selectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi

          build_json="$scratch/sqlite_test_build.jsonl"
          selectors=(
            'test|audit_retention|retention_and_kubernetes_effects_preserve_both_capabilities_on_reopen'
            'test|control_cli|effect_capability_cli_requires_attestation_keeps_the_format_and_runs_once'
            'test|schema13_protocol_contract|cli_schema13_and_the_served_protocol_keep_the_same_inactive_namespace'
            'test|worker_relay_api|reopened_gateway_keeps_three_worker_quotas_terminal_usage_and_directed_audit_separate'
            'test|diagnose_cli|store_names_that_the_gateway_refuses_are_refused'
            'lib|agentsandbox|api::human_sources::tests::owned_admin_reads_refuse_head_before_authentication'
            'lib|agentsandbox|broker::enforcer::recovery::recovery_v3::tests::idle_stop_admission::fresh_full3_idle_ack_requires_complete_ledger_after_joins'
            'lib|agentsandbox|runtime::kubernetes::session_driver::tests::a_bound_workspace_must_keep_the_approved_storage_class'
          )
          expected=8
          if (( ${#selectors[@]} != expected )); then
            printf 'selector_list=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          passed=0
          test_log="$scratch/selector.log"
          for entry in "${selectors[@]}"; do
            IFS='|' read -r kind target selector <<< "$entry"
            if ! executable="$(jq -ers --arg kind "$kind" --arg target "$target" '[.[] |
                select(.reason == "compiler-artifact" and .target.name == $target
                  and .target.kind == [$kind] and .profile.test == true
                  and .features == [] and .executable != null) | .executable]
                | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null)" \
                || [[ ! -f "$executable" || ! -x "$executable" ]]; then
              printf 'target=%s selector=%s result=NOT_RUN reason=test_binary_unconfirmed\n' \
                "$target" "$selector" >> "$receipt"
              continue
            fi

            digest=$(sha256sum "$executable" | cut -d ' ' -f1)
            status=0
            timeout --kill-after=5s 240s "$executable" "$selector" --exact --test-threads=1 --color=never \
              > "$test_log" 2>&1 || status=$?
            if (( status == 0 )) \
                && [[ "$(grep -Fxc 'running 1 test' "$test_log")" == 1 ]] \
                && [[ "$(grep -Fxc "test $selector ... ok" "$test_log")" == 1 ]] \
                && [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$test_log")" == 1 ]]; then
              printf 'target=%s selector=%s test_sha256=%s result=PASS confirmed=1/1 ignored=0 exit=0\n' \
                "$target" "$selector" "$digest" >> "$receipt"
              ((passed += 1))
            else
              printf 'target=%s selector=%s test_sha256=%s result=FAIL confirmed=0/1 exit=%s\n' \
                "$target" "$selector" "$digest" "$status" >> "$receipt"
            fi
          done
          printf 'confirmed=%s/%s\n' "$passed" "$expected" >> "$receipt"
          (( failed == 0 && passed == expected ))

      - name: Show the sanitized receipt
        if: always()
        shell: bash
        run: |
          receipt="$RUNNER_TEMP/owned-g11-composition-check.txt"
          if [[ -f "$receipt" ]]; then
            {
              printf '### Owned maintenance and G11 composition\n\n'
              printf '%s\n' '~~~text'
              cat "$receipt"
              printf '%s\n' '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the sanitized receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-g11-composition-check-${{ github.sha }}
          path: ${{ runner.temp }}/owned-g11-composition-check.txt
          if-no-files-found: ignore
          retention-days: 14
