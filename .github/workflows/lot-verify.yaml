name: G07 worker terminal verification

# Verifies V1 development branches on a hosted Linux x86_64 runner so that the
# development Mac keeps its memory for engine, browser and macOS recipes.
# It complements ci.yaml (dev/main) and never creates tags, releases or
# artifacts outside this run. Engine (Docker/Podman/Kubernetes) and provider
# recipes stay out of this workflow: ignored tests are not run and are never
# counted as passes.

on:
  push:
    branches: ['claude/v1-**']

permissions:
  contents: read

concurrency:
  group: lot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk for the test targets
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Fetch dependencies with the pinned Rust toolchain
        run: |
          rustc --version
          cargo fetch --locked
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all targets with MySQL enabled
        run: cargo check --locked --offline --all-targets --features mysql-storage --keep-going
      - name: Check all targets without default features (SQLite only)
        run: cargo check --locked --offline --all-targets --no-default-features --keep-going
      - name: Provider harness regressions
        run: |
          python3 -B tests/e2e/interactive_driver.py --self-test
          python3 -B tests/e2e/test_run_provider_preflight.py ProviderPreflightTests ProviderBrowserStageTests
          python3 -B tests/e2e/test_run_provider_broker.py BrokerRecipeTests
      - name: Full3 synthetic worker terminal
        id: g07_full3
        # The fixture starts its broker with env_clear, including RUST_MIN_STACK.
        shell: bash
        run: |
          set -o pipefail
          export TMPDIR="$(mktemp -d /tmp/aig.XXXXXX)"
          cargo test --locked --offline --no-default-features --test broker_import_result_gate \
            broker_import_result_pending_then_acknowledged -- --exact --test-threads=1 --nocapture \
            2>&1 | tee cargo-test.log
          grep -Fq 'test result: ok. 1 passed; 0 failed;' cargo-test.log
      - name: Broker journal publication and ACK regressions
        if: ${{ !cancelled() && (steps.g07_full3.outcome == 'success' || steps.g07_full3.outcome == 'failure') }}
        shell: bash
        run: |
          set -o pipefail
          export TMPDIR="$(mktemp -d /tmp/aig.XXXXXX)"
          cargo test --locked --offline --no-default-features --lib -- --exact --test-threads=1 \
            runner::broker::executor::helpers::prospective_live_tests::fresh_claim_ack_with_a_lost_writer_reply_continues_once_from_the_exact_durable_head \
            runner::broker::executor::helpers::prospective_live_tests::unpublished_claim_ack_with_a_writer_error_fails_closed_after_the_reread \
            runner::broker::executor::journal::tests::committed_rpc_replay_is_not_fresh_and_binding_loss_blocks_http \
            2>&1 | tee -a cargo-test.log journal-test.log
          grep -Fq 'test result: ok. 3 passed; 0 failed;' journal-test.log
      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          if [ -f cargo-test.log ]; then
            grep -E '^test result:|^     Running ' cargo-test.log > cargo-test-summary.txt || true
            grep -E '\.\.\. FAILED$' cargo-test.log | sed 's/^test //; s/ \.\.\. FAILED$//' > cargo-test-failed.txt || true
            {
              echo "### G07 targeted test results"
              echo
              echo "Failed tests: $(wc -l < cargo-test-failed.txt)"
              echo
              echo '```'
              head -n 100 cargo-test-failed.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lot-verify-rust-${{ github.sha }}
          path: |
            cargo-test.log
            journal-test.log
            cargo-test-summary.txt
            cargo-test-failed.txt
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
