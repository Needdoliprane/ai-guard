name: G07 Claude activity composition check

on:
  push:
    branches: ['claude/v1-g07-claude-composition-check-20261122']

permissions:
  contents: read

concurrency:
  group: g07-claude-composition-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: SQLite preflight, compile and targeted oracles
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          unset RUST_MIN_STACK
          scratch="$(mktemp -d "$RUNNER_TEMP/g07-sqlite.XXXXXX")"
          receipt="$RUNNER_TEMP/g07-sqlite-summary.txt"
          printf 'source_commit=6be3ca5335870710c2288b161714fb75e21256f4\ncomposed_parent=e48b67f4bb51265c45e9a95181d8f0786955a285\nprofile=sqlite-only\n' > "$receipt"
          failed=0
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" \
              || "$(git rev-parse HEAD^)" != 6be3ca5335870710c2288b161714fb75e21256f4 \
              || "$(git rev-parse HEAD~2)" != e48b67f4bb51265c45e9a95181d8f0786955a285 ]] \
              || ! git diff --quiet 6be3ca5335870710c2288b161714fb75e21256f4 HEAD -- . ':(exclude).github/workflows/lot-verify.yaml'; then
            printf 'source_check=FAIL\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'source_check=PASS\n' >> "$receipt"
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          printf 'preflight_free_kb=%s\n' "$free_kb" >> "$receipt"
          if [[ ! "$free_kb" =~ ^[0-9]+$ ]] || (( free_kb < 8388608 )); then
            printf 'disk_gate=FAIL threshold_kb=8388608\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'disk_gate=PASS\n' >> "$receipt"
          rustc --version | sed -nE 's/^rustc ([0-9]+\.[0-9]+\.[0-9]+).*/toolchain=\1/p' >> "$receipt"
          if ! cargo fmt --all -- --check > "$scratch/fmt.log" 2>&1; then
            printf 'format=FAIL\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'format=PASS\n' >> "$receipt"
          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            printf 'locked_fetch=FAIL\nchecks=NOT_RUN\nselectors=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'locked_fetch=PASS\n' >> "$receipt"
          emit_diagnostics() {
            local profile="$1" json="$2" out="$3"
            jq -r --arg profile "$profile" --arg workspace "$GITHUB_WORKSPACE" '
              select(.reason == "compiler-message" and .message.level == "error")
              | .target.name as $target | .message.code.code as $code
              | .message.spans[]? | select(.is_primary == true)
              | .file_name as $raw_file
              | (if ($raw_file | startswith($workspace + "/")) then $raw_file[(($workspace | length) + 1):] else $raw_file end) as $file
              | select(($target | type) == "string" and ($target | test("^[A-Za-z0-9_-]+$")))
              | select(($code | type) == "string" and ($code | test("^E[0-9]{4}$")))
              | select(($file | type) == "string" and ($file | test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.rs$")))
              | select((.line_start | type) == "number" and (.line_start | floor) == .line_start and .line_start > 0)
              | select((.column_start | type) == "number" and (.column_start | floor) == .column_start and .column_start > 0)
              | "error profile=\($profile) target=\($target) code=\($code) location=\($file):\(.line_start):\(.column_start)"
            ' "$json" > "$out"
          }
          cargo_stage() {
            local profile="$1"; shift
            local json="$scratch/$profile-check.jsonl" diagnostics="$scratch/$profile-check.diagnostics" rc=0
            "$@" --message-format=json > "$json" 2> "$scratch/$profile-check.stderr" || rc=$?
            printf '%s_check=%s cargo_exit=%s\n' "$profile" "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$receipt"
            if ! emit_diagnostics "$profile" "$json" "$diagnostics"; then
              printf '%s_diagnostics=unavailable\n' "$profile" >> "$receipt"
              failed=1
            elif [[ -s "$diagnostics" ]]; then
              sort -u "$diagnostics" >> "$receipt"
              printf '%s_sanitized_error_spans=%s\n' "$profile" "$(wc -l < "$diagnostics" | tr -d ' ')" >> "$receipt"
            else
              printf '%s_sanitized_error_spans=0\n' "$profile" >> "$receipt"
            fi
            if (( rc != 0 )); then failed=1; fi
          }
          cargo_stage sqlite cargo check --locked --offline --no-default-features --all-targets --keep-going
          post_check_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          printf 'post_check_free_kb=%s\n' "$post_check_kb" >> "$receipt"
          targets=(--lib --test provider_activity_adapters --test provider_activity_live)
          include_r2=0
          if [[ "$post_check_kb" =~ ^[0-9]+$ ]] && (( post_check_kb >= 8388608 )); then
            targets+=(--test supervision_api)
            include_r2=1
            printf 'r2_test_target=supervision_api compile=ADMITTED\n' >> "$receipt"
          else
            printf 'r2_test_target=supervision_api compile=NOT_RUN reason=disk_budget\n' >> "$receipt"
          fi
          build_json="$scratch/sqlite-tests.jsonl"
          build_rc=0
          cargo test --locked --offline --no-default-features "${targets[@]}" --no-run \
            --message-format=json > "$build_json" 2> "$scratch/sqlite-tests.stderr" || build_rc=$?
          printf 'sqlite_test_build=%s cargo_exit=%s\n' "$([[ "$build_rc" == 0 ]] && echo PASS || echo FAIL)" "$build_rc" >> "$receipt"
          if ! emit_diagnostics sqlite_test_build "$build_json" "$scratch/sqlite-tests.diagnostics"; then
            printf 'sqlite_test_build_diagnostics=unavailable\n' >> "$receipt"
            failed=1
          elif [[ -s "$scratch/sqlite-tests.diagnostics" ]]; then
            sort -u "$scratch/sqlite-tests.diagnostics" >> "$receipt"
          fi
          (( build_rc == 0 )) || failed=1
          libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          adapters="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "provider_activity_adapters" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          live="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "provider_activity_live" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          r2=""
          if (( include_r2 == 1 )); then
            r2="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "supervision_api" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          fi
          panic_location() {
            python3 - "$1" <<'PY'
          import os, re, sys
          try:
              text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          except OSError:
              print("unavailable")
              raise SystemExit
          workspace = os.environ.get("GITHUB_WORKSPACE", "")
          if workspace:
              text = text.replace(workspace.rstrip("/") + "/", "")
          match = re.search(r"(?<![A-Za-z0-9_/])((?:src|tests)/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\.rs):([1-9][0-9]{0,5}):([1-9][0-9]{0,5})", text)
          print(f"{match.group(1)}:{match.group(2)}:{match.group(3)}" if match else "unavailable")
          PY
          }
          run_exact() {
            local label="$1" exe="$2" selector="$3" log="$scratch/$1.log" rc=0
            if [[ ! -x "$exe" ]]; then
              printf 'selector=%s result=NOT_RUN reason=artifact_missing\n' "$selector" >> "$receipt"
              failed=1
              return
            fi
            timeout --kill-after=5s 240s "$exe" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1 || rc=$?
            local selected ignored
            selected="$(grep -Fxc 'running 1 test' "$log" || true)"
            ignored="$(grep -Eo '[0-9]+ ignored' "$log" | tail -n 1 | cut -d ' ' -f1 || true)"
            ignored="${ignored:-unknown}"
            if (( rc == 0 )) && [[ "$selected" == 1 && "$ignored" == 0 ]] \
                && grep -Fqx "test $selector ... ok" "$log" \
                && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;$' "$log"; then
              printf 'selector=%s result=PASS selected=1 ignored=0 exit=0\n' "$selector" >> "$receipt"
            else
              printf 'selector=%s result=FAIL selected_count=%s ignored_count=%s exit=%s panic_location=%s\n' \
                "$selector" "${selected:-0}" "$ignored" "$rc" "$(panic_location "$log")" >> "$receipt"
              failed=1
            fi
          }
          if (( build_rc == 0 )) && [[ -n "$libtest" && -x "$libtest" && -n "$adapters" && -x "$adapters" && -n "$live" && -x "$live" ]]; then
            printf 'libtest_artifact=unique sha256=%s\nadapters_artifact=unique sha256=%s\nlive_artifact=unique sha256=%s\n' \
              "$(sha256sum "$libtest" | cut -d ' ' -f1)" "$(sha256sum "$adapters" | cut -d ' ' -f1)" "$(sha256sum "$live" | cut -d ' ' -f1)" >> "$receipt"
            run_exact activity_stdout_end_vs_deadline "$libtest" 'provider_activity::collector::tests::stdout_loss_reports_the_first_abandoned_chunk_without_inventing_a_deadline'
            run_exact full_reconciliation_missing_spool "$libtest" 'broker::service::server::full_owner_tests::full_reconciliation_acknowledges_pending_result_with_unavailable_activity_spool'
            run_exact session_close_coverage_replay "$libtest" 'provider_activity::session::close_tests::replay_records_one_unknown_coverage_after_recovering_the_retained_chain'
            run_exact session_interrupted_coverage_open "$libtest" 'provider_activity::session::close_tests::an_interrupted_session_leaves_coverage_open_for_terminal_replay'
            run_exact adapter_claude_stream "$adapters" 'claude_stream_maps_messages_reasoning_tools_and_delegation'
            run_exact adapter_claude_hooks "$adapters" 'claude_hooks_map_tools_prompts_and_subagents_without_inventing_a_parent'
            run_exact adapter_secret_redaction "$adapters" 'hook_payload_secrets_are_masked_before_projection'
            run_exact adapter_recorded_offline "$adapters" 'recorded_offline_client_output_is_fully_recognized'
            run_exact forwarder_retry_reopen "$live" 'the_forwarder_retries_without_loss_and_resumes_after_reopen'
            run_exact hook_store_route "$live" 'hook_activity_reaches_the_gateway_while_the_session_is_still_running'
            run_exact hook_ack_durable_spool "$live" 'the_hook_pump_acknowledges_only_durable_records_and_reports_anomalies'
            run_exact batch_route_rollback "$live" 'the_batch_route_is_atomic_idempotent_and_runner_only'
            if (( include_r2 == 1 )) && [[ -n "$r2" && -x "$r2" ]]; then
              printf 'r2_artifact=unique sha256=%s\n' "$(sha256sum "$r2" | cut -d ' ' -f1)" >> "$receipt"
              run_exact r2_capacity_revocation "$r2" 'ordinary_exhaustion_keeps_control_capacity_and_control_exhaustion_keeps_revocation'
            elif (( include_r2 == 1 )); then
              printf 'r2_selector=NOT_RUN reason=artifact_not_unique_or_build_failed\n' >> "$receipt"
              failed=1
            fi
          else
            printf 'selectors=NOT_RUN reason=base_test_artifact_not_unique_or_build_failed\n' >> "$receipt"
            failed=1
          fi
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Upload sanitized SQLite receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-claude-composition-sqlite-${{ github.sha }}
          path: ${{ runner.temp }}/g07-sqlite-summary.txt
          if-no-files-found: ignore
          retention-days: 14

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: MySQL profile compile check
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/g07-mysql.XXXXXX")"
          receipt="$RUNNER_TEMP/g07-mysql-summary.txt"
          printf 'source_commit=6be3ca5335870710c2288b161714fb75e21256f4\nprofile=mysql-storage\n' > "$receipt"
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" \
              || "$(git rev-parse HEAD^)" != 6be3ca5335870710c2288b161714fb75e21256f4 \
              || "$(git rev-parse HEAD~2)" != e48b67f4bb51265c45e9a95181d8f0786955a285 ]] \
              || ! git diff --quiet 6be3ca5335870710c2288b161714fb75e21256f4 HEAD -- . ':(exclude).github/workflows/lot-verify.yaml'; then
            printf 'source_check=FAIL\nmysql_check=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'source_check=PASS\n' >> "$receipt"
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          printf 'preflight_free_kb=%s\n' "$free_kb" >> "$receipt"
          if [[ ! "$free_kb" =~ ^[0-9]+$ ]] || (( free_kb < 5242880 )); then
            printf 'disk_gate=FAIL threshold_kb=5242880\nmysql_check=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'disk_gate=PASS\n' >> "$receipt"
          rustc --version | sed -nE 's/^rustc ([0-9]+\.[0-9]+\.[0-9]+).*/toolchain=\1/p' >> "$receipt"
          if ! cargo fmt --all -- --check > "$scratch/fmt.log" 2>&1; then
            printf 'format=FAIL\nmysql_check=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'format=PASS\n' >> "$receipt"
          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            printf 'locked_fetch=FAIL\nmysql_check=NOT_RUN\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'locked_fetch=PASS\n' >> "$receipt"
          json="$scratch/mysql-check.jsonl"
          rc=0
          cargo check --locked --offline --no-default-features --features mysql-storage --all-targets --keep-going \
            --message-format=json > "$json" 2> "$scratch/mysql-check.stderr" || rc=$?
          printf 'mysql_check=%s cargo_exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$receipt"
          if ! jq -r --arg workspace "$GITHUB_WORKSPACE" '
            select(.reason == "compiler-message" and .message.level == "error")
            | .target.name as $target | .message.code.code as $code
            | .message.spans[]? | select(.is_primary == true)
            | .file_name as $raw_file
            | (if ($raw_file | startswith($workspace + "/")) then $raw_file[(($workspace | length) + 1):] else $raw_file end) as $file
            | select(($target | type) == "string" and ($target | test("^[A-Za-z0-9_-]+$")))
            | select(($code | type) == "string" and ($code | test("^E[0-9]{4}$")))
            | select(($file | type) == "string" and ($file | test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.rs$")))
            | select((.line_start | type) == "number" and (.line_start | floor) == .line_start and .line_start > 0)
            | select((.column_start | type) == "number" and (.column_start | floor) == .column_start and .column_start > 0)
            | "error profile=mysql target=\($target) code=\($code) location=\($file):\(.line_start):\(.column_start)"
          ' "$json" > "$scratch/mysql-check.diagnostics"; then
            printf 'mysql_diagnostics=unavailable\n' >> "$receipt"
            rc=1
          elif [[ -s "$scratch/mysql-check.diagnostics" ]]; then
            sort -u "$scratch/mysql-check.diagnostics" >> "$receipt"
            printf 'mysql_sanitized_error_spans=%s\n' "$(wc -l < "$scratch/mysql-check.diagnostics" | tr -d ' ')" >> "$receipt"
          else
            printf 'mysql_sanitized_error_spans=0\n' >> "$receipt"
          fi
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          exit "$([[ "$rc" == 0 ]] && echo 0 || echo 1)"
      - name: Upload sanitized MySQL receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-claude-composition-mysql-${{ github.sha }}
          path: ${{ runner.temp }}/g07-mysql-summary.txt
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 6be3ca5335870710c2288b161714fb75e21256f4
          test "$(git rev-parse HEAD~2)" = e48b67f4bb51265c45e9a95181d8f0786955a285
          git -C "$GITHUB_WORKSPACE" diff --quiet 6be3ca5335870710c2288b161714fb75e21256f4 HEAD -- . ':(exclude).github/workflows/lot-verify.yaml'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Frontend build and unit tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g07-frontend-summary.txt"
          printf 'source_commit=6be3ca5335870710c2288b161714fb75e21256f4\nnode=24.22.2\n' > "$receipt"
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/g07-npm-ci.log" 2>&1; then
            printf 'npm_ci=PASS\n' >> "$receipt"
          else
            printf 'npm_ci=FAIL\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if npm run build > "$RUNNER_TEMP/g07-npm-build.log" 2>&1; then
            printf 'npm_build=PASS\n' >> "$receipt"
          else
            printf 'npm_build=FAIL\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if npm test > "$RUNNER_TEMP/g07-npm-test.log" 2>&1; then
            printf 'npm_unit_tests=PASS\n' >> "$receipt"
          else
            printf 'npm_unit_tests=FAIL\n' >> "$receipt"
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized frontend receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-claude-composition-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/g07-frontend-summary.txt
          if-no-files-found: ignore
          retention-days: 14
