name: G10 Docker live three-worker dashboard

# One hosted Docker journey proves the A1/A2 and B1 live dashboard during the
# real three-worker overlap. Browser use is sandboxed and loopback-only.
on:
  push:
    branches:
      - claude/v1-g10-docker-live-dashboard-check-20261123

permissions:
  contents: read

concurrency:
  group: g10-docker-live-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-live-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      SOURCE_SHA: c5a487f77264e2e89284d9c50f5e3a9f13c70873
      SOURCE_TREE: 39d60ecdc35224112d3a9d823365712994547c12
      SOURCE_PARENT: 66cd42574de11f7a33c617bc77957215820858e5
      EXPECTED_BRANCH: claude/v1-g10-docker-live-dashboard-check-20261123
      SELECTOR: real_cli_runs_three_independent_workers_across_two_tenants
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
      LC_ALL: C
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Initialize closed dashboard receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          cat > "$receipt" <<'EOF'
          source_sha=c5a487f77264e2e89284d9c50f5e3a9f13c70873
          source_tree=39d60ecdc35224112d3a9d823365712994547c12
          source_parent=66cd42574de11f7a33c617bc77957215820858e5
          selector=real_cli_runs_three_independent_workers_across_two_tenants
          workflow_sha=NOT_RUN
          source_guard=NOT_RUN
          runner_user=NOT_RUN
          rootful_preflight=NOT_RUN
          docker_endpoint=unix:///var/run/docker.sock
          rustc=NOT_RUN
          cargo=NOT_RUN
          cargo_fetch=NOT_RUN
          browser_node=NOT_RUN
          playwright=NOT_RUN
          chromium=NOT_RUN
          chromium_version=NOT_RUN
          chromium_sandbox=REQUIRED
          frontend_install=NOT_RUN
          frontend_build=NOT_RUN
          worker_image_build=NOT_RUN
          worker_image_uid=NOT_RUN
          worker_image_workdir=NOT_RUN
          provider_versions=EMPTY
          worker_image_id_sha256=unknown
          runner_containers_before=unknown
          runner_volumes_before=unknown
          test_containers_before=unknown
          test_volumes_before=unknown
          test_containers_after=unknown
          test_volumes_after=unknown
          new_containers=unknown
          new_volumes=unknown
          test_running_one=unknown
          test_selected=unknown
          test_passed=unknown
          test_failed=unknown
          test_ignored=unknown
          test_exit=NOT_RUN
          test_verdict=NOT_RUN
          browser_verdict=NOT_ATTESTED
          browser_rows_a=NOT_ATTESTED
          browser_rows_b=NOT_ATTESTED
          browser_native_matches=NOT_ATTESTED
          browser_logout=NOT_ATTESTED
          browser_closed=NOT_ATTESTED
          dashboard_status=NOT_ATTESTED
          worker_cleanup_by_test=NOT_ATTESTED
          container_inventory_status=NOT_RUN
          volume_inventory_status=NOT_RUN
          private_fixture_cleanup=NOT_STARTED
          workflow_engine_cleanup=NOT_PERFORMED
          image_cleanup=NOT_PERFORMED
          runner_disposal=EXPECTED
          last_phase=initialized
          result=NOT_RUN
          scope=one exact ignored Docker test; three real workers; live A1/A2 and B1 dashboard; Chromium sandbox required; loopback only; no provider
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact candidate, selector and sandbox contract
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field workflow_sha "$GITHUB_SHA"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
                "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
                "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
                "$(git cat-file commit "$SOURCE_SHA" 2>/dev/null | awk '$1 == "parent" { parent[++n] = $2 } END { if (n == 1) print parent[1] }')" == "$SOURCE_PARENT" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
                -z "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" &&
                "$(grep -Fxc 'async fn real_cli_runs_three_independent_workers_across_two_tenants() -> Result<()> {' tests/runtime_user_journey.rs || true)" == 1 &&
                "$(grep -Fxc '#[ignore = "requires a real approved Docker or Podman account, explicit local Unix engine, and an immutable QA image with /bin/sleep and /bin/tar"]' tests/runtime_user_journey.rs || true)" == 1 &&
                "$(grep -Fxc '    let live_browser = match std::env::var_os("AGENTSANDBOX_TEST_BROWSER_LIVE") {' tests/runtime_user_journey.rs || true)" == 1 &&
                "$(grep -Fxc '    browser = await chromium.launch({ headless: true, chromiumSandbox: true, timeout: 15_000,' front/tests/browser_runtime_journey.mjs || true)" == 1 &&
                "$(grep -Fxc '      args: ["--no-sandbox"]' front/tests/browser_runtime_journey.mjs || true)" == 0 &&
                "$(grep -Fxc '            && created.network == NetworkV1::None' tests/runtime_user_journey.rs || true)" == 1 &&
                "$(grep -Fxc 'USER 1000:1000' images/worker.Dockerfile || true)" == 1 ]]; then
            set_field source_guard PASS
            set_field last_phase source_verified
          else
            set_field source_guard FAIL
            set_field last_phase source_guard_failed
            echo 'G10 live-dashboard source/ref guard failed; details omitted.' >&2
            exit 1
          fi
          uid="$(id -u)"
          if [[ "$uid" =~ ^[0-9]+$ ]] && (( uid != 0 )); then
            set_field runner_user NON_ROOT
            set_field last_phase non_root_runner_verified
          else
            set_field runner_user FAIL
            set_field last_phase root_browser_user_rejected
            echo 'Chromium sandbox requires a non-root runner user.' >&2
            exit 1
          fi

      - name: Prepare private job directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          private="$RUNNER_TEMP/g10-live-dashboard"
          if [[ -e "$private" || -L "$private" ]]; then
            set_field last_phase private_path_preexisting
            set_field result FAIL
            exit 1
          fi
          mkdir -m 700 "$private" "$private/tmp" "$private/cargo-target" "$private/playwright" "$private/playwright-browsers"
          printf 'G10_PRIVATE=%s\nTMPDIR=%s/tmp\nCARGO_TARGET_DIR=%s/cargo-target\nPLAYWRIGHT_BROWSERS_PATH=%s/playwright-browsers\n' \
            "$private" "$private" "$private" "$private" >> "$GITHUB_ENV"
          set_field last_phase private_fixture_prepared

      - name: Verify hosted local rootful Docker and read-only inventory
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$G10_PRIVATE"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase docker_rootful_preflight
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' default 2>/dev/null || true)"
          security="$(docker info --format '{{json .SecurityOptions}}' 2>/dev/null || true)"
          platform="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}' 2>/dev/null || true)"
          if [[ -S /var/run/docker.sock && "$endpoint" == unix:///var/run/docker.sock && "$platform" == linux/amd64 ]] &&
             jq -e 'type == "array" and all(.[]; (ascii_downcase | contains("rootless")) | not)' <<<"$security" >/dev/null; then
            docker container ls -aq --no-trunc 2>"$private/preflight.stderr" | LC_ALL=C sort -u > "$private/runner-containers.before" || {
              set_field rootful_preflight FAIL; set_field last_phase rootful_inventory_failed; exit 1;
            }
            docker volume ls -q 2>>"$private/preflight.stderr" | LC_ALL=C sort -u > "$private/runner-volumes.before" || {
              set_field rootful_preflight FAIL; set_field last_phase rootful_inventory_failed; exit 1;
            }
            set_field runner_containers_before "$(wc -l < "$private/runner-containers.before" | tr -d ' ')"
            set_field runner_volumes_before "$(wc -l < "$private/runner-volumes.before" | tr -d ' ')"
            set_field rootful_preflight PASS
            set_field last_phase docker_baseline_recorded
          else
            set_field rootful_preflight FAIL
            set_field last_phase docker_rootful_check_failed
            echo 'G10 Docker preflight failed; details omitted.' >&2
            exit 1
          fi

      - name: Set up Node and build the exact source frontend
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Install frontend and pinned browser driver
        shell: bash
        working-directory: front
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$G10_PRIVATE"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          node_version="$(node --version 2>/dev/null || true)"
          if [[ "$node_version" == v24.22.2 ]]; then set_field browser_node 24.22.2; else set_field browser_node MISMATCH; set_field last_phase node_version_mismatch; exit 1; fi
          set_field last_phase frontend_dependencies
          if npm ci --no-audit --no-fund > "$private/npm-ci.log" 2>&1; then
            set_field frontend_install PASS
          else
            set_field frontend_install FAIL; set_field last_phase frontend_install_failed; exit 1
          fi
          if npm run build > "$private/frontend-build.log" 2>&1 && [[ -s dist/index.html ]]; then
            set_field frontend_build PASS
          else
            set_field frontend_build FAIL; set_field last_phase frontend_build_failed; exit 1
          fi
          set_field last_phase playwright_install
          if (cd "$private/playwright" && npm init -y > "$private/playwright-init.log" 2>&1 &&
              npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 > "$private/playwright-install.log" 2>&1); then
            version="$(node -p "require('$private/playwright/node_modules/playwright/package.json').version" 2>/dev/null || true)"
            if [[ "$version" == 1.56.1 ]]; then set_field playwright 1.56.1; else set_field playwright MISMATCH; set_field last_phase playwright_version_mismatch; exit 1; fi
          else
            set_field playwright FAIL; set_field last_phase playwright_install_failed; exit 1
          fi
          if PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" "$private/playwright/node_modules/.bin/playwright" install --with-deps chromium > "$private/chromium-install.log" 2>&1; then
            mapfile -t browsers < <(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) -perm -u+x -print)
            version_line=""
            if (( ${#browsers[@]} == 1 )); then version_line="$("${browsers[0]}" --version 2>/dev/null || true)"; fi
            if [[ "$version_line" =~ ^(Chromium|Google\ Chrome|Chrome\ for\ Testing)[[:space:]]([0-9]+(\.[0-9]+){2,3})$ ]]; then
              set_field chromium PLAYWRIGHT_PINNED
              set_field chromium_version "${BASH_REMATCH[2]}"
              set_field last_phase chromium_installed
              printf 'AGENTSANDBOX_TEST_BROWSER_DIST=%s/dist\nAGENTSANDBOX_TEST_BROWSER_NODE=%s\nCODEX_PRIMARY_RUNTIME_NODE_MODULES=%s/playwright/node_modules\nPLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\nAGENTSANDBOX_TEST_BROWSER_LIVE=1\n' \
                "$GITHUB_WORKSPACE/front" "$(command -v node)" "$private" "${browsers[0]}" >> "$GITHUB_ENV"
            else
              set_field chromium FAIL; set_field chromium_version UNKNOWN; set_field last_phase chromium_executable_or_version_invalid; exit 1
            fi
          else
            set_field chromium FAIL; set_field last_phase chromium_install_failed; exit 1
          fi

      - name: Build immutable UID 1000 worker image without provider clients
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$G10_PRIVATE"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          tag="ai-guard-g10-dashboard-worker:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field last_phase worker_image_build
          if docker image inspect "$tag" >/dev/null 2>&1; then
            set_field worker_image_build PREEXISTING_TAG; set_field last_phase worker_tag_collision; exit 1
          fi
          if docker build --file images/worker.Dockerfile \
              --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= --build-arg CLAUDE_ACTIVITY_PROFILE= \
              --tag "$tag" . > "$private/worker-build.log" 2>&1; then
            worker_id="$(docker image inspect --format '{{.Id}}' "$tag" 2>/dev/null || true)"
            worker_user="$(docker image inspect --format '{{.Config.User}}' "$tag" 2>/dev/null || true)"
            worker_workdir="$(docker image inspect --format '{{.Config.WorkingDir}}' "$tag" 2>/dev/null || true)"
            labels="$(docker image inspect --format '{{json .Config.Labels}}' "$tag" 2>/dev/null || true)"
            if [[ "$worker_id" =~ ^sha256:[0-9a-f]{64}$ && "$worker_user" == 1000:1000 && "$worker_workdir" == /workspace ]] &&
               jq -e 'type == "object" and .["ai-guard.provider.codex.requested-version"] == "" and .["ai-guard.provider.claude-code.requested-version"] == ""' <<<"$labels" >/dev/null; then
              printf '%s\n' "$worker_id" > "$private/image.id"
              chmod 600 "$private/image.id"
              printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_ALLOW_ROOTFUL=1\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=unix:///var/run/docker.sock\nAGENTSANDBOX_TEST_IMAGE=%s\n' "$worker_id" >> "$GITHUB_ENV"
              set_field worker_image_build PASS
              set_field worker_image_uid PASS_1000_1000
              set_field worker_image_workdir PASS_WORKSPACE
              set_field worker_image_id_sha256 "${worker_id#sha256:}"
              set_field last_phase worker_image_verified
            else
              set_field worker_image_build VERIFY_FAILED; set_field worker_image_uid FAIL; set_field last_phase worker_image_verification_failed; exit 1
            fi
          else
            set_field worker_image_build FAIL; set_field last_phase worker_image_build_failed; exit 1
          fi

      - name: Record test-owned engine inventory baseline
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$G10_PRIVATE"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          docker container ls -aq --no-trunc 2>"$private/baseline.stderr" | LC_ALL=C sort -u > "$private/test-containers.before" || { set_field last_phase test_baseline_failed; exit 1; }
          docker volume ls -q 2>>"$private/baseline.stderr" | LC_ALL=C sort -u > "$private/test-volumes.before" || { set_field last_phase test_baseline_failed; exit 1; }
          set_field test_containers_before "$(wc -l < "$private/test-containers.before" | tr -d ' ')"
          set_field test_volumes_before "$(wc -l < "$private/test-volumes.before" | tr -d ' ')"
          set_field last_phase test_inventory_baseline_recorded

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$G10_PRIVATE"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          rustc_line="$(rustc --version 2>/dev/null || true)"
          cargo_line="$(cargo --version 2>/dev/null || true)"
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then set_field rustc 1.99.1; else set_field rustc MISMATCH; set_field last_phase rustc_mismatch; exit 1; fi
          if [[ "$cargo_line" =~ ^cargo\ 1\.99\.1($|[[:space:]]) ]]; then set_field cargo 1.99.1; else set_field cargo MISMATCH; set_field last_phase cargo_mismatch; exit 1; fi
          set_field last_phase dependency_fetch
          if cargo fetch --locked > "$private/cargo-fetch.log" 2>&1; then set_field cargo_fetch PASS; set_field last_phase dependencies_fetched; else set_field cargo_fetch FAIL; set_field last_phase dependency_fetch_failed; exit 1; fi

      - name: Compile one exact runtime journey libtest
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$G10_PRIVATE"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rust_compile
          if ! cargo test --locked --offline --no-default-features --test runtime_user_journey --no-run --message-format=json > "$private/build.jsonl" 2> "$private/build.stderr"; then
            set_field last_phase rust_compile_failed
            echo 'Exact runtime journey compilation failed; compiler output withheld.' >&2
            exit 1
          fi
          if ! jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "runtime_user_journey" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$private/build.jsonl" > "$private/libtest.path"; then
            set_field last_phase libtest_artifact_ambiguous; exit 1
          fi
          libtest="$(cat "$private/libtest.path")"
          if [[ ! -x "$libtest" ]]; then set_field last_phase libtest_not_executable; exit 1; fi
          set_field rust_libtest_sha256 "$(sha256sum "$libtest" | awk '{print $1}')"
          set_field last_phase rust_compiled

      - name: Run the exact ignored live-dashboard journey once
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$G10_PRIVATE"
          selector="$SELECTOR"
          libtest="$(cat "$private/libtest.path")"
          log="$private/live-dashboard-test.log"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase exact_live_dashboard_test
          test_rc=0
          timeout --signal=TERM --kill-after=15s 45m "$libtest" "$selector" --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1 || test_rc=$?
          set_field test_exit "$test_rc"
          running_count="$(grep -Fxc 'running 1 test' "$log" || true)"
          pass_count="$(grep -Fxc "test $selector ... ok" "$log" || true)"
          fail_count="$(grep -Fxc "test $selector ... FAILED" "$log" || true)"
          selected=0
          [[ "$running_count" == 1 && "$((pass_count + fail_count))" == 1 ]] && selected=1 || true
          set_field test_running_one "$([[ "$running_count" == 1 ]] && echo PASS || echo FAIL)"
          set_field test_selected "$selected"
          summary="$(grep -E '^test result: ' "$log" | tail -n 1 || true)"
          passed=unknown; failed=unknown; ignored=unknown; summary_state=UNKNOWN
          if [[ "$summary" =~ ^test\ result:\ (ok|FAILED)\.\ ([0-9]+)\ passed\;\ ([0-9]+)\ failed\;\ ([0-9]+)\ ignored\;\ [0-9]+\ measured\;\ [0-9]+\ filtered\ out\;\ finished\ in\ [0-9]+(\.[0-9]+)?s$ ]]; then
            summary_state="${BASH_REMATCH[1]}"; passed="${BASH_REMATCH[2]}"; failed="${BASH_REMATCH[3]}"; ignored="${BASH_REMATCH[4]}"
          fi
          set_field test_passed "$passed"; set_field test_failed "$failed"; set_field test_ignored "$ignored"
          browser_matches=0
          jq -Rr 'fromjson? | select(type == "object" and .scope == "three_parallel_audited_workers_with_normal_completion" and .status == "PASS" and (.browser | type == "object")) | @json' "$log" > "$private/browser-report.jsonl" || true
          browser_matches="$(wc -l < "$private/browser-report.jsonl" | tr -d ' ')"
          browser_ok=0
          if [[ "$browser_matches" == 1 ]] && jq -e '(.browser.status == "PASS") and (.browser.mode == "overlap_viewer") and (.browser.runtime_kind == "docker") and (.browser.rows == [2,1]) and ((.browser.views | length) == 2) and ((.browser.inspected_after_dom | length) == 3) and (.browser.logged_out == 2)' "$private/browser-report.jsonl" >/dev/null; then
            browser_ok=1
            set_field browser_verdict PASS
            set_field browser_rows_a PASS_2
            set_field browser_rows_b PASS_1
            set_field browser_native_matches PASS_3
            set_field browser_logout PASS_2
            set_field browser_closed PASS
            set_field dashboard_status PASS
          fi
          test_verdict=INCONCLUSIVE
          if [[ "$test_rc" == 0 && "$selected" == 1 && "$running_count" == 1 && "$pass_count" == 1 && "$summary_state" == ok &&
                "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then test_verdict=PASS; elif [[ "$fail_count" == 1 || "$summary_state" == FAILED ]]; then test_verdict=FAIL; fi
          set_field test_verdict "$test_verdict"
          if [[ "$test_verdict" == PASS ]]; then set_field worker_cleanup_by_test PASS_3; fi
          if [[ "$test_verdict" == PASS && "$browser_ok" == 1 ]]; then
            set_field last_phase live_dashboard_passed
            set_field execution_status PASS
          else
            set_field browser_verdict NOT_ATTESTED
            set_field dashboard_status NOT_ATTESTED
            set_field last_phase live_dashboard_failed_or_unattested
            set_field execution_status "$test_verdict"
          fi
          printf 'Exact test=%s selected=%s passed=%s failed=%s ignored=%s exit=%s; live_dashboard=%s\n' \
            "$test_verdict" "$selected" "$passed" "$failed" "$ignored" "$test_rc" \
            "$(awk -F= '$1=="dashboard_status"{print $2}' "$receipt")" >> "$GITHUB_STEP_SUMMARY"
          [[ "$test_verdict" == PASS && "$browser_ok" == 1 ]]

      - name: Record read-only engine inventory and close private scratch
        if: always()
        shell: bash
        run: |
          set +x
          set -uo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g10-live-dashboard-receipt.txt"
          private="$RUNNER_TEMP/g10-live-dashboard"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending" || return 1
            chmod 600 "$receipt.pending" || return 1
            mv -- "$receipt.pending" "$receipt" || return 1
          }
          inventory_failed=0
          if [[ ! -d "$private" || -L "$private" || "$private" != "$RUNNER_TEMP/g10-live-dashboard" ]]; then
            set_field container_inventory_status NOT_ATTESTED || true
            set_field volume_inventory_status NOT_ATTESTED || true
            set_field private_fixture_cleanup NOT_CREATED || true
            set_field last_phase inventory_not_attested || true
            set_field result FAIL || true
            exit 1
          fi
          if [[ -f "$private/test-containers.before" ]] && docker info >/dev/null 2>&1 &&
             docker container ls -aq --no-trunc > "$private/test-containers.after" 2> "$private/inventory.stderr" &&
             LC_ALL=C sort -u "$private/test-containers.after" -o "$private/test-containers.after" &&
             comm -13 "$private/test-containers.before" "$private/test-containers.after" > "$private/test-containers.new"; then
            set_field test_containers_after "$(wc -l < "$private/test-containers.after" | tr -d ' ')" || inventory_failed=1
            count="$(wc -l < "$private/test-containers.new" | tr -d ' ')"
            set_field new_containers "$count" || inventory_failed=1
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count <= 32 )); then [[ "$count" == 0 ]] && set_field container_inventory_status UNCHANGED || set_field container_inventory_status ADDITIONS_OBSERVED; else set_field container_inventory_status OVER_LIMIT; inventory_failed=1; fi
          else
            set_field container_inventory_status UNKNOWN || inventory_failed=1; inventory_failed=1
          fi
          if [[ -f "$private/test-volumes.before" ]] && docker info >/dev/null 2>&1 &&
             docker volume ls -q > "$private/test-volumes.after" 2>> "$private/inventory.stderr" &&
             LC_ALL=C sort -u "$private/test-volumes.after" -o "$private/test-volumes.after" &&
             comm -13 "$private/test-volumes.before" "$private/test-volumes.after" > "$private/test-volumes.new"; then
            set_field test_volumes_after "$(wc -l < "$private/test-volumes.after" | tr -d ' ')" || inventory_failed=1
            count="$(wc -l < "$private/test-volumes.new" | tr -d ' ')"
            set_field new_volumes "$count" || inventory_failed=1
            if [[ "$count" =~ ^[0-9]+$ ]] && (( count <= 32 )); then [[ "$count" == 0 ]] && set_field volume_inventory_status UNCHANGED || set_field volume_inventory_status ADDITIONS_OBSERVED; else set_field volume_inventory_status OVER_LIMIT; inventory_failed=1; fi
          else
            set_field volume_inventory_status UNKNOWN || inventory_failed=1; inventory_failed=1
          fi
          set_field workflow_engine_cleanup NOT_PERFORMED || inventory_failed=1
          set_field image_cleanup NOT_PERFORMED || inventory_failed=1
          /bin/rm -rf -- "$private" >/dev/null 2>&1 || inventory_failed=1
          if [[ ! -e "$private" ]]; then set_field private_fixture_cleanup PASS || inventory_failed=1; else set_field private_fixture_cleanup FAIL || inventory_failed=1; fi
          test_verdict="$(awk -F= '$1=="test_verdict"{print $2}' "$receipt")"
          browser_verdict="$(awk -F= '$1=="browser_verdict"{print $2}' "$receipt")"
          containers="$(awk -F= '$1=="container_inventory_status"{print $2}' "$receipt")"
          volumes="$(awk -F= '$1=="volume_inventory_status"{print $2}' "$receipt")"
          scratch="$(awk -F= '$1=="private_fixture_cleanup"{print $2}' "$receipt")"
          if [[ "$test_verdict" == PASS && "$browser_verdict" == PASS && "$containers" != UNKNOWN && "$containers" != NOT_ATTESTED && "$containers" != OVER_LIMIT &&
                "$volumes" != UNKNOWN && "$volumes" != NOT_ATTESTED && "$volumes" != OVER_LIMIT && "$scratch" == PASS && "$inventory_failed" == 0 ]]; then
            set_field result PASS || inventory_failed=1
          else
            set_field result FAIL || inventory_failed=1
          fi
          set_field last_phase read_only_inventory_complete || inventory_failed=1
          {
            printf 'G10 live dashboard result=%s source=%s test=%s browser=%s rows_a=%s rows_b=%s native_matches=%s logout=%s browser_closed=%s containers=%s/%s volumes=%s/%s engine_cleanup=%s phase=%s\n' \
              "$(awk -F= '$1=="result"{print $2}' "$receipt")" "$SOURCE_SHA" "$test_verdict" "$browser_verdict" \
              "$(awk -F= '$1=="browser_rows_a"{print $2}' "$receipt")" "$(awk -F= '$1=="browser_rows_b"{print $2}' "$receipt")" \
              "$(awk -F= '$1=="browser_native_matches"{print $2}' "$receipt")" "$(awk -F= '$1=="browser_logout"{print $2}' "$receipt")" \
              "$(awk -F= '$1=="browser_closed"{print $2}' "$receipt")" "$containers" "$(awk -F= '$1=="new_containers"{print $2}' "$receipt")" \
              "$volumes" "$(awk -F= '$1=="new_volumes"{print $2}' "$receipt")" "$(awk -F= '$1=="workflow_engine_cleanup"{print $2}' "$receipt")" \
              "$(awk -F= '$1=="last_phase"{print $2}' "$receipt")"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$(awk -F= '$1=="result"{print $2}' "$receipt")" == PASS ]]

      - name: Upload only the closed G10 dashboard receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g10-docker-live-dashboard-${{ github.run_id }}
          path: ${{ runner.temp }}/g10-live-dashboard-receipt.txt
          if-no-files-found: error
          retention-days: 14
