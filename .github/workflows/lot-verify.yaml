name: G10 durable reservation restart canary

# One SQLite fixture at the configured quota boundary. It does not start workers.
on:
  push:
    branches:
      - claude/v1-g10-reservations-check-20261122

permissions:
  contents: read

concurrency:
  group: g10-reservation-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-reservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      AI_GUARD_BUILD_REVISION: 'f76fa6c7873b7b507eaab6e22a4c4c2693f330e7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize closed canary receipt
        shell: bash
        run: |
          umask 077
          cat > g10-reservation-receipt.txt <<'EOF'
          candidate_source=f76fa6c7873b7b507eaab6e22a4c4c2693f330e7
          workflow_ref_guard=NOT_RUN
          workflow_sha_negative=NOT_RUN
          source_checkout=NOT_RUN
          rustc_version=NOT_RUN
          dependency_fetch=NOT_RUN
          compile_exit_code=NOT_RUN
          test_fqn=configured_worker_quota_at_hundred_survives_gateway_restart
          test_inventory=NOT_RUN
          selected=NOT_RUN
          passed=NOT_RUN
          failed=NOT_RUN
          ignored=NOT_RUN
          test_exit_code=NOT_RUN
          test_result=NOT_RUN
          scope=100 durable reservations and gateway restart; not 100 active workers
          EOF
          chmod 600 g10-reservation-receipt.txt

      - name: Guard real workflow ref and checkout the exact source
        shell: bash
        run: |
          set -euo pipefail
          receipt=g10-reservation-receipt.txt
          expected_source=f76fa6c7873b7b507eaab6e22a4c4c2693f330e7
          expected_ref=refs/heads/claude/v1-g10-reservations-check-20261122
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          verify_workflow_sha() {
            local candidate="$1" parent changed
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || return 1
            parent="$(git rev-parse "$candidate^" 2>/dev/null)" || return 1
            [[ "$parent" == "$expected_source" ]] || return 1
            changed="$(git diff-tree --no-commit-id --name-only -r "$candidate" 2>/dev/null)" || return 1
            [[ "$changed" == '.github/workflows/lot-verify.yaml' ]]
          }
          actual_head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" != "$expected_ref" || "$actual_head" != "$GITHUB_SHA" ]] \
              || ! verify_workflow_sha "$GITHUB_SHA"; then
            set_receipt workflow_ref_guard FAIL
            echo 'Workflow ref/source guard failed; details omitted.' >&2
            exit 1
          fi
          if verify_workflow_sha "$expected_source"; then
            set_receipt workflow_ref_guard FAIL
            echo 'Workflow SHA guard accepted the source commit as a workflow commit.' >&2
            exit 1
          fi
          set_receipt workflow_sha_negative REJECTED
          git checkout --detach "$expected_source" >/dev/null 2>&1
          [[ "$(git rev-parse HEAD)" == "$expected_source" ]]
          set_receipt source_checkout PASS
          set_receipt workflow_ref_guard PASS

      - name: Fetch, compile one SQLite target and run one exact selector
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          receipt="$GITHUB_WORKSPACE/g10-reservation-receipt.txt"
          scratch="$(mktemp -d "$RUNNER_TEMP/g10-reservation.XXXXXX")"
          chmod 700 "$scratch"
          trap 'rm -rf "$scratch"' EXIT
          source_sha=f76fa6c7873b7b507eaab6e22a4c4c2693f330e7
          selector=configured_worker_quota_at_hundred_survives_gateway_restart
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            set_receipt source_checkout FAIL
            echo 'Pinned source checkout failed; details omitted.' >&2
            exit 1
          fi
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then
            set_receipt rustc_version 1.99.1
          else
            set_receipt rustc_version MISMATCH
            exit 1
          fi
          if cargo fetch --locked > "$scratch/fetch.stdout" 2> "$scratch/fetch.stderr"; then
            set_receipt dependency_fetch PASS
          else
            set_receipt dependency_fetch FAIL
            set_receipt compile_exit_code NOT_RUN
            exit 1
          fi

          build_json="$scratch/gateway-tenancy.jsonl"
          build_rc=0
          cargo test --locked --offline --no-default-features --test gateway_tenancy \
            --no-run --message-format=json > "$build_json" 2> "$scratch/build.stderr" || build_rc=$?
          set_receipt compile_exit_code "$build_rc"
          if (( build_rc != 0 )); then
            set_receipt test_inventory NOT_RUN
            echo 'Single SQLite target compilation failed; raw output omitted.' >&2
            exit 1
          fi

          test_bin="$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "gateway_tenancy" and .target.kind == ["test"]
              and .profile.test == true and .features == [] and .executable != null)
              | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          if [[ ! -x "$test_bin" ]]; then
            set_receipt test_inventory FAIL
            exit 1
          fi
          test_list="$scratch/test-list.txt"
          if "$test_bin" --list > "$test_list" 2> "$scratch/list.stderr" \
              && [[ "$(grep -Fxc "$selector: test" "$test_list" || true)" == 1 ]]; then
            set_receipt test_inventory PASS
          else
            set_receipt test_inventory FAIL
            exit 1
          fi

          test_log="$scratch/selector.log"
          test_rc=0
          timeout --kill-after=5s 180s "$test_bin" "$selector" --exact --test-threads=1 --color=never \
            > "$test_log" 2>&1 || test_rc=$?
          selected="$(grep -Fxc 'running 1 test' "$test_log" || true)"
          counts="$(sed -nE 's/^test result: [^ ]+\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/p' "$test_log" | tail -n 1)"
          passed=unknown
          failed=unknown
          ignored=unknown
          if [[ -n "$counts" ]]; then read -r passed failed ignored <<< "$counts"; fi
          set_receipt selected "${selected:-0}"
          set_receipt passed "$passed"
          set_receipt failed "$failed"
          set_receipt ignored "$ignored"
          set_receipt test_exit_code "$test_rc"
          if (( test_rc == 0 )) && [[ "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]] \
              && grep -Fqx "test $selector ... ok" "$test_log" \
              && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$test_log"; then
            set_receipt test_result PASS
          else
            set_receipt test_result FAIL
            exit 1
          fi

      - name: Add closed canary receipt to run summary
        if: always()
        shell: bash
        run: |
          if [[ -f g10-reservation-receipt.txt ]]; then
            {
              echo '### G10 durable reservation canary'
              echo
              echo '```text'
              cat g10-reservation-receipt.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload closed canary receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g10-reservation-canary-${{ github.sha }}
          path: g10-reservation-receipt.txt
          if-no-files-found: warn
          retention-days: 14
