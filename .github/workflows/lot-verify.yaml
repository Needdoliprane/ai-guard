name: G07 Fresh guardian STOP verification

# Branch-only check for the four native STOP admission and idle-close oracles.
# The fixtures use private local IPC. There are no engine or provider recipes.

on:
  push:
    branches: ['claude/v1-g07-idle-stop-check-20261122']

permissions:
  contents: read

concurrency:
  group: g07-idle-stop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify and run the four exact SQLite regressions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_revision=ae44c0d724e1d1e2cab658b33df292da609b46ff
          receipt="$RUNNER_TEMP/g07-idle-stop-check.txt"
          printf 'source_revision=%s\nworkflow_revision=%s\nrun_id=%s\nrun_attempt=%s\nrunner=%s/%s\nprofile=sqlite-only\n' \
            "$source_revision" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS" "$RUNNER_ARCH" > "$receipt"

          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" || "$(git rev-parse HEAD^)" != "$source_revision" ]] \
              || ! git diff --quiet "$source_revision" HEAD -- . ':(exclude).github/workflows/lot-verify.yaml'; then
            printf 'source_check=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          printf 'source_check=PASS\n' >> "$receipt"

          # Short socket paths and private raw output on the ephemeral runner.
          scratch=$(mktemp -d /tmp/aig.XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          export AI_GUARD_TEST_D5_IPC_ROOT="$scratch"

          if ! cargo fmt --all -- --check > "$scratch/format.log" 2>&1; then
            printf 'format=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          printf 'format=PASS\n' >> "$receipt"

          if ! cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            printf 'locked_fetch=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          printf 'locked_fetch=PASS\n' >> "$receipt"

          build_json="$scratch/libtest.jsonl"
          if ! cargo test --locked --offline --no-default-features --lib --no-run \
              --message-format=json > "$build_json" 2> "$scratch/build.stderr"; then
            printf 'sqlite_libtest_build=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            jq -r 'select(.reason == "compiler-message" and .message.level == "error")
              | .message.code.code // empty | select(test("^E[0-9]{4}$"))' "$build_json" \
              2>/dev/null | sort -u | sed 's/^/rustc_error=/' >> "$receipt" || true
            exit 1
          fi
          printf 'sqlite_libtest_build=PASS\n' >> "$receipt"
          if ! libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "agentsandbox" and .target.kind == ["lib"]
              and .profile.test == true and .features == [] and .executable != null) | .executable]
              | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null)" \
              || [[ ! -f "$libtest" || ! -x "$libtest" ]]; then
            printf 'sqlite_libtest_identity=FAIL\nselectors=NOT_RUN\n' >> "$receipt"
            exit 1
          fi
          digest=$(sha256sum "$libtest" | cut -d ' ' -f1)
          printf 'sqlite_libtest_sha256=%s\n' "$digest" >> "$receipt"

          idle_stop=broker::enforcer::recovery::recovery_v3::tests::idle_stop_admission
          native_admission=broker::enforcer::retirement::tests::native_admission_tests
          selectors=(
            "$idle_stop::fresh_full3_idle_ack_requires_actual_catch_up_join"
            "$idle_stop::fresh_full3_idle_join_outlives_an_ipc_disconnect"
            "$idle_stop::fresh_full3_idle_ack_requires_complete_ledger_after_joins"
            "$native_admission::recovery_intent_refuses_original_before_waiting_for_its_commit_gate"
          )
          passed=0
          test_log="$scratch/selector.log"
          for selector in "${selectors[@]}"; do
            status=0
            timeout 60s "$libtest" "$selector" --exact --test-threads=1 --color=never \
              > "$test_log" 2>&1 || status=$?
            if (( status == 0 )) \
                && [[ "$(grep -Fxc 'running 1 test' "$test_log")" == 1 ]] \
                && [[ "$(grep -Fxc "test $selector ... ok" "$test_log")" == 1 ]] \
                && [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$test_log")" == 1 ]]; then
              printf 'selector=%s result=PASS confirmed=1/1 ignored=0 exit=0\n' "$selector" >> "$receipt"
              ((passed += 1))
            else
              printf 'selector=%s result=FAIL confirmed=0/1 exit=%s\n' "$selector" "$status" >> "$receipt"
            fi
          done
          printf 'confirmed=%s/%s\n' "$passed" "${#selectors[@]}" >> "$receipt"
          (( passed == ${#selectors[@]} ))

      - name: Show the sanitized receipt
        if: always()
        shell: bash
        run: |
          receipt="$RUNNER_TEMP/g07-idle-stop-check.txt"
          if [[ -f "$receipt" ]]; then
            {
              printf '### G07 Fresh guardian STOP verification\n\n'
              printf '%s\n' '~~~text'
              cat "$receipt"
              printf '%s\n' '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the sanitized receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-idle-stop-check-${{ github.sha }}
          path: ${{ runner.temp }}/g07-idle-stop-check.txt
          if-no-files-found: ignore
          retention-days: 14
