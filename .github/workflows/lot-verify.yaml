name: G07 Claude targeted SQLite follow-up

# One SQLite test build and exact local oracles. Full runs against the corrected source.
on:
  push:
    branches:
      - claude/v1-g07-claude-targeted-followup-20261122

permissions:
  contents: read

concurrency:
  group: g07-claude-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      AI_GUARD_BUILD_REVISION: 'f76fa6c7873b7b507eaab6e22a4c4c2693f330e7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize sanitized selector receipt
        shell: bash
        run: |
          umask 077
          cat > cargo-test-summary.txt <<'EOF'
          workflow_source=f76fa6c7873b7b507eaab6e22a4c4c2693f330e7
          source_guard=NOT_RUN
          source_guard_negative=NOT_RUN
          dependency_fetch=NOT_RUN
          sqlite_test_build=NOT_RUN
          selectors_expected=19
          selectors_passed=0
          selectors_failed=0
          full_owner_selectors=3
          EOF

      - name: Guard workflow-only commit and select exact cumulative source
        shell: bash
        run: |
          set -euo pipefail
          receipt=cargo-test-summary.txt
          expected_source=f76fa6c7873b7b507eaab6e22a4c4c2693f330e7
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          verify_workflow_sha() {
            local workflow_sha="$1" parent changed
            [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            parent="$(git rev-parse "$workflow_sha^" 2>/dev/null)" || return 1
            [[ "$parent" == "$expected_source" ]] || return 1
            changed="$(git diff-tree --no-commit-id --name-only -r "$workflow_sha" 2>/dev/null)" || return 1
            [[ "$changed" == '.github/workflows/lot-verify.yaml' ]]
          }
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$GITHUB_SHA" ]] || ! verify_workflow_sha "$GITHUB_SHA"; then
            set_receipt source_guard FAIL
            echo 'Source guard failed; raw output omitted.' >&2
            exit 1
          fi
          if verify_workflow_sha "$expected_source"; then
            set_receipt source_guard FAIL
            echo 'Source guard accepted an invalid workflow SHA; details omitted.' >&2
            exit 1
          fi
          set_receipt source_guard_negative REJECTED
          git checkout --detach "$expected_source" >/dev/null 2>&1
          [[ "$(git rev-parse HEAD)" == "$expected_source" ]]
          set_receipt source_guard PASS

      - name: Fetch, compile one SQLite test set and run exact selectors
        shell: bash
        run: |
          set -uo pipefail
          receipt="$GITHUB_WORKSPACE/cargo-test-summary.txt"
          scratch="$(mktemp -d "$RUNNER_TEMP/g07-sqlite.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          source_sha=f76fa6c7873b7b507eaab6e22a4c4c2693f330e7
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          printf 'source_commit=%s\n' "$source_sha" >> "$receipt"
          if ! cargo fetch --locked > "$scratch/fetch.stdout" 2> "$scratch/fetch.stderr"; then
            set_receipt dependency_fetch FAIL
            echo 'Locked dependency fetch failed; details omitted.' >&2
            exit 1
          fi
          set_receipt dependency_fetch PASS

          build_json="$scratch/sqlite-tests.jsonl"
          build_rc=0
          cargo test --locked --offline --no-default-features --lib \
            --test provider_activity_adapters --test provider_activity_live \
            --test supervision_api --no-run --message-format=json \
            > "$build_json" 2> "$scratch/build.stderr" || build_rc=$?
          if (( build_rc != 0 )); then
            set_receipt sqlite_test_build FAIL
            jq -r '
              select(.reason == "compiler-message" and .message.level == "error")
              | .message as $m
              | "rustc " + ($m.code.code // "<no-code>")
                + ([$m.spans[]? | select(.is_primary == true)
                    | select(.file_name | startswith("src/") or startswith("tests/"))
                    | "\(.file_name):\(.line_start):\(.column_start)-\(.line_end):\(.column_end)"]
                   | if length > 0 then " " + (join(", ")) else "" end)
            ' "$build_json" 2>/dev/null | sort -u >> "$receipt" || true
            echo 'One SQLite test build failed; only source spans and rustc codes retained.' >&2
            exit 1
          fi
          set_receipt sqlite_test_build PASS

          libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          adapters="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "provider_activity_adapters" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          live="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "provider_activity_live" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          supervision="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "supervision_api" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          if [[ ! -x "$libtest" || ! -x "$adapters" || ! -x "$live" || ! -x "$supervision" ]]; then
            printf 'test_artifact=FAIL\n' >> "$receipt"
            exit 1
          fi
          printf 'libtest_sha256=%s\nadapters_sha256=%s\nlive_sha256=%s\nsupervision_sha256=%s\n' \
            "$(sha256sum "$libtest" | cut -d ' ' -f1)" \
            "$(sha256sum "$adapters" | cut -d ' ' -f1)" \
            "$(sha256sum "$live" | cut -d ' ' -f1)" \
            "$(sha256sum "$supervision" | cut -d ' ' -f1)" >> "$receipt"

          passed=0
          failed=0
          run_exact() {
            local label="$1" exe="$2" selector="$3" log="$scratch/$1.log" rc=0 selected ignored
            timeout --kill-after=5s 240s "$exe" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1 || rc=$?
            selected="$(grep -Fxc 'running 1 test' "$log" || true)"
            ignored="$(sed -nE 's/^test result: [^;]+; [0-9]+ failed; ([0-9]+) ignored;.*/\1/p' "$log" | tail -n 1)"
            ignored="${ignored:-unknown}"
            if (( rc == 0 )) && [[ "$selected" == 1 && "$ignored" == 0 ]] \
                && grep -Fqx "test $selector ... ok" "$log" \
                && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$log"; then
              printf 'selector=%s result=PASS selected=1 ignored=0 exit=0\n' "$selector" >> "$receipt"
              ((passed += 1))
            else
              printf 'selector=%s result=FAIL selected=%s ignored=%s exit=%s\n' "$selector" "${selected:-0}" "$ignored" "$rc" >> "$receipt"
              ((failed += 1))
            fi
          }

          # Twelve non-Full exact selectors from the prior run, followed by writer and Full oracles.
          run_exact activity_stdout_end_vs_deadline "$libtest" 'provider_activity::collector::tests::stdout_loss_reports_the_first_abandoned_chunk_without_inventing_a_deadline'
          run_exact session_close_coverage_replay "$libtest" 'provider_activity::session::close_tests::replay_records_one_unknown_coverage_after_recovering_the_retained_chain'
          run_exact session_interrupted_coverage_open "$libtest" 'provider_activity::session::close_tests::an_interrupted_session_leaves_coverage_open_for_terminal_replay'
          run_exact adapter_claude_stream "$adapters" 'claude_stream_maps_messages_reasoning_tools_and_delegation'
          run_exact adapter_claude_hooks "$adapters" 'claude_hooks_map_tools_prompts_and_subagents_without_inventing_a_parent'
          run_exact adapter_secret_redaction "$adapters" 'hook_payload_secrets_are_masked_before_projection'
          run_exact adapter_recorded_offline "$adapters" 'recorded_offline_client_output_is_fully_recognized'
          run_exact forwarder_retry_reopen "$live" 'the_forwarder_retries_without_loss_and_resumes_after_reopen'
          run_exact hook_store_route "$live" 'hook_activity_reaches_the_gateway_while_the_session_is_still_running'
          run_exact hook_ack_durable_spool "$live" 'the_hook_pump_acknowledges_only_durable_records_and_reports_anomalies'
          run_exact batch_route_rollback "$live" 'the_batch_route_is_atomic_idempotent_and_runner_only'
          run_exact r2_capacity_revocation "$supervision" 'ordinary_exhaustion_keeps_control_capacity_and_control_exhaustion_keeps_revocation'

          # Writer projection and inventory oracles are separate exact Rust unit tests.
          run_exact writer_acknowledged_read "$libtest" 'broker::writer::status_projection_tests::abandoned_retirement_audit_read_keeps_acknowledged_result_readable'
          run_exact writer_retirement_conflict "$libtest" 'broker::writer::status_projection_tests::retirement_audit_conflict_for_a_missing_observed_job_closes_the_status_projection'
          run_exact writer_abandoned_mutation "$libtest" 'broker::writer::status_projection_tests::abandoned_mutation_waiter_invalidates_projection_while_actor_keeps_its_work'
          run_exact writer_result_read_timeout "$libtest" 'broker::writer::status_projection_tests::result_read_timeout_keeps_acknowledged_status_readable'

          # Full's fixture fix is pinned in source 47c; include the two callers sharing its owner.
          run_exact full_reconciliation "$libtest" 'broker::service::server::full_owner_tests::full_reconciliation_acknowledges_pending_result_with_unavailable_activity_spool'
          run_exact full_normal_shutdown "$libtest" 'broker::service::server::full_owner_tests::normal_shutdown_retains_a_full_deferred_run_until_its_owned_future_finishes'
          run_exact full_slot_saturation "$libtest" 'broker::service::server::full_owner_tests::full_slot_saturation_is_refused_before_a_real_resume_acknowledgement'

          set_receipt selectors_passed "$passed"
          set_receipt selectors_failed "$failed"
          printf 'selectors_result=%s\n' "$([[ "$failed" == 0 && "$passed" == 19 ]] && echo PASS || echo FAIL)" >> "$receipt"
          (( failed == 0 && passed == 19 ))

      - name: Add sanitized receipt to run summary
        if: always()
        shell: bash
        run: |
          if [[ -f cargo-test-summary.txt ]]; then
            {
              echo '### G07 targeted SQLite selectors'
              echo
              echo '```text'
              cat cargo-test-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized SQLite receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-claude-targeted-followup-${{ github.sha }}
          path: cargo-test-summary.txt
          if-no-files-found: warn
          retention-days: 14
