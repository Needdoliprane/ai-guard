name: G09 run-client cleanup sample diagnostic

# One ignored Linux integration selector on a disposable GitHub-hosted runner.
# The test SIGKILLs only its own run-client process; the workload has no network
# or provider. Docker inventory is read-only and fixture resources are retained.
on:
  push:
    branches:
      - claude/v1-g09-run-client-cleanup-sample-check-20261123

permissions:
  contents: read

concurrency:
  group: g09-run-client-cleanup-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-client-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SOURCE_SHA: f2072a854a487dbb2d0189ee892b6f5db2e400c4
      SOURCE_TREE: 823a6a3431c8e8263e4a606ec179a79b99d98886
      SOURCE_PARENT_SHA: 4212a83f5f1172a0c099d0d6125fe2f5813ef519
      SOURCE_PARENT_TREE: 90651a972f96a47c162703817b53c42423b8390f
      SOURCE_PARENT_PARENT_SHA: 05f778bd072f8faf053ddab411ed9771d8899edd
      SOURCE_PARENT_PARENT_TREE: 7cc59be478ff42a60c0a53f6eb76d46b57fd3d1f
      EXPECTED_TEST_BLOB: 06c3bb572bad5a676349d13bce80b6fb9245da61
      LOCK_SHA: 05847a300405860df8f860d5dc1c39ca423dfa0d
      EXPECTED_BRANCH: claude/v1-g09-run-client-cleanup-sample-check-20261123
      SELECTOR: broker_run_cli_sigkill_preserves_original_deadline_without_second_start
      AI_GUARD_BUILD_REVISION: f2072a854a487dbb2d0189ee892b6f5db2e400c4
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      DOCKER_HOST: unix:///var/run/docker.sock
      LC_ALL: C
    steps:
      - name: Initialize closed run-client receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          cat > "$receipt" <<EOF
          source_sha=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          source_parent=$SOURCE_PARENT_SHA
          workflow_sha=$WORKFLOW_SHA
          workflow_parent_sha=unknown
          source_guard=NOT_RUN
          rootful_preflight=NOT_RUN
          worker_image_build=NOT_RUN
          worker_image_uid=NOT_RUN
          worker_image_arch=NOT_RUN
          provider_cli_versions=NONE_SELECTED
          worker_network=none
          dependency_fetch=NOT_RUN
          build_no_run=NOT_RUN
          build_exit=unknown
          libtest_sha256=unknown
          test_selector=$SELECTOR
          test_selected=unknown
          test_passed=unknown
          test_failed=unknown
          test_ignored=unknown
          test_exit=unknown
          test_verdict=NOT_RUN
          evidence_root=NOT_VERIFIED
          result_file=NOT_READ
          run_client_state=NOT_READ
          run_client_stage=NOT_READ
          outcome_diagnosis=NOT_RUN
          fixture_retention=TEST_DECLARED_PRIVATE
          containers_before=unknown
          containers_after=unknown
          containers_new=unknown
          volumes_before=unknown
          volumes_after=unknown
          volumes_new=unknown
          images_before=unknown
          images_after=unknown
          images_new=unknown
          engine_cleanup=NOT_PERFORMED
          receipt_closed=NO
          last_phase=initialized
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify source and exact workflow child
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source_parent=$SOURCE_PARENT_SHA
          source_parent_parent=$SOURCE_PARENT_PARENT_SHA
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" &&
                "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$SOURCE_TREE" &&
                "$(git show -s --format=%P "$SOURCE_SHA")" == "$source_parent" &&
                "$(git rev-parse "$source_parent^{tree}")" == "$SOURCE_PARENT_TREE" &&
                "$(git show -s --format=%P "$source_parent")" == "$source_parent_parent" &&
                "$(git rev-parse "$source_parent_parent^{tree}")" == "$SOURCE_PARENT_PARENT_TREE" &&
                "$(git rev-parse "$SOURCE_SHA:Cargo.lock")" == "$LOCK_SHA" &&
                "$(git diff --name-only "$source_parent" "$SOURCE_SHA")" == tests/broker_runtime.rs &&
                "$(git rev-parse "$SOURCE_SHA:tests/broker_runtime.rs")" == "$EXPECTED_TEST_BLOB" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             grep -Fq "async fn $SELECTOR() -> Result<()>" tests/broker_runtime.rs &&
             grep -Fq 'let killed_status = run_cli.kill_owned()?;' tests/broker_runtime.rs &&
             grep -Fq 'broker_live_after_result_replay":true' tests/broker_runtime.rs &&
             grep -Fq 'items.len() == 1' tests/broker_runtime.rs &&
             grep -Fq 'quota.held_workers == 0' tests/broker_runtime.rs &&
             grep -Fq 'broker_exit.success()' tests/broker_runtime.rs &&
             grep -Fq 'gateway.terminate_owned()?.success()' tests/broker_runtime.rs &&
             grep -Fq '"network":"none"' tests/broker_runtime.rs &&
             grep -Fq 'retain enforcer, workspace and evidence' tests/broker_runtime.rs &&
             grep -Fq '"run_client_recovery":RunClientRecoveryReceipt { state, stage }' tests/broker_runtime.rs &&
             grep -Fq 'enum RunClientRecoveryStage' tests/broker_runtime.rs &&
             grep -Fq 'Complete,' tests/broker_runtime.rs &&
             grep -Fq 'CentralCleanupSample::NotObserved' tests/broker_runtime.rs &&
             grep -Fq 'CentralCleanupSample::ReportedUnconfirmed' tests/broker_runtime.rs &&
             grep -Fq 'CentralCleanupSample::ReportedRemoved' tests/broker_runtime.rs &&
             grep -Fq 'BrokerErrorCodeV1' tests/broker_runtime.rs &&
             grep -Fq 'Unauthorized,' src/broker/service/protocol.rs &&
             grep -Fq 'Forbidden,' src/broker/service/protocol.rs &&
             grep -Fq 'Unavailable,' src/broker/service/protocol.rs &&
             grep -Fq 'IncompatibleControl,' src/broker/service/protocol.rs &&
             grep -Fq 'Busy,' src/broker/service/protocol.rs &&
             grep -Fq 'InvalidInput,' src/broker/service/protocol.rs &&
             grep -Fq 'Conflict,' src/broker/service/protocol.rs &&
             grep -Fq 'Interrupted,' src/broker/service/protocol.rs &&
             grep -Fq 'LimitExceeded,' src/broker/service/protocol.rs &&
             grep -Fq 'NeedsReconciliation' src/broker/service/protocol.rs &&
             awk '/^async fn wait_terminal\(/ { inside_wait=1 } /^fn check_usage\(/ { inside_wait=0 } inside_wait && /let worker: WorkerV1/ { worker=NR } inside_wait && /BrokerCommandV1::Status \{ operation_id \}/ { status=NR } inside_wait && /let central_cleanup_sample = match worker\.cleanup_removed/ { sample=NR } END { exit !(worker && status && sample && worker < status && status < sample) }' tests/broker_runtime.rs; then
            set_field workflow_parent_sha "$SOURCE_SHA"
            set_field source_guard PASS
            set_field last_phase source_verified
          else
            set_field source_guard FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Prepare private Cargo scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=private_scratch_prepare/' "$receipt"
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private"
          canonical="$(realpath -- "$private")"
          [[ "$canonical" == "$private" && "$(stat -c '%a' "$private")" == 700 ]]
          mkdir -m 700 "$private/target" "$private/tmp"
          [[ "$(realpath -- "$private/target")" == "$private/target" && "$(stat -c '%a' "$private/target")" == 700 ]]
          [[ "$(realpath -- "$private/tmp")" == "$private/tmp" && "$(stat -c '%a' "$private/tmp")" == 700 ]]
          printf 'G09_PRIVATE=%s\nTMPDIR=%s\nCARGO_TARGET_DIR=%s/target\n' "$private" "$private/tmp" "$private" >> "$GITHUB_ENV"
          sed -i 's/^last_phase=.*/last_phase=private_scratch_ready/' "$receipt"

      - name: Verify rootful Docker and inventory existing resources
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rootful_preflight
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' default)"
          security="$(docker info --format '{{json .SecurityOptions}}')"
          platform="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')"
          if [[ -S /var/run/docker.sock && "$endpoint" == unix:///var/run/docker.sock && "$platform" == linux/amd64 ]] &&
             jq -e 'all(.[]; (ascii_downcase | contains("rootless")) | not)' <<< "$security" >/dev/null; then
            docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$G09_PRIVATE/containers.before"
            docker volume ls -q | LC_ALL=C sort -u > "$G09_PRIVATE/volumes.before"
            docker image ls -q --no-trunc | LC_ALL=C sort -u > "$G09_PRIVATE/images.before"
            set_field containers_before "$(wc -l < "$G09_PRIVATE/containers.before" | tr -d ' ')"
            set_field volumes_before "$(wc -l < "$G09_PRIVATE/volumes.before" | tr -d ' ')"
            set_field images_before "$(wc -l < "$G09_PRIVATE/images.before" | tr -d ' ')"
            set_field rootful_preflight PASS
            set_field last_phase rootful_preflight_complete
          else
            set_field rootful_preflight FAIL
            set_field last_phase rootful_preflight_failed
            exit 1
          fi

      - name: Build the private UID 1000 worker image without provider clients
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          tag="ai-guard-g09-run-client:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field last_phase worker_image_build
          if docker build --file images/worker.Dockerfile --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= --tag "$tag" . > "$G09_PRIVATE/worker-build.log" 2>&1; then
            image_id="$(docker image inspect --format '{{.Id}}' "$tag")"
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$(docker image inspect --format '{{.Config.User}}' "$image_id")" == 1000:1000 ]]
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" == linux/amd64 ]]
            printf '%s\n' "$image_id" > "$G09_PRIVATE/image.id"
            printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_ALLOW_ROOTFUL=1\nAGENTSANDBOX_TEST_RETAIN_ENFORCER=1\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=unix:///var/run/docker.sock\nAGENTSANDBOX_TEST_IMAGE=%s\nAGENTSANDBOX_TEST_BROKER_NATIVE_START=1\nAGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS=30\n' "$image_id" >> "$GITHUB_ENV"
            set_field worker_image_build PASS
            set_field worker_image_uid 1000:1000
            set_field worker_image_arch linux/amd64
            set_field provider_cli_versions NONE_SELECTED
            set_field last_phase worker_image_verified
          else
            set_field worker_image_build FAIL
            set_field last_phase worker_image_build_failed
            exit 1
          fi

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=dependency_fetch/' "$receipt"
          if cargo fetch --locked > "$G09_PRIVATE/fetch.log" 2>&1; then
            sed -i 's/^dependency_fetch=NOT_RUN$/dependency_fetch=PASS/' "$receipt" || true
            sed -i 's/^last_phase=.*/last_phase=dependencies_fetched/' "$receipt"
          else
            rc=$?
            sed -i 's/^dependency_fetch=NOT_RUN$/dependency_fetch=FAIL/' "$receipt" || true
            sed -i "s/^last_phase=.*/last_phase=dependency_fetch_failed_exit_${rc}/" "$receipt"
            exit "$rc"
          fi

      - name: Compile exactly one broker runtime libtest executable
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase libtest_no_run
          if cargo test --locked --offline --test broker_runtime --no-run --message-format=json > "$G09_PRIVATE/build.jsonl" 2> "$G09_PRIVATE/build.stderr"; then
            libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "broker_runtime" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl" 2>/dev/null || true)"
            [[ -n "$libtest" && -x "$libtest" ]]
            set_field libtest_sha256 "$(sha256sum "$libtest" | awk '{print $1}')"
            set_field build_no_run PASS
            set_field build_exit 0
            printf '%s\n' "$libtest" > "$G09_PRIVATE/libtest.path"
            set_field last_phase compiled_no_run
          else
            rc=$?
            set_field build_no_run FAIL
            set_field build_exit "$rc"
            set_field last_phase no_run_build_failed
            exit "$rc"
          fi

      - name: Run the single run-client SIGKILL recovery selector and classify its result
        shell: bash
        env:
          AGENTSANDBOX_TEST_RUNTIME: docker
          AGENTSANDBOX_TEST_ALLOW_ROOTFUL: '1'
          AGENTSANDBOX_TEST_RETAIN_ENFORCER: '1'
          AGENTSANDBOX_TEST_RUNTIME_PROGRAM: /usr/bin/docker
          AGENTSANDBOX_TEST_RUNTIME_ENDPOINT: unix:///var/run/docker.sock
          AGENTSANDBOX_TEST_BROKER_NATIVE_START: '1'
          AGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS: '30'
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector="$SELECTOR"
          log="$G09_PRIVATE/test.log"
          set_field last_phase targeted_run_client_recovery
          libtest="$(<"$G09_PRIVATE/libtest.path")"
          if timeout --signal=TERM --kill-after=30s 660s "$libtest" "$selector" --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1; then rc=0; else rc=$?; fi
          selected=0 passed=0 failed=0 ignored=0 summary_ok=0
          [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] && selected=1 || true
          if grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log"; then
            passed=1
            summary_ok=1
          elif grep -Eq '^test result: FAILED\. [0-9]+ passed; [1-9][0-9]* failed; [0-9]+ ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log"; then
            failed=1
          fi
          grep -Fxc "test $selector ... FAILED" "$log" >/dev/null 2>&1 && failed=1 || true
          set_field test_selected "$selected"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"
          if [[ "$(grep -Fxc 'running 1 test' "$log" || true)" != 1 ]]; then
            set_field selected_test_status SELECTOR_NOT_ATTESTED
            set_field run_client_state NOT_ATTESTED
            set_field run_client_stage NOT_ATTESTED
            set_field outcome_diagnosis SELECTOR_NOT_ATTESTED
            set_field test_verdict FAIL
            exit 1
          fi
          evidence_root="$(sed -nE "s|^test $selector \.\.\. retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\1|p; s|^retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\1|p" "$log" | LC_ALL=C sort -u)"
          if [[ "$(printf '%s\n' "$evidence_root" | sed '/^$/d' | wc -l | tr -d ' ')" != 1 ||
                ! "$evidence_root" =~ ^/tmp/br-[[:alnum:]]{6}$ || ! -d "$evidence_root" || -L "$evidence_root" ||
                "$(realpath -- "$evidence_root")" != "$evidence_root" ||
                "$(stat -c '%u %a' "$evidence_root")" != "$(id -u) 700" ]]; then
            set_field evidence_root PRIVATE_ROOT_NOT_VERIFIED
            set_field run_client_state NOT_READ
            set_field run_client_stage NOT_READ
            set_field outcome_diagnosis PRIVATE_ROOT_NOT_VERIFIED
            set_field test_verdict FAIL
            exit 1
          fi
          set_field evidence_root VERIFIED_PRIVATE
          set_field result_file PRIVATE_VERIFIED
          read_result_field() {
            local pointer=$1
            [[ -f "$evidence_root/result.json" && ! -L "$evidence_root/result.json" &&
               "$(realpath -- "$evidence_root/result.json")" == "$evidence_root/result.json" &&
               "$(stat -c '%u %a' "$evidence_root/result.json")" == "$(id -u) 600" ]] || return 1
            jq -ers --arg pointer "$pointer" '
              if length == 1 and (.[0] | type == "object") and
                 (.[0].run_client_recovery | type == "object") then
                .[0].run_client_recovery | .[$pointer] | select(type == "string")
              else empty end' "$evidence_root/result.json" 2>/dev/null
          }
          state="$(read_result_field state || true)"
          stage="$(read_result_field stage || true)"
          case "$state" in passed|failed|timed_out) ;; *) state=UNRECOGNIZED ;; esac
          case "$stage" in
            not_reached|reap_clock|broker_liveness|worker_read|status_read|terminal_wait|executor|result_read|result_outcome|terminal_correlation|post_terminal_checks|control_shutdown|complete) ;;
            *) stage=UNRECOGNIZED ;;
          esac
          set_field run_client_state "$state"
          set_field run_client_stage "$stage"
          if [[ "$state" == failed && "$stage" == executor ]]; then
            cleanup_sample="$(read_result_field central_cleanup_sample || true)"
            executor_error="$(read_result_field executor_error || true)"
            case "$cleanup_sample" in
              not_observed|reported_unconfirmed|reported_removed) ;;
              *)
                set_field outcome_diagnosis UNRECOGNIZED_EXECUTOR_METADATA
                set_field test_verdict FAIL_UNRECOGNIZED_EXECUTOR_METADATA
                set_field last_phase run_client_executor_metadata_rejected
                exit 1
                ;;
            esac
            case "$executor_error" in
              unauthorized|forbidden|unavailable|incompatible_control|busy|invalid_input|conflict|interrupted|limit_exceeded|needs_reconciliation) ;;
              *)
                set_field outcome_diagnosis UNRECOGNIZED_EXECUTOR_METADATA
                set_field test_verdict FAIL_UNRECOGNIZED_EXECUTOR_METADATA
                set_field last_phase run_client_executor_metadata_rejected
                exit 1
                ;;
            esac
            set_field central_cleanup_sample "$cleanup_sample"
            set_field executor_error "$executor_error"
            set_field outcome_diagnosis EXECUTOR_FAILURE_CLASSIFIED
            set_field test_verdict FAIL_EXECUTOR
            set_field last_phase run_client_executor_failure
            exit 1
          elif [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 &&
                  "$summary_ok" == 1 && "$state" == passed && "$stage" == complete ]]; then
            set_field outcome_diagnosis PASS_PASSED_COMPLETE
            set_field test_verdict PASS_1_0_0
            set_field last_phase targeted_test_complete
          else
            set_field outcome_diagnosis "${state}_${stage}_exit_${rc}"
            set_field test_verdict FAIL_OR_INCOMPLETE
            set_field last_phase run_client_recovery_incomplete
            exit 1
          fi

      - name: Record read-only Docker inventory and close receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-cleanup-sample-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$private" && -f "$private/containers.before" && -f "$private/volumes.before" && -f "$private/images.before" ]] && docker info >/dev/null 2>&1; then
            if docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.after" &&
               docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.after" &&
               docker image ls -q --no-trunc | LC_ALL=C sort -u > "$private/images.after" &&
               comm -13 "$private/containers.before" "$private/containers.after" > "$private/containers.new" &&
               comm -13 "$private/volumes.before" "$private/volumes.after" > "$private/volumes.new" &&
               comm -13 "$private/images.before" "$private/images.after" > "$private/images.new"; then
              set_field containers_after "$(wc -l < "$private/containers.after" | tr -d ' ')"
              set_field containers_new "$(wc -l < "$private/containers.new" | tr -d ' ')"
              set_field volumes_after "$(wc -l < "$private/volumes.after" | tr -d ' ')"
              set_field volumes_new "$(wc -l < "$private/volumes.new" | tr -d ' ')"
              set_field images_after "$(wc -l < "$private/images.after" | tr -d ' ')"
              set_field images_new "$(wc -l < "$private/images.new" | tr -d ' ')"
            else
              set_field containers_after unknown
              set_field containers_new unknown
              set_field volumes_after unknown
              set_field volumes_new unknown
              set_field images_after unknown
              set_field images_new unknown
            fi
          else
            set_field containers_after unknown
            set_field containers_new unknown
            set_field volumes_after unknown
            set_field volumes_new unknown
            set_field images_after unknown
            set_field images_new unknown
          fi
          set_field engine_cleanup NOT_PERFORMED
          set_field receipt_closed YES
          {
            printf 'G09 run-client recovery outcome=%s source=%s\n' \
              "$(grep '^test_verdict=' "$receipt" | cut -d= -f2)" "$SOURCE_SHA"
            printf 'selected=%s passed=%s failed=%s ignored=%s exit=%s state=%s stage=%s diagnosis=%s\n' \
              "$(grep '^test_selected=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_passed=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_failed=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_ignored=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_exit=' "$receipt" | cut -d= -f2)" \
              "$(grep '^run_client_state=' "$receipt" | cut -d= -f2)" \
              "$(grep '^run_client_stage=' "$receipt" | cut -d= -f2)" \
              "$(grep '^outcome_diagnosis=' "$receipt" | cut -d= -f2)"
            if [[ "$(grep '^outcome_diagnosis=' "$receipt" | cut -d= -f2)" == EXECUTOR_FAILURE_CLASSIFIED ]]; then
              printf 'central_cleanup_sample=%s executor_error=%s\n' \
                "$(grep '^central_cleanup_sample=' "$receipt" | cut -d= -f2)" \
                "$(grep '^executor_error=' "$receipt" | cut -d= -f2)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-run-client-cleanup-sample-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/g09-run-client-cleanup-sample-receipt.txt
          if-no-files-found: error
          retention-days: 14
