name: G09 STOP-only cold audit recovery check

# Run one fixture-only cold recovery selector on the exact qualification composition.
on:
  push:
    branches:
      - claude/v1-g09-stop-recovery-audit-check-20261123

permissions:
  contents: read

concurrency:
  group: g09-stop-recovery-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stop-recovery-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_SHA: dc779cf92cb7fd66614958b5082519dfaa767040
      SOURCE_TREE_SHA: 93d15c29f97d7a50c1efd51c1928392b338cfc37
      SOURCE_PARENT_1_SHA: 42cfbcd5eae7babc5abee4e48bbdb55fa38acb65
      SOURCE_PARENT_1_PARENT_1_SHA: 92e72c2b8520ab06289e3d8d9031712c9bc6d027
      SOURCE_PARENT_1_PARENT_2_SHA: eb4278932958a28d09747bee57b4b46c2cf84a33
      SOURCE_PARENT_1_PARENT_1_PARENT_1_SHA: 7d3c56edf890c72cf8271ca9bd6b8ef6e603f68a
      SOURCE_PARENT_1_PARENT_1_PARENT_2_SHA: bd56de64892d840db35c61cfe20db79a7c227e9a
      TEST_PORT_SHA: eb4278932958a28d09747bee57b4b46c2cf84a33
      TEST_PORT_PARENT_SHA: a947b5e1c179214fb65699b96ce7818ebeefd53f
      TEST_PORT_PARENT_1_SHA: 881c7da73dc438d978beb01049cfe1e7464abd00
      TEST_PORT_PARENT_2_SHA: 8a51fbc94b4d9f54c17be4771376343a771f193c
      EXPECTED_COLD_AUDIT_TEST_BLOB: 1503eb4e322afcb482e6937f9cc02ed96f94561d
      EXPECTED_TEST_PORT_BLOB: 668cba1d2dc6cb6ba8ed478c2bb0f3442e6e01d0
      COLD_AUDIT_TEST_FILE: src/broker/service/cold_audit_tests.rs
      COLD_AUDIT_TEST: broker::service::server::cancel_retry_tests::cold_audit_tests::cold_stop_only_reconcile_loop_publishes_pending_v4_without_start_capability
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Checkout the exact G09 cold audit fixture composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 6
          persist-credentials: false

      - name: Build and run one bounded cold audit recovery selector
        id: cold-audit
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-stop-recovery-audit-receipt.txt"
          scratch=""
          fixture_tmp=""
          cat > "$receipt" <<'EOF'
          source_sha=dc779cf92cb7fd66614958b5082519dfaa767040
          source_tree_sha=93d15c29f97d7a50c1efd51c1928392b338cfc37
          source_parent_1_sha=42cfbcd5eae7babc5abee4e48bbdb55fa38acb65
          test_port_sha=eb4278932958a28d09747bee57b4b46c2cf84a33
          selector=broker::service::server::cancel_retry_tests::cold_audit_tests::cold_stop_only_reconcile_loop_publishes_pending_v4_without_start_capability
          fixture=private SQLite plus loopback gateway fixture and private Unix IPC; no engine or provider
          source_guard=NOT_RUN
          disk_preflight=NOT_RUN
          rustc_version=NOT_RUN
          dependency_fetch=NOT_RUN
          libtest_compile=NOT_RUN
          libtest_artifact=NOT_RUN
          selector_inventory=NOT_RUN
          selected=NOT_RUN
          passed=NOT_RUN
          failed=NOT_RUN
          ignored=NOT_RUN
          test_counts=NOT_ATTESTED
          test_exit=NOT_RUN
          test_verdict=NOT_RUN
          phase_seed_verified=NOT_ATTESTED
          phase_stop_only_ready=NOT_ATTESTED
          phase_retained_ipc_verified=NOT_ATTESTED
          phase_event_pair_observed=NOT_ATTESTED
          phase_loop_joined=NOT_ATTESTED
          phase_stop_only_owners_dropped=NOT_ATTESTED
          phase_reopened_ack_verified=NOT_ATTESTED
          last_attested_phase=NOT_ATTESTED
          local_v4_pending_entries=NOT_ATTESTED
          loopback_gateway_first_acknowledgements=NOT_ATTESTED
          audit_pair_observed=NOT_ATTESTED
          audit_pair_publication=NOT_ATTESTED
          stop_result_refusal=NOT_ATTESTED
          fixture_worker_state=NOT_ATTESTED
          central_worker_transition=NOT_EXPECTED
          runtime_calls=NOT_ATTESTED
          decision_calls=NOT_ATTESTED
          fixture_preflight=NOT_RUN
          fixture_tmp_cleanup=NOT_RUN
          fixture_resource_closure=NOT_RUN
          private_scratch_cleanup=NOT_RUN
          result=NOT_RUN
          scope=one exact cold STOP-only reconciliation test; local pending V4 entries and fixture-gateway ACKs are distinct
          EOF
          chmod 600 "$receipt"
          result=FAIL
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            chmod 600 "$receipt.tmp"
            mv -- "$receipt.tmp" "$receipt"
          }
          finish() {
            local code=$? cleanup_rc=0
            trap - EXIT
            set +e
            if [[ -n "$scratch" && "$scratch" == "$RUNNER_TEMP/g09-stop-recovery."* ]]; then
              rm -rf -- "$scratch" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$scratch" ]] || cleanup_rc=1
            fi
            if [[ -n "$fixture_tmp" && "$fixture_tmp" == /tmp/g09-sr-* ]]; then
              if [[ -d "$fixture_tmp" ]] && find "$fixture_tmp" -mindepth 1 -print -quit | grep -q .; then
                set_receipt fixture_resource_closure RESIDUAL_PRIVATE_ENTRIES
                cleanup_rc=1
              else
                set_receipt fixture_resource_closure EMPTY
              fi
              rm -rf -- "$fixture_tmp" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$fixture_tmp" ]] || cleanup_rc=1
            fi
            if (( cleanup_rc == 0 )); then
              set_receipt fixture_tmp_cleanup PASS
              set_receipt private_scratch_cleanup PASS
            else
              set_receipt fixture_tmp_cleanup FAIL
              set_receipt private_scratch_cleanup FAIL
              code=1
            fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; else result=FAIL; fi
            set_receipt result "$result"
            {
              printf 'G09 STOP-only cold audit recovery selector result=%s\n' "$result"
              grep -E '^(source_guard|disk_preflight|rustc_version|dependency_fetch|libtest_compile|libtest_artifact|selector_inventory|selected|passed|failed|ignored|test_counts|test_exit|test_verdict|phase_|last_attested_phase|local_v4_pending_entries|loopback_gateway_first_acknowledgements|audit_pair_observed|audit_pair_publication|stop_result_refusal|fixture_worker_state|central_worker_transition|runtime_calls|decision_calls|fixture_preflight|fixture_tmp_cleanup|fixture_resource_closure|private_scratch_cleanup|result)=' "$receipt"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
          trap finish EXIT

          source_sha=$SOURCE_SHA
          test_port_sha=$TEST_PORT_SHA
          expected_ref=refs/heads/claude/v1-g09-stop-recovery-audit-check-20261123
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "$expected_ref" &&
                "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
                "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" &&
                "$(git show -s --format=%P HEAD 2>/dev/null)" == "$source_sha" &&
                "$(git diff --name-only "$source_sha" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse "$source_sha^{tree}" 2>/dev/null)" == "$SOURCE_TREE_SHA" &&
                "$(git show -s --format=%P "$source_sha" 2>/dev/null)" == "$SOURCE_PARENT_1_SHA" &&
                "$(git show -s --format=%P "$SOURCE_PARENT_1_SHA" 2>/dev/null)" == "$SOURCE_PARENT_1_PARENT_1_SHA $SOURCE_PARENT_1_PARENT_2_SHA" &&
                "$(git show -s --format=%P "$SOURCE_PARENT_1_PARENT_1_SHA" 2>/dev/null)" == "$SOURCE_PARENT_1_PARENT_1_PARENT_1_SHA $SOURCE_PARENT_1_PARENT_1_PARENT_2_SHA" &&
                "$(git diff --name-only "$SOURCE_PARENT_1_SHA" "$source_sha" 2>/dev/null)" == "$COLD_AUDIT_TEST_FILE" &&
                "$(git show -s --format=%P "$test_port_sha" 2>/dev/null)" == "$TEST_PORT_PARENT_SHA" &&
                "$(git show -s --format=%P "$TEST_PORT_PARENT_SHA" 2>/dev/null)" == "$TEST_PORT_PARENT_1_SHA $TEST_PORT_PARENT_2_SHA" &&
                "$(git diff --name-only "$TEST_PORT_PARENT_SHA" "$test_port_sha" 2>/dev/null)" == "$COLD_AUDIT_TEST_FILE" &&
                "$(git rev-parse "$test_port_sha:$COLD_AUDIT_TEST_FILE" 2>/dev/null)" == "$EXPECTED_TEST_PORT_BLOB" &&
                "$(git rev-parse "$source_sha:$COLD_AUDIT_TEST_FILE" 2>/dev/null)" == "$EXPECTED_COLD_AUDIT_TEST_BLOB" &&
                "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true ]]; then
            set_receipt source_guard PASS
          else
            set_receipt source_guard FAIL
            exit 1
          fi

          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$free_kb" =~ ^[0-9]+$ ]] && (( free_kb >= 5242880 )); then set_receipt disk_preflight PASS; else set_receipt disk_preflight FAIL; exit 1; fi
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then set_receipt rustc_version 1.99.1; else set_receipt rustc_version MISMATCH; exit 1; fi

          scratch="$(mktemp -d "$RUNNER_TEMP/g09-stop-recovery.XXXXXX")"
          chmod 700 "$scratch"
          mkdir -m 700 "$scratch/home"
          fixture_tmp="$(mktemp -d "/tmp/g09-sr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          chmod 700 "$fixture_tmp"
          fixture_real="$(realpath -e "$fixture_tmp")"
          socket_probe="$fixture_tmp/srf-1234567890/endpoints/i-0000000000000000/s"
          if [[ "$fixture_real" == "$fixture_tmp" && ${#socket_probe} -le 103 ]]; then
            set_receipt fixture_preflight PASS
          else
            set_receipt fixture_preflight FAIL_PATH_BUDGET
            exit 1
          fi
          export TMPDIR="$fixture_tmp" CARGO_TARGET_DIR="$scratch/target" AI_GUARD_BUILD_REVISION="$source_sha"
          if timeout --kill-after=10s 15m cargo fetch --locked > "$scratch/fetch.log" 2>&1; then set_receipt dependency_fetch PASS; else set_receipt dependency_fetch FAIL; exit 1; fi

          build_rc=0
          timeout --kill-after=15s 90m cargo test --locked --offline --no-default-features --lib --no-run --message-format=json \
            > "$scratch/libtest.jsonl" 2> "$scratch/libtest.stderr" || build_rc=$?
          set_receipt libtest_compile "$([[ "$build_rc" == 0 ]] && echo PASS || echo FAIL)"
          if (( build_rc != 0 )); then set_receipt test_verdict NOT_RUN; set_receipt test_exit NOT_RUN; exit 1; fi
          libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and
            .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) |
            .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/libtest.jsonl" 2>/dev/null || true)"
          if [[ -z "$libtest" || ! -x "$libtest" ]]; then set_receipt libtest_artifact MISMATCH; exit 1; fi
          set_receipt libtest_artifact UNIQUE
          selector_list="$scratch/libtest.list"
          if env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$scratch/home" TMPDIR="$scratch/tmp" \
              "$libtest" --list > "$selector_list" 2> "$scratch/list.stderr" &&
             [[ "$(grep -Fxc "$COLD_AUDIT_TEST: test" "$selector_list" || true)" == 1 ]]; then
            set_receipt selector_inventory PASS
          else
            set_receipt selector_inventory FAIL
            exit 1
          fi

          test_log="$scratch/selected-test.log"
          test_rc=0
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$scratch/home" TMPDIR="$fixture_tmp" \
            AI_GUARD_TEST_D5_IPC_ROOT="$fixture_tmp" \
            timeout --kill-after=10s 300s "$libtest" "$COLD_AUDIT_TEST" --exact --test-threads=1 --nocapture --color=never \
            > "$test_log" 2>&1 || test_rc=$?
          set_receipt test_exit "$test_rc"
          if [[ "$(grep -Fxc 'running 1 test' "$test_log" || true)" == 1 ]]; then set_receipt selected 1; else set_receipt selected 0; fi
          phases=(seed_verified stop_only_ready retained_ipc_verified event_pair_observed loop_joined stop_only_owners_dropped reopened_ack_verified)
          normalized_phases="$scratch/phase-markers.txt"
          awk -v fqn="$COLD_AUDIT_TEST" '
            BEGIN { prefix = "test " fqn " ... " }
            {
              line = $0
              if (index(line, prefix) == 1) line = substr(line, length(prefix) + 1)
              if (line ~ /^cold_recovery_test phase=(seed_verified|stop_only_ready|retained_ipc_verified|event_pair_observed|loop_joined|stop_only_owners_dropped|reopened_ack_verified)$/) print line
            }
          ' "$test_log" > "$normalized_phases"
          summary_ok='^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$'
          if grep -Eq "$summary_ok" "$test_log"; then
            set_receipt passed 1
            set_receipt failed 0
            set_receipt ignored 0
            set_receipt test_counts PASS_1_0_0
          else
            set_receipt passed NOT_ATTESTED
            set_receipt failed NOT_ATTESTED
            set_receipt ignored NOT_ATTESTED
            set_receipt test_counts NOT_ATTESTED
          fi
          last_phase=NOT_ATTESTED
          marker_error=0
          for phase in "${phases[@]}"; do
            marker_count="$(grep -Fxc "cold_recovery_test phase=$phase" "$normalized_phases" || true)"
            if [[ "$marker_count" == 1 ]]; then
              set_receipt "phase_$phase" PASS
              last_phase="$phase"
              case "$phase" in
                seed_verified) set_receipt local_v4_pending_entries 2 ;;
                event_pair_observed) set_receipt audit_pair_observed PASS ;;
                loop_joined) set_receipt stop_result_refusal PASS ;;
                reopened_ack_verified) set_receipt loopback_gateway_first_acknowledgements 2 ;;
              esac
            else
              set_receipt "phase_$phase" NOT_ATTESTED
              marker_error=1
            fi
          done
          set_receipt last_attested_phase "$last_phase"
          if (( test_rc == 0 )) && [[ "$(grep -Fxc 'running 1 test' "$test_log" || true)" == 1 ]] &&
             grep -Eq "$summary_ok" "$test_log" &&
             (( marker_error == 0 )) && [[ "$last_phase" == reopened_ack_verified ]]; then
            set_receipt test_verdict PASS
            set_receipt audit_pair_observed PASS
            set_receipt audit_pair_publication PASS
            set_receipt stop_result_refusal PASS
            set_receipt fixture_worker_state terminal_unchanged
            set_receipt runtime_calls unchanged
            set_receipt decision_calls unchanged
          else
            set_receipt test_verdict FAIL
            exit 1
          fi

      - name: Upload only the closed cold recovery audit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-stop-recovery-audit-${{ github.sha }}
          path: ${{ runner.temp }}/g09-stop-recovery-audit-receipt.txt
          if-no-files-found: error
          retention-days: 14
