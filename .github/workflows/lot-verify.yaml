name: G05 R1 egress retention checks

# Two exact Store checks on the candidate, with private Cargo and libtest logs.
on:
  push:
    branches: ['claude/v1-g05-r1-egress-pin-check-20261122']

permissions:
  contents: read

concurrency:
  group: g05-r1-egress-pin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the egress and signed-position retention checks
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          summary="$RUNNER_TEMP/g05-r1-egress-pin-check-status.txt"
          fetch_exit_code=NOT_RUN
          compilation_status=NOT_RUN
          compilation_exit_code=NOT_RUN
          target_resolution_status=NOT_RUN
          checked_exact_tests=0
          passed_exact_tests=0
          show_compiler_diagnostics=false
          build_json=
          check_rows=

          compiler_summary() {
            local diagnostics
            if [[ "$show_compiler_diagnostics" == false ]]; then
              printf 'compiler_diagnostics_status=NOT_REQUIRED\n'
            elif [[ ! -s "$build_json" ]] ||
                ! diagnostics="$(jq -rs '
                  def source_number: numbers | select(. >= 1 and . <= 1000000 and (. == floor));
                  [ .[] | select(.reason == "compiler-message" and .message.level == "error") | .message ]
                  as $errors
                  | ($errors | map(.code.code? | strings | select(test("^E[0-9]{4}$")))
                     | unique | .[:8][] | "compiler_error_code=\(.)"),
                    ($errors | map(.spans[]? | select(.is_primary == true)
                     | (.file_name | strings | select(length <= 120 and
                          test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\\.rs$"))) as $file
                     | (.line_start | source_number) as $line
                     | (.column_start | source_number) as $column
                     | "\($file):\($line):\($column)")
                     | unique | .[:8][] | "compiler_position=\(.)")
                ' "$build_json" 2>/dev/null)"; then
              printf 'compiler_diagnostics_status=UNAVAILABLE\n'
            elif [[ -z "$diagnostics" ]]; then
              printf 'compiler_diagnostics_status=NONE\n'
            else
              printf 'compiler_diagnostics_status=AVAILABLE\n%s\n' "$diagnostics"
            fi
          }

          write_summary() {
            local workflow_exit_code=$?
            {
              printf 'fetch_exit_code=%s\n' "$fetch_exit_code"
              printf 'compilation_status=%s\n' "$compilation_status"
              printf 'compilation_exit_code=%s\n' "$compilation_exit_code"
              printf 'target_resolution_status=%s\n' "$target_resolution_status"
              printf 'expected_exact_tests=2\n'
              printf 'checked_exact_tests=%s\n' "$checked_exact_tests"
              printf 'passed_exact_tests=%s\n' "$passed_exact_tests"
              if [[ -s "$check_rows" ]]; then
                cat "$check_rows"
              fi
              compiler_summary
              printf 'workflow_exit_code=%s\n' "$workflow_exit_code"
            } > "$summary"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          }
          trap write_summary EXIT

          scratch="$(mktemp -d "$RUNNER_TEMP/g05-r1-check-private.XXXXXX")"
          scratch="$(cd "$scratch" && pwd -P)"
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"
          check_rows="$scratch/checks.txt"
          if cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            fetch_exit_code=0
          else
            fetch_exit_code=$?
            exit "$fetch_exit_code"
          fi

          if cargo test --locked --offline --no-default-features --lib --test audit_retention \
              --no-run --message-format=json > "$build_json" 2> "$scratch/build.stderr"; then
            compilation_status=PASS
            compilation_exit_code=0
          else
            compilation_exit_code=$?
            compilation_status=FAIL
            show_compiler_diagnostics=true
            exit "$compilation_exit_code"
          fi

          test_binary() {
            jq -ers --arg kind "$1" --arg name "$2" --arg prefix "$CARGO_TARGET_DIR/" '
              [.[] | select(.reason == "compiler-artifact" and .target.kind == [$kind]
                and .target.name == $name and .profile.test == true)
                | .executable | strings | select(startswith($prefix))]
              | unique | if length == 1 then .[0] else empty end
            ' "$build_json" 2>/dev/null
          }
          if ! library_test="$(test_binary lib agentsandbox)" ||
              ! integration_test="$(test_binary test audit_retention)" ||
              [[ ! -x "$library_test" || ! -x "$integration_test" ]]; then
            target_resolution_status=FAIL
            show_compiler_diagnostics=true
            exit 1
          fi
          target_resolution_status=PASS

          run_exact_test() {
            local label=$1 binary=$2 selector=$3
            local log="$scratch/$label.log"
            local code banners selected case_results results counts
            local passed=UNOBSERVED failed=UNOBSERVED ignored=UNOBSERVED status=FAIL

            if "$binary" "$selector" --exact --test-threads=1 > "$log" 2>&1; then
              code=0
            else
              code=$?
            fi
            banners="$(grep -Ec '^running [0-9]+ tests?$' "$log" || true)"
            selected="$(awk '/^running [0-9]+ tests?$/ { count += $2 } END { print count + 0 }' "$log")"
            case_results="$(grep -Ec '^test .+ \.\.\. (ok|FAILED|ignored)(,.*)?$' "$log" || true)"
            results="$(grep -c '^test result: ' "$log" || true)"
            counts="$(awk '
              /^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored;/ {
                matches++
                if (length($4) <= 9 && length($6) <= 9 && length($8) <= 9) {
                  counts = $4 " " $6 " " $8
                }
              }
              END { if (matches == 1 && counts != "") print counts }
            ' "$log")"
            if [[ -n "$counts" ]]; then
              read -r passed failed ignored <<< "$counts"
            fi
            if [[ "$selected" == 0 ]]; then
              show_compiler_diagnostics=true
            fi
            if [[ "$code" == 0 && "$banners" == 1 && "$selected" == 1 &&
                "$case_results" == 1 && "$results" == 1 &&
                "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]] &&
                grep -Fxq "test $selector ... ok" "$log" &&
                grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"; then
              status=PASS
              passed_exact_tests=$((passed_exact_tests + 1))
            fi
            checked_exact_tests=$((checked_exact_tests + 1))
            {
              printf '%s_status=%s\n' "$label" "$status"
              printf '%s_exit_code=%s\n' "$label" "$code"
              printf '%s_selected=%s\n' "$label" "$selected"
              printf '%s_passed=%s\n' "$label" "$passed"
              printf '%s_failed=%s\n' "$label" "$failed"
              printf '%s_ignored=%s\n' "$label" "$ignored"
            } >> "$check_rows"
          }

          run_exact_test egress "$library_test" \
            audit::egress_decisions::tests::egress_store_retention_preserves_decision_and_channel_receipts
          run_exact_test signed_position "$integration_test" \
            a_kept_signed_position_stays_live_and_the_prefix_still_verifies
          [[ "$checked_exact_tests" == 2 && "$passed_exact_tests" == 2 ]]

      - name: Upload the sanitized retention receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g05-r1-egress-pin-check-status-${{ github.sha }}
          path: ${{ runner.temp }}/g05-r1-egress-pin-check-status.txt
          if-no-files-found: error
          retention-days: 14
