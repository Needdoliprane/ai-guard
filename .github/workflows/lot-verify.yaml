name: G03 Podman Linux rootless preflight

# This is an aptitude preflight only: no image build/pull, container, worker,
# package installation, runtime qualification, or shared service mutation.
on:
  push:
    branches:
      - claude/v1-g03-podman-linux-rootless-preflight-20261123

permissions:
  contents: read

concurrency:
  group: g03-podman-rootless-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  podman-rootless-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: c5a487f77264e2e89284d9c50f5e3a9f13c70873
      SOURCE_TREE: 39d60ecdc35224112d3a9d823365712994547c12
      SOURCE_PARENT: 66cd42574de11f7a33c617bc77957215820858e5
      EXPECTED_BRANCH: claude/v1-g03-podman-linux-rootless-preflight-20261123
      RUST_BACKTRACE: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize the closed receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g03-podman-linux-rootless-preflight-receipt.txt"
          cat > "$receipt" <<'EOF'
          workflow_sha=NOT_RUN
          source_guard=NOT_RUN
          runner_os_arch=NOT_RUN
          runner_user=NOT_RUN
          podman_present=NOT_RUN
          podman_client_version=unknown
          podman_server_version=unknown
          version_observation=NOT_RUN
          api_protocol=NOT_RUN
          uid_mapping=NOT_RUN
          gid_mapping=NOT_RUN
          service_child=NOT_STARTED
          rootless=NOT_RUN
          socket_owner_mode=NOT_RUN
          private_roots=NOT_RUN
          cgroup_v2=NOT_RUN
          cgroup_controllers=NOT_RUN
          service_cleanup=NOT_STARTED
          scratch_cleanup=NOT_STARTED
          cleanup_phase=NOT_RUN
          last_phase=initialized
          result=NOT_RUN
          scope=hosted Linux x86_64; non-root user; preinstalled Podman only; private Unix service socket and storage roots; no image or workload
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact source lineage and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g03-podman-linux-rootless-preflight-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field workflow_sha "$GITHUB_SHA"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
                "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
                "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
                "$(git cat-file commit "$SOURCE_SHA" 2>/dev/null | awk '$1 == "parent" { parent[++n] = $2 } END { if (n == 1) print parent[1] }')" == "$SOURCE_PARENT" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
                -z "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" ]]; then
            set_field source_guard PASS
            set_field last_phase source_verified
          else
            set_field source_guard FAIL
            set_field last_phase source_guard_failed
            set_field result FAIL
            echo 'G03 source/ref/workflow guard failed; details omitted.' >&2
            exit 1
          fi

      - name: Observe rootless Podman aptitude without installing or launching workloads
        id: preflight
        shell: bash
        run: |
          set +x
          set -uo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g03-podman-linux-rootless-preflight-receipt.txt"
          private="$RUNNER_TEMP/g03-podman-linux-rootless-preflight"
          service_pid=''
          service_started=0
          finalizing=0
          cleanup_failed=0
          result=BLOCKED
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending" || return 1
            chmod 600 "$receipt.pending" || return 1
            mv -- "$receipt.pending" "$receipt" || return 1
          }
          finalize() {
            (( finalizing == 0 )) || return
            finalizing=1
            trap - EXIT
            if (( service_started == 1 )); then
              child_uid=''
              child_ppid=''
              if [[ -r "/proc/$service_pid/status" ]]; then
                child_uid="$(awk '$1 == "Uid:" {print $2; exit}' "/proc/$service_pid/status" 2>/dev/null || true)"
                child_ppid="$(ps -o ppid= -p "$service_pid" 2>/dev/null | tr -d ' ' || true)"
              fi
              if [[ "$child_uid" == "$(id -u)" && "$child_ppid" == "$$" ]]; then
                kill "$service_pid" >/dev/null 2>&1 || true
                wait "$service_pid" >/dev/null 2>&1 || true
                if ! kill -0 "$service_pid" >/dev/null 2>&1; then set_field service_cleanup PASS || cleanup_failed=1; else set_field service_cleanup FAIL || cleanup_failed=1; cleanup_failed=1; fi
              else
                set_field service_cleanup NOT_ATTESTED || cleanup_failed=1
                cleanup_failed=1
              fi
            else
              set_field service_cleanup NOT_STARTED || cleanup_failed=1
            fi
            if [[ -d "$private" && ! -L "$private" && "$private" == "$RUNNER_TEMP/g03-podman-linux-rootless-preflight" ]]; then
              /bin/rm -rf -- "$private" >/dev/null 2>&1 || cleanup_failed=1
              if [[ ! -e "$private" ]]; then set_field scratch_cleanup PASS || cleanup_failed=1; else set_field scratch_cleanup FAIL || cleanup_failed=1; cleanup_failed=1; fi
            else
              set_field scratch_cleanup NOT_ATTESTED || cleanup_failed=1
              cleanup_failed=1
            fi
            set_field cleanup_phase complete || cleanup_failed=1
            if (( cleanup_failed != 0 )); then
              result=FAIL
            fi
            if ! set_field result "$result"; then
              cleanup_failed=1
              result=FAIL
              set_field result FAIL || true
            fi
            {
              printf 'G03 Podman rootless preflight result=%s source=%s\n' "$result" "$SOURCE_SHA"
              printf 'runner=%s user=%s podman=%s client=%s server=%s version_status=%s api_protocol=%s uidmap=%s gidmap=%s rootless=%s socket=%s roots=%s cgroup_v2=%s controllers=%s service_cleanup=%s scratch_cleanup=%s phase=%s\n' \
                "$(awk -F= '$1=="runner_os_arch"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="runner_user"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="podman_present"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="podman_client_version"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="podman_server_version"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="version_observation"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="api_protocol"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="uid_mapping"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="gid_mapping"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="rootless"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="socket_owner_mode"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="private_roots"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="cgroup_v2"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="cgroup_controllers"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="service_cleanup"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="scratch_cleanup"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="last_phase"{print $2}' "$receipt")"
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != PASS ]]; then exit 1; fi
            exit 0
          }
          trap finalize EXIT
          mkdir -m 700 "$private" "$private/control" "$private/storage" "$private/runroot" "$private/tmp" "$private/xdg" "$private/home" "$private/config" "$private/data" "$private/cache"
          canonical_private="$(readlink -f "$private")"
          export HOME="$private/home"
          export XDG_RUNTIME_DIR="$private/xdg"
          export XDG_CONFIG_HOME="$private/config"
          export XDG_DATA_HOME="$private/data"
          export XDG_CACHE_HOME="$private/cache"
          if [[ "$RUNNER_ENVIRONMENT" != github-hosted || "$RUNNER_OS" != Linux || "$RUNNER_ARCH" != X64 ]]; then
            set_field runner_os_arch FAIL; set_field last_phase host_rejected; exit 1
          fi
          set_field runner_os_arch PASS
          if [[ "$(id -u)" =~ ^[0-9]+$ && "$(id -u)" != 0 ]]; then set_field runner_user PASS; else set_field runner_user FAIL; set_field last_phase user_rejected; exit 1; fi
          podman_bin="$(command -v podman || true)"
          if [[ -z "$podman_bin" || ! -x "$podman_bin" ]]; then
            set_field podman_present BLOCKED
            set_field version_observation BLOCKED
            set_field last_phase podman_absent
            exit 1
          fi
          set_field podman_present PASS
          set_field last_phase podman_version
          if ! timeout 10s podman --remote=false version --format json > "$private/client-version.json" 2> "$private/client-version.stderr"; then
            set_field version_observation BLOCKED; set_field last_phase podman_version_unavailable; exit 1
          fi
          client_version="$(jq -er '.Client.Version // .Version' "$private/client-version.json" 2>/dev/null || true)"
          client_api="$(jq -er '.Client.APIVersion' "$private/client-version.json" 2>/dev/null || true)"
          version_re='^v?([0-9]+\.){2}[0-9]+([+-][0-9A-Za-z.-]+)?$'
          api_re='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ${#client_version} -gt 64 || ${#client_api} -gt 32 || ! "$client_version" =~ $version_re || ! "$client_api" =~ $api_re ]]; then
            set_field podman_client_version unknown; set_field version_observation BLOCKED; set_field last_phase client_version_unavailable; exit 1
          fi
          set_field podman_client_version "$client_version"
          set_field version_observation CLIENT_OBSERVED
          set_field runner_user PASS
          current_uid="$(id -u)"
          current_gid="$(id -g)"
          if timeout 20s podman --remote=false --root "$private/storage" --runroot "$private/runroot" --tmpdir "$private/tmp" unshare cat /proc/self/uid_map > "$private/uid-map" 2> "$private/uid-map.stderr" &&
             awk -v uid="$current_uid" 'NR==1 && $1==0 && $2==uid && $3>=1 {mapped=1; next} {if ($1+$3>maximum) maximum=$1+$3} END {exit !(mapped && maximum>=65536)}' "$private/uid-map"; then
            set_field uid_mapping PASS
          else
            set_field uid_mapping BLOCKED; set_field last_phase uid_mapping_unavailable; exit 1
          fi
          if timeout 20s podman --remote=false --root "$private/storage" --runroot "$private/runroot" --tmpdir "$private/tmp" unshare cat /proc/self/gid_map > "$private/gid-map" 2> "$private/gid-map.stderr" &&
             awk -v gid="$current_gid" 'NR==1 && $1==0 && $2==gid && $3>=1 {mapped=1; next} {if ($1+$3>maximum) maximum=$1+$3} END {exit !(mapped && maximum>=65536)}' "$private/gid-map"; then
            set_field gid_mapping PASS
          else
            set_field gid_mapping BLOCKED; set_field last_phase gid_mapping_unavailable; exit 1
          fi
          socket="$private/control/podman.sock"
          set_field last_phase service_start
          podman --remote=false --root "$private/storage" --runroot "$private/runroot" --tmpdir "$private/tmp" system service --time=0 "unix://$socket" > "$private/service.stdout" 2> "$private/service.stderr" &
          service_pid=$!
          service_started=1
          for attempt in $(seq 1 40); do
            if [[ -S "$socket" ]] && timeout 3s podman --remote --url "unix://$socket" info --format json > "$private/server-info.json" 2> "$private/server-info.stderr"; then break; fi
            if ! kill -0 "$service_pid" >/dev/null 2>&1; then set_field last_phase service_exited; exit 1; fi
            sleep 0.25
          done
          if [[ ! -S "$socket" || ! -s "$private/server-info.json" ]]; then set_field last_phase service_unavailable; exit 1; fi
          child_uid="$(awk '$1 == "Uid:" {print $2; exit}' "/proc/$service_pid/status" 2>/dev/null || true)"
          child_ppid="$(ps -o ppid= -p "$service_pid" 2>/dev/null | tr -d ' ' || true)"
          socket_meta="$(stat -c '%u %a' "$socket" 2>/dev/null || true)"
          if [[ "$child_uid" == "$current_uid" && "$child_ppid" == "$$" ]]; then set_field service_child PASS; else set_field service_child FAIL; result=FAIL; set_field last_phase service_ownership_failed; exit 1; fi
          read -r socket_uid socket_mode <<< "$socket_meta"
          if [[ "$socket_uid" == "$current_uid" && "$socket_mode" == 600 && "$(stat -c '%a' "$private/control")" == 700 ]]; then set_field socket_owner_mode PASS; else set_field socket_owner_mode FAIL; result=FAIL; set_field last_phase socket_acl_failed; exit 1; fi
          set_field last_phase service_observed
          if ! timeout 10s podman --remote --url "unix://$socket" version --format json > "$private/server-version.json" 2> "$private/server-version.stderr"; then
            set_field version_observation BLOCKED; set_field last_phase server_version_unavailable; exit 1
          fi
          remote_client_version="$(jq -er '.Client.Version' "$private/server-version.json" 2>/dev/null || true)"
          server_version="$(jq -er '.Server.Version' "$private/server-version.json" 2>/dev/null || true)"
          remote_client_api="$(jq -er '.Client.APIVersion' "$private/server-version.json" 2>/dev/null || true)"
          server_api="$(jq -er '.Server.APIVersion' "$private/server-version.json" 2>/dev/null || true)"
          if [[ ${#server_version} -gt 64 || ${#remote_client_version} -gt 64 || ${#remote_client_api} -gt 32 || ${#server_api} -gt 32 || ! "$server_version" =~ $version_re || "$remote_client_version" != "$client_version" || ! "$remote_client_api" =~ $api_re || ! "$server_api" =~ $api_re ]]; then
            set_field version_observation BLOCKED; set_field last_phase server_version_unavailable; exit 1
          fi
          set_field podman_server_version "$server_version"
          set_field version_observation PASS
          if [[ "$client_api" == "$remote_client_api" && "$remote_client_api" == "$server_api" ]]; then set_field api_protocol PASS; else set_field api_protocol FAIL; result=FAIL; set_field last_phase api_protocol_mismatch; exit 1; fi
          if jq -e '.host.security.rootless == true' "$private/server-info.json" >/dev/null 2>&1; then set_field rootless PASS; else set_field rootless FAIL; result=FAIL; set_field last_phase rootful_refused; exit 1; fi
          graph_root="$(jq -er '.store.graphRoot' "$private/server-info.json" 2>/dev/null || true)"
          run_root="$(jq -er '.store.runRoot' "$private/server-info.json" 2>/dev/null || true)"
          if [[ "$graph_root" == "$canonical_private/storage" && "$run_root" == "$canonical_private/runroot" ]]; then set_field private_roots PASS; else set_field private_roots FAIL; result=FAIL; set_field last_phase storage_root_not_private; exit 1; fi
          if jq -e '.host.cgroupVersion == "v2"' "$private/server-info.json" >/dev/null 2>&1; then set_field cgroup_v2 PASS; else set_field cgroup_v2 BLOCKED; set_field last_phase cgroup_v2_unavailable; exit 1; fi
          controllers="$(tr ' ' '\n' < /sys/fs/cgroup/cgroup.controllers 2>/dev/null | sort -u | paste -sd, -)"
          process_cgroup="$(awk -F: '$1=="0" {print $3; exit}' /proc/"$service_pid"/cgroup 2>/dev/null || true)"
          effective_controllers=''
          if [[ -n "$process_cgroup" && -r "/sys/fs/cgroup$process_cgroup/cgroup.controllers" ]]; then effective_controllers="$(tr ' ' '\n' < "/sys/fs/cgroup$process_cgroup/cgroup.controllers" | sort -u | paste -sd, -)"; fi
          if [[ ",$controllers," == *,cpu,* && ",$controllers," == *,memory,* && ",$controllers," == *,pids,* &&
                ",$effective_controllers," == *,cpu,* && ",$effective_controllers," == *,memory,* && ",$effective_controllers," == *,pids,* ]]; then
            set_field cgroup_controllers PASS
          else
            set_field cgroup_controllers BLOCKED; set_field last_phase required_controllers_unavailable; exit 1
          fi
          result=PASS
          set_field last_phase preflight_complete
          exit 0

      - name: Upload only the closed preflight receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g03-podman-linux-rootless-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/g03-podman-linux-rootless-preflight-receipt.txt
          if-no-files-found: error
          retention-days: 14
