name: G09 terminal wait receipt software-only check

# One exact pure software witness; no Docker or runtime setup.
on:
  push:
    branches:
      - claude/v1-g09-terminal-wait-sample-software-check-20261123

permissions:
  contents: read

concurrency:
  group: g09-terminal-wait-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terminal-wait-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SOURCE_SHA: f84cc3056c9c4ae6c4d4097ca36cc4d61b02e06d
      SOURCE_TREE_SHA: 49328b693358a3d0763027fe2118c4626ce16cb0
      SOURCE_PARENT_SHA: f2072a854a487dbb2d0189ee892b6f5db2e400c4
      SOURCE_PARENT_TREE_SHA: 823a6a3431c8e8263e4a606ec179a79b99d98886
      SOURCE_PARENT_PARENT_SHA: 4212a83f5f1172a0c099d0d6125fe2f5813ef519
      SOURCE_PARENT_PARENT_TREE_SHA: 90651a972f96a47c162703817b53c42423b8390f
      TEST_FILE: tests/broker_runtime.rs
      TEST_BLOB_SHA: b941f5f282130016aeb01a7c9c71dc9521385532
      CARGO_LOCK_SHA: 05847a300405860df8f860d5dc1c39ca423dfa0d
      EXPECTED_BRANCH: claude/v1-g09-terminal-wait-sample-software-check-20261123
      TEST_SELECTOR: terminal_wait_receipt_samples_only_expired_pairs_with_closed_fields
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize closed software witness receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-terminal-wait-software-receipt.txt"
          cat > "$receipt" <<EOF
          source_sha=$SOURCE_SHA
          source_tree_sha=$SOURCE_TREE_SHA
          source_parent_sha=$SOURCE_PARENT_SHA
          workflow_sha=$WORKFLOW_SHA
          workflow_parent_sha=NOT_VERIFIED
          test_file=$TEST_FILE
          test_selector=$TEST_SELECTOR
          profile=no-default-features
          source_guard=NOT_RUN
          disk_preflight=NOT_RUN
          rustc_version=NOT_RUN
          dependency_fetch=NOT_RUN
          test_command=NOT_RUN
          selected=NOT_ATTESTED
          focused_software_test=NOT_ATTESTED
          passed=NOT_ATTESTED
          failed=NOT_ATTESTED
          ignored=NOT_ATTESTED
          filtered=NOT_ATTESTED
          test_exit=NOT_RUN
          software_test_verdict=NOT_RUN
          runtime_engine=NOT_RUN
          runtime_worker=NOT_RUN
          provider=NOT_RUN
          scratch_cleanup=NOT_RUN
          receipt_closed=NO
          result=NOT_RUN
          scope=one exact pure software test; no engine, worker, runtime, provider, or process signaling
          EOF
          chmod 600 "$receipt"

      - name: Checkout exact software witness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify exact source and branch
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-wait-software-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1 == key { $0 = key "=" value; found=1 } { print } END { if (!found) print key "=" value }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git status --porcelain=v1 --untracked-files=all)" == "" &&
                "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" &&
                "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$SOURCE_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_SHA")" == "$SOURCE_PARENT_SHA" &&
                "$(git rev-parse "$SOURCE_PARENT_SHA^{tree}")" == "$SOURCE_PARENT_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_PARENT_SHA")" == "$SOURCE_PARENT_PARENT_SHA" &&
                "$(git rev-parse "$SOURCE_PARENT_PARENT_SHA^{tree}")" == "$SOURCE_PARENT_PARENT_TREE_SHA" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git diff --name-only "$SOURCE_PARENT_SHA" "$SOURCE_SHA")" == "$TEST_FILE" &&
                "$(git rev-parse "$SOURCE_SHA:$TEST_FILE")" == "$TEST_BLOB_SHA" &&
                "$(git rev-parse "$SOURCE_SHA:Cargo.lock")" == "$CARGO_LOCK_SHA" &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                "$(grep -Fc "fn $TEST_SELECTOR()" "$TEST_FILE")" == 1 ]]; then
            set_field source_guard PASS
            set_field workflow_parent_sha "$SOURCE_SHA"
          else
            set_field source_guard FAIL
            exit 1
          fi

      - name: Fetch locked dependencies and run one exact software witness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-terminal-wait-software-receipt.txt"
          scratch=""
          finish() {
            local code=$? cleanup_rc=0
            trap - EXIT
            set +e
            if [[ -n "$scratch" && "$scratch" == "$RUNNER_TEMP/g09-terminal-software."* ]]; then
              rm -rf -- "$scratch" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$scratch" ]] || cleanup_rc=1
            fi
            if (( cleanup_rc == 0 )); then
              sed -i 's/^scratch_cleanup=.*/scratch_cleanup=PASS/' "$receipt"
            else
              sed -i 's/^scratch_cleanup=.*/scratch_cleanup=FAIL/' "$receipt"
              code=1
            fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; else result=FAIL; fi
            sed -i "s/^result=.*/result=$result/" "$receipt"
            exit "$code"
          }
          trap finish EXIT
          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1 == key { $0 = key "=" value; found=1 } { print } END { if (!found) print key "=" value }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$free_kb" =~ ^[0-9]+$ ]] && (( free_kb >= 2097152 )); then set_field disk_preflight PASS; else set_field disk_preflight FAIL; exit 1; fi
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then set_field rustc_version 1.99.1; else set_field rustc_version MISMATCH; exit 1; fi
          scratch="$(mktemp -d "$RUNNER_TEMP/g09-terminal-software.XXXXXX")"
          chmod 700 "$scratch"
          mkdir -m 700 "$scratch/tmp" "$scratch/target"
          export TMPDIR="$scratch/tmp" CARGO_TARGET_DIR="$scratch/target"
          if cargo fetch --locked > "$scratch/fetch.log" 2>&1; then set_field dependency_fetch PASS; else set_field dependency_fetch FAIL; exit 1; fi
          set_field test_command cargo_test_locked_offline_no_default_features_test_broker_runtime_exact_single_selector
          test_rc=0
          if cargo test --locked --offline --no-default-features --test broker_runtime "$TEST_SELECTOR" -- --exact --test-threads=1 > "$scratch/test.log" 2>&1; then test_rc=0; else test_rc=$?; fi
          set_field test_exit "$test_rc"
          if [[ "$(grep -Fxc 'running 1 test' "$scratch/test.log" || true)" == 1 ]]; then
            set_field selected 1/1
            set_field focused_software_test 1/1
          else
            set_field selected NOT_ATTESTED
            set_field focused_software_test NOT_ATTESTED
          fi
          if [[ "$(grep -Ec '^test result:' "$scratch/test.log" || true)" == 1 ]] &&
             grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$scratch/test.log"; then
            set_field passed 1
            set_field failed 0
            set_field ignored 0
            filtered="$(sed -nE 's/^test result: ok\. 1 passed; 0 failed; 0 ignored; ([0-9]+) measured; ([0-9]+) filtered out; finished in .*/\2/p' "$scratch/test.log")"
            if [[ "$filtered" =~ ^[0-9]+$ ]]; then set_field filtered "$filtered"; else set_field filtered NOT_ATTESTED; fi
            if (( test_rc == 0 )) && [[ "$(grep -Fxc 'running 1 test' "$scratch/test.log" || true)" == 1 ]] &&
               [[ "$(grep -Fxc "test $TEST_SELECTOR ... ok" "$scratch/test.log" || true)" == 1 ]]; then
              set_field software_test_verdict PASS_1_0_0
            else
              set_field software_test_verdict FAIL
              exit 1
            fi
          else
            set_field passed NOT_ATTESTED
            set_field failed NOT_ATTESTED
            set_field ignored NOT_ATTESTED
            set_field filtered NOT_ATTESTED
            set_field software_test_verdict FAIL
            exit 1
          fi

      - name: Close the software witness receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-terminal-wait-software-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1 == key { $0 = key "=" value; found=1 } { print } END { if (!found) print key "=" value }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          if [[ "$(grep '^result=' "$receipt" | cut -d= -f2)" == NOT_RUN ]]; then set_field result FAIL; fi
          if [[ "$(grep '^scratch_cleanup=' "$receipt" | cut -d= -f2)" == NOT_RUN ]]; then set_field scratch_cleanup NOT_CREATED; fi
          set_field receipt_closed YES
          {
            printf 'G09 software witness result=%s\n' "$(grep '^result=' "$receipt" | cut -d= -f2)"
            grep -E '^(source_guard|disk_preflight|rustc_version|dependency_fetch|profile|test_command|selected|focused_software_test|passed|failed|ignored|filtered|test_exit|software_test_verdict|runtime_engine|runtime_worker|provider|scratch_cleanup|receipt_closed|result)=' "$receipt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only the closed software witness receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-terminal-wait-software-${{ github.sha }}
          path: ${{ runner.temp }}/g09-terminal-wait-software-receipt.txt
          if-no-files-found: error
          retention-days: 14
