name: G09 recovery diagnostic

# One synthetic local recovery selector on hosted Linux x86_64. This workflow
# does not qualify Docker/Podman/Kubernetes engines or real providers.

on:
  push:
    branches: ['claude/v1-g09-recovery-check-20261122']

permissions:
  contents: read

concurrency:
  group: g09-recovery-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free hosted runner disk for the Rust target
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch dependencies with the repository toolchain
        run: |
          rustc --version
          cargo fetch --locked

      - name: Run the exact G09 recovery selector
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          selector='broker_crash_recovery_observes_then_stops_the_same_running_instance'
          run_log="$RUNNER_TEMP/g09-private-test.log"
          summary="$RUNNER_TEMP/g09-test-summary.txt"
          tmpdir_status=NOT_RUN
          selected_test_count=0
          selector_guard=NOT_RUN
          cargo_exit_code=NOT_RUN
          workflow_exit_code=2
          test_result=NOT_RUN
          reconciliation_diagnostic=NOT_REACHED

          write_summary() {
            {
              printf 'selector=%s\n' "$selector"
              printf 'tmpdir_status=%s\n' "$tmpdir_status"
              printf 'selected_test_count=%s\n' "$selected_test_count"
              printf 'selector_guard=%s\n' "$selector_guard"
              printf 'test_result=%s\n' "$test_result"
              printf 'reconciliation_diagnostic=%s\n' "$reconciliation_diagnostic"
              printf 'cargo_exit_code=%s\n' "$cargo_exit_code"
              printf 'workflow_exit_code=%s\n' "$workflow_exit_code"
            } > "$summary"
            chmod 600 "$summary"
            {
              printf '### G09 targeted recovery selector\n\n'
              cat "$summary"
              printf '\n'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          tmpdir_candidate="$(mktemp -d /tmp/g09.XXXXXX)"
          chmod 700 "$tmpdir_candidate"
          export TMPDIR="$(cd "$tmpdir_candidate" && pwd -P)"
          if [[ "$TMPDIR" != /tmp/g09.* || ${#TMPDIR} -ge 52 ]]; then
            tmpdir_status=FAIL
            write_summary
            exit 2
          fi
          tmpdir_status=PASS

          set +e
          cargo test --locked --offline --no-default-features --test runner_recovery \
            broker_crash_recovery_observes_then_stops_the_same_running_instance \
            -- --exact --test-threads=1 --nocapture > "$run_log" 2>&1
          cargo_exit_code=$?
          set -e

          diagnostic_pattern='^authenticated terminal reconciliation failed: exit_code=(None|Some\(-?[0-9]{1,10}\)), '
          diagnostic_pattern+='cli_message_category=(no_terminal_proof|invocation_adoption_pending|audit_related|runtime_related|no_safe_cli_message), '
          diagnostic_pattern+='worker_state=(Reserved|Preparing|Created|StartIssued|Running|Stopping|Terminal|InDoubt|Cancelled|unavailable), '
          diagnostic_pattern+='quota_held=(None|Some\((true|false)\)), usage_count=(None|Some\([0-9]{1,10}\)), '
          diagnostic_pattern+='terminal_ack=(true|false), audit_head_unchanged=(None|Some\((true|false)\))$'
          safe_diagnostic="$(grep -E -m 1 "$diagnostic_pattern" "$run_log" || true)"
          if [[ -n "$safe_diagnostic" ]]; then
            reconciliation_diagnostic="$safe_diagnostic"
          fi

          selected_test_count="$(grep -Fxc 'running 1 test' "$run_log" || true)"
          if [[ "$selected_test_count" == 1 ]]; then
            selector_guard=PASS
          else
            selector_guard=FAIL
          fi
          if [[ "$cargo_exit_code" == 0 && "$selector_guard" == PASS ]]; then
            test_result=PASS
          else
            test_result=FAIL
          fi
          if [[ "$cargo_exit_code" != 0 ]]; then
            workflow_exit_code=$cargo_exit_code
          elif [[ "$selector_guard" != PASS ]]; then
            workflow_exit_code=1
          else
            workflow_exit_code=0
          fi

          write_summary
          exit "$workflow_exit_code"

      - name: Upload sanitized selector status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-recovery-status-${{ github.sha }}
          path: ${{ runner.temp }}/g09-test-summary.txt
          if-no-files-found: ignore
          retention-days: 14
