name: G07 R1 batch horizon verification

on:
  push:
    branches: ['claude/v1-g07-r1-activity-batch-check-20261122']

permissions:
  contents: read

concurrency:
  group: lot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Free runner disk for the test target
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Verify atomic rollback at the R1 archive horizon
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(mktemp -d /tmp/aig.XXXXXX)"
          product_sha=656fb664626ebfdfc7605673b7d8c9da04c63ab5
          selector=batch_at_the_archived_horizon_rolls_back_and_keeps_the_typed_conflict

          report() {
            printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          report_cargo_failure() {
            local phase=$1 status=$2 output=$3 codes
            codes=$(sed -nE 's/^error\[(E[0-9]{4})\]:.*/\1/p' <<< "$output" | sort -u | paste -sd, -)
            if [[ -n $codes ]]; then
              report "FAIL $phase category=rustc exit=$status codes=$codes"
            elif grep -Eq '^error: (linking |could not link |failed to build archive)' <<< "$output"; then
              report "FAIL $phase category=linker exit=$status"
            elif grep -Fq 'No space left on device' <<< "$output"; then
              report "FAIL $phase category=disk_space exit=$status"
            else
              report "FAIL $phase category=cargo exit=$status"
            fi
          }

          if [[ ! $GITHUB_SHA =~ ^[0-9a-f]{40}$ || $(git rev-parse HEAD 2>/dev/null) != "$GITHUB_SHA" ||
                $(git show -s --format=%P HEAD 2>/dev/null) != "$product_sha" ||
                $(git diff --name-only "$product_sha" HEAD 2>/dev/null) != .github/workflows/lot-verify.yaml ]]; then
            report 'FAIL checkout category=unexpected_revision_or_delta'
            exit 1
          fi
          report "product_sha=$product_sha verification_sha=$GITHUB_SHA"
          if output=$(cargo fetch --locked 2>&1); then
            report 'PASS dependencies'
          else
            report_cargo_failure dependencies "$?" "$output"
            exit 1
          fi

          status=0
          output=$(cargo test --locked --offline --no-default-features --test audit_retention \
            -- --exact --test-threads=1 "$selector" 2>&1) || status=$?
          counts=$(sed -nE 's/^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored; [0-9]+ measured; [0-9]+ filtered out;.*/\2 \3 \4/p' <<< "$output")
          if [[ ! $counts =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then
            report_cargo_failure audit_retention "$status" "$output"
            exit 1
          fi
          read -r passed failed ignored <<< "$counts"
          if (( status != 0 || passed != 1 || failed != 0 || ignored != 0 )) ||
            ! grep -Fxq -- "test $selector ... ok" <<< "$output"; then
            report "FAIL $selector category=test_result passed=$passed expected=1 failed=$failed ignored=$ignored exit=$status"
            exit 1
          fi
          report "PASS $selector passed=$passed failed=$failed ignored=$ignored"
