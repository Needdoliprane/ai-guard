name: G07 retirement RED receipt

on:
  push:
    branches: ['claude/v1-g07-retirement-red-receipt-20261122']

permissions:
  contents: read

concurrency:
  group: g07-retirement-red-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Initialize sanitized receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          printf 'workflow_sha=%s\nworkflow_parent=NOT_VERIFIED\nsource_sha=3a2f7aede4902c2658a4da68f886a387e401ec61\nsource_parent=6dd5e2dc16eea251fbb2affbf272830f4af5e759\nsource_checkout=NOT_RUN\nworkflow_lineage=NOT_RUN\nfetch=NOT_RUN\nbuild=NOT_RUN\nartifact=NOT_RUN\ntest=NOT_RUN\ntest_exit=NOT_RUN\nselection_banner_count=0\nselected_test_count=0\ncase_result_count=0\nfailed_case_count=0\nignored_count=0\npanic_at_unwrap_count=0\ncorrupt_reason_count=0\nelse_control_count=0\nverdict=INCONCLUSIVE\n' "$WORKFLOW_SHA" > "$RUNNER_TEMP/g07-red-receipt.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3a2f7aede4902c2658a4da68f886a387e401ec61
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and workflow lineage
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          receipt="$RUNNER_TEMP/g07-red-receipt.txt"
          source_status=FAIL
          lineage_status=FAIL
          if [[ "$(git rev-parse HEAD)" == 3a2f7aede4902c2658a4da68f886a387e401ec61 &&
                "$(git rev-parse HEAD^)" == 6dd5e2dc16eea251fbb2affbf272830f4af5e759 &&
                -f src/broker/writer_status_projection_tests.rs ]] &&
              grep -Fq 'writer.result_status(operation).await.unwrap()' src/broker/writer_status_projection_tests.rs &&
              grep -Fq 'the intact journal must still supply the operation' src/broker/writer_status_projection_tests.rs; then
            source_status=PASS
          fi
          if [[ "$(git rev-parse "$WORKFLOW_SHA^")" == 88041c33704fd7c53f64fc78a4ed07719bb4c2af &&
                "$(git diff --name-only 88041c33704fd7c53f64fc78a4ed07719bb4c2af "$WORKFLOW_SHA")" == '.github/workflows/lot-verify.yaml' ]]; then
            lineage_status=PASS
          fi
          printf 'source_checkout=%s\nworkflow_lineage=%s\nworkflow_parent=88041c33704fd7c53f64fc78a4ed07719bb4c2af\n' \
            "$source_status" "$lineage_status" >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          [[ "$source_status" == PASS && "$lineage_status" == PASS ]]
      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -uo pipefail
          if cargo fetch --locked > "$RUNNER_TEMP/g07-red-fetch-private.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'fetch=%s fetch_exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g07-red-receipt.txt"
          exit "$rc"
      - name: Compile one libtest executable
        id: build
        shell: bash
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/g07-red-private"
          mkdir -m 700 "$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          cargo test --locked --offline --no-default-features --lib --no-run --message-format=json \
            > "$scratch/build.jsonl" 2> "$scratch/build.stderr"
          rc=$?
          printf 'build=%s build_exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g07-red-receipt.txt"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" == 0 ]]; then
            binary="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/build.jsonl")"
            if [[ -x "$binary" ]]; then
              digest="$(sha256sum "$binary" | cut -d ' ' -f1)"
              printf 'artifact=PASS\nlibtest_sha256=%s\n' "$digest" >> "$RUNNER_TEMP/g07-red-receipt.txt"
              echo "binary=$binary" >> "$GITHUB_OUTPUT"
              echo "sha256=$digest" >> "$GITHUB_OUTPUT"
            else
              printf 'artifact=FAIL\n' >> "$RUNNER_TEMP/g07-red-receipt.txt"
              exit 1
            fi
          fi
          exit "$rc"
      - name: Run exact RED without nocapture and classify the failure
        id: oracle
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          TEST_BINARY: ${{ steps.build.outputs.binary }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$RUNNER_TEMP/g07-red-private"
          log="$scratch/red.log"
          receipt="$RUNNER_TEMP/g07-red-receipt.txt"
          selector='broker::writer::status_projection_tests::abandoned_retirement_audit_read_keeps_acknowledged_result_readable'
          if timeout --kill-after=5s 240s "$TEST_BINARY" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1; then rc=0; else rc=$?; fi
          selection_banner_count="$(grep -Ec '^running [0-9]+ tests?$' "$log" || true)"
          selected_test_count="$(awk '/^running [0-9]+ tests?$/ { count += $2 } END { print count + 0 }' "$log")"
          case_result_count="$(grep -Ec '^test .+ \.\.\. (ok|FAILED|ignored)(,.*)?$' "$log" || true)"
          failed_case_count="$(grep -Fxc "test $selector ... FAILED" "$log" || true)"
          ignored_count="$(grep -Ec '^test .* \.\.\. ignored(,.*)?$' "$log" || true)"
          panic_at_unwrap_count="$(grep -Ec '^thread .* panicked at src/broker/writer_status_projection_tests\.rs:162:[0-9]+:' "$log" || true)"
          corrupt_reason_count="$(grep -Ec 'called `Result::unwrap\(\)` on an `Err` value: Corrupt' "$log" || true)"
          else_control_count="$(grep -Fxc 'the intact journal must still supply the operation' "$log" || true)"
          result_count="$(grep -c '^test result: ' "$log" || true)"
          verdict=INCONCLUSIVE
          if [[ "$rc" == 101 && "$selection_banner_count" == 1 && "$selected_test_count" == 1 &&
                "$case_result_count" == 1 && "$failed_case_count" == 1 && "$ignored_count" == 0 &&
                "$result_count" == 1 && "$panic_at_unwrap_count" == 1 &&
                "$corrupt_reason_count" == 1 && "$else_control_count" == 0 ]] &&
              grep -Eq '^test result: FAILED\. 0 passed; 1 failed; 0 ignored;.*$' "$log"; then
            verdict=RED_REPRODUCED
          fi
          {
            printf 'test=FAIL_EXPECTED\ntest_exit=%s\n' "$rc"
            printf 'selection_banner_count=%s\nselected_test_count=%s\ncase_result_count=%s\n' \
              "$selection_banner_count" "$selected_test_count" "$case_result_count"
            printf 'failed_case_count=%s\nignored_count=%s\npanic_at_unwrap_count=%s\n' \
              "$failed_case_count" "$ignored_count" "$panic_at_unwrap_count"
            printf 'corrupt_reason_count=%s\nelse_control_count=%s\nverdict=%s\n' \
              "$corrupt_reason_count" "$else_control_count" "$verdict"
          } >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          test "$verdict" = RED_REPRODUCED
      - name: Upload sanitized RED receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-retirement-red-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/g07-red-receipt.txt
          if-no-files-found: warn
          retention-days: 14
