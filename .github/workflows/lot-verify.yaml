name: G08 owned accounting summary check

# Validate seven exact accounting and worker summary contracts in local SQLite fixtures.
# No engine, provider, database service or other external service is started.
on:
  push:
    branches:
      - claude/v1-g08-owned-accounting-summary-check-20261123

permissions:
  contents: read

concurrency:
  group: g08-owned-accounting-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-accounting-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SOURCE_SHA: e1e766f6bd936cdab29aed6851b6f2b826724e5a
      SOURCE_TREE: 0dc7211abfc5be30c67397ab83b6fd08236ceb64
      SOURCE_PARENT_SHA: ad15469e58460799f52e20f37d95584c1c1bddee
      SOURCE_PARENT_TREE: a7b529cceb8d3a351ca47518eda9a2a7962b1bba
      SOURCE_BOUNDS_TEST_SHA: 99090b37eadc52661c00b3a6b5593271b829be01
      SOURCE_BOUNDS_TEST_TREE: 22a97dabe83056355b28df6824e1262aeb7ed277
      SOURCE_USAGE_TEST_SHA: 39c6d3466efff33ade4263159e5a03a5e91a05a4
      SOURCE_USAGE_TEST_TREE: 458efdad78052635440e33ae713c4d70cfb053b1
      SOURCE_USAGE_IMPL_SHA: 875995ed363d94db8ad64ffbf7bf2a6b2c472c5a
      SOURCE_USAGE_IMPL_TREE: 007815d345bef4090d7e7b81ff695e7984116b5c
      SOURCE_API_TEST_SHA: 6d11f8b80c468da7e04cc9df7527b928bed398e1
      SOURCE_API_TEST_TREE: b1c56beb23b8c14470ad67203e522beec0c2f7ac
      SOURCE_SQLITE_BASE_SHA: 16bc18f742d04ed02da258dc353a3facf89c99e6
      SOURCE_SQLITE_BASE_TREE: 62c022dd0318e6286df07889c5a2161e09636e26
      SOURCE_TEST_PATH: src/api/human_sources/journal_tests/owned_admin_reads.rs
      SOURCE_PRODUCT_PATH: src/audit/human_summary.rs
      EXPECTED_BRANCH: claude/v1-g08-owned-accounting-summary-check-20261123
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
    steps:
      - name: Initialize closed SQLite summary receipt
        shell: bash
        run: |
          umask 077
          receipt="$RUNNER_TEMP/g08-owned-accounting-summary-receipt.txt"
          cat > "$receipt" <<'EOF'
          source_sha=e1e766f6bd936cdab29aed6851b6f2b826724e5a
          source_tree=0dc7211abfc5be30c67397ab83b6fd08236ceb64
          source_parent_sha=ad15469e58460799f52e20f37d95584c1c1bddee
          source_parent_tree=a7b529cceb8d3a351ca47518eda9a2a7962b1bba
          source_bounds_test_sha=99090b37eadc52661c00b3a6b5593271b829be01
          source_bounds_test_tree=22a97dabe83056355b28df6824e1262aeb7ed277
          source_usage_test_sha=39c6d3466efff33ade4263159e5a03a5e91a05a4
          source_usage_test_tree=458efdad78052635440e33ae713c4d70cfb053b1
          source_usage_impl_sha=875995ed363d94db8ad64ffbf7bf2a6b2c472c5a
          source_usage_impl_tree=007815d345bef4090d7e7b81ff695e7984116b5c
          source_api_test_sha=6d11f8b80c468da7e04cc9df7527b928bed398e1
          source_api_test_tree=b1c56beb23b8c14470ad67203e522beec0c2f7ac
          source_sqlite_base_sha=16bc18f742d04ed02da258dc353a3facf89c99e6
          source_sqlite_base_tree=62c022dd0318e6286df07889c5a2161e09636e26
          rust_lineage=NOT_RUN
          checkout_shallow=NOT_RUN
          workflow_sha=NOT_RUN
          source_guard=NOT_RUN
          rustc=NOT_RUN
          cargo=NOT_RUN
          cargo_fetch=NOT_RUN
          libtest_compile=NOT_RUN
          libtest_sha256=unknown
          selector_1=NOT_RUN
          selector_2=NOT_RUN
          selector_3=NOT_RUN
          selector_4=NOT_RUN
          selector_5=NOT_RUN
          selector_6=NOT_RUN
          selector_7=NOT_RUN

          selected=0
          passed=0
          failed=0
          ignored=0
          private_cleanup=NOT_RUN
          last_phase=NOT_RUN
          result=NOT_RUN
          scope=seven exact library tests; SQLite fixtures only; no engine/provider/service; selector names intentionally omitted
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 8

      - name: Fetch dependencies and run seven exact SQLite selectors
        id: verify
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g08-owned-accounting-summary-receipt.txt"
          private_root=
          phase=source_guard
          result=FAIL
          selected_count=0
          passed_count=0
          failed_count=0
          ignored_count=0
          run_failed=0
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            chmod 600 "$receipt.tmp"
            mv -- "$receipt.tmp" "$receipt"
          }
          finish() {
            local code=$? cleanup_rc=0 final_phase
            trap - EXIT
            set +e
            if [[ -n "$private_root" && "$private_root" == /tmp/g08wr.* ]]; then
              rm -rf -- "$private_root" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$private_root" ]] || cleanup_rc=1
            fi
            case "$phase" in
              source_guard|toolchain|scratch_setup|dependency_fetch|libtest_compile|exact_selectors|complete)
                final_phase="$phase" ;;
              *) final_phase=unknown ;;
            esac
            if (( cleanup_rc != 0 )); then final_phase=private_cleanup; fi
            if (( cleanup_rc == 0 )); then set_receipt private_cleanup PASS; else set_receipt private_cleanup FAIL; fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; else result=FAIL; fi
            set_receipt last_phase "$final_phase"
            set_receipt result "$result"
            {
              printf 'G08 owned accounting summary=%s source=%s\n' "$result" "$SOURCE_SHA"
              printf 'Seven exact SQLite selectors selected=%s passed=%s failed=%s ignored=%s cleanup=%s phase=%s\n' \
                "$selected_count" "$passed_count" "$failed_count" "$ignored_count" \
                "$(awk -F= '$1=="private_cleanup"{print $2}' "$receipt")" "$final_phase"
            } >> "$GITHUB_STEP_SUMMARY"
            if (( code == 0 && cleanup_rc != 0 )); then code=1; fi
            exit "$code"
          }
          trap finish EXIT

          set_receipt workflow_sha "$GITHUB_SHA"
          expected_source_paths="$(printf '%s\n%s' "$SOURCE_TEST_PATH" "$SOURCE_PRODUCT_PATH")"
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
             "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
             "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
             "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
             "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
             "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
             "$(git show -s --format=%P "$SOURCE_SHA" 2>/dev/null)" == "$SOURCE_PARENT_SHA" &&
             "$(git rev-parse "$SOURCE_PARENT_SHA^{tree}" 2>/dev/null)" == "$SOURCE_PARENT_TREE" &&
             "$(git show -s --format=%P "$SOURCE_PARENT_SHA" 2>/dev/null)" == "$SOURCE_BOUNDS_TEST_SHA" &&
             "$(git rev-parse "$SOURCE_BOUNDS_TEST_SHA^{tree}" 2>/dev/null)" == "$SOURCE_BOUNDS_TEST_TREE" &&
             "$(git show -s --format=%P "$SOURCE_BOUNDS_TEST_SHA" 2>/dev/null)" == "$SOURCE_USAGE_TEST_SHA" &&
             "$(git rev-parse "$SOURCE_USAGE_TEST_SHA^{tree}" 2>/dev/null)" == "$SOURCE_USAGE_TEST_TREE" &&
             "$(git show -s --format=%P "$SOURCE_USAGE_TEST_SHA" 2>/dev/null)" == "$SOURCE_USAGE_IMPL_SHA" &&
             "$(git rev-parse "$SOURCE_USAGE_IMPL_SHA^{tree}" 2>/dev/null)" == "$SOURCE_USAGE_IMPL_TREE" &&
             "$(git show -s --format=%P "$SOURCE_USAGE_IMPL_SHA" 2>/dev/null)" == "$SOURCE_API_TEST_SHA" &&
             "$(git rev-parse "$SOURCE_API_TEST_SHA^{tree}" 2>/dev/null)" == "$SOURCE_API_TEST_TREE" &&
             "$(git show -s --format=%P "$SOURCE_API_TEST_SHA" 2>/dev/null)" == "$SOURCE_SQLITE_BASE_SHA" &&
             "$(git rev-parse "$SOURCE_SQLITE_BASE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_SQLITE_BASE_TREE" &&
             "$(git diff --name-only "$SOURCE_SQLITE_BASE_SHA" "$SOURCE_SHA" 2>/dev/null | LC_ALL=C sort)" == "$expected_source_paths" &&
             "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
             "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" ]] || {
            set_receipt source_guard FAIL
            echo 'G08 source/ref guard failed; details omitted.' >&2
            exit 1
          }
          set_receipt source_guard PASS
          set_receipt checkout_shallow PASS
          set_receipt rust_lineage PASS

          phase=toolchain
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]] || { set_receipt rustc MISMATCH; exit 1; }
          set_receipt rustc 1.99.1
          cargo_line="$(cargo --version 2>/dev/null)" || cargo_line=''
          [[ "$cargo_line" =~ ^cargo\ 1\.99\.1($|[[:space:]]) ]] || { set_receipt cargo MISMATCH; exit 1; }
          set_receipt cargo 1.99.1

          phase=scratch_setup
          private_root="$(mktemp -d /tmp/g08wr.XXXXXX)" || exit 1
          private_root="$(realpath -e "$private_root")" || exit 1
          chmod 700 "$private_root"
          mkdir -m 700 "$private_root/target" "$private_root/tmp"
          export TMPDIR="$private_root/tmp" CARGO_TARGET_DIR="$private_root/target"
          export AI_GUARD_BUILD_REVISION="$SOURCE_SHA"

          phase=dependency_fetch
          if cargo fetch --locked > "$private_root/cargo-fetch.log" 2>&1; then
            set_receipt cargo_fetch PASS
          else
            set_receipt cargo_fetch FAIL
            exit 1
          fi

          phase=libtest_compile
          build_json="$private_root/libtest.jsonl"
          if timeout --kill-after=15s 45m cargo test --locked --offline --no-default-features --lib --no-run \
              --message-format=json > "$build_json" 2> "$private_root/libtest.stderr"; then
            libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and
              .target.name == "agentsandbox" and .target.kind == ["lib"] and
              .profile.test == true and .features == [] and .executable != null) |
              .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
            [[ -n "$libtest" && -x "$libtest" ]] || { set_receipt libtest_compile ARTIFACT_MISMATCH; exit 1; }
            set_receipt libtest_compile PASS
            set_receipt libtest_sha256 "$(sha256sum "$libtest" | awk '{print $1}')"
          else
            set_receipt libtest_compile FAIL
            exit 1
          fi

          phase=exact_selectors
          selectors=(
            api::human_sources::journal_tests::owned_admin_reads::owned_accounting_summary_format14_reads_quota_and_observed_usage_with_one_receipt
            api::human_sources::journal_tests::owned_admin_reads::owned_accounting_summary_format15_reads_quota_and_observed_usage_with_one_receipt
            api::human_sources::journal_tests::owned_admin_reads::owned_worker_summary_format14_counts_only_durable_worker_facts
            api::human_sources::journal_tests::owned_admin_reads::owned_worker_summary_format15_counts_only_durable_worker_facts
            api::human_sources::journal_tests::owned_admin_reads::owned_sources_serve_the_summary_memberships_and_configuration
            audit::human_summary::tests::usage_counts_allocations_on_both_bounds_and_excludes_adjacent_instants
            audit::human_summary::tests::usage_ignores_valid_normalized_allocation_with_extended_year_outside_window
          )
          [[ "${#selectors[@]}" == 7 ]] || { set_receipt selector_1 INVALID_SELECTOR_TABLE; exit 1; }
          index=0
          for selector in "${selectors[@]}"; do
            ((index += 1))
            test_log="$private_root/selector-${index}.log"
            test_rc=0
            timeout --kill-after=5s 300s "$libtest" "$selector" --exact --test-threads=1 \
              > "$test_log" 2>&1 || test_rc=$?
            selected_here=0
            [[ "$(grep -Fxc 'running 1 test' "$test_log" || true)" == 1 ]] && selected_here=1 || true
            summary_line="$(grep -E '^test result: ' "$test_log" | tail -n 1 || true)"
            summary_state=UNKNOWN
            summary_passed=0
            summary_failed=0
            summary_ignored=0
            selected_count=$(( selected_count + selected_here ))
            if [[ "$summary_line" =~ ^test\ result:\ (ok|FAILED)\.\ ([0-9]+)\ passed\;\ ([0-9]+)\ failed\;\ ([0-9]+)\ ignored\;\ [0-9]+\ measured\;\ [0-9]+\ filtered\ out\;\ finished\ in\ [0-9]+(\.[0-9]+)?s$ ]]; then
              summary_state="${BASH_REMATCH[1]}"
              summary_passed="${BASH_REMATCH[2]}"
              summary_failed="${BASH_REMATCH[3]}"
              summary_ignored="${BASH_REMATCH[4]}"
              passed_count=$(( passed_count + summary_passed ))
              failed_count=$(( failed_count + summary_failed ))
              ignored_count=$(( ignored_count + summary_ignored ))
            fi
            selector_status=FAIL
            if [[ "$test_rc" == 0 && "$selected_here" == 1 && "$summary_state" == ok &&
                  "$summary_passed" == 1 && "$summary_failed" == 0 && "$summary_ignored" == 0 &&
                  "$(grep -Fxc "test $selector ... ok" "$test_log" || true)" == 1 ]]; then
              selector_status=PASS_1_0_0
            else
              run_failed=1
            fi
            set_receipt "selector_$index" "$selector_status"
          done
          set_receipt selected "$selected_count"
          set_receipt passed "$passed_count"
          set_receipt failed "$failed_count"
          set_receipt ignored "$ignored_count"
          [[ "$run_failed" == 0 && "$selected_count" == 7 && "$passed_count" == 7 &&
             "$failed_count" == 0 && "$ignored_count" == 0 ]] || exit 1
          phase=complete

      - name: Upload only the closed accounting summary receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g08-owned-accounting-summary-${{ github.sha }}
          path: ${{ runner.temp }}/g08-owned-accounting-summary-receipt.txt
          if-no-files-found: error
          retention-days: 14
