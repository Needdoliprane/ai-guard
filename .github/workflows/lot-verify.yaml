name: G12 Darwin ARM64 archive outcome diagnostic

on:
  push:
    branches: ['claude/v1-g12-darwin-arm64-archive-outcome-20261123']

permissions:
  contents: read

concurrency:
  group: g12-darwin-arm64-archive-outcome-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-archive:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: 4b6ae87a712f782e28e035432967c0bed270e0fc
      RUST_TARGET: aarch64-apple-darwin
      EXCLUDED_BINARIES: ai-guard-demo-pki
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      AI_GUARD_BUILD_REVISION: 4b6ae87a712f782e28e035432967c0bed270e0fc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - name: Verify source and package native archive privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RECEIPT="$RUNNER_TEMP/g12-darwin-arm64-outcome-receipt.txt"
          PRIVATE_DIR="$RUNNER_TEMP/g12-darwin-arm64-private"
          phase=preflight
          source_guard=FAIL
          target_fetch=NOT_RUN
          target_fetch_exit=unknown
          native_build=NOT_RUN
          native_exit=unknown
          rust_error_codes=none
          package_prepare=NOT_RUN
          notices_fetch=NOT_RUN
          notices_fetch_exit=unknown
          notices_build=NOT_RUN
          notices_build_exit=unknown
          binary_copy=NOT_RUN
          cli_help=NOT_RUN
          cli_identity=NOT_RUN
          archive_create=NOT_RUN
          archive_members=NOT_RUN
          archive_binaries=NOT_RUN
          archive_notices=NOT_RUN
          notices=NOT_RUN
          archive_check=NOT_RUN
          archive_sha256=unknown
          notices_sha256=unknown
          license_sha256=unknown
          archive_bytes=0
          license_check=NOT_RUN
          build_info_check=NOT_RUN
          native_count=0
          native_names=unknown
          version=unknown
          rustc_version=unknown
          cargo_version=unknown
          host_arch=unknown
          mkdir -m 700 -p "$PRIVATE_DIR"
          finish() {
            result=FAIL
            if [[ "$phase" == complete && "$source_guard" == PASS && "$target_fetch" == PASS &&
                  "$native_build" == PASS && "$package_prepare" == PASS && "$notices_fetch" == PASS &&
                  "$notices_build" == PASS && "$binary_copy" == PASS && "$cli_help" == PASS &&
                  "$cli_identity" == PASS && "$archive_create" == PASS && "$archive_members" == PASS &&
                  "$archive_binaries" == PASS && "$archive_notices" == PASS && "$notices" == PASS &&
                  "$archive_check" == PASS && "$license_check" == PASS && "$build_info_check" == PASS ]]; then result=PASS; fi
            close_status() { if [[ "$1" == IN_PROGRESS ]]; then printf FAIL; else printf '%s' "$1"; fi; }
            {
              printf 'schema=g12-native-archive-v1\n'
              printf 'candidate_sha=%s\nworkflow_sha=%s\nworkflow_parent=%s\n' \
                "$CANDIDATE_SHA" "${GITHUB_SHA:-unknown}" "$CANDIDATE_SHA"
              printf 'target=%s\nhost_arch=%s\nversion=%s\nrustc_version=%s\ncargo_version=%s\n' \
                "$RUST_TARGET" "$host_arch" "$version" "$rustc_version" "$cargo_version"
              printf 'phase=%s\nsource_guard=%s\ntarget_fetch=%s\ntarget_fetch_exit=%s\n' \
                "$phase" "$source_guard" "$(close_status "$target_fetch")" "$target_fetch_exit"
              printf 'native_build=%s\nnative_exit=%s\nrust_error_codes=%s\npackage_prepare=%s\n' \
                "$(close_status "$native_build")" "$native_exit" "$rust_error_codes" "$(close_status "$package_prepare")"
              printf 'notices_fetch=%s\nnotices_fetch_exit=%s\nnotices_build=%s\nnotices_build_exit=%s\nbinary_copy=%s\n' \
                "$(close_status "$notices_fetch")" "$notices_fetch_exit" "$(close_status "$notices_build")" \
                "$notices_build_exit" "$(close_status "$binary_copy")"
              printf 'cli_help=%s\ncli_identity=%s\narchive_create=%s\narchive_members=%s\n' \
                "$(close_status "$cli_help")" "$(close_status "$cli_identity")" \
                "$(close_status "$archive_create")" "$(close_status "$archive_members")"
              printf 'archive_binaries=%s\narchive_notices=%s\n' \
                "$(close_status "$archive_binaries")" "$(close_status "$archive_notices")"
              printf 'native_binary_count=%s\nnative_binary_names=%s\nexcluded_binaries=%s\n' \
                "$native_count" "$native_names" "$EXCLUDED_BINARIES"
              printf 'notices=%s\narchive_check=%s\n' "$notices" "$archive_check"
              printf 'archive_sha256=%s\narchive_bytes=%s\nnotices_sha256=%s\nlicense_sha256=%s\n' \
                "$archive_sha256" "$archive_bytes" "$notices_sha256" "$license_sha256"
              printf 'license_check=%s\nbuild_info_check=%s\nandroid=NOT_INCLUDED\n' "$license_check" "$build_info_check"
              printf 'tag_created=NO\npublication=NOT_ATTEMPTED\nresult=%s\n' "$result"
            } > "$RECEIPT"
          }
          trap finish EXIT

          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = macOS
          test "${RUNNER_ARCH:-}" = ARM64
          host_arch=$(uname -m)
          test "$host_arch" = arm64
          test "${GITHUB_EVENT_NAME:-}" = push
          test "${GITHUB_REF:-}" = refs/heads/claude/v1-g12-darwin-arm64-archive-outcome-20261123
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^1")" = bbe39996997332a8c6aed7a8551c45258abb8100
          test "$(git rev-parse "$CANDIDATE_SHA^2")" = 076d69add0efcae7f9870630a47c110bc89373c2
          test "$(git rev-parse --is-shallow-repository)" = true
          test "$(git diff --name-only "$CANDIDATE_SHA" HEAD)" = .github/workflows/lot-verify.yaml
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git checkout --detach "$CANDIDATE_SHA" >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" = 1.99.1
          rustc_version=$(rustc --version | awk '{print $2}')
          cargo_version=$(cargo --version | awk '{print $2}')
          test "$rustc_version" = 1.99.1
          test "$cargo_version" = 1.99.1
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RUST_TARGET"

          phase=metadata
          metadata=$(cargo metadata --locked --offline --no-deps --format-version 1 2>"$PRIVATE_DIR/metadata.err")
          version=$(jq -er '[.packages[] | select(.name == "agentsandbox")] | select(length == 1) | .[0].version' <<< "$metadata")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          jq -e --arg version "$version" '.version == $version' front/package.json >/dev/null
          jq -e --arg version "$version" '.version == $version and .packages[""].version == $version' front/package-lock.json >/dev/null
          native_names=$(jq -er --arg excluded "$EXCLUDED_BINARIES" '
            [.packages[] | select(.name == "agentsandbox")] | select(length == 1)
            | [.[0].targets[] | select(.kind | index("bin")) | .name] | sort
            | . - ($excluded | split(" ") | map(select(length > 0)))
            | if index("agentsandbox") != null and length == 6 and length == (unique | length) and
                all(.[]; type == "string" and test("^[A-Za-z0-9_.-]+$") and . != "." and . != "..")
              then join(" ") else error("Unexpected native binary target list") end
          ' <<< "$metadata")
          native_count=$(wc -w <<< "$native_names" | tr -d ' ')
          test "$native_count" = 6
          source_guard=PASS

          phase=target-fetch
          RELEASE_TAG="v$version"
          RELEASE_SHA="$CANDIDATE_SHA"
          export RELEASE_TAG RELEASE_SHA AI_GUARD_BUILD_REVISION
          export RUST_TARGET NATIVE_BINARIES="$native_names" CARGO_BUILD_JOBS
          export GITHUB_RUN_ID GITHUB_REPOSITORY RUNNER_TEMP="$PRIVATE_DIR" AI_GUARD_VERSION="$version"
          target_fetch=IN_PROGRESS
          if cargo fetch --locked --target "$RUST_TARGET" >"$PRIVATE_DIR/fetch-target.out" 2>&1; then
            target_fetch=PASS
          else
            rc=$?
            target_fetch=FAIL
            if (( rc <= 255 )); then target_fetch_exit=$rc; fi
            exit 1
          fi

          phase=native-build
          native_build=IN_PROGRESS
          if cargo build --release --locked --offline --bins --target "$RUST_TARGET" >"$PRIVATE_DIR/build.out" 2>&1; then
            native_build=PASS
            native_exit=0
          else
            rc=$?
            native_build=FAIL
            if (( rc <= 255 )); then native_exit=$rc; fi
            codes=$(grep -Eo 'error\[E[0-9]{4}\]' "$PRIVATE_DIR/build.out" | sed -E 's/error\[(E[0-9]{4})\]/\1/' | sort -u | paste -sd, - || true)
            if [[ -z "$codes" ]]; then rust_error_codes=none
            elif [[ "$codes" =~ ^E[0-9]{4}(,E[0-9]{4})*$ ]]; then rust_error_codes=$codes
            else rust_error_codes=unknown
            fi
            exit 1
          fi
          package_name="ai-guard-$RELEASE_TAG-$RUST_TARGET"
          package="$PRIVATE_DIR/package/$package_name"
          assets="$PRIVATE_DIR/release-assets"
          phase=package-prepare
          package_prepare=IN_PROGRESS
          install -d "$package/bin" "$assets"
          install -m 0644 LICENSE "$package/LICENSE"
          printf 'tag=%s\ncommit=%s\ntarget=%s\nrun=%s\nrepository=%s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$RUST_TARGET" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > "$package/BUILD-INFO"
          package_prepare=PASS

          phase=notices-fetch
          notices_fetch=IN_PROGRESS
          if cargo fetch --locked >"$PRIVATE_DIR/fetch-notices.out" 2>&1; then notices_fetch=PASS; else rc=$?; if (( rc <= 255 )); then notices_fetch_exit=$rc; fi; exit 1; fi

          phase=notices-build
          notices_build=IN_PROGRESS
          if cargo run --quiet --release --locked --offline --target "$RUST_TARGET" --example third_party_notices -- \
              notices --for-release --allowed .github/third-party-license-expressions.txt \
              --output "$package/THIRD-PARTY-NOTICES" >"$PRIVATE_DIR/notices.out" 2>&1; then
            test -s "$package/THIRD-PARTY-NOTICES"
            notices_build=PASS
            notices_build_exit=0
          else
            rc=$?
            notices_build=FAIL
            if (( rc <= 255 )); then notices_build_exit=$rc; fi
            codes=$(grep -Eo 'error\[E[0-9]{4}\]' "$PRIVATE_DIR/notices.out" | sed -E 's/error\[(E[0-9]{4})\]/\1/' | sort -u | paste -sd, - || true)
            if [[ -n "$codes" ]]; then
              combined=$(printf '%s\n%s\n' "$rust_error_codes" "$codes" | tr ',' '\n' | grep -E '^E[0-9]{4}$' | sort -u | paste -sd, - || true)
              if [[ -n "$combined" && "$combined" =~ ^E[0-9]{4}(,E[0-9]{4})*$ ]]; then rust_error_codes=$combined; fi
            fi
            exit 1
          fi
          notices=PASS

          phase=binary-copy
          binary_copy=IN_PROGRESS
          for program in $native_names; do
            test -s "target/$RUST_TARGET/release/$program"
            install -m 0755 "target/$RUST_TARGET/release/$program" "$package/bin/$program"
          done
          binary_copy=PASS

          phase=cli-help
          cli_help=IN_PROGRESS
          "$package/bin/agentsandbox" --help >/dev/null 2>&1
          cli_help=PASS

          phase=cli-identity
          cli_identity=IN_PROGRESS
          "$package/bin/agentsandbox" version --json > "$PRIVATE_DIR/version.json" 2>/dev/null
          jq -e --arg version "$version" --arg revision "$CANDIDATE_SHA" \
            '.schema_version == 1 and .product == "ai-guard" and .component == "agentsandbox" and
             .version == $version and .build.revision == $revision' "$PRIVATE_DIR/version.json" >/dev/null
          cli_identity=PASS

          phase=archive-create
          archive_create=IN_PROGRESS
          archive="$assets/$package_name.tar.gz"
          tar -C "$PRIVATE_DIR/package" -czf "$archive" "$package_name"
          test -s "$archive"
          archive_create=PASS
          archive_bytes=$(stat -f '%z' "$archive")
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          phase=archive-members
          archive_members=IN_PROGRESS
          tar -tzf "$archive" > "$PRIVATE_DIR/archive-members.raw"
          sed 's#/$##' "$PRIVATE_DIR/archive-members.raw" | LC_ALL=C sort > "$PRIVATE_DIR/archive-members"
          {
            printf '%s\n' "$package_name" "$package_name/bin" "$package_name/LICENSE" \
              "$package_name/BUILD-INFO" "$package_name/THIRD-PARTY-NOTICES"
            for program in $native_names; do printf '%s/bin/%s\n' "$package_name" "$program"; done
          } | LC_ALL=C sort > "$PRIVATE_DIR/expected-members"
          cmp -s "$PRIVATE_DIR/expected-members" "$PRIVATE_DIR/archive-members"
          archive_members=PASS
          phase=archive-binaries
          archive_binaries=IN_PROGRESS
          for program in $native_names; do
            tar -xOzf "$archive" "$package_name/bin/$program" > "$PRIVATE_DIR/extracted-$program"
            cmp -s "$package/bin/$program" "$PRIVATE_DIR/extracted-$program"
          done
          archive_binaries=PASS
          phase=archive-notices
          archive_notices=IN_PROGRESS
          tar -xOzf "$archive" "$package_name/THIRD-PARTY-NOTICES" > "$PRIVATE_DIR/archive-notices"
          test -s "$PRIVATE_DIR/archive-notices"
          notices_sha256=$(shasum -a 256 "$PRIVATE_DIR/archive-notices" | awk '{print $1}')
          [[ "$notices_sha256" =~ ^[0-9a-f]{64}$ ]]
          archive_notices=PASS
          phase=license
          tar -xOzf "$archive" "$package_name/LICENSE" > "$PRIVATE_DIR/archive-license"
          cmp -s LICENSE "$PRIVATE_DIR/archive-license"
          license_sha256=$(shasum -a 256 "$PRIVATE_DIR/archive-license" | awk '{print $1}')
          [[ "$license_sha256" =~ ^[0-9a-f]{64}$ ]]
          license_check=PASS
          phase=build-info
          tar -xOzf "$archive" "$package_name/BUILD-INFO" > "$PRIVATE_DIR/archive-build-info"
          printf 'tag=%s\ncommit=%s\ntarget=%s\nrun=%s\nrepository=%s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$RUST_TARGET" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" \
            > "$PRIVATE_DIR/expected-build-info"
          cmp -s "$PRIVATE_DIR/archive-build-info" "$PRIVATE_DIR/expected-build-info"
          build_info_check=PASS
          archive_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          archive_check=PASS
          phase=complete
      - name: Ensure a closed receipt exists
        if: always()
        shell: bash
        run: |
          RECEIPT="$RUNNER_TEMP/g12-darwin-arm64-outcome-receipt.txt"
          if [[ ! -f "$RECEIPT" ]]; then
            umask 077
            {
              printf 'schema=g12-native-archive-v1\ncandidate_sha=%s\nworkflow_sha=%s\n' "$CANDIDATE_SHA" "${GITHUB_SHA:-unknown}"
              printf 'target=%s\nresult=FAIL\nsource_guard=NOT_RUN\nnative_build=NOT_RUN\n' "$RUST_TARGET"
              printf 'native_exit=unknown\nrust_error_codes=none\nnative_binary_count=0\nnative_binary_names=unknown\nversion=unknown\n'
              printf 'rustc_version=unknown\ncargo_version=unknown\ntarget_fetch=NOT_RUN\ntarget_fetch_exit=unknown\n'
              printf 'package_prepare=NOT_RUN\nnotices_fetch=NOT_RUN\nnotices_fetch_exit=unknown\n'
              printf 'notices_build=NOT_RUN\nnotices_build_exit=unknown\nbinary_copy=NOT_RUN\ncli_help=NOT_RUN\ncli_identity=NOT_RUN\n'
              printf 'archive_create=NOT_RUN\narchive_members=NOT_RUN\narchive_binaries=NOT_RUN\narchive_notices=NOT_RUN\nnotices=NOT_RUN\n'
              printf 'phase=preflight\narchive_check=NOT_RUN\narchive_sha256=unknown\narchive_bytes=0\n'
              printf 'notices_sha256=unknown\nlicense_sha256=unknown\nlicense_check=NOT_RUN\nbuild_info_check=NOT_RUN\n'
              printf 'android=NOT_INCLUDED\ntag_created=NO\npublication=NOT_ATTEMPTED\n'
            } > "$RECEIPT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g12-darwin-arm64-outcome-receipt
          path: ${{ runner.temp }}/g12-darwin-arm64-outcome-receipt.txt
          if-no-files-found: error
          retention-days: 14
