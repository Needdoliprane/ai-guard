name: G04 Keycloak Web check

on:
  push:
    branches: [claude/v1-g04-keycloak-web-cargo-paths-check-20261122]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE_SHA: 72fa713f7c0295d9582fa4439e88e5250c4ac8b5
      DOCKER_HOST: unix:///var/run/docker.sock
      G04_IDP_PROJECT: g04-idp-${{ github.run_id }}-${{ github.run_attempt }}
      G04_CONTROL_PROJECT: g04-control-${{ github.run_id }}-${{ github.run_attempt }}
      AI_GUARD_TEST_DASHBOARD: http://127.0.0.1:4000
      AI_GUARD_TEST_OIDC_ISSUER: http://keycloak.ai-guard.test:18080/realms/ai-guard-demo
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /opt/google/chrome/chrome
      PLAYWRIGHT_VERSION: '1.65.1'
    steps:
      - name: Require the GitHub-hosted runner
        id: hosted_runner
        shell: bash
        run: |
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted && "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 &&
            "${GITHUB_EVENT_NAME:-}" == push && "${GITHUB_REF:-}" == refs/heads/claude/v1-g04-keycloak-web-cargo-paths-check-20261122 &&
            "$(id -u)" =~ ^[1-9][0-9]*$ ]] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Verify the sandboxed Web discovery flow
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          G04_PRIVATE="$RUNNER_TEMP/g04-keycloak-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$G04_PRIVATE" "$G04_PRIVATE/receipt"
          receipt="$G04_PRIVATE/receipt"
          phase=source
          status=FAIL
          cleanup=NOT_RUN
          idp_started=false
          control_started=false

          stop_project() {
            local ids
            local -a active
            ids="$(timeout -k 5s 10s docker ps --no-trunc -q --filter "label=com.docker.compose.project=$1")" || return 1
            if [[ -n "$ids" ]]; then
              mapfile -t active <<< "$ids"
              timeout -k 5s 35s docker stop --time 8 "${active[@]}" >/dev/null 2>&1 || return 1
            fi
            ids="$(timeout -k 5s 10s docker ps -q --filter "label=com.docker.compose.project=$1")" || return 1
            [[ -z "$ids" ]]
          }

          record_control_build_failure() {
            local diagnosis category=unknown step=unknown cargo_category=unknown rust_error_lines=null rust_codes=
            # BuildKit can report more than one failure. Emit only unique matches.
            if diagnosis="$(tail -c 262144 "$G04_PRIVATE/control-build.log" 2>/dev/null | LC_ALL=C awk '
              function unique(values, count, key, result) {
                for (key in values) {
                  count++
                  result = key
                }
                return count == 1 ? result : "unknown"
              }
              { line = tolower($0) }
              line ~ /^#[0-9]+ \[rust-build [0-9]+\/[0-9]+\] run cargo build / { cargo_runs[$1] = 1 }
              /^#[0-9]+ [0-9]+(\.[0-9]+)?[[:space:]]/ {
                message = $0
                sub(/^#[0-9]+ [0-9]+(\.[0-9]+)?[[:space:]]+/, "", message)
                sampled[$1] = 1
                lower = tolower(message)
                if (message ~ /^error\[E[0-9][0-9][0-9][0-9]\]:/) {
                  codes[$1, substr(message, 7, 5)] = 1
                  rust_lines[$1]++
                  compiler[$1] = 1
                } else if (lower ~ /^error: (component download failed|could not download (file|nonexistent rust version)|toolchain .* (is not installed|is not installable)|no default toolchain|rustup could not choose|rustc .* is not supported|failed to (download component|install component|parse override toolchain file))/) {
                  toolchain[$1] = 1
                } else if (lower ~ /^(error: )?(failed to (download (from|crate|any data)|fetch |query (replaced )?source registry)|unable to update registry|download of .* failed)/) {
                  fetch[$1] = 1
                } else if (lower ~ /^error: (could not compile |failed to run custom build command |linking with |couldn.t read )/) {
                  compiler[$1] = 1
                }
              }
              line ~ /^(error:|#[0-9]+ error:)/ &&
                line ~ /(failed to resolve source metadata for .*\/library\/(node|rust|debian):|no match for platform in manifest|no matching manifest for linux\/amd64)/ {
                category["base_or_platform"] = 1
                step["base_image"] = 1
              }
              line ~ /^(error:|#[0-9]+ error:)/ && line ~ /failed to (compute cache key|calculate checksum)/ && line ~ /not found/ &&
                line ~ /"\/(front\/package(-lock)?\.json|cargo\.(toml|lock)|rust-toolchain\.toml|src|policies|license|build\/front\/dist|build\/target\/release\/(agentsandbox|ai-guard-audit-checkpoint|ai-guard-diagnose))"/ {
                category["package_artifact"] = 1
                step["artifact_copy"] = 1
              }
              line ~ /npm (err!|error).*can only install.*(package(-lock)?\.json|npm-shrinkwrap\.json)|cannot find module .*@rollup\/rollup-linux-x64-(gnu|musl)/ {
                category["package_artifact"] = 1
              }
              line ~ /error: ((failed to (parse|load)|could not parse) manifest|manifest path .* does not exist|cannot update the lock file .*cargo\.lock)/ {
                category["cargo_manifest"] = 1
                step["cargo_build"] = 1
              }
              line ~ /^(error:|#[0-9]+ error:).*process .*\/bin\/sh -c .*did not complete successfully/ {
                if (line ~ /\/bin\/sh -c npm ci"/) step["npm_ci"] = 1
                if (line ~ /\/bin\/sh -c npm run build"/) step["frontend_build"] = 1
                if (line ~ /\/bin\/sh -c cargo build /) {
                  step["cargo_build"] = 1
                  if ($1 ~ /^#[0-9]+$/) {
                    cargo_failures[$1] = 1
                    has_cargo_failure = 1
                  }
                }
                if (line ~ /\/bin\/sh -c apt-get update /) step["runtime_packages"] = 1
              }
              END {
                build_step = unique(step)
                vertex = has_cargo_failure ? unique(cargo_failures) : unique(cargo_runs)
                printf "%s %s", unique(category), build_step
                if (build_step != "cargo_build" || vertex == "unknown" || !sampled[vertex]) {
                  print " unknown null"
                } else {
                  kind = toolchain[vertex] ? "toolchain" : (fetch[vertex] ? "fetch" : "compile")
                  if (toolchain[vertex] + fetch[vertex] + compiler[vertex] != 1) kind = "unknown"
                  printf " %s %d", kind, rust_lines[vertex]
                  for (i = 0; i < 10000 && emitted < 16; i++) {
                    code = sprintf("E%04d", i)
                    if ((vertex, code) in codes) {
                      printf " %s", code
                      emitted++
                    }
                  }
                  printf "\n"
                }
              }
            ' 2>/dev/null)"; then
              read -r category step cargo_category rust_error_lines rust_codes <<< "$diagnosis"
            fi
            jq -n --arg category "$category" --arg step "$step" --argjson exit_code "$1" --argjson elapsed_seconds "$2" \
              --arg cargo_category "$cargo_category" --argjson rust_error_lines "$rust_error_lines" --arg rust_codes "$rust_codes" \
              '{category:$category,step:$step,exit_code:$exit_code,elapsed_seconds:$elapsed_seconds}
                + (if $step == "cargo_build" then {
                    cargo_category:$cargo_category,
                    rust_error_lines:$rust_error_lines,
                    rust_error_codes:($rust_codes | split(" ") | map(select(length > 0)))
                  } else {} end)' \
              > "$receipt/control-build.json"
          }

          finish() {
            local code=$? ports
            trap - EXIT
            if [[ "$idp_started" == true || "$control_started" == true ]]; then
              cleanup=PASS
              if [[ "$control_started" == true ]] && ! stop_project "$G04_CONTROL_PROJECT"; then cleanup=FAIL; fi
              if [[ "$idp_started" == true ]] && ! stop_project "$G04_IDP_PROJECT"; then cleanup=FAIL; fi
              if ! ports="$(ss -H -ltn "$port_filter")" || [[ -n "$ports" ]]; then cleanup=FAIL; fi
              if [[ "$cleanup" == FAIL && "$code" == 0 ]]; then
                phase=cleanup
                status=FAIL
                code=1
              fi
            fi
            if [[ "$status" == PASS && "$code" != 0 ]]; then status=FAIL; fi
            jq -n --arg source "$SOURCE_SHA" --arg workflow "$GITHUB_SHA" \
              --arg phase "$phase" --arg status "$status" --arg cleanup "$cleanup" \
              '{source_sha:$source,workflow_sha:$workflow,phase:$phase,status:$status,cleanup:$cleanup}' \
              > "$receipt/result.json"
            printf 'G04 Keycloak Web %s (%s), cleanup %s\n' "$status" "$phase" "$cleanup"
            exit "$code"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" ]] || exit 1
          [[ "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" == .github/workflows/lot-verify.yaml ]] || exit 1
          source_tree="$G04_PRIVATE/source"
          mkdir "$source_tree"
          git archive --format=tar "$SOURCE_SHA" | tar -xf - -C "$source_tree"

          phase=chromium_executable
          if [[ ! -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" ]]; then
            status=BLOCKED
            exit 1
          fi
          chrome="$(timeout -k 5s 10s "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" --product-version 2>"$G04_PRIVATE/chrome.err")"
          [[ "$chrome" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || exit 1
          jq -n --arg chrome "$chrome" --arg playwright "$PLAYWRIGHT_VERSION" \
            '{chrome:$chrome,playwright:$playwright}' > "$receipt/browser.json"

          phase=playwright_install
          mkdir "$G04_PRIVATE/browser"
          timeout -k 5s 2m npm install --prefix "$G04_PRIVATE/browser" --ignore-scripts --no-audit --no-fund \
            --save-exact "playwright@$PLAYWRIGHT_VERSION" > "$G04_PRIVATE/npm.log" 2>&1
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$G04_PRIVATE/browser/node_modules"
          unset DEBUG PWDEBUG NODE_DEBUG AI_GUARD_TEST_ARTIFACT_DIR AI_GUARD_TEST_OIDC_ALLOW_TLS
          export AI_GUARD_TEST_OIDC_ACCOUNTS=admin-ai-guard,user-1,user-2,admin

          phase=loopback_preflight
          if timeout -k 5s 90s node "$source_tree/front/tests/browser_oidc_live.mjs" --check-transport \
            > "$G04_PRIVATE/transport.json" 2> "$G04_PRIVATE/transport.err"; then
            jq -es '
              select(length == 1) | .[0] |
              select(.mode == "keycloak_discovery_transport_preflight" and .status == "PASS"
                and .scope == "loopback_http_only"
                and ([.checks[].host] | sort) == ["127.0.0.1","[::1]","localhost"]
                and all(.checks[]; .allowed_http == 200 and .disallowed_requests_reaching_server == 0)) |
              {status,checks:[.checks[] | {host,allowed_http,disallowed_requests_reaching_server}]}
            ' "$G04_PRIVATE/transport.json" > "$receipt/transport.json"
          else
            browser_code=$?
            if [[ "$browser_code" == 1 ]] && jq -es '
              length == 1 and (.[0] |
                .mode == "keycloak_discovery_transport_preflight" and .status == "FAIL"
                and .stage == "prévol loopback" and (.reason as $reason |
                  any(("127.0.0.1", "[::1]", "localhost");
                    "Prévol \(.) interrompu à l’étape « démarrage Chromium »." == $reason)))
            ' "$G04_PRIVATE/transport.err" >/dev/null 2>&1; then
              phase=chromium_launch
              status=BLOCKED
            fi
            exit 1
          fi

          phase=compose_preflight
          unset DOCKER_CONTEXT DOCKER_TLS DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_DEFAULT_PLATFORM DOCKER_AUTH_CONFIG
          unset BUILDX_BUILDER BUILDKIT_HOST COMPOSE_FILE COMPOSE_PROJECT_NAME COMPOSE_PROFILES COMPOSE_ENV_FILES
          [[ "${DOCKER_HOST:-}" == unix:///var/run/docker.sock ]] || exit 1
          [[ -S /var/run/docker.sock ]] || exit 1
          export DOCKER_CONFIG="$G04_PRIVATE/docker"
          mkdir "$DOCKER_CONFIG"
          unset AI_GUARD_DEMO_IDP_HOST AI_GUARD_DEMO_IDP_PORT AI_GUARD_DEMO_WEB_ORIGIN
          unset AI_GUARD_GATEWAY_PORT AI_GUARD_DASHBOARD_PORT
          port_filter='( sport = :4000 or sport = :8787 or sport = :18080 )'
          free_ports="$(ss -H -ltn "$port_filter")"
          [[ -z "$free_ports" ]] || exit 1
          for project in "$G04_IDP_PROJECT" "$G04_CONTROL_PROJECT"; do
            containers="$(docker ps -aq --filter "label=com.docker.compose.project=$project")"
            networks="$(docker network ls -q --filter "label=com.docker.compose.project=$project")"
            volumes="$(docker volume ls -q --filter "label=com.docker.compose.project=$project")"
            [[ -z "$containers$networks$volumes" ]] || exit 1
          done
          cp "$source_tree/.env.exemple.local-keycloak-sso" "$G04_PRIVATE/compose.env"
          export AI_GUARD_CONTROL_IMAGE="agentsandbox-control:$G04_CONTROL_PROJECT"
          export AI_GUARD_DEMO_CONTROL_IMAGE="$AI_GUARD_CONTROL_IMAGE"
          export AI_GUARD_DEMO_IDP_IMAGE="ai-guard-keycloak-demo:$G04_IDP_PROJECT"
          old_control="$(docker image ls -q "$AI_GUARD_CONTROL_IMAGE")"
          old_idp="$(docker image ls -q "$AI_GUARD_DEMO_IDP_IMAGE")"
          [[ -z "$old_control$old_idp" ]] || exit 1
          compose=(docker compose --env-file "$G04_PRIVATE/compose.env")
          idp=("${compose[@]}" -p "$G04_IDP_PROJECT" -f "$source_tree/deploy/keycloak-demo/compose.yaml" --profile keycloak-demo-http)
          control=("${compose[@]}" -p "$G04_CONTROL_PROJECT" -f "$source_tree/deploy/docker/compose.sso.yaml")

          phase=control_image
          build_started=$SECONDS
          BUILDKIT_PROGRESS=plain timeout -k 5s 35m docker build --build-arg AI_GUARD_BUILD_REVISION="$SOURCE_SHA" \
            -f "$source_tree/images/control.Dockerfile" -t "$AI_GUARD_CONTROL_IMAGE" "$source_tree" \
            > "$G04_PRIVATE/control-build.log" 2>&1 || {
            build_exit=$?
            record_control_build_failure "$build_exit" "$((SECONDS - build_started))" ||
              printf '%s\n' 'Control build summary unavailable.'
            exit "$build_exit"
          }
          phase=keycloak_image
          timeout -k 5s 10m docker build -f "$source_tree/deploy/keycloak-demo/Dockerfile" -t "$AI_GUARD_DEMO_IDP_IMAGE" \
            "$source_tree/deploy/keycloak-demo" > "$G04_PRIVATE/idp-build.log" 2>&1
          control_image="$(docker image inspect --format '{{.Id}}' "$AI_GUARD_CONTROL_IMAGE")"
          idp_image="$(docker image inspect --format '{{.Id}}' "$AI_GUARD_DEMO_IDP_IMAGE")"
          image_pattern='^sha256:[a-f0-9]{64}$'
          [[ "$control_image" =~ $image_pattern && "$idp_image" =~ $image_pattern ]] || exit 1
          jq -n --arg control "$control_image" --arg keycloak "$idp_image" \
            '{control:$control,keycloak:$keycloak}' > "$receipt/images.json"

          phase=keycloak_start
          "${idp[@]}" config --quiet
          idp_started=true
          timeout -k 5s 90s "${idp[@]}" up -d --no-build --pull never keycloak-demo keycloak-demo-ingress \
            > "$G04_PRIVATE/idp-start.log" 2>&1
          [[ "$("${idp[@]}" port keycloak-demo-ingress 18080)" == 127.0.0.1:18080 ]] || exit 1
          phase=keycloak_discovery
          timeout -k 5s 100s curl --noproxy '*' --resolve keycloak.ai-guard.test:18080:127.0.0.1 \
            --fail --silent --show-error --max-time 5 --retry 30 --retry-connrefused --retry-delay 2 --retry-max-time 90 \
            "$AI_GUARD_TEST_OIDC_ISSUER/.well-known/openid-configuration" \
            > "$G04_PRIVATE/discovery.json" 2> "$G04_PRIVATE/discovery.err"
          jq -e --arg issuer "$AI_GUARD_TEST_OIDC_ISSUER" '
            .issuer == $issuer and (.code_challenge_methods_supported | index("S256") != null)
            and (.response_types_supported | index("code") != null)
          ' "$G04_PRIVATE/discovery.json" > /dev/null
          identity_id="$(docker network ls -q --filter "label=com.docker.compose.project=$G04_IDP_PROJECT" \
            --filter label=com.docker.compose.network=identity_demo)"
          [[ "$identity_id" =~ ^[a-f0-9]+$ ]] || exit 1
          identity_network="$(docker network inspect --format '{{.Internal}} {{.Name}}' "$identity_id")"
          read -r internal network_name <<< "$identity_network"
          [[ "$internal" == true && "$network_name" =~ ^[a-z0-9_-]+$ ]] || exit 1
          export AI_GUARD_SSO_IDENTITY_NETWORK="$network_name"

          phase=control_prepare
          "${control[@]}" config --quiet
          control_started=true
          timeout -k 5s 90s "${control[@]}" --profile sso-prepare run --no-deps --pull never -T \
            setup setup prepare --input - --output-dir /data/installation --demo-defaults \
            < "$source_tree/docs/setup/sso/examples/local-demo.json" > "$G04_PRIVATE/setup.json" 2> "$G04_PRIVATE/setup.err"
          jq -es 'length == 1 and .[0].status == "prepared"' "$G04_PRIVATE/setup.json" > /dev/null

          phase=control_start
          timeout -k 5s 125s "${control[@]}" up -d --wait --wait-timeout 110 --no-build --pull never gateway dashboard ingress \
            > "$G04_PRIVATE/control-start.log" 2>&1
          [[ "$("${control[@]}" port ingress 8787)" == 127.0.0.1:8787 ]] || exit 1
          [[ "$("${control[@]}" port ingress 4000)" == 127.0.0.1:4000 ]] || exit 1

          phase=web_flow
          timeout -k 5s 3m node "$source_tree/front/tests/browser_oidc_live.mjs" > "$G04_PRIVATE/web.json" 2> "$G04_PRIVATE/web.err"
          jq -es '
            select(length == 1) | .[0] |
            select(.mode == "keycloak_discovery_oidc_web" and .status == "PASS"
              and ([.checks[].account] | sort) == ["admin","admin-ai-guard","user-1","user-2"]
              and all(.checks[]; .status == "PASS" and
                (if .account == "admin" then .evidence == "realm_demo_login_refused"
                 else .evidence == "oidc_identity_and_authorized_read"
                   and .context == (if .account == "admin-ai-guard" then "administration" else "personnel" end)
                   and .local_logout == "closed" and .logout_audit == "recorded"
                 end))) |
            {mode,status,tenant:"ai-guard-demo",checks:[.checks[] |
              if .account == "admin" then {account,status,evidence}
              else {account,status,evidence,context,local_logout,logout_audit} end]}
          ' "$G04_PRIVATE/web.json" > "$receipt/web.json"
          phase=complete
          status=PASS

      - name: Upload the allowlisted receipt
        if: always() && steps.hosted_runner.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g04-keycloak-web
          path: ${{ runner.temp }}/g04-keycloak-${{ github.run_id }}-${{ github.run_attempt }}/receipt/*.json
          if-no-files-found: error
          retention-days: 7
