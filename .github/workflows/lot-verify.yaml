name: G07 provider readiness CLI regression

on:
  push:
    branches: ['claude/v1-g07-provider-readiness-check-20261123']

permissions:
  contents: read

concurrency:
  group: g07-provider-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_WITNESS: d349e8e9bb114855fda8e597e75c52231a71d923
      RED_SHA: c0188eff221dadd372d2a6bf687e421588e8635d
      PORT_SHA: ed4f094bd2e62d9284cdb914354d7ce2c2b39463
      GREEN_SHA: 6153c00d27bb5efb6695b3f444011ccd96280959
      EXPECTED_TEST_BLOB: 212dbf19bf5c2a4335ca335ea05bc400ad503807
      EXPECTED_LOCK_BLOB: 05847a300405860df8f860d5dc1c39ca423dfa0d
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 7
          persist-credentials: false
      - name: Verify RED and GREEN provider CLI regression privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RECEIPT="$RUNNER_TEMP/g07-provider-readiness-receipt.txt"
          PRIVATE_DIR="$RUNNER_TEMP/g07-provider-readiness-private"
          phase=preflight
          source_guard=FAIL
          toolchain=NOT_RUN
          dependency_fetch=NOT_RUN
          red_build=NOT_RUN
          green_build=NOT_RUN
          red_selected=0
          red_missing_subcommand=0
          red_other_failures=0
          green_selected=0
          green_passed=0
          green_failed=0
          green_ignored=0
          test_blob_equal=FAIL
          lock_blob_equal=FAIL
          rustc_version=unknown
          cargo_version=unknown
          host=unknown
          test_blob_id=unknown
          lock_blob_id=unknown
          mkdir -m 700 -p "$PRIVATE_DIR"
          finish() {
            result=FAIL
            if [[ "$phase" == complete && "$source_guard" == PASS && "$toolchain" == PASS &&
                  "$dependency_fetch" == PASS && "$test_blob_equal" == PASS && "$lock_blob_equal" == PASS &&
                  "$red_build" == PASS && "$green_build" == PASS && "$red_selected" == 3 &&
                  "$red_missing_subcommand" == 3 && "$red_other_failures" == 0 &&
                  "$green_selected" == 3 && "$green_passed" == 3 && "$green_failed" == 0 && "$green_ignored" == 0 ]]; then
              result=PASS
            fi
            {
              printf 'schema=g07-provider-readiness-v1\n'
              printf 'source_witness=%s\nred_sha=%s\nport_sha=%s\ngreen_sha=%s\nworkflow_sha=%s\nworkflow_parent=%s\n' \
                "$SOURCE_WITNESS" "$RED_SHA" "$PORT_SHA" "$GREEN_SHA" "${GITHUB_SHA:-unknown}" "$GREEN_SHA"
              printf 'target=%s\nhost=%s\nrustc_version=%s\ncargo_version=%s\nphase=%s\n' \
                'x86_64-unknown-linux-gnu' "$host" "$rustc_version" "$cargo_version" "$phase"
              printf 'source_guard=%s\ntoolchain=%s\ntest_blob_equal=%s\nlock_blob_equal=%s\n' \
                "$source_guard" "$toolchain" "$test_blob_equal" "$lock_blob_equal"
              printf 'test_blob_id=%s\nlock_blob_id=%s\n' "$test_blob_id" "$lock_blob_id"
              printf 'dependency_fetch=%s\nred_build=%s\nred_selected=%s\nred_missing_subcommand=%s\nred_other_failures=%s\n' \
                "$dependency_fetch" "$red_build" "$red_selected" "$red_missing_subcommand" "$red_other_failures"
              printf 'green_build=%s\ngreen_selected=%s\ngreen_passed=%s\ngreen_failed=%s\ngreen_ignored=%s\n' \
                "$green_build" "$green_selected" "$green_passed" "$green_failed" "$green_ignored"
              printf 'selector_1=checks_the_selected_reference_relative_to_the_explicit_profiles_file\n'
              printf 'selector_2=automatic_selection_reports_absent_subscription_without_falling_back_to_api\n'
              printf 'selector_3=marks_non_private_files_and_linked_paths_as_suspect\n'
              printf 'credentials=FIXTURE_ONLY\nprovider_network=NOT_USED\n'
              printf 'raw_logs=NOT_PUBLISHED\nresult=%s\n' "$result"
            } > "$RECEIPT"
          }
          trap finish EXIT

          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          test "${RUNNER_ARCH:-}" = X64
          test "${GITHUB_EVENT_NAME:-}" = push
          test "${GITHUB_REF:-}" = refs/heads/claude/v1-g07-provider-readiness-check-20261123
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$GREEN_SHA"
          test "$(git rev-parse "$GREEN_SHA^1")" = "$PORT_SHA"
          test "$(git rev-parse "$PORT_SHA^1")" = "$RED_SHA"
          test "$(git rev-parse "$RED_SHA^1")" = 00ae22915b5944ef06a8ff6b87539ab4dad37bc1
          test "$(git rev-parse 00ae22915b5944ef06a8ff6b87539ab4dad37bc1^1)" = "$SOURCE_WITNESS"
          test "$(git rev-parse "$SOURCE_WITNESS^1")" = 4b6ae87a712f782e28e035432967c0bed270e0fc
          test "$(git rev-parse --is-shallow-repository)" = true
          test "$(git diff --name-only "$GREEN_SHA" HEAD)" = .github/workflows/lot-verify.yaml
          test "$(git diff --name-only "$SOURCE_WITNESS^1" "$SOURCE_WITNESS")" = tests/provider_readiness_cli.rs
          test "$(git diff --name-only "$RED_SHA^1" "$RED_SHA")" = tests/provider_readiness_cli.rs
          test "$(git rev-parse "$RED_SHA:tests/provider_readiness_cli.rs")" = \
               "$(git rev-parse "$GREEN_SHA:tests/provider_readiness_cli.rs")"
          test "$(git rev-parse "$PORT_SHA:tests/provider_readiness_cli.rs")" = "$EXPECTED_TEST_BLOB"
          test "$(git rev-parse "$RED_SHA:Cargo.lock")" = "$(git rev-parse "$GREEN_SHA:Cargo.lock")"
          test "$(git rev-parse "$PORT_SHA:Cargo.lock")" = "$EXPECTED_LOCK_BLOB"
          test_blob_id=$(git rev-parse "$RED_SHA:tests/provider_readiness_cli.rs")
          lock_blob_id=$(git rev-parse "$RED_SHA:Cargo.lock")
          test "$test_blob_id" = "$EXPECTED_TEST_BLOB"
          test "$lock_blob_id" = "$EXPECTED_LOCK_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test_blob_equal=PASS
          lock_blob_equal=PASS
          source_guard=PASS

          private_target="$PRIVATE_DIR/target"
          export CARGO_TARGET_DIR="$private_target"
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = x86_64-unknown-linux-gnu
          rustc_version=$(rustc --version | awk '{print $2}')
          cargo_version=$(cargo --version | awk '{print $2}')
          test "$rustc_version" = 1.99.1
          test "$cargo_version" = 1.99.1
          test "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" = 1.99.1
          toolchain=PASS
          phase=fetch
          cargo fetch --locked >"$PRIVATE_DIR/fetch.out" 2>&1
          dependency_fetch=PASS

          selectors=(
            checks_the_selected_reference_relative_to_the_explicit_profiles_file
            automatic_selection_reports_absent_subscription_without_falling_back_to_api
            marks_non_private_files_and_linked_paths_as_suspect
          )
          test "${#selectors[@]}" = 3
          phase=red
          git checkout --detach "$RED_SHA" >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "$RED_SHA"
          test "$(git rev-parse HEAD:tests/provider_readiness_cli.rs)" = "$(git rev-parse "$GREEN_SHA:tests/provider_readiness_cli.rs")"
          test "$(git rev-parse HEAD:Cargo.lock)" = "$(git rev-parse "$GREEN_SHA:Cargo.lock")"
          if cargo test --locked --offline --test provider_readiness_cli --no-run --message-format=json \
              >"$PRIVATE_DIR/red-build.jsonl" 2>"$PRIVATE_DIR/red-build.err"; then
            red_build=PASS
          else
            red_build=FAIL
            exit 1
          fi
          red_test_bin=$(jq -ser '[.[] | select(.reason == "compiler-artifact" and .target.name == "provider_readiness_cli" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$PRIVATE_DIR/red-build.jsonl")
          test -x "$red_test_bin"
          red_index=0
          for selector in "${selectors[@]}"; do
            red_index=$((red_index + 1))
            log="$PRIVATE_DIR/red-$red_index.out"
            red_selected=$((red_selected + 1))
            if "$red_test_bin" "$selector" --exact --test-threads=1 >"$log" 2>&1; then
              red_other_failures=$((red_other_failures + 1))
            elif grep -Fxq 'running 1 test' "$log" && grep -Fxq "test $selector ... FAILED" "$log" &&
                 grep -Eq '^test result: FAILED\. 0 passed; 1 failed; 0 ignored; 0 measured; 2 filtered out' "$log" &&
                 grep -Fq "unrecognized subcommand 'providers'" "$log"; then
              red_missing_subcommand=$((red_missing_subcommand + 1))
            else
              red_other_failures=$((red_other_failures + 1))
            fi
          done
          test "$red_selected" = 3
          test "$red_missing_subcommand" = 3
          test "$red_other_failures" = 0

          phase=green
          git checkout --detach "$GREEN_SHA" >/dev/null 2>&1
          test "$(git rev-parse HEAD)" = "$GREEN_SHA"
          test "$(git rev-parse HEAD:tests/provider_readiness_cli.rs)" = "$(git rev-parse "$RED_SHA:tests/provider_readiness_cli.rs")"
          test "$(git rev-parse HEAD:Cargo.lock)" = "$(git rev-parse "$RED_SHA:Cargo.lock")"
          if cargo test --locked --offline --test provider_readiness_cli --no-run --message-format=json \
              >"$PRIVATE_DIR/green-build.jsonl" 2>"$PRIVATE_DIR/green-build.err"; then
            green_build=PASS
          else
            green_build=FAIL
            exit 1
          fi
          green_test_bin=$(jq -ser '[.[] | select(.reason == "compiler-artifact" and .target.name == "provider_readiness_cli" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$PRIVATE_DIR/green-build.jsonl")
          test -x "$green_test_bin"
          green_index=0
          for selector in "${selectors[@]}"; do
            green_index=$((green_index + 1))
            log="$PRIVATE_DIR/green-$green_index.out"
            green_selected=$((green_selected + 1))
            if "$green_test_bin" "$selector" --exact --test-threads=1 >"$log" 2>&1 &&
               grep -Fxq 'running 1 test' "$log" && grep -Fxq "test $selector ... ok" "$log" &&
               grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; 2 filtered out' "$log"; then
              green_passed=$((green_passed + 1))
            else
              green_failed=$((green_failed + 1))
            fi
          done
          green_ignored=$((3 - green_passed - green_failed))
          test "$green_selected" = 3
          test "$green_passed" = 3
          test "$green_failed" = 0
          test "$green_ignored" = 0
          test_blob_equal=PASS
          lock_blob_equal=PASS
          phase=complete
      - name: Ensure a closed receipt exists
        if: always()
        shell: bash
        run: |
          RECEIPT="$RUNNER_TEMP/g07-provider-readiness-receipt.txt"
          if [[ ! -f "$RECEIPT" ]]; then
            umask 077
            {
              printf 'schema=g07-provider-readiness-v1\nsource_witness=%s\nred_sha=%s\nport_sha=%s\ngreen_sha=%s\n' "$SOURCE_WITNESS" "$RED_SHA" "$PORT_SHA" "$GREEN_SHA"
              printf 'workflow_sha=%s\nworkflow_parent=%s\ntarget=x86_64-unknown-linux-gnu\nresult=FAIL\n' "${GITHUB_SHA:-unknown}" "$GREEN_SHA"
              printf 'phase=preflight\nsource_guard=NOT_RUN\ntoolchain=NOT_RUN\ntest_blob_equal=NOT_RUN\nlock_blob_equal=NOT_RUN\n'
              printf 'dependency_fetch=NOT_RUN\nred_build=NOT_RUN\nred_selected=0\nred_missing_subcommand=0\nred_other_failures=0\n'
              printf 'green_build=NOT_RUN\ngreen_selected=0\ngreen_passed=0\ngreen_failed=0\ngreen_ignored=0\n'
              printf 'credentials=FIXTURE_ONLY\nprovider_network=NOT_USED\nraw_logs=NOT_PUBLISHED\n'
            } > "$RECEIPT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g07-provider-readiness-receipt
          path: ${{ runner.temp }}/g07-provider-readiness-receipt.txt
          if-no-files-found: error
          retention-days: 14
