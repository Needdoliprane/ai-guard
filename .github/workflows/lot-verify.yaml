name: Lot verification

# Verifies V1 development branches on a hosted Linux x86_64 runner so that the
# development Mac keeps its memory for engine, browser and macOS recipes.
# It complements ci.yaml (dev/main) and never creates tags, releases or
# artifacts outside this run. Engine (Docker/Podman/Kubernetes) and provider
# recipes stay out of this workflow: ignored tests are not run and are never
# counted as passes.

on:
  push:
    branches: ['claude/v1-**']

permissions:
  contents: read

concurrency:
  group: lot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-archive:
    if: github.ref_name == 'claude/v1-g12-a2-frontend-archive-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SOURCE_SHA: a2b70dfdb64f593893fcc731f91abaabac0e16ad
      SOURCE_TREE: 818b74ea130d28fc810b62ce0453a4e93db1f9d7
      SOURCE_PARENT_ONE: 1a57b776b0c84c5723184b765af8e4fb2f39076a
      SOURCE_PARENT_ONE_TREE: b55a03a4eeac2b870e641f54e0770228937c237b
      SOURCE_PARENT_TWO: 92597dafd8f79aa630bb070fcd55bf6a8905db07
      SOURCE_PARENT_TWO_TREE: afa226a1b1da7cc9f656e3e5880314e123c361a3
      SOURCE_PARENT_THREE: 7fa1e59088d8131196e380be6cfb823988a0828e
      SOURCE_PARENT_THREE_TREE: 7c36e97fbe83c0d5f9442e646de5bbfd5c240272
      EXPECTED_RELEASE_WORKFLOW_BLOB: 75d89d771e01861a6790333bc035df18bbdb21ce
      EXPECTED_PACKAGE_BLOB: 9d0dfd883ee37947253638223f596e9ab1303e31
      EXPECTED_LOCK_BLOB: 2130d696ec950fdcb90bf39d990bdce8f4703470
      EXPECTED_LICENSE_BLOB: d645695673349e3947e8e5ae42332d0ac3164cd7
      LOCK_SHA: 05847a300405860df8f860d5dc1c39ca423dfa0d
      EXPECTED_BRANCH: claude/v1-g12-a2-frontend-archive-check-20261123
      NATIVE_BINARIES: ''
      RELEASE_SHA: a2b70dfdb64f593893fcc731f91abaabac0e16ad
    steps:
      - name: Initialize closed frontend archive receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g12-frontend-archive-receipt.txt"
          cat > "$receipt" <<EOF
          schema=g12_frontend_archive_v1
          source_sha=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          workflow_sha=$WORKFLOW_SHA
          workflow_parent=NOT_VERIFIED
          source_guard=NOT_RUN
          source_version=UNKNOWN
          vite_locked_version=UNKNOWN
          node_version=NOT_RUN
          npm_ci=NOT_RUN
          frontend_build=NOT_RUN
          index_html=NOT_RUN
          compiled_js=NOT_RUN
          source_license=NOT_RUN
          vite_license_exact=NOT_RUN
          build_info_source=NOT_RUN
          archive_members=NOT_RUN
          archive_sha256=NOT_COMPUTED
          archive_bytes=UNKNOWN
          archive_member_count=UNKNOWN
          archive_label=NOT_SET
          release_tag_operation=NOT_RUN
          scratch_cleanup=NOT_RUN
          receipt_closed=NO
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false

      - name: Verify exact composed source and workflow child
        id: source_guard
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g12-frontend-archive-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          trap 'set_field source_guard FAIL' ERR
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" &&
                "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$SOURCE_TREE" &&
                "$(git show -s --format=%P "$SOURCE_SHA")" == "$SOURCE_PARENT_ONE $SOURCE_PARENT_TWO $SOURCE_PARENT_THREE" &&
                "$(git rev-parse "$SOURCE_PARENT_ONE^{tree}")" == "$SOURCE_PARENT_ONE_TREE" &&
                "$(git rev-parse "$SOURCE_PARENT_TWO^{tree}")" == "$SOURCE_PARENT_TWO_TREE" &&
                "$(git rev-parse "$SOURCE_PARENT_THREE^{tree}")" == "$SOURCE_PARENT_THREE_TREE" &&
                "$(git rev-parse "$SOURCE_SHA:Cargo.lock")" == "$LOCK_SHA" &&
                "$(git rev-parse "$SOURCE_SHA:.github/workflows/release.yaml")" == "$EXPECTED_RELEASE_WORKFLOW_BLOB" &&
                "$(git rev-parse "$SOURCE_SHA:front/package.json")" == "$EXPECTED_PACKAGE_BLOB" &&
                "$(git rev-parse "$SOURCE_SHA:front/package-lock.json")" == "$EXPECTED_LOCK_BLOB" &&
                "$(git rev-parse "$SOURCE_SHA:LICENSE")" == "$EXPECTED_LICENSE_BLOB" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             grep -Fq 'name: Build and package frontend assets' .github/workflows/release.yaml &&
             grep -Fq 'npm ci --no-audit --no-fund' .github/workflows/release.yaml &&
             grep -Fq 'npm run build' .github/workflows/release.yaml &&
             grep -Fq 'install -m 0644 node_modules/vite/LICENSE.md "$package/licenses/vite-LICENSE.md"' .github/workflows/release.yaml &&
             grep -Fq 'verify_archive_members "$archive" "$name" "$target"' .github/workflows/release.yaml; then
            metadata=$(cargo metadata --locked --offline --no-deps --format-version 1)
            cargo_version=$(jq -er '[.packages[] | select(.name == "agentsandbox")] | select(length == 1) | .[0].version' <<< "$metadata")
            frontend_version=$(jq -er '.version | strings | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$"))' front/package.json)
            package_lock_version=$(jq -er '.version' front/package-lock.json)
            lock_root_version=$(jq -er '.packages[""].version' front/package-lock.json)
            vite_locked_version=$(jq -er '.packages["node_modules/vite"].version' front/package-lock.json)
            [[ "$cargo_version" == "$frontend_version" && "$package_lock_version" == "$frontend_version" &&
               "$lock_root_version" == "$frontend_version" &&
               "$vite_locked_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
            printf 'RELEASE_TAG=v%s\n' "$frontend_version" >> "$GITHUB_ENV"
            printf 'SOURCE_VERSION=%s\n' "$frontend_version" >> "$GITHUB_ENV"
            printf 'VITE_LOCKED_VERSION=%s\n' "$vite_locked_version" >> "$GITHUB_ENV"
            set_field source_guard PASS
            set_field source_version "$frontend_version"
            set_field vite_locked_version "$vite_locked_version"
            set_field archive_label "v$frontend_version"
            set_field workflow_parent "$SOURCE_SHA"
            trap - ERR
          else
            set_field source_guard FAIL
            exit 1
          fi

      - name: Prepare private frontend build scratch
        id: scratch
        if: steps.source_guard.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/g12-frontend-archive-private"
          [[ ! -e "$private" && ! -L "$private" ]]
          [[ ! -e "$RUNNER_TEMP/package" && ! -L "$RUNNER_TEMP/package" ]]
          [[ ! -e "$RUNNER_TEMP/release-assets" && ! -L "$RUNNER_TEMP/release-assets" ]]
          [[ ! -e "$GITHUB_WORKSPACE/front/node_modules" && ! -L "$GITHUB_WORKSPACE/front/node_modules" ]]
          [[ ! -e "$GITHUB_WORKSPACE/front/dist" && ! -L "$GITHUB_WORKSPACE/front/dist" ]]
          mkdir -m 700 "$private" "$RUNNER_TEMP/package" "$RUNNER_TEMP/release-assets"
          chmod 700 "$RUNNER_TEMP/package" "$RUNNER_TEMP/release-assets"

      - name: Setup Node for the frontend bundle
        id: setup_node
        if: steps.source_guard.outcome == 'success' && steps.scratch.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Build and package frontend assets
        id: frontend_bundle
        if: steps.source_guard.outcome == 'success' && steps.scratch.outcome == 'success' && steps.setup_node.outcome == 'success'
        shell: bash
        working-directory: front
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/g12-frontend-archive-private/npm-cache
        run: |
          exec > "$RUNNER_TEMP/g12-frontend-archive-private/frontend-build.log" 2>&1
          export AI_GUARD_VERSION="${RELEASE_TAG#v}"
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s node_modules/vite/LICENSE.md
          name="ai-guard-$RELEASE_TAG-frontend"
          package="$RUNNER_TEMP/package/$name"
          install -d "$package/licenses"
          cp -R dist/. "$package/"
          install -m 0644 ../LICENSE "$package/"
          install -m 0644 node_modules/vite/LICENSE.md "$package/licenses/vite-LICENSE.md"
          printf 'tag=%s\ncommit=%s\nrun=%s\nrepository=%s\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > "$package/BUILD-INFO"
          tar -C "$RUNNER_TEMP/package" -czf "$RUNNER_TEMP/release-assets/$name.tar.gz" "$name"

      - name: Verify frontend archive and close receipt
        if: always()
        shell: bash
        env:
          SOURCE_GUARD_OUTCOME: ${{ steps.source_guard.outcome }}
          BUILD_OUTCOME: ${{ steps.frontend_bundle.outcome }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g12-frontend-archive-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          if [[ "$SOURCE_GUARD_OUTCOME" != success ]]; then
            set_field npm_ci NOT_RUN
            set_field frontend_build NOT_RUN
            set_field archive_members NOT_RUN
            exit 0
          fi
          node_version="$(node --version)"
          set_field node_version "$node_version"
          if [[ "$BUILD_OUTCOME" != success ]]; then
            set_field npm_ci FAIL_OR_UNKNOWN
            set_field frontend_build FAIL
            set_field archive_members NOT_RUN
            exit 1
          fi
          set_field npm_ci PASS
          set_field frontend_build PASS

          version="${RELEASE_TAG#v}"
          name="ai-guard-$RELEASE_TAG-frontend"
          archive="$RUNNER_TEMP/release-assets/$name.tar.gz"
          private="$RUNNER_TEMP/g12-frontend-archive-private"

          [[ "$node_version" == v24.22.2 ]]
          installed_vite_version="$(jq -er '.version' front/node_modules/vite/package.json)"
          [[ "$installed_vite_version" == "$VITE_LOCKED_VERSION" ]]
          set_field vite_locked_version "$installed_vite_version"
          [[ "$version" == "$SOURCE_VERSION" ]]

          js_count="$(find front/dist/assets -maxdepth 1 -type f -name '*.js' -size +0c | wc -l | tr -d '[:space:]')"
          [[ "$js_count" =~ ^[1-9][0-9]*$ ]]
          grep -Eq '<script[^>]+src="/?assets/[^"]+\.js"' front/dist/index.html
          set_field index_html PASS
          set_field compiled_js PASS

          [[ -f "$archive" && ! -L "$archive" && -s "$archive" ]]
          archive_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ && "$archive_bytes" -lt 2147483648 ]]
          shasum -a 256 "$archive" > "$archive.sha256"
          checksum_line="$(cat "$archive.sha256")"
          archive_sha="${checksum_line%% *}"
          [[ "$archive_sha" =~ ^[0-9a-f]{64}$ &&
             "$checksum_line" == "$(shasum -a 256 "$archive")" ]]

          verify_archive_members() {
            local archive=$1 name=$2 target=$3
            LC_ALL=C tar --numeric-owner -tvzf "$archive" |
              LC_ALL=C awk -v root="$name" -v target="$target" -v native_bins="$NATIVE_BINARIES" '
                function check_required(path, needs_execute) {
                  if (count[path] != 1 || !nonempty_regular[path] || (needs_execute && !owner_executable[path])) {
                    print "Expected one nonempty " (needs_execute ? "owner-executable " : "") "regular member: " path
                    failed = 1
                  }
                }
                BEGIN {
                  native_archive = (target != "frontend" && target != "release-metadata")
                  if (native_archive) {
                    n = split(native_bins, programs, " ")
                    for (i = 1; i <= n; i++) {
                      path = "bin/" programs[i]
                      if (programs[i] !~ /^[A-Za-z0-9_.-]+$/ || programs[i] == "." || programs[i] == ".." ||
                          (path in required_binaries)) failed = 1
                      required_binaries[path] = 1
                    }
                    if (failed || !("bin/agentsandbox" in required_binaries)) {
                      print "Missing or invalid verified native binary list"
                      failed = 1
                      exit 1
                    }
                  }
                }
                {
                  # GNU tar lists one uid/gid field. BSD tar lists link count, uid, and gid separately.
                  gnu = ($2 ~ /^[0-9]+\/[0-9]+$/)
                  size = gnu ? $3 : $5
                  fields = gnu ? 5 : 8
                  path = $0
                  for (i = 0; i < fields; i++) sub(/^[^[:blank:]]+[[:blank:]]+/, "", path)
                  type = substr($1, 1, 1)
                  if (type == "l") sub(/ -> .*/, "", path)
                  if (type == "h") sub(/ link to .*/, "", path)
                  if (type == "d") sub(/\/$/, "", path)
                  if (path == root) next
                  if (index(path, root "/") != 1 || path ~ /(^|\/)\.\.?($|\/)|\/\/|\/$/) {
                    print "Expected a member path under " root "/ without path aliases"
                    failed = 1
                    next
                  }
                  path = substr(path, length(root) + 2)
                  if (native_archive &&
                      ((path == "bin" && type != "d") ||
                       (index(path, "bin/") == 1 && !(path in required_binaries)))) {
                    print "Unexpected native bin member " path
                    failed = 1
                    next
                  }
                  if (path == "BUILD-INFO" || path == "LICENSE" || (path in required_binaries) || path == "index.html" ||
                      path == "THIRD-PARTY-NOTICES" ||
                      (target == "release-metadata" && (path == "manifest/release-manifest.json" ||
                        path == "manifest/sbom.cdx.json" || path == "manifest/SHA256SUMS")) ||
                      (target == "frontend" && (path == "licenses/vite-LICENSE.md" || path ~ /^assets\/.+\.js$/))) {
                    count[path]++
                    nonempty_regular[path] = (type == "-" && size ~ /^[0-9]+$/ && size + 0 > 0)
                    owner_executable[path] = (substr($1, 4, 1) ~ /[xs]/)
                  }
                }
                END {
                  check_required("BUILD-INFO", 0)
                  check_required("LICENSE", 0)
                  if (target == "release-metadata") {
                    check_required("manifest/release-manifest.json", 0)
                    check_required("manifest/sbom.cdx.json", 0)
                    check_required("manifest/SHA256SUMS", 0)
                    if (count["index.html"] || count["THIRD-PARTY-NOTICES"]) {
                      print "Unexpected frontend or notices member in the metadata archive"
                      failed = 1
                    }
                  } else if (target == "frontend") {
                    check_required("index.html", 0)
                    check_required("licenses/vite-LICENSE.md", 0)
                    for (path in count) {
                      if (path ~ /^assets\/.+\.js$/ && count[path] == 1 && nonempty_regular[path]) has_script = 1
                    }
                    if (!has_script) {
                      print "Expected at least one nonempty regular JavaScript asset under assets/"
                      failed = 1
                    }
                  } else {
                    check_required("THIRD-PARTY-NOTICES", 0)
                    for (path in required_binaries) check_required(path, 1)
                  }
                  exit failed
                }
              '
          }

          if ! verify_archive_members "$archive" "$name" frontend > "$private/member-check.log" 2>&1; then
            set_field archive_members FAIL
            exit 1
          fi
          set_field archive_members PASS
          archive_member_count="$(tar -tzf "$archive" | wc -l | tr -d '[:space:]')"
          [[ "$archive_member_count" =~ ^[1-9][0-9]*$ ]]

          if ! tar -xOzf "$archive" -- "$name/BUILD-INFO" | cmp -s - <(
            printf 'tag=%s\ncommit=%s\nrun=%s\nrepository=%s\n' \
              "$RELEASE_TAG" "$RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY"
          ); then
            set_field build_info_source FAIL
            exit 1
          fi
          set_field build_info_source PASS

          source_license_sha="$(git show --no-textconv "$SOURCE_SHA:LICENSE" | shasum -a 256)"
          source_license_sha="${source_license_sha%% *}"
          [[ "$source_license_sha" =~ ^[0-9a-f]{64}$ ]]
          if ! tar -xOzf "$archive" -- "$name/LICENSE" | cmp -s - <(git show --no-textconv "$SOURCE_SHA:LICENSE"); then
            set_field source_license FAIL
            exit 1
          fi
          set_field source_license "PASS_$source_license_sha"

          vite_license_sha="$(shasum -a 256 front/node_modules/vite/LICENSE.md)"
          vite_license_sha="${vite_license_sha%% *}"
          [[ "$vite_license_sha" =~ ^[0-9a-f]{64}$ ]]
          if ! tar -xOzf "$archive" -- "$name/licenses/vite-LICENSE.md" | cmp -s - front/node_modules/vite/LICENSE.md; then
            set_field vite_license_exact FAIL
            exit 1
          fi
          set_field vite_license_exact "PASS_$vite_license_sha"

          if ! tar -xOzf "$archive" -- "$name/index.html" | cmp -s - front/dist/index.html; then
            set_field index_html FAIL
            exit 1
          fi
          set_field archive_sha256 "$archive_sha"
          set_field archive_bytes "$archive_bytes"
          set_field archive_member_count "$archive_member_count"
          set_field scratch_cleanup PENDING
          set_field receipt_closed YES

      - name: Close private frontend build scratch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g12-frontend-archive-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            chmod 600 "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          for path in \
            "$RUNNER_TEMP/g12-frontend-archive-private" \
            "$RUNNER_TEMP/package" \
            "$RUNNER_TEMP/release-assets"; do
            if [[ -d "$path" && ! -L "$path" && "$(realpath -- "$path")" == "$path" ]]; then
              rm -rf -- "$path"
            fi
          done
          for path in "$GITHUB_WORKSPACE/front/node_modules" "$GITHUB_WORKSPACE/front/dist"; do
            if [[ -d "$path" && ! -L "$path" && "$(realpath -- "$path")" == "$path" ]]; then
              rm -rf -- "$path"
            fi
          done
          if [[ ! -e "$RUNNER_TEMP/g12-frontend-archive-private" &&
                ! -e "$RUNNER_TEMP/package" &&
                ! -e "$RUNNER_TEMP/release-assets" &&
                ! -e "$GITHUB_WORKSPACE/front/node_modules" &&
                ! -e "$GITHUB_WORKSPACE/front/dist" ]]; then
            set_field scratch_cleanup PASS
          else
            set_field scratch_cleanup INCOMPLETE
            exit 1
          fi
          set_field receipt_closed YES

      - name: Upload closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030dd5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g12-frontend-archive-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/g12-frontend-archive-receipt.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  rust:
    if: github.ref_name != 'claude/v1-g12-a2-frontend-archive-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      # Match CI's build limit when compiling and linking the full test suite.
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk for the test targets
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Fetch dependencies with the pinned Rust toolchain
        run: |
          rustc --version
          cargo fetch --locked
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all targets with MySQL enabled
        run: cargo check --locked --offline --all-targets --features mysql-storage --keep-going
      - name: Check all targets without default features (SQLite only)
        run: cargo check --locked --offline --all-targets --no-default-features --keep-going
      - name: Third-party licence guard and its unit tests
        # `cargo test` builds examples but does not run their unit tests.
        run: |
          cargo test --locked --offline --example third_party_notices
          cargo run --quiet --locked --offline --example third_party_notices -- check --allowed .github/third-party-license-expressions.txt
      - name: Provider harness regressions
        run: |
          python3 -B tests/e2e/interactive_driver.py --self-test
          python3 -B tests/e2e/test_run_provider_preflight.py ProviderPreflightTests ProviderBrowserStageTests
          python3 -B tests/e2e/test_run_provider_broker.py BrokerRecipeTests
      - name: Rust test suite (ignored engine and provider tests excluded)
        if: github.ref_name != 'claude/v1-integration-regressions-20261122'
        shell: bash
        run: |
          set -o pipefail
          export TMPDIR="$(mktemp -d /tmp/aig.XXXXXX)"
          cargo test --locked --offline --no-fail-fast 2>&1 | tee cargo-test.log
      - name: Targeted SQLite library regressions
        if: github.ref_name == 'claude/v1-integration-regressions-20261122'
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(mktemp -d /tmp/aig.XXXXXX)"
          build_json="$TMPDIR/libtest.jsonl"
          test_log="$TMPDIR/selector.log"
          summary=cargo-test-summary.txt
          failures=cargo-test-failed.txt
          : > "$summary"
          : > "$failures"

          settlement=broker::service::server::retirement_settlement_tests::same_original_not_queued_final_retries_its_retained_input_before_another_q
          selectors=(
            audit::resource_tests::retention_confirms_the_committed_segment_after_a_filesystem_ack_failure
            api::human_sources::journal_tests::owned_event_page_reports_the_archived_prefix_after_adoption
            api::human_sources::tests::owned_admin_reads_refuse_head_before_authentication
            api::human_sources::journal_tests::owned_admin_reads::owned_sources_apply_a_delegated_membership_change_under_the_write_epoch
            identity::operations::tests::owned_event_availability_preserves_granted_permissions
            broker::writer::inventory_tests::completed_inventory_releases_its_permit_before_reply
            broker::writer::inventory_tests::timed_out_inventory_keeps_one_permit_and_cannot_queue_a_series_before_cancel
            broker::writer::status_projection_tests::coverage_only_pending_arm_does_not_taint_a_valid_last_confirmed_status
            "$settlement"
          )
          expected=9
          if (( ${#selectors[@]} != expected )); then
            echo 'Invalid regression selector count' | tee -a "$summary"
            exit 1
          fi
          printf 'Revision %s; %s exact SQLite library tests expected\n' "$GITHUB_SHA" "$expected" | tee -a "$summary"

          # Keep raw Cargo and test output in the runner's private scratch directory.
          if ! cargo test --locked --offline --no-default-features --lib --no-run \
              --message-format=json > "$build_json" 2> "$TMPDIR/build.stderr"; then
            echo 'SQLite library build failed; tests not run' | tee -a "$summary"
            jq -r 'select(.reason == "compiler-message" and .message.level == "error")
              | .message.code.code // empty | select(test("^E[0-9]{4}$"))' "$build_json" \
              2>/dev/null | sort -u | tee -a "$summary" || true
            exit 1
          fi
          if ! libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "agentsandbox" and .target.kind == ["lib"]
              and .profile.test == true and .executable != null) | .executable]
              | unique | if length == 1 then .[0] else empty end' "$build_json")" \
              || [[ ! -x "$libtest" ]]; then
            echo 'Expected one SQLite library test executable; tests not run' | tee -a "$summary"
            exit 1
          fi
          printf 'SQLite libtest SHA-256 %s\n' "$(sha256sum "$libtest" | awk '{print $1}')" | tee -a "$summary"

          passed=0
          for selector in "${selectors[@]}"; do
            if "$libtest" "$selector" --exact --test-threads=1 > "$test_log" 2>&1 \
                && grep -Fxq 'running 1 test' "$test_log" \
                && grep -Fxq "test $selector ... ok" "$test_log" \
                && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$test_log"; then
              printf 'PASS %s\n' "$selector" | tee -a "$summary"
              ((passed += 1))
            else
              printf 'FAIL %s\n' "$selector" | tee -a "$summary"
              printf '%s\n' "$selector" >> "$failures"
              if [[ "$selector" == "$settlement" ]]; then
                phases='bind_full3|enqueue_signal|ack_signal|load_before_retirement|begin_retirement|ack_pending|authorize_retirement|read_pending|load_before_final|pause_writer'
                categories='InvalidInput|UnsupportedVersion|TooLarge|LimitExceeded|Busy|Conflict|Interrupted|Corrupt|UnsafeFilesystem|ControlSecret|Io'
                grep -Eo "settlement phase=($phases) category=($categories)\b" "$test_log" \
                  | sort -u | tee -a "$summary" || true
              fi
            fi
          done
          printf 'Passed %s of %s exact selectors\n' "$passed" "$expected" | tee -a "$summary"
          (( passed == expected ))
      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          if [ -f cargo-test.log ]; then
            grep -E '^test result:|^     Running ' cargo-test.log > cargo-test-summary.txt || true
            grep -E '\.\.\. FAILED$' cargo-test.log | sed 's/^test //; s/ \.\.\. FAILED$//' > cargo-test-failed.txt || true
            {
              echo "### Rust test suite"
              echo
              echo "Failed tests: $(wc -l < cargo-test-failed.txt)"
              echo
              echo '```'
              head -n 100 cargo-test-failed.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f cargo-test-summary.txt ]; then
            {
              echo "### Targeted SQLite library tests"
              echo '```'
              cat cargo-test-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lot-verify-rust-${{ github.sha }}
          path: |
            cargo-test.log
            cargo-test-summary.txt
            cargo-test-failed.txt
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    if: github.ref_name != 'claude/v1-g12-a2-frontend-archive-check-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
