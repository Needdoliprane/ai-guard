name: G09 rootful inspect null-safe bind count

on:
  push:
    branches: ['claude/v1-g09-rootful-inspect-null-check-20261123']

permissions:
  contents: read

concurrency:
  group: g09-rootful-inspect-null-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AI_GUARD_BUILD_REVISION: c2b8885180488424a2c8517bb64d555eb900a7db
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Initialize a closed receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          printf 'source_sha=c2b8885180488424a2c8517bb64d555eb900a7db\nsource_parent_sha=d0e4c329dd0d075b4afd60f5cef648dbd4225695\nmarker_sha=d0e4c329dd0d075b4afd60f5cef648dbd4225695\nsource_base_sha=b2dacaf9477f13e053b839b97fb1480242a6ecaf\nsource_base_parent_1=c20ed2f2bb872f49e9312798e3d8230766db2657\nsource_base_parent_2=54886f2ef042dee4a06fb2ff0f79a80a0e851a1e\nworkflow_sha=%s\nworkflow_parent_sha=unknown\nselector=broker_sigkill_preserves_original_deadline_without_second_start\nworker_scope=one\nworker_command=/bin/sleep\nworker_network=none\nmode=linux-x86_64-rootful-docker-unix:///var/run/docker.sock\nsource_check=NOT_RUN\nworkflow_check=NOT_RUN\nrootful_preflight=NOT_RUN\nworker_image_uid=NOT_RUN\nworker_image_id_sha256=unknown\nworker_image_tag_retained=NOT_RUN\nbuild_no_run=NOT_RUN\ntest_verdict=NOT_RUN\ntest_selected=unknown\ntest_passed=unknown\ntest_failed=unknown\ntest_ignored=unknown\ntest_exit=unknown\nevidence_marker=NOT_PROCESSED\nfixture_stage=UNKNOWN\nfixture_init=NOT_ATTESTED\nsubmit_accepted=NOT_ATTESTED\nreported_batch_failure_file=NOT_VERIFIED\nguard_before_file=NOT_VERIFIED\naudit_before_file=NOT_VERIFIED\nrecovery_before_file=NOT_VERIFIED\ndocker_running_file=NOT_VERIFIED\ncontainers_before=unknown\ncontainers_after=unknown\ncontainers_new=unknown\nvolumes_before=unknown\nvolumes_after=unknown\nvolumes_new=unknown\nfixture_resources=UNKNOWN_NO_VERIFIED_EVIDENCE_ROOT\nworkflow_engine_cleanup=NOT_PERFORMED\nreceipt_closed=NOT_CLOSED\nlast_phase=initialized\n' "$WORKFLOW_SHA" > "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify exact merge source and one-file child
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source=c2b8885180488424a2c8517bb64d555eb900a7db
          base=b2dacaf9477f13e053b839b97fb1480242a6ecaf
          marker=d0e4c329dd0d075b4afd60f5cef648dbd4225695
          selector=broker_sigkill_preserves_original_deadline_without_second_start
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g09-rootful-inspect-null-check-20261123 &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$source" &&
                "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git show -s --format=%P "$source")" == "$marker" &&
                "$(git show -s --format=%P "$marker")" == "$base" &&
                "$(git show -s --format=%P "$base")" == 'c20ed2f2bb872f49e9312798e3d8230766db2657 54886f2ef042dee4a06fb2ff0f79a80a0e851a1e' &&
                "$(git diff --name-only "$base" "$marker")" == tests/broker_runtime.rs &&
                "$(git diff --name-only "$marker" "$source")" == tests/support/broker_runtime.rs &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             git diff --quiet "$base" "$marker" -- Cargo.lock &&
             git diff --quiet "$marker" "$source" -- Cargo.lock &&
             grep -Fq "async fn $selector() -> Result<()>" tests/broker_runtime.rs &&
             grep -Fq '#[ignore = "requires explicit Docker program/Unix endpoint/image/rootful opt-in; retains enforcer and QA resources"]' tests/broker_runtime.rs &&
             grep -Fq 'let argv = vec!["/bin/sleep".into(), sleep_seconds.to_string()];' tests/broker_runtime.rs &&
             grep -Fq '"network":"none"' tests/broker_runtime.rs &&
             grep -Fq 'broker.kill_owned()?' tests/broker_runtime.rs &&
             grep -Fq 'killed_status.signal() == Some(libc::SIGKILL)' tests/broker_runtime.rs &&
             grep -Fq 'evidence.write("submit-accepted.json", &json!({"stage":"submit_accepted"}))?;' tests/broker_runtime.rs &&
             grep -Fq 'restart_same_broker_and_registry' tests/broker_runtime.rs &&
             grep -Fq '.prefix("br-")' tests/support/broker_runtime.rs &&
             grep -Fq '.tempdir_in(base)' tests/support/broker_runtime.rs &&
             grep -Fq 'retained broker runtime evidence:' tests/support/broker_runtime.rs &&
             grep -Fq '"bind_count":{{if eq (json .HostConfig.Binds) "null"}}0{{else}}{{len .HostConfig.Binds}}{{end}}' tests/support/broker_runtime.rs &&
             grep -Fq 'inspection["bind_count"] == 0' tests/broker_runtime.rs &&
             grep -Fq 'check_mounts(&running, &worker.attempt.volume_name)?;' tests/broker_runtime.rs &&
             grep -Fq 'let mounts = inspection["mounts"]' tests/broker_runtime.rs; then
            set_field workflow_parent_sha "$source"
            set_field source_check PASS
            set_field workflow_check PASS
            set_field last_phase source_verified
          else
            set_field source_check FAIL
            set_field workflow_check FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Prepare private short TMPDIR
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=private_tmp_prepare/' "$receipt"
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private"
          canonical=$(realpath -- "$private")
          [[ "$canonical" == "$private" && ${#canonical} -le 80 ]]
          [[ "$(stat -c '%a' "$private")" == 700 ]]
          mkdir -m 700 "$private/tmp"
          [[ "$(realpath -- "$private/tmp")" == "$private/tmp" && "$(stat -c '%a' "$private/tmp")" == 700 ]]
          printf 'G09_PRIVATE=%s\nTMPDIR=%s\n' "$private" "$private/tmp" >> "$GITHUB_ENV"

      - name: Verify local rootful Docker and inventory existing resources
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rootful_docker_preflight
          endpoint=$(docker context inspect --format '{{.Endpoints.docker.Host}}' default)
          security=$(docker info --format '{{json .SecurityOptions}}')
          server_platform=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          private="$G09_PRIVATE"
          if test -S /var/run/docker.sock &&
             [[ "$endpoint" == unix:///var/run/docker.sock && "$server_platform" == linux/amd64 ]] &&
             jq -e 'all(.[]; (ascii_downcase | contains("rootless")) | not)' <<< "$security" >/dev/null; then
            docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.before"
            docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.before"
            set_field containers_before "$(wc -l < "$private/containers.before" | tr -d ' ')"
            set_field volumes_before "$(wc -l < "$private/volumes.before" | tr -d ' ')"
            set_field rootful_preflight PASS
            set_field last_phase rootful_preflight_complete
          else
            set_field rootful_preflight FAIL
            set_field last_phase rootful_mode_verification
            exit 1
          fi

      - name: Build immutable UID 1000 worker image without providers
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          tag="ai-guard-g09-broker-recovery:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$tag" > "$G09_PRIVATE/image.tag"
          set_field last_phase worker_image_build
          if docker build --file images/worker.Dockerfile --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= --tag "$tag" . > "$G09_PRIVATE/worker-build.log" 2>&1; then
            worker_id=$(docker image inspect --format '{{.Id}}' "$tag")
            [[ "$worker_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$(docker image inspect --format '{{.Config.User}}' "$worker_id")" == 1000:1000 ]]
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$worker_id")" == linux/amd64 ]]
            printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_ALLOW_ROOTFUL=1\nAGENTSANDBOX_TEST_RETAIN_ENFORCER=1\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=unix:///var/run/docker.sock\nAGENTSANDBOX_TEST_IMAGE=%s\nAGENTSANDBOX_TEST_BROKER_NATIVE_START=1\nAGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS=30\n' "$worker_id" >> "$GITHUB_ENV"
            printf '%s\n' "$worker_id" > "$G09_PRIVATE/image.id"
            set_field worker_image_uid PASS
            set_field worker_image_id_sha256 "${worker_id#sha256:}"
            set_field worker_image_tag_retained YES_EPHEMERAL_RUNNER
            set_field last_phase worker_image_verified
          else
            set_field worker_image_uid FAIL
            set_field last_phase worker_image_build_failed
            exit 1
          fi

      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=dependency_fetch/' "$receipt"
          if cargo fetch --locked > "$G09_PRIVATE/fetch.log" 2>&1; then
            sed -i 's/^last_phase=.*/last_phase=dependencies_fetched/' "$receipt"
          else
            rc=$?
            sed -i "s/^last_phase=.*/last_phase=dependency_fetch_failed_exit_${rc}/" "$receipt"
            exit "$rc"
          fi

      - name: Compile the natural CLI and one libtest without running tests
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase libtest_no_run
          if cargo test --locked --offline --test broker_runtime --no-run --message-format=json > "$G09_PRIVATE/build.jsonl" 2> "$G09_PRIVATE/build.stderr"; then
            libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "broker_runtime" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl")
            cli=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["bin"] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl")
            [[ -x "$libtest" && -x "$cli" ]]
            printf '%s\n' "$(sha256sum "$libtest" | awk '{print $1}')" > "$G09_PRIVATE/libtest.sha256"
            printf '%s\n' "$(sha256sum "$cli" | awk '{print $1}')" > "$G09_PRIVATE/cli.sha256"
            set_field build_no_run PASS
            set_field build_test_sha256 "$(<"$G09_PRIVATE/libtest.sha256")"
            set_field build_cli_sha256 "$(<"$G09_PRIVATE/cli.sha256")"
            set_field last_phase compiled_no_run
          else
            set_field build_no_run FAIL
            set_field last_phase no_run_build_failed
            exit 1
          fi

      - name: Run only the exact ignored broker-loss recovery test
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector=broker_sigkill_preserves_original_deadline_without_second_start
          log="$G09_PRIVATE/test.log"
          set_field last_phase targeted_runtime_test
          if cargo test --locked --offline --test broker_runtime "$selector" -- --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1; then rc=0; else rc=$?; fi
          selected=0; passed=0; failed=0; ignored=0
          grep -Fqx 'running 1 test' "$log" && selected=1 || true
          grep -Fqx "test $selector ... ok" "$log" && { selected=1; passed=1; } || true
          grep -Fqx "test $selector ... FAILED" "$log" && { selected=1; failed=1; } || true
          summary=$(grep -E '^test result:' "$log" | tail -n 1 | sed -E 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/' || true)
          if [[ "$summary" =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then read -r passed failed ignored <<< "$summary"; fi
          if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then verdict=PASS; phase=broker_recovery_test_complete; else verdict=FAIL; phase=broker_recovery_test_failed_or_unconfirmed; fi
          set_field test_verdict "$verdict"
          set_field test_selected "$selected"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"

          marker_text='retained broker runtime evidence:'
          marker_count="$( (grep -oF "$marker_text" "$log" 2>/dev/null || true) | wc -l | tr -d ' ' )"
          evidence_root=
          evidence_marker=REJECTED
          if [[ "$marker_count" == 0 ]]; then
            evidence_marker=ABSENT
          elif [[ "$marker_count" != 1 ]]; then
            evidence_marker=AMBIGUOUS
          else
            plain_root="$(sed -nE 's|^retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\1|p' "$log")"
            prefixed_root="$(sed -nE 's|^test broker_sigkill_preserves_original_deadline_without_second_start \.\.\. retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\1|p' "$log")"
            marker_matches=()
            [[ -n "$plain_root" ]] && marker_matches+=("$plain_root")
            [[ -n "$prefixed_root" ]] && marker_matches+=("$prefixed_root")
            if [[ "${#marker_matches[@]}" == 1 ]]; then
              candidate_root="${marker_matches[0]}"
              root_meta="$(stat -c '%u %a' "$candidate_root" 2>/dev/null)" || root_meta=''
              root_canonical="$(realpath -- "$candidate_root" 2>/dev/null)" || root_canonical=''
              if [[ "$candidate_root" =~ ^/tmp/br-[[:alnum:]]{6}$ && -d "$candidate_root" && ! -L "$candidate_root" &&
                    "$root_canonical" == "$candidate_root" && "$root_meta" == "$(id -u) 700" ]]; then
                evidence_root="$candidate_root"
                evidence_marker=VERIFIED
              fi
            fi
          fi
          set_field evidence_marker "$evidence_marker"
          if [[ "$evidence_marker" == VERIFIED ]]; then
            set_field fixture_resources EVIDENCE_ROOT_RETAINED_STATE_UNKNOWN
            ordinary_private_file() {
              local candidate="$1" metadata canonical
              [[ -f "$candidate" && ! -L "$candidate" ]] || return 1
              canonical="$(realpath -- "$candidate" 2>/dev/null)" || return 1
              [[ "$canonical" == "$candidate" ]] || return 1
              metadata="$(stat -c '%u %a' "$candidate" 2>/dev/null)" || return 1
              [[ "$metadata" == "$(id -u) 600" ]]
            }
            if ordinary_private_file "$evidence_root/stage.json"; then
              fixture_stage="$(jq -ser 'if length == 1 and (.[0] | type == "object" and
                (.stage == "read_only_preflight" or .stage == "submit_real_worker" or
                 .stage == "kill_owned_broker_only" or .stage == "restart_same_broker_and_registry"))
                then .[0].stage else empty end' "$evidence_root/stage.json" 2>/dev/null)" || fixture_stage=UNKNOWN
            else
              fixture_stage=UNKNOWN
            fi
            case "$fixture_stage" in
              read_only_preflight|submit_real_worker|kill_owned_broker_only|restart_same_broker_and_registry) ;;
              *) fixture_stage=UNKNOWN ;;
            esac
            set_field fixture_stage "$fixture_stage"
            if ordinary_private_file "$evidence_root/preflight.json" &&
               jq -e '.allow_rootful == true and .native_start == true and .timeout_seconds == 30 and .endpoint == "unix:///var/run/docker.sock" and .image.os == "linux"' "$evidence_root/preflight.json" >/dev/null 2>&1; then
              set_field fixture_init ATTESTED
            fi
            if ordinary_private_file "$evidence_root/submit-accepted.json" &&
               jq -e 'type == "object" and length == 1 and .stage == "submit_accepted"' "$evidence_root/submit-accepted.json" >/dev/null 2>&1; then
              set_field submit_accepted ATTESTED
            fi
            for entry in \
              'reported_batch_failure_file:reported-batch-failure.json' \
              'guard_before_file:guard-before.json' \
              'audit_before_file:audit-before.json' \
              'recovery_before_file:recovery-before.json' \
              'docker_running_file:docker-running.json'; do
              field=${entry%%:*}
              filename=${entry#*:}
              if ordinary_private_file "$evidence_root/$filename"; then
                set_field "$field" PRESENT_PRIVATE
              else
                set_field "$field" ABSENT_OR_NOT_PRIVATE
              fi
            done
          else
            set_field fixture_resources UNKNOWN_NO_VERIFIED_EVIDENCE_ROOT
            set_field fixture_stage UNKNOWN
          fi
          set_field last_phase "$phase"
          [[ "$verdict" == PASS ]]

      - name: Record read-only resource inventory without cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-inspect-null-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field workflow_engine_cleanup INVENTORY_UNAVAILABLE
          if [[ -d "$private" && -f "$private/containers.before" && -f "$private/volumes.before" ]] && docker info >/dev/null 2>&1; then
            if docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.after" &&
               docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.after" &&
               comm -13 "$private/containers.before" "$private/containers.after" > "$private/containers.new" &&
               comm -13 "$private/volumes.before" "$private/volumes.after" > "$private/volumes.new"; then
              set_field containers_after "$(wc -l < "$private/containers.after" | tr -d ' ')"
              set_field containers_new "$(wc -l < "$private/containers.new" | tr -d ' ')"
              set_field volumes_after "$(wc -l < "$private/volumes.after" | tr -d ' ')"
              set_field volumes_new "$(wc -l < "$private/volumes.new" | tr -d ' ')"
              set_field workflow_engine_cleanup NOT_PERFORMED
            fi
          fi
          set_field receipt_closed YES

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-rootful-inspect-null-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/g09-rootful-inspect-null-receipt.txt
          if-no-files-found: error
          retention-days: 14
