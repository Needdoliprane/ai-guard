name: G05 R1 egress retention witness

# Runs one local Store regression on the frozen pre-fix source.
on:
  push:
    branches: ['claude/v1-g05-r1-egress-pin-oracle-20261122']

permissions:
  contents: read

concurrency:
  group: g05-r1-egress-pin-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Observe the exact Store retention regression
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          selector='audit::egress_decisions::tests::egress_store_retention_preserves_decision_and_channel_receipts'
          marker='egress_decision_retention_lost'
          summary="$RUNNER_TEMP/g05-r1-egress-retention-status.txt"
          fetch_exit_code=NOT_RUN
          compilation_status=NOT_RUN
          compilation_exit_code=NOT_RUN
          test_status=NOT_RUN
          test_exit_code=NOT_RUN
          selection_banner_count=0
          selected_test_count=0
          case_result_count=0
          failed_case_count=0
          marker_count=0
          selected_failure_marker_count=0
          verdict=INCONCLUSIVE

          write_summary() {
            local workflow_exit_code=$?
            {
              printf 'fetch_exit_code=%s\n' "$fetch_exit_code"
              printf 'compilation_status=%s\n' "$compilation_status"
              printf 'compilation_exit_code=%s\n' "$compilation_exit_code"
              printf 'test_status=%s\n' "$test_status"
              printf 'test_exit_code=%s\n' "$test_exit_code"
              printf 'selection_banner_count=%s\n' "$selection_banner_count"
              printf 'selected_test_count=%s\n' "$selected_test_count"
              printf 'case_result_count=%s\n' "$case_result_count"
              printf 'failed_case_count=%s\n' "$failed_case_count"
              printf 'marker_count=%s\n' "$marker_count"
              printf 'selected_failure_marker_count=%s\n' "$selected_failure_marker_count"
              printf 'verdict=%s\n' "$verdict"
              printf 'workflow_exit_code=%s\n' "$workflow_exit_code"
            } > "$summary"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          }
          trap write_summary EXIT

          scratch="$(mktemp -d "$RUNNER_TEMP/g05-r1-private.XXXXXX")"
          if cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            fetch_exit_code=0
          else
            fetch_exit_code=$?
            exit "$fetch_exit_code"
          fi

          if cargo test --locked --offline --no-default-features --lib --no-run > "$scratch/build.log" 2>&1; then
            compilation_status=PASS
            compilation_exit_code=0
          else
            compilation_exit_code=$?
            compilation_status=FAIL
            exit "$compilation_exit_code"
          fi

          test_log="$scratch/test.log"
          if cargo test --locked --offline --no-default-features --lib "$selector" -- --exact > "$test_log" 2>&1; then
            test_exit_code=0
          else
            test_exit_code=$?
          fi
          test_status=UNOBSERVED
          selection_banner_count="$(grep -Ec '^running [0-9]+ tests?$' "$test_log" || true)"
          selected_test_count="$(awk '/^running [0-9]+ tests?$/ { count += $2 } END { print count + 0 }' "$test_log")"
          case_result_count="$(grep -Ec '^test .+ \.\.\. (ok|FAILED|ignored)(,.*)?$' "$test_log" || true)"
          failed_case_count="$(grep -Fxc "test $selector ... FAILED" "$test_log" || true)"
          marker_count="$(grep -Fxc "$marker" "$test_log" || true)"
          selected_failure_marker_count="$(awk -v banner="---- $selector stdout ----" -v marker="$marker" '
            $0 == "failures:" || /^test result: / { in_selected_failure = 0 }
            $0 == banner { in_selected_failure = 1; next }
            in_selected_failure && $0 == marker { count++ }
            END { print count + 0 }
          ' "$test_log")"
          result_count="$(grep -c '^test result: ' "$test_log" || true)"
          if [[ "$selection_banner_count" == 1 && "$selected_test_count" == 1 &&
              "$case_result_count" == 1 && "$result_count" == 1 ]]; then
            if [[ "$test_exit_code" == 101 && "$failed_case_count" == 1 ]] &&
                grep -Eq '^test result: FAILED\. 0 passed; 1 failed; 0 ignored;' "$test_log"; then
              test_status=FAIL
              if [[ "$marker_count" == 1 && "$selected_failure_marker_count" == 1 ]]; then
                verdict=REPRODUCED
              fi
            elif [[ "$test_exit_code" == 0 ]] &&
                grep -Fxq "test $selector ... ok" "$test_log" &&
                grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$test_log"; then
              test_status=PASS
              verdict=NOT_REPRODUCED
            fi
          fi

          if [[ "$test_exit_code" == 0 ]]; then
            exit 1
          fi
          exit "$test_exit_code"

      - name: Upload the sanitized retention witness
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g05-r1-egress-retention-status-${{ github.sha }}
          path: ${{ runner.temp }}/g05-r1-egress-retention-status.txt
          if-no-files-found: error
          retention-days: 14
