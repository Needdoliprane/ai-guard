name: G07 SQL activity gateway verification

on:
  push:
    branches: ['claude/v1-g07-mysql-activity-gateway-check-20261122']

permissions:
  contents: read

concurrency:
  group: lot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk for the test targets
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Check both SQL profiles and run the SQLite gateway oracles
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(mktemp -d /tmp/aig.XXXXXX)"

          report() {
            printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          report_cargo_failure() {
            local label=$1 status=$2 output=$3 codes
            codes=$(sed -nE 's/^error\[(E[0-9]{4})\]:.*/\1/p' <<< "$output" | sort -u | paste -sd, -)
            if [[ -n $codes ]]; then
              report "FAIL $label category=rustc exit=$status codes=$codes"
            elif grep -Eq '^error: (linking |could not link |failed to build archive)' <<< "$output"; then
              report "FAIL $label category=linker exit=$status"
            elif grep -Fq 'No space left on device' <<< "$output"; then
              report "FAIL $label category=disk_space exit=$status"
            else
              report "FAIL $label category=cargo exit=$status"
            fi
          }

          check() {
            local label=$1 output status=0
            shift
            output=$(cargo "$@" 2>&1) || status=$?
            if (( status == 0 )); then
              report "PASS $label"
            else
              report_cargo_failure "$label" "$status" "$output"
              return 1
            fi
          }

          test_target() {
            local label=$1 expected=$2 output status=0 counts passed failed ignored
            shift 2
            output=$(cargo test --locked --offline --no-default-features "$@" 2>&1) || status=$?
            counts=$(sed -nE 's/^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored; [0-9]+ measured; [0-9]+ filtered out;.*/\2 \3 \4/p' <<< "$output")
            if [[ ! $counts =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then
              report_cargo_failure "$label" "$status" "$output"
              return 1
            fi
            read -r passed failed ignored <<< "$counts"
            if (( status != 0 || passed != expected || failed != 0 || ignored != 0 )); then
              report "FAIL $label category=test_result passed=$passed expected=$expected failed=$failed ignored=$ignored exit=$status"
              return 1
            fi
            report "PASS $label passed=$passed failed=$failed ignored=$ignored"
          }

          failed=0
          check dependencies fetch --locked || exit 1
          check mysql check --locked --offline --all-targets --no-default-features --features mysql-storage --keep-going || failed=1
          if check sqlite check --locked --offline --all-targets --no-default-features --keep-going; then
            test_target api_lib 2 --lib -- --exact --test-threads=1 \
              api::ingestion_window_tests::legacy_batch_preserves_receipts_and_rolls_back_before_conflict_reply \
              api::human_sources::tests::modern_route_matrix_closes_before_body_extractors_and_store || failed=1
            test_target api_auth_boundary 6 --test api_auth_boundary -- --test-threads=1 || failed=1
          else
            report 'SKIP SQLite gateway oracles category=sqlite_check_failed'
            failed=1
          fi
          exit "$failed"
