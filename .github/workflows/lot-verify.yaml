name: G12 candidate release asset preflight

# A source-only check for one immutable candidate. It creates no tag or release.
on:
  push:
    branches:
      - claude/v1-g12-candidate-release-assets-lot-verify-20261122

permissions:
  contents: read

concurrency:
  group: g12-candidate-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_TERM_COLOR: never
      AI_GUARD_VERSION: '0.0.1'
      AI_GUARD_BUILD_REVISION: 'ce0297852a20f0c6f9f7b66fb2beede29d725475'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize closed preflight receipt
        shell: bash
        run: |
          umask 077
          receipt=g12-candidate-release-assets-receipt.txt
          cat > "$receipt" <<EOF
          candidate=ce0297852a20f0c6f9f7b66fb2beede29d725475
          source_guard=NOT_RUN
          source_guard_negative=NOT_RUN
          dependency_fetch=NOT_RUN
          build=NOT_RUN
          notices=NOT_RUN
          manifest=NOT_RUN
          source_verify=NOT_RUN
          sbom=NOT_RUN
          notices_sha256=NOT_RUN
          release_manifest_sha256=NOT_RUN
          sbom_sha256=NOT_RUN
          sha256sums_sha256=NOT_RUN
          sbom_component_count=NOT_RUN
          EOF

      - name: Verify workflow SHA and select exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          receipt=g12-candidate-release-assets-receipt.txt
          source_sha=ce0297852a20f0c6f9f7b66fb2beede29d725475
          expected_parent=ce0297852a20f0c6f9f7b66fb2beede29d725475
          expected_base=65798ff1cf1ea1f753a8418d6c9e48a7b74c7c97
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          fail_guard() { set_receipt source_guard FAIL; echo 'Source guard failed; details omitted.' >&2; exit 1; }
          verify_workflow_sha() {
            local workflow_sha="$1" actual_parent changed
            [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]] || return 1
            actual_parent="$(git rev-parse "$workflow_sha^" 2>/dev/null)" || return 1
            [[ "$actual_parent" == "$expected_parent" ]] || return 1
            changed="$(git diff-tree --no-commit-id --name-only -r "$workflow_sha" 2>/dev/null)" || return 1
            [[ "$changed" == '.github/workflows/lot-verify.yaml' ]]
          }

          verify_workflow_sha "$GITHUB_SHA" || fail_guard
          # Exercise the negative guard on every run: the real source commit is not a workflow child.
          if verify_workflow_sha "$source_sha"; then
            fail_guard
          fi
          set_receipt source_guard_negative REJECTED
          git merge-base --is-ancestor "$expected_base" "$source_sha" || fail_guard
          git checkout --detach "$source_sha" >/dev/null 2>&1 || fail_guard
          [[ "$(git rev-parse HEAD)" == "$source_sha" ]] || fail_guard
          set_receipt source_guard PASS

      - name: Fetch, build and verify release asset inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$GITHUB_WORKSPACE/g12-candidate-release-assets-receipt.txt"
          private="$RUNNER_TEMP/ai-guard-g12-private"
          mkdir -m 700 -p "$private/tmp" "$private/manifest"
          export TMPDIR="$private/tmp"
          source_sha=ce0297852a20f0c6f9f7b66fb2beede29d725475
          cli="$GITHUB_WORKSPACE/target/release/agentsandbox"
          notices_tool="$GITHUB_WORKSPACE/target/release/examples/third_party_notices"
          manifest="$private/manifest"
          allowed=.github/third-party-license-expressions.txt
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          fail() { echo "$1 failed; raw output remains private." >&2; exit 1; }

          [[ "$(git rev-parse HEAD)" == "$source_sha" ]] || fail 'exact source check'
          if cargo fetch --locked > "$private/fetch.stdout" 2> "$private/fetch.stderr"; then
            set_receipt dependency_fetch PASS
          else
            set_receipt dependency_fetch FAIL
            fail 'locked dependency fetch'
          fi

          if cargo build --release --locked --offline --no-default-features --bin agentsandbox --example third_party_notices > "$private/build.stdout" 2> "$private/build.stderr"; then
            set_receipt build PASS
          else
            set_receipt build FAIL
            fail 'single release build'
          fi

          if "$notices_tool" notices --for-release --allowed "$allowed" --output "$private/THIRD-PARTY-NOTICES.txt" > "$private/notices.stdout" 2> "$private/notices.stderr" \
              && [[ -s "$private/THIRD-PARTY-NOTICES.txt" ]]; then
            set_receipt notices PASS
            set_receipt notices_sha256 "$(sha256sum "$private/THIRD-PARTY-NOTICES.txt" | awk '{print $1}')"
          else
            set_receipt notices FAIL
            fail 'strict release notices generation'
          fi

          if "$cli" release manifest --source "$GITHUB_WORKSPACE" --output "$manifest" > "$private/manifest.stdout" 2> "$private/manifest.stderr"; then
            set_receipt manifest PASS
          else
            set_receipt manifest FAIL
            fail 'source release manifest generation'
          fi

          for file in release-manifest.json sbom.cdx.json SHA256SUMS; do
            [[ -s "$manifest/$file" ]] || { set_receipt manifest FAIL; fail 'nonempty manifest output check'; }
          done
          set_receipt release_manifest_sha256 "$(sha256sum "$manifest/release-manifest.json" | awk '{print $1}')"
          set_receipt sbom_sha256 "$(sha256sum "$manifest/sbom.cdx.json" | awk '{print $1}')"
          set_receipt sha256sums_sha256 "$(sha256sum "$manifest/SHA256SUMS" | awk '{print $1}')"

          if jq -e --arg version "$AI_GUARD_VERSION" '
              .bomFormat == "CycloneDX" and .specVersion == "1.6"
              and .metadata.component.version == $version
              and (.components | type == "array" and length > 0)
            ' "$manifest/sbom.cdx.json" > /dev/null; then
            set_receipt sbom PASS
            set_receipt sbom_component_count "$(jq -r '.components | length' "$manifest/sbom.cdx.json")"
          else
            set_receipt sbom FAIL
            fail 'CycloneDX 1.6 and version check'
          fi

          if "$cli" release verify --source "$GITHUB_WORKSPACE" --manifest "$manifest" --source-only > "$private/verify.stdout" 2> "$private/verify.stderr"; then
            set_receipt source_verify PASS
          else
            set_receipt source_verify FAIL
            fail 'source-only release verify'
          fi

      - name: Upload closed preflight receipt, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g12-candidate-release-assets-${{ github.sha }}
          path: g12-candidate-release-assets-receipt.txt
          if-no-files-found: warn
          retention-days: 14
