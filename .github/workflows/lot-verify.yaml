name: G08 grants-composition MySQL-feature compile check

# Compile the exact grants composition in the MySQL-storage feature profile.
on:
  push:
    branches:
      - claude/v1-g08-grants-composition-mysql-compile-check-20261123

permissions:
  contents: read

concurrency:
  group: g08-grants-mysql-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mysql-storage-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_SHA: 05f778bd072f8faf053ddab411ed9771d8899edd
      SOURCE_TREE_SHA: 7cc59be478ff42a60c0a53f6eb76d46b57fd3d1f
      SOURCE_PARENT_1_SHA: dc779cf92cb7fd66614958b5082519dfaa767040
      SOURCE_PARENT_2_SHA: bdfebf9ca00c9a025c65f0808b457ea81d298aa0
      SOURCE_PARENT_1_PARENT_SHA: 42cfbcd5eae7babc5abee4e48bbdb55fa38acb65
      SOURCE_PARENT_2_PARENT_1_SHA: 0db8b504fc3729b135b0f0c6d8410ed64acb040e
      SOURCE_PARENT_2_PARENT_2_SHA: 7253430d8088d9f692bdea3a65241262c71e9921
      EXPECTED_BRANCH: claude/v1-g08-grants-composition-mysql-compile-check-20261123
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Checkout the exact grants composition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Run one locked offline MySQL-feature all-targets check
        id: mysql-check
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g08-grants-mysql-check-receipt.txt"
          scratch=""
          cat > "$receipt" <<'EOF'
          source_sha=05f778bd072f8faf053ddab411ed9771d8899edd
          source_tree_sha=7cc59be478ff42a60c0a53f6eb76d46b57fd3d1f
          source_parent_1_sha=dc779cf92cb7fd66614958b5082519dfaa767040
          source_parent_2_sha=bdfebf9ca00c9a025c65f0808b457ea81d298aa0
          profile=no-default-features,mysql-storage
          command=cargo_check_locked_offline_all_targets_no_default_features_mysql_storage
          source_guard=NOT_RUN
          disk_preflight=NOT_RUN
          rustc_version=NOT_RUN
          dependency_fetch=NOT_RUN
          mysql_storage_all_targets_check=NOT_RUN
          check_exit=NOT_RUN
          runtime_mysql=NOT_RUN
          owned_mysql_parity=NOT_ESTABLISHED
          private_scratch_cleanup=NOT_RUN
          result=NOT_RUN
          scope=compile-only; no tests executed; no MySQL server or runtime started
          EOF
          chmod 600 "$receipt"
          result=FAIL
          finish() {
            local code=$? cleanup_rc=0
            trap - EXIT
            set +e
            if [[ -n "$scratch" && "$scratch" == "$RUNNER_TEMP/g08-mysql-compile."* ]]; then
              rm -rf -- "$scratch" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$scratch" ]] || cleanup_rc=1
            fi
            if (( cleanup_rc == 0 )); then
              sed -i 's/^private_scratch_cleanup=.*/private_scratch_cleanup=PASS/' "$receipt"
            else
              sed -i 's/^private_scratch_cleanup=.*/private_scratch_cleanup=FAIL/' "$receipt"
              code=1
            fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; else result=FAIL; fi
            sed -i "s/^result=.*/result=$result/" "$receipt"
            {
              printf 'G08 grants-composition MySQL-feature compile result=%s\n' "$result"
              grep -E '^(source_guard|disk_preflight|rustc_version|dependency_fetch|mysql_storage_all_targets_check|check_exit|runtime_mysql|owned_mysql_parity|private_scratch_cleanup|result)=' "$receipt"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
          trap finish EXIT

          expected_ref="refs/heads/$EXPECTED_BRANCH"
          source_sha=$SOURCE_SHA
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "$expected_ref" &&
                "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
                "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" &&
                "$(git show -s --format=%P HEAD 2>/dev/null)" == "$source_sha" &&
                "$(git diff --name-only "$source_sha" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse "$source_sha^{tree}" 2>/dev/null)" == "$SOURCE_TREE_SHA" &&
                "$(git show -s --format=%P "$source_sha" 2>/dev/null)" == "$SOURCE_PARENT_1_SHA $SOURCE_PARENT_2_SHA" &&
                "$(git show -s --format=%P "$SOURCE_PARENT_1_SHA" 2>/dev/null)" == "$SOURCE_PARENT_1_PARENT_SHA" &&
                "$(git show -s --format=%P "$SOURCE_PARENT_2_SHA" 2>/dev/null)" == "$SOURCE_PARENT_2_PARENT_1_SHA $SOURCE_PARENT_2_PARENT_2_SHA" &&
                "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true ]]; then
            sed -i 's/^source_guard=.*/source_guard=PASS/' "$receipt"
          else
            sed -i 's/^source_guard=.*/source_guard=FAIL/' "$receipt"
            exit 1
          fi

          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$free_kb" =~ ^[0-9]+$ ]] && (( free_kb >= 5242880 )); then
            sed -i 's/^disk_preflight=.*/disk_preflight=PASS/' "$receipt"
          else
            sed -i 's/^disk_preflight=.*/disk_preflight=FAIL/' "$receipt"
            exit 1
          fi
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then
            sed -i 's/^rustc_version=.*/rustc_version=1.99.1/' "$receipt"
          else
            sed -i 's/^rustc_version=.*/rustc_version=MISMATCH/' "$receipt"
            exit 1
          fi

          scratch="$(mktemp -d "$RUNNER_TEMP/g08-mysql-compile.XXXXXX")" || exit 1
          chmod 700 "$scratch"
          if timeout --kill-after=10s 20m cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            sed -i 's/^dependency_fetch=.*/dependency_fetch=PASS/' "$receipt"
          else
            sed -i 's/^dependency_fetch=.*/dependency_fetch=FAIL/' "$receipt"
            exit 1
          fi
          check_rc=0
          timeout --kill-after=10s 90m cargo check --locked --offline --all-targets --no-default-features --features mysql-storage \
            > "$scratch/check.stdout" 2> "$scratch/check.stderr" || check_rc=$?
          sed -i "s/^check_exit=.*/check_exit=$check_rc/" "$receipt"
          if (( check_rc == 0 )); then
            sed -i 's/^mysql_storage_all_targets_check=.*/mysql_storage_all_targets_check=PASS/' "$receipt"
          else
            sed -i 's/^mysql_storage_all_targets_check=.*/mysql_storage_all_targets_check=FAIL/' "$receipt"
            exit 1
          fi

      - name: Upload only the closed compile receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g08-grants-mysql-compile-${{ github.sha }}
          path: ${{ runner.temp }}/g08-grants-mysql-check-receipt.txt
          if-no-files-found: error
          retention-days: 14
