name: Check the owned accounting composition on SQLite and MySQL

on:
  push:
    branches: ['claude/v1-g01-owned-accounting-composed-check-20261123']

permissions:
  contents: read

concurrency:
  group: owned-accounting-composed-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  all-targets:
    name: All targets (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sqlite
          - profile: mysql
    env:
      CANDIDATE_SHA: c5a487f77264e2e89284d9c50f5e3a9f13c70873
      CANDIDATE_PARENTS: '66cd42574de11f7a33c617bc77957215820858e5'
      CANDIDATE_TREE: 39d60ecdc35224112d3a9d823365712994547c12
      COMPOSED_PARENTS: '0f462d02ce7b92f67dbbd8c2fd600c6fdd5438d8 e1e766f6bd936cdab29aed6851b6f2b826724e5a'
      RUST_VERSION: 1.99.1
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize closed receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          umask 077
          printf 'schema=1\nprofile=%s\ncandidate_sha=%s\ncandidate_parents=%s\nworkflow_sha=%s\nworkflow_parent=unknown\ncargo_lock_sha256=unknown\nrust_toolchain_sha256=unknown\nrustc_version=unknown\ncargo_version=unknown\ncheckout=NOT_RUN\nsource_guard=NOT_RUN\nworkflow_lineage=NOT_RUN\npreflight=NOT_RUN\nmanifest_guard=NOT_RUN\ntoolchain=NOT_RUN\ncargo_fetch=NOT_RUN\ncargo_fetch_exit=NOT_RUN\nall_targets=NOT_RUN\nall_targets_exit=NOT_RUN\nrust_error_code_status=NOT_RUN\nrust_error_code_count=0\nrust_error_codes=none\n' \
            '${{ matrix.profile }}' "$CANDIDATE_SHA" "$CANDIDATE_PARENTS" "$WORKFLOW_SHA" \
            > "$RUNNER_TEMP/owned-accounting-${{ matrix.profile }}-receipt.txt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          # Include both parents of the merge, one commit before the documented candidate.
          fetch-depth: 4
          persist-credentials: false
      - name: Guard exact candidate and workflow-only lineage
        id: preflight
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set +x
          set -euo pipefail
          source_status=FAIL
          lineage_status=FAIL
          manifest_status=FAIL
          lock_hash=unknown
          toolchain_hash=unknown
          source_parents="$(git show -s --format=%P "$CANDIDATE_SHA" 2>/dev/null || true)"
          workflow_parent="$(git show -s --format=%P "$WORKFLOW_SHA" 2>/dev/null || true)"
          workflow_files="$(git diff --name-only "$CANDIDATE_SHA" "$WORKFLOW_SHA" 2>/dev/null || true)"
          worktree_status="$(git status --porcelain=v1 --untracked-files=all 2>/dev/null || true)"
          if [[ -f Cargo.lock && -f rust-toolchain.toml && -f Cargo.toml ]] &&
             [[ "$(git ls-files --error-unmatch Cargo.lock 2>/dev/null || true)" == Cargo.lock &&
                "$(git ls-files --error-unmatch rust-toolchain.toml 2>/dev/null || true)" == rust-toolchain.toml ]] &&
             grep -Fxq 'channel = "1.99.1"' rust-toolchain.toml &&
             grep -Fxq 'profile = "minimal"' rust-toolchain.toml &&
             grep -Fxq 'rust-version = "1.99"' Cargo.toml; then
            manifest_status=PASS
          fi
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$(git rev-parse HEAD 2>/dev/null || true)" == "$WORKFLOW_SHA" &&
                "$source_parents" == "$CANDIDATE_PARENTS" &&
                "$(git rev-parse "$CANDIDATE_SHA^{tree}" 2>/dev/null || true)" == "$CANDIDATE_TREE" &&
                "$(git show -s --format=%P "$CANDIDATE_PARENTS" 2>/dev/null || true)" == "$COMPOSED_PARENTS" &&
                "$manifest_status" == PASS &&
                "$(git show -s --format=%P "$WORKFLOW_SHA" 2>/dev/null || true)" == "$CANDIDATE_SHA" &&
                -z "$worktree_status" &&
                "${GITHUB_EVENT_NAME:-}" == push &&
                "${GITHUB_REF:-}" == refs/heads/claude/v1-g01-owned-accounting-composed-check-20261123 &&
                "$(git rev-parse --show-toplevel)" == "$GITHUB_WORKSPACE" ]]; then
            source_status=PASS
          fi
          if [[ "$workflow_parent" == "$CANDIDATE_SHA" &&
                "$workflow_files" == '.github/workflows/lot-verify.yaml' ]]; then
            lineage_status=PASS
          fi
          if [[ "$source_status" == PASS && "$lineage_status" == PASS ]]; then
            lock_hash="$(sha256sum Cargo.lock | awk '{print $1}')"
            toolchain_hash="$(sha256sum rust-toolchain.toml | awk '{print $1}')"
            [[ "$lock_hash" =~ ^[0-9a-f]{64}$ && "$toolchain_hash" =~ ^[0-9a-f]{64}$ ]]
          fi
          echo "source_status=$source_status" >> "$GITHUB_OUTPUT"
          echo "lineage_status=$lineage_status" >> "$GITHUB_OUTPUT"
          echo "manifest_status=$manifest_status" >> "$GITHUB_OUTPUT"
          echo "workflow_parent=$workflow_parent" >> "$GITHUB_OUTPUT"
          echo "cargo_lock_sha256=$lock_hash" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain_sha256=$toolchain_hash" >> "$GITHUB_OUTPUT"
          [[ "$source_status" == PASS && "$lineage_status" == PASS ]]
      - name: Install and verify pinned Rust toolchain
        id: toolchain
        if: steps.preflight.outcome == 'success'
        shell: bash
        run: |
          set +x
          set -euo pipefail
          install_log="$RUNNER_TEMP/rustup-install-private.log"
          if rustup toolchain install "$RUST_VERSION" --profile minimal > "$install_log" 2>&1; then
            install_exit=0
          else
            install_exit=$?
          fi
          rustc_line="unknown"
          cargo_line="unknown"
          if [[ "$install_exit" == 0 ]] && rustc_line="$(rustc +"$RUST_VERSION" --version 2>/dev/null)" &&
             cargo_line="$(cargo +"$RUST_VERSION" --version 2>/dev/null)"; then
            rustc_short="$(awk '{print $1, $2}' <<< "$rustc_line")"
            cargo_short="$(awk '{print $1, $2}' <<< "$cargo_line")"
            rustc_version="${rustc_short#rustc }"
            cargo_version="${cargo_short#cargo }"
            if [[ "$rustc_short" == "rustc $RUST_VERSION" && "$cargo_short" == "cargo $RUST_VERSION" ]]; then
              echo "toolchain_status=PASS" >> "$GITHUB_OUTPUT"
              echo "rustc_version=$rustc_version" >> "$GITHUB_OUTPUT"
              echo "cargo_version=$cargo_version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'toolchain_status=FAIL' >> "$GITHUB_OUTPUT"
          echo 'rustc_version=unknown' >> "$GITHUB_OUTPUT"
          echo 'cargo_version=unknown' >> "$GITHUB_OUTPUT"
          exit 1
      - name: Fetch locked dependencies
        id: fetch
        if: steps.toolchain.outcome == 'success'
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if cargo +"$RUST_VERSION" fetch --locked > "$RUNNER_TEMP/cargo-fetch-private.log" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "fetch_exit=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" == 0 ]]; then echo 'fetch_status=PASS' >> "$GITHUB_OUTPUT"; else echo 'fetch_status=FAIL' >> "$GITHUB_OUTPUT"; fi
          exit "$rc"
      - name: Check every target with the selected storage configuration
        id: compile
        if: steps.fetch.outcome == 'success'
        shell: bash
        env:
          CHECK_PROFILE: ${{ matrix.profile }}
        run: |
          set +x
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          case "$CHECK_PROFILE" in
            sqlite) set -- --no-default-features ;;
            mysql) set -- --no-default-features --features mysql-storage ;;
            *) echo 'Unsupported profile' >&2; exit 2 ;;
          esac
          json="$RUNNER_TEMP/owned-accounting-all-targets-${CHECK_PROFILE}.jsonl"
          stderr="$RUNNER_TEMP/owned-accounting-all-targets-${CHECK_PROFILE}-private.stderr"
          if cargo +"$RUST_VERSION" check --locked --offline --all-targets "$@" \
              --message-format=json > "$json" 2> "$stderr"; then
            rc=0
          else
            rc=$?
          fi
          error_codes="$RUNNER_TEMP/owned-accounting-all-targets-${CHECK_PROFILE}-codes.txt"
          code_status=filtered
          if jq -r '
              select(.reason == "compiler-message" and .message.level == "error")
              | .message.code.code // empty
              | select(type == "string" and test("^E[0-9]{4}$"))
            ' "$json" > "$error_codes.raw" 2>/dev/null; then
            grep -E '^E[0-9]{4}$' "$error_codes.raw" | sort -u > "$error_codes" || true
          else
            : > "$error_codes"
            code_status=unavailable
          fi
          error_count="$(wc -l < "$error_codes" | tr -d ' ')"
          error_list="$(sed -n '1,20p' "$error_codes" | paste -sd, -)"
          [[ "$error_count" =~ ^[0-9]+$ ]]
          [[ -n "$error_list" ]] || error_list=none
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "error_code_count=$error_count" >> "$GITHUB_OUTPUT"
          echo "error_codes=$error_list" >> "$GITHUB_OUTPUT"
          echo "error_code_status=$code_status" >> "$GITHUB_OUTPUT"
          if [[ "$rc" == 0 ]]; then
            echo 'compile_status=PASS' >> "$GITHUB_OUTPUT"
          else
            echo 'compile_status=FAIL' >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"
      - name: Finalize closed compilation receipt
        if: always()
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PREFLIGHT_SOURCE: ${{ steps.preflight.outputs.source_status }}
          PREFLIGHT_LINEAGE: ${{ steps.preflight.outputs.lineage_status }}
          PREFLIGHT_MANIFEST: ${{ steps.preflight.outputs.manifest_status }}
          WORKFLOW_PARENT: ${{ steps.preflight.outputs.workflow_parent }}
          LOCK_HASH: ${{ steps.preflight.outputs.cargo_lock_sha256 }}
          TOOLCHAIN_HASH: ${{ steps.preflight.outputs.rust_toolchain_sha256 }}
          RUSTC_VERSION: ${{ steps.toolchain.outputs.rustc_version }}
          CARGO_VERSION: ${{ steps.toolchain.outputs.cargo_version }}
          FETCH_EXIT: ${{ steps.fetch.outputs.fetch_exit }}
          COMPILE_EXIT: ${{ steps.compile.outputs.exit_code }}
          ERROR_CODE_COUNT: ${{ steps.compile.outputs.error_code_count }}
          ERROR_CODES: ${{ steps.compile.outputs.error_codes }}
          ERROR_CODE_STATUS: ${{ steps.compile.outputs.error_code_status }}
        run: |
          set +x
          set -euo pipefail
          outcome() {
            case "$1" in
              success) printf '%s' PASS ;;
              failure) printf '%s' FAIL ;;
              *) printf '%s' NOT_RUN ;;
            esac
          }
          safe_version() {
            if [[ "$1" =~ ^1\.99\.1$ ]]; then printf '%s' "$1"; else printf '%s' unknown; fi
          }
          safe_uint() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then printf '%s' "$1"; else printf '%s' NOT_RUN; fi
          }
          safe_codes() {
            if [[ "$1" == none || "$1" =~ ^E[0-9]{4}(,E[0-9]{4}){0,19}$ ]]; then printf '%s' "$1"; else printf '%s' unknown; fi
          }
          checkout_status="$(outcome "$CHECKOUT_OUTCOME")"
          preflight_status="$(outcome "$PREFLIGHT_OUTCOME")"
          toolchain_status="$(outcome "$TOOLCHAIN_OUTCOME")"
          fetch_status="$(outcome "$FETCH_OUTCOME")"
          compile_status="$(outcome "$COMPILE_OUTCOME")"
          source_status=NOT_RUN
          lineage_status=NOT_RUN
          if [[ "$PREFLIGHT_SOURCE" == PASS ]]; then source_status=PASS; elif [[ "$PREFLIGHT_SOURCE" == FAIL ]]; then source_status=FAIL; fi
          if [[ "$PREFLIGHT_LINEAGE" == PASS ]]; then lineage_status=PASS; elif [[ "$PREFLIGHT_LINEAGE" == FAIL ]]; then lineage_status=FAIL; fi
          manifest_status=NOT_RUN
          if [[ "$PREFLIGHT_MANIFEST" == PASS ]]; then manifest_status=PASS; elif [[ "$PREFLIGHT_MANIFEST" == FAIL ]]; then manifest_status=FAIL; fi
          workflow_sha=unknown
          if [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then workflow_sha=$WORKFLOW_SHA; fi
          workflow_parent=unknown
          if [[ "$WORKFLOW_PARENT" =~ ^[0-9a-f]{40}$ ]]; then workflow_parent=$WORKFLOW_PARENT; fi
          lock_hash=unknown
          if [[ "$LOCK_HASH" =~ ^[0-9a-f]{64}$ ]]; then lock_hash=$LOCK_HASH; fi
          toolchain_hash=unknown
          if [[ "$TOOLCHAIN_HASH" =~ ^[0-9a-f]{64}$ ]]; then toolchain_hash=$TOOLCHAIN_HASH; fi
          rustc="$(safe_version "$RUSTC_VERSION")"
          cargo="$(safe_version "$CARGO_VERSION")"
          fetch_exit="$(safe_uint "$FETCH_EXIT")"
          compile_exit="$(safe_uint "$COMPILE_EXIT")"
          code_count="$(safe_uint "$ERROR_CODE_COUNT")"
          codes="$(safe_codes "$ERROR_CODES")"
          code_status=unknown
          if [[ "$ERROR_CODE_STATUS" == filtered || "$ERROR_CODE_STATUS" == unavailable ]]; then code_status=$ERROR_CODE_STATUS; fi
          receipt="$RUNNER_TEMP/owned-accounting-${{ matrix.profile }}-receipt.txt"
          {
            printf 'schema=1\nprofile=%s\ncandidate_sha=%s\ncandidate_parents=%s\nworkflow_sha=%s\nworkflow_parent=%s\n' \
              '${{ matrix.profile }}' "$CANDIDATE_SHA" "$CANDIDATE_PARENTS" "$workflow_sha" "$workflow_parent"
            printf 'cargo_lock_sha256=%s\nrust_toolchain_sha256=%s\nrustc_version=%s\ncargo_version=%s\n' \
              "$lock_hash" "$toolchain_hash" "$rustc" "$cargo"
            printf 'checkout=%s\nsource_guard=%s\nworkflow_lineage=%s\npreflight=%s\nmanifest_guard=%s\ntoolchain=%s\n' \
              "$checkout_status" "$source_status" "$lineage_status" "$preflight_status" "$manifest_status" "$toolchain_status"
            printf 'cargo_fetch=%s\ncargo_fetch_exit=%s\nall_targets=%s\nall_targets_exit=%s\n' \
              "$fetch_status" "$fetch_exit" "$compile_status" "$compile_exit"
            printf 'rust_error_code_status=%s\nrust_error_code_count=%s\nrust_error_codes=%s\n' \
              "$code_status" "$code_count" "$codes"
          } > "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: assembled-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/owned-accounting-${{ matrix.profile }}-receipt.txt
          if-no-files-found: error
          retention-days: 14
