name: G01 named stack lifecycle checks

on:
  push:
    branches: [claude/v1-g01-named-stack-lifecycle-check-20261123]

permissions:
  contents: read

concurrency:
  group: g01-named-stack-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  named-stack-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_BRANCH: claude/v1-g01-named-stack-lifecycle-check-20261123
      SOURCE_SHA: 2d752fa3086924c374b0f03573300ab5044ab114
      SOURCE_TREE_SHA: b8ac92ab077b1b090b9b1ec652802723b144db40
      SOURCE_PARENT_SHA: b5e4fa5eb0e78558a1d64d5bd5e7a436fde77557
      SOURCE_PARENT_TREE_SHA: 8f31475a269f190cf6eaddad91c009f4913aa058
      SOURCE_BASE_SHA: c155e7a8db5ce7294eff65d763fa48b657e4bd45
      SOURCE_BASE_TREE_SHA: d21ade703b946f6e6211327fba0c1cc865a0f0d5
      SOURCE_ORIGIN_SHA: fc01d779348503ef148c18000d06151555b30b0b
      SOURCE_ORIGIN_TREE_SHA: 4beebc88ecc29f2f5235d15b5cb548daa7c5460b
      LOCK_SHA: 05847a300405860df8f860d5dc1c39ca423dfa0d
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Checkout the exact named stack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Verify eight targeted source lifecycle witnesses
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g01-named-stack-lifecycle-receipt.txt"
          printf 'schema=g01-named-stack-lifecycle-v1\nsource_sha=%s\nsource_tree_sha=%s\nsource_parent_sha=%s\nworkflow_sha=%s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$SOURCE_PARENT_SHA" "$GITHUB_SHA" > "$receipt"
          cat >> "$receipt" <<'EOF'
          source_guard=NOT_RUN
          rust=NOT_RUN
          locked_dependencies=NOT_RUN
          build=NOT_RUN
          r9_snapshot=NOT_RUN
          r19_named_ports=NOT_RUN
          r20_pre_effect_refusal=NOT_RUN
          stack_name_unit=NOT_RUN
          readiness_loopback=NOT_RUN
          snapshot_grammar=NOT_RUN
          retained_cli_port_guard=NOT_RUN
          retained_cli_unapproved_environment_canary=NOT_RUN
          selected=0
          passed=0
          runtime=NONE
          scratch_cleanup=NOT_NEEDED
          result=NOT_RUN
          EOF
          chmod 600 "$receipt"

          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1==key{$0=key "=" value} {print}' "$receipt" > "$receipt.next"
            mv -- "$receipt.next" "$receipt"
          }
          scratch=
          finish() {
            local rc=$? cleanup_rc=0
            trap - EXIT
            set +e
            if [[ -n "$scratch" ]]; then
              if [[ "$scratch" =~ ^/tmp/g01stack\.[a-zA-Z0-9]{6}$ && -d "$scratch" && ! -L "$scratch" &&
                    "$(realpath -e -- "$scratch")" == "$scratch" &&
                    "$(stat -c '%u %a' -- "$scratch")" == "$(id -u) 700" ]]; then
                rm -rf -- "$scratch" >/dev/null 2>&1 || cleanup_rc=1
                [[ ! -e "$scratch" && ! -L "$scratch" ]] || cleanup_rc=1
              else
                cleanup_rc=1
              fi
              if (( cleanup_rc == 0 )); then set_field scratch_cleanup PASS; else set_field scratch_cleanup FAIL; rc=1; fi
            fi
            if (( rc == 0 )); then set_field result PASS; else set_field result FAIL; fi
            exit "$rc"
          }
          trap finish EXIT

          expected_sources=$'tests/source_lifecycle/harness.rs\ntests/source_lifecycle/paths.rs'
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" &&
                "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$SOURCE_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_SHA")" == "$SOURCE_PARENT_SHA" &&
                "$(git rev-parse "$SOURCE_PARENT_SHA^{tree}")" == "$SOURCE_PARENT_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_PARENT_SHA")" == "$SOURCE_BASE_SHA" &&
                "$(git rev-parse "$SOURCE_BASE_SHA^{tree}")" == "$SOURCE_BASE_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_BASE_SHA")" == "$SOURCE_ORIGIN_SHA" &&
                "$(git rev-parse "$SOURCE_ORIGIN_SHA^{tree}")" == "$SOURCE_ORIGIN_TREE_SHA" &&
                "$(git diff --name-only "$SOURCE_PARENT_SHA" "$SOURCE_SHA")" == "$expected_sources" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse "$SOURCE_SHA:Cargo.lock")" == "$LOCK_SHA" &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            set_field source_guard PASS
          else
            set_field source_guard FAIL
            exit 1
          fi

          version="$(rustc --version 2>/dev/null || true)"
          [[ "$version" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]] || { set_field rust MISMATCH; exit 1; }
          set_field rust 1.99.1
          scratch="$(mktemp -d /tmp/g01stack.XXXXXX)"
          if [[ ! "$scratch" =~ ^/tmp/g01stack\.[a-zA-Z0-9]{6}$ ||
                "$(realpath -e -- "$scratch")" != "$scratch" ||
                "$(stat -c '%u %a' -- "$scratch")" != "$(id -u) 700" ]]; then
            exit 1
          fi
          mkdir -m 700 "$scratch/tmp" "$scratch/target"
          export TMPDIR="$scratch/tmp" CARGO_TARGET_DIR="$scratch/target" RUST_BACKTRACE=0
          if timeout --kill-after=5s 15m cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            set_field locked_dependencies PASS
          else
            set_field locked_dependencies FAIL
            exit 1
          fi
          if ! timeout --kill-after=10s 45m cargo test --locked --offline --no-default-features \
                --lib --test source_lifecycle --test retained_cli_lifecycle --no-run --message-format=json \
                > "$scratch/build.jsonl" 2> "$scratch/build.stderr"; then
            set_field build FAIL
            exit 1
          fi
          set_field build PASS
          selected=0
          passed=0
          run_witness() {
            local target_name=$1 target_kind=$2 selector=$3 key=$4 binary output code=0
            binary="$(jq -ers --arg target "$target_name" --arg kind "$target_kind" '[.[] | select(.reason=="compiler-artifact" and
              .target.name==$target and .target.kind==[$kind] and .profile.test==true and .executable!=null) |
              .executable] | unique | if length==1 then .[0] else empty end' "$scratch/build.jsonl" 2>/dev/null || true)"
            if [[ -z "$binary" || ! -x "$binary" || "$binary" != "$CARGO_TARGET_DIR/"* ]]; then
              set_field "$key" ARTIFACT_MISMATCH
              return
            fi
            output="$scratch/$key.test.log"
            timeout --kill-after=5s 180s "$binary" "$selector" --exact --test-threads=1 > "$output" 2>&1 || code=$?
            if [[ "$(grep -Fxc 'running 1 test' "$output" || true)" == 1 ]]; then
              selected=$((selected+1))
            fi
            if [[ "$code" == 0 && "$(grep -Fxc "test $selector ... ok" "$output" || true)" == 1 ]] &&
                grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$output"; then
              set_field "$key" PASS_1_0_0
              passed=$((passed+1))
            else
              set_field "$key" FAIL_OR_NOT_SELECTED
            fi
          }
          run_witness source_lifecycle test paths::r9_up_hands_the_prepared_compose_file_to_the_engine_and_ends_when_the_stack_answers r9_snapshot
          run_witness source_lifecycle test paths::r19_named_stack_uses_the_selected_ports_and_stops_the_same_project r19_named_ports
          run_witness source_lifecycle test paths::r20_stack_options_are_refused_before_configuration_or_engine_effects r20_pre_effect_refusal
          run_witness agentsandbox lib operations::tests::a_stack_name_is_a_bounded_lowercase_compose_project_name stack_name_unit
          run_witness agentsandbox lib operations::tests::readiness::control_readiness_requires_viewer_access_even_when_health_checks_pass readiness_loopback
          run_witness agentsandbox lib operations::source_snapshot::tests::build_and_compose_commands_accept_only_their_closed_grammar snapshot_grammar
          run_witness retained_cli_lifecycle test contract::retained_cli_limits_port_overrides_to_canonical_compose_up retained_cli_port_guard
          run_witness retained_cli_lifecycle test contract::retained_cli_rejects_unbounded_arguments_and_unapproved_environment_before_spawn retained_cli_unapproved_environment_canary
          set_field selected "$selected"
          set_field passed "$passed"
          [[ "$selected" == 8 && "$passed" == 8 ]]

      - name: Upload the closed named stack receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g01-named-stack-lifecycle-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/g01-named-stack-lifecycle-receipt.txt
          if-no-files-found: error
          retention-days: 14
