name: G06 and G08 SQLite recovery and owned grants

on:
  push:
    branches: [claude/v1-sqlite-recovery-grants-proof-check-20261123]

permissions:
  contents: read

jobs:
  sqlite-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_BRANCH: claude/v1-sqlite-recovery-grants-proof-check-20261123
      SOURCE_SHA: fc01d779348503ef148c18000d06151555b30b0b
      SOURCE_TREE_SHA: 4beebc88ecc29f2f5235d15b5cb548daa7c5460b
      SOURCE_PARENT_SHA: 5d08c6cd82f8ea587e5a1975b35cd53963f127da
      SOURCE_PARENT_TREE_SHA: f8f85384029b77ce2768125f9e9d8e58461c2904
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Checkout the candidate with the recovery witness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the SQLite restore witnesses on private fixture files
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/v1-sqlite-witnesses-receipt.txt"
          printf 'source_sha=%s\nsource_tree_sha=%s\nsource_parent_sha=%s\nworkflow_sha=%s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$SOURCE_PARENT_SHA" "$GITHUB_SHA" > "$receipt"
          cat >> "$receipt" <<'EOF'
          source_guard=NOT_RUN
          rust=NOT_RUN
          locked_dependencies=NOT_RUN
          build=NOT_RUN
          schema13_operator_restore=NOT_RUN
          retained_claim_restore=NOT_RUN
          owned15_grant_replay=NOT_RUN
          owned14_grant_replay=NOT_RUN
          owned15_membership_replay=NOT_RUN
          selected=0
          passed=0
          runtime=NOT_RUN
          scratch_cleanup=NOT_NEEDED
          result=NOT_RUN
          EOF
          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1==key{$0=key "=" value} {print}' "$receipt" > "$receipt.next"
            mv -- "$receipt.next" "$receipt"
          }
          scratch=
          finish() {
            local rc=$? cleanup_rc=0
            trap - EXIT
            set +e
            if [[ -n "$scratch" ]]; then
              if [[ "$scratch" =~ ^/tmp/ag06\.[a-zA-Z0-9]{6}$ && -d "$scratch" && ! -L "$scratch" &&
                    "$(realpath -e -- "$scratch")" == "$scratch" &&
                    "$(stat -c '%u %a' -- "$scratch")" == "$(id -u) 700" ]]; then
                rm -rf -- "$scratch" >/dev/null 2>&1 || cleanup_rc=1
                [[ ! -e "$scratch" && ! -L "$scratch" ]] || cleanup_rc=1
              else
                cleanup_rc=1
              fi
              if (( cleanup_rc == 0 )); then set_field scratch_cleanup PASS; else set_field scratch_cleanup FAIL; rc=1; fi
            fi
            if (( rc == 0 )); then set_field result PASS; else set_field result FAIL; fi
            exit "$rc"
          }
          trap finish EXIT

          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" &&
                "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$SOURCE_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_SHA")" == "$SOURCE_PARENT_SHA" &&
                "$(git rev-parse "$SOURCE_PARENT_SHA^{tree}")" == "$SOURCE_PARENT_TREE_SHA" &&
                "$(git diff --name-only "$SOURCE_PARENT_SHA" "$SOURCE_SHA")" == $'src/api/human_sources/journal_tests/owned_admin_reads.rs\ntests/supervision_api.rs' &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            set_field source_guard PASS
          else
            set_field source_guard FAIL
            exit 1
          fi

          version="$(rustc --version 2>/dev/null || true)"
          [[ "$version" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]] || { set_field rust MISMATCH; exit 1; }
          set_field rust 1.99.1
          scratch="$(mktemp -d /tmp/ag06.XXXXXX)"
          if [[ ! "$scratch" =~ ^/tmp/ag06\.[a-zA-Z0-9]{6}$ || "$(realpath -e -- "$scratch")" != "$scratch" ||
                "$(stat -c '%u %a' -- "$scratch")" != "$(id -u) 700" ]]; then
            exit 1
          fi
          mkdir -m 700 "$scratch/tmp" "$scratch/target"
          export TMPDIR="$scratch/tmp" CARGO_TARGET_DIR="$scratch/target" RUST_BACKTRACE=0
          if timeout --kill-after=5s 15m cargo fetch --locked > "$scratch/fetch.log" 2>&1; then
            set_field locked_dependencies PASS
          else
            set_field locked_dependencies FAIL
            exit 1
          fi
          if ! timeout --kill-after=10s 45m cargo test --locked --offline --no-default-features \
                --lib --test schema13_protocol_contract --test supervision_api --no-run --message-format=json \
                > "$scratch/build.jsonl" 2> "$scratch/build.stderr"; then
            set_field build FAIL
            exit 1
          fi
          set_field build PASS
          selected=0
          passed=0
          run_witness() {
            local target_name=$1 selector=$2 key=$3 binary output code=0
            binary="$(jq -ers --arg target "$target_name" '[.[] | select(.reason=="compiler-artifact" and
              .target.name==$target and (.target.kind==["test"] or .target.kind==["lib"]) and .profile.test==true and .executable!=null) |
              .executable] | unique | if length==1 then .[0] else empty end' "$scratch/build.jsonl" 2>/dev/null || true)"
            if [[ -z "$binary" || ! -x "$binary" || "$binary" != "$CARGO_TARGET_DIR/"* ]]; then
              set_field "$key" ARTIFACT_MISMATCH
              return
            fi
            output="$scratch/$key.test.log"
            timeout --kill-after=5s 180s "$binary" "$selector" --exact --test-threads=1 > "$output" 2>&1 || code=$?
            if [[ "$(grep -Fxc 'running 1 test' "$output" || true)" == 1 ]]; then
              selected=$((selected+1))
            fi
            if [[ "$code" == 0 && "$(grep -Fxc "test $selector ... ok" "$output" || true)" == 1 ]] &&
                grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$output"; then
              set_field "$key" PASS_1_0_0
              passed=$((passed+1))
            else
              set_field "$key" FAIL_OR_NOT_SELECTED
            fi
          }
          run_witness schema13_protocol_contract cli_schema13_and_the_served_protocol_keep_the_same_inactive_namespace schema13_operator_restore
          run_witness supervision_api supervised_api_arms_import_and_worker_claims_once_then_maintenance_blocks_new_effects retained_claim_restore
          run_witness agentsandbox api::human_sources::journal_tests::owned_admin_reads::owned_grant_format15_reads_and_replays_one_durable_admin_change_through_dashboard owned15_grant_replay
          run_witness agentsandbox api::human_sources::journal_tests::owned_admin_reads::owned_grant_change_format14_returns_one_durable_receipt_and_keeps_the_source_available owned14_grant_replay
          run_witness agentsandbox api::human_sources::journal_tests::owned_admin_reads::owned_membership_post_on_format15_requires_an_admin_and_returns_the_durable_receipt owned15_membership_replay
          set_field selected "$selected"
          set_field passed "$passed"
          [[ "$selected" == 5 && "$passed" == 5 ]]
      - name: Upload the closed recovery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1-sqlite-witnesses-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/v1-sqlite-witnesses-receipt.txt
          if-no-files-found: error
          retention-days: 14
