name: G07 v5 worker cleanup ACK status check

on:
  push:
    branches: ['claude/v1-g07-cleanup-ack-v5-check-20261122']

permissions:
  contents: read

concurrency:
  group: g07-cleanup-ack-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-ack-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AI_GUARD_BUILD_REVISION: 46499d960c76800ecabaaa2ffbaf62480f37e820
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize the closed status receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g07-v5-ack-receipt.txt"
          printf 'source_sha=46499d960c76800ecabaaa2ffbaf62480f37e820\nworkflow_sha=%s\nselector=runner::broker::executor::journal::tests::export_retirement_tests::full3_v5_commits_worker_cleanup_ack_after_acknowledged_result\nsource_check=NOT_RUN\nworkflow_check=NOT_RUN\ndependency_fetch=NOT_RUN\ndependency_fetch_exit=unknown\nlibtest_build=NOT_RUN\nlibtest_build_exit=unknown\nlibtest_artifact=NOT_RUN\nlibtest_artifact_sha256=unknown\ntest_verdict=NOT_RUN\ntest_exit=unknown\ntest_selected_count=unknown\ntest_duration_ms=unknown\nack_complete=unknown\nack_milestone_set=NOT_RUN\nfixture_cleanup=unknown\n' "$WORKFLOW_SHA" > "$receipt"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify the exact source and workflow-only commit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g07-v5-ack-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v prefix="$key=" -v replacement="$key=$value" '
              index($0, prefix) == 1 { print replacement; found=1; next }
              { print }
              END { if (!found) print replacement }
            ' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source=46499d960c76800ecabaaa2ffbaf62480f37e820
          parent=cba3f9fde68ffd3f6a2e5c4be287507549bff81a
          test_source=src/runner/broker/executor/export_retirement_tests.rs
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g07-cleanup-ack-v5-check-20261122 &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ &&
                "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git rev-parse HEAD^)" == "$source" &&
                "$(git rev-parse "$source^")" == "$parent" &&
                "$(git diff --name-only "$parent" "$source")" == "$test_source" &&
                "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
              grep -Fq 'mod tests;' src/runner/broker/executor/journal.rs &&
              grep -Fq '#[path = "export_retirement_tests.rs"]' src/runner/broker/executor/journal_tests.rs &&
              grep -Fq 'async fn full3_v5_commits_worker_cleanup_ack_after_acknowledged_result()' "$test_source" &&
              grep -Fq 'trace_phase("cleanup_v5_caller_ack_confirmed")' "$test_source" &&
              grep -Fq 'trace_phase("cleanup_v5_replay_unchanged")' "$test_source" &&
              grep -Fq 'trace_phase("cleanup_v5_native_fixture_joined")' "$test_source"; then
            set_field source_check PASS
            set_field workflow_check PASS
          else
            set_field source_check FAIL
            set_field workflow_check FAIL
            cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g07-v5-ack-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v prefix="$key=" -v replacement="$key=$value" 'index($0, prefix) == 1 { print replacement; found=1; next } { print } END { if (!found) print replacement }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          if cargo fetch --locked > "$RUNNER_TEMP/g07-v5-fetch.log" 2>&1; then
            set_field dependency_fetch PASS
            set_field dependency_fetch_exit 0
          else
            rc=$?
            set_field dependency_fetch FAIL
            set_field dependency_fetch_exit "$rc"
            set_field libtest_build NOT_RUN
            set_field test_verdict NOT_RUN
            set_field test_exit unknown
            set_field ack_complete unknown
            exit "$rc"
          fi
      - name: Compile the single library test binary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g07-v5-ack-receipt.txt"
          private="$RUNNER_TEMP/g07-v5-private"
          mkdir -m 700 "$private" "$private/tmp"
          export TMPDIR="$private/tmp"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/g07-v5-target"
          set_field() {
            local key=$1 value=$2
            awk -v prefix="$key=" -v replacement="$key=$value" 'index($0, prefix) == 1 { print replacement; found=1; next } { print } END { if (!found) print replacement }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          if cargo test --locked --offline --no-default-features --lib --no-run --message-format=json \
            > "$private/build.jsonl" 2> "$private/build.stderr"; then
            rc=0
          else
            rc=$?
          fi
          if (( rc != 0 )); then
            set_field libtest_build FAIL
            set_field libtest_build_exit "$rc"
            set_field libtest_artifact NOT_RUN
            set_field test_verdict NOT_RUN
            set_field test_exit unknown
            set_field test_duration_ms unknown
            set_field ack_complete unknown
            exit "$rc"
          fi
          set_field libtest_build PASS
          set_field libtest_build_exit 0
          if binary="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$private/build.jsonl")" && [[ -x "$binary" ]]; then
            set_field libtest_artifact PASS
          else
            set_field libtest_artifact FAIL
            set_field test_verdict NOT_RUN
            set_field test_exit unknown
            set_field ack_complete unknown
            exit 1
          fi
          digest="$(sha256sum "$binary" | cut -d ' ' -f1)"
          set_field libtest_artifact_sha256 "$digest"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: Run the single globally bounded ACK test
        if: steps.build.outputs.binary != ''
        shell: bash
        env:
          TEST_BINARY: ${{ steps.build.outputs.binary }}
        run: |
          set -euo pipefail
          umask 077
          selector='runner::broker::executor::journal::tests::export_retirement_tests::full3_v5_commits_worker_cleanup_ack_after_acknowledged_result'
          private="$(mktemp -d /tmp/aigv5.XXXXXX)"
          chmod 700 "$private"
          cleanup_private() {
            local rc=$?
            trap - EXIT
            if [[ $private =~ ^/tmp/aigv5\.[A-Za-z0-9]{6}$ ]]; then rm -rf -- "$private" >/dev/null 2>&1 || true; fi
            exit "$rc"
          }
          trap cleanup_private EXIT
          export TMPDIR="$private"
          log="$private/test.log"
          receipt="$RUNNER_TEMP/g07-v5-ack-receipt.txt"
          phases=(prefix_confirmed pending_durable writer_advance_returned store_receipt_confirmed caller_ack_confirmed strict_result_confirmed replay_unchanged native_fixture_joined)
          markers=(cleanup_v5_prefix_confirmed cleanup_v5_pending_durable cleanup_v5_writer_advance_returned cleanup_v5_store_receipt_confirmed cleanup_v5_caller_ack_confirmed cleanup_v5_strict_result_confirmed cleanup_v5_replay_unchanged cleanup_v5_native_fixture_joined)
          milestone_set=1
          prior_ms=-1
          set_field() {
            local key=$1 value=$2
            awk -v prefix="$key=" -v replacement="$key=$value" 'index($0, prefix) == 1 { print replacement; found=1; next } { print } END { if (!found) print replacement }' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          record_milestones() {
            local i phase marker hits line elapsed
            for i in "${!phases[@]}"; do
              phase=${phases[$i]}
              marker=${markers[$i]}
              hits="$(grep -Ec "^export-retirement phase=${marker} elapsed_ms=[0-9]{1,7}$" "$log" || true)"
              line="$(grep -E "^export-retirement phase=${marker} elapsed_ms=[0-9]{1,7}$" "$log" || true)"
              if [[ $hits == 1 && $line =~ ^export-retirement\ phase=[a-z0-9_]+\ elapsed_ms=([0-9]{1,7})$ ]]; then
                elapsed=${BASH_REMATCH[1]}
                if (( 10#$elapsed <= 600000 && 10#$elapsed >= prior_ms )); then
                  printf 'ack_milestone=%s state=closed elapsed_ms=%s\n' "$phase" "$elapsed" >> "$receipt"
                  prior_ms=$((10#$elapsed))
                  continue
                fi
              fi
              printf 'ack_milestone=%s state=unknown elapsed_ms=unknown\n' "$phase" >> "$receipt"
              milestone_set=0
            done
            if (( milestone_set )); then set_field ack_milestone_set complete; else set_field ack_milestone_set incomplete; fi
          }
          bounded_duration_ms() {
            local seconds computed
            seconds="$(sed -nE 's/^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored; [0-9]+ measured; [0-9]+ filtered out; finished in ([0-9]+(\.[0-9]+)?)s$/\2/p' "$log")"
            if [[ $seconds =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              computed="$(awk -v value="$seconds" 'BEGIN { printf "%.0f", value * 1000 }')"
              if [[ $computed =~ ^[0-9]+$ ]] && (( computed <= 600000 )); then printf '%s' "$computed"; return 0; fi
            fi
            printf 'unknown'
          }
          if timeout --kill-after=10s 600s "$TEST_BINARY" "$selector" --exact --test-threads=1 --nocapture --color=never > "$log" 2>&1; then
            test_rc=0
          else
            test_rc=$?
          fi
          selected="$(grep -Fxc 'running 1 test' "$log" || true)"
          ok_line="$(grep -Fxc "test $selector ... ok" "$log" || true)"
          summaries="$(grep -Ec '^test result: ' "$log" || true)"
          ok_summaries="$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log" || true)"
          test_duration_ms="$(bounded_duration_ms)"
          record_milestones
          ack_complete=unknown
          test_verdict=fail
          if (( test_rc == 124 || test_rc == 137 || test_rc == 143 || test_rc == 130 )); then
            test_verdict=unknown
          elif (( test_rc == 0 )) && [[ $selected == 1 && $ok_line == 1 && $summaries == 1 &&
                $ok_summaries == 1 && $test_duration_ms != unknown && $milestone_set == 1 ]]; then
            test_verdict=pass
            ack_complete=confirmed
          fi
          set_field test_verdict "$test_verdict"
          set_field test_exit "$test_rc"
          set_field test_selected_count "$selected"
          set_field test_duration_ms "$test_duration_ms"
          set_field ack_complete "$ack_complete"
          set_field fixture_cleanup unknown
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          [[ $test_verdict == pass ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g07-v5-ack-status-${{ github.sha }}
          path: ${{ runner.temp }}/g07-v5-ack-receipt.txt
          if-no-files-found: ignore
          retention-days: 14
