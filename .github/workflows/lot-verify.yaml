name: G09 recovery contract check

# One synthetic local recovery selector on hosted Linux x86_64. This workflow
# does not qualify Docker/Podman/Kubernetes engines or real providers.

on:
  push:
    branches: ['claude/v1-g09-recovery-contract-check-20261122']

permissions:
  contents: read

concurrency:
  group: g09-recovery-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '8388608'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free hosted runner disk for the Rust target
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch dependencies with the repository toolchain
        run: |
          rustc --version
          cargo fetch --locked

      - name: Run the exact G09 recovery selector
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          selector='broker_crash_recovery_observes_then_stops_the_same_running_instance'
          run_log="$RUNNER_TEMP/g09-private-test.log"
          summary="$RUNNER_TEMP/g09-test-summary.txt"
          tmpdir_status=NOT_RUN
          selected_test_count=0
          selector_guard=NOT_RUN
          contract_guard=NOT_RUN
          cargo_exit_code=NOT_RUN
          workflow_exit_code=2
          test_result=NOT_RUN
          reconciliation_diagnostic=NOT_REACHED
          replay_diagnostic=NOT_REACHED

          write_summary() {
            {
              printf 'selector=%s\n' "$selector"
              printf 'tmpdir_status=%s\n' "$tmpdir_status"
              printf 'selected_test_count=%s\n' "$selected_test_count"
              printf 'selector_guard=%s\n' "$selector_guard"
              printf 'contract_guard=%s\n' "$contract_guard"
              printf 'test_result=%s\n' "$test_result"
              printf 'reconciliation_diagnostic=%s\n' "$reconciliation_diagnostic"
              printf 'replay_diagnostic=%s\n' "$replay_diagnostic"
              printf 'cargo_exit_code=%s\n' "$cargo_exit_code"
              printf 'workflow_exit_code=%s\n' "$workflow_exit_code"
            } > "$summary"
            chmod 600 "$summary"
            {
              printf '### G09 targeted recovery selector\n\n'
              cat "$summary"
              printf '\n'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          tmpdir_candidate="$(mktemp -d /tmp/g09.XXXXXX)"
          chmod 700 "$tmpdir_candidate"
          export TMPDIR="$(cd "$tmpdir_candidate" && pwd -P)"
          if [[ "$TMPDIR" != /tmp/g09.* || ${#TMPDIR} -ge 52 ]]; then
            tmpdir_status=FAIL
            write_summary
            exit 2
          fi
          tmpdir_status=PASS

          set +e
          cargo test --locked --offline --no-default-features --test runner_recovery \
            broker_crash_recovery_observes_then_stops_the_same_running_instance \
            -- --exact --test-threads=1 --nocapture > "$run_log" 2>&1
          cargo_exit_code=$?
          set -e

          diagnostic_fields=' category=(declared_capture_unavailable|cleanup_unconfirmed|unexpected_success|unexpected_refusal) exit_code=(None|Some\(-?[0-9]{1,10}\)) stdout_empty=(true|false)$'
          initial_pattern="^g09_recovery_cli phase=initial$diagnostic_fields"
          replay_pattern="^g09_recovery_cli phase=replay$diagnostic_fields"
          expected_fields='category=declared_capture_unavailable exit_code=Some(1) stdout_empty=true'
          expected_initial="g09_recovery_cli phase=initial $expected_fields"
          expected_replay="g09_recovery_cli phase=replay $expected_fields"
          if ! [[ "$expected_initial" =~ $initial_pattern && "$expected_replay" =~ $replay_pattern ]]; then
            echo 'safe diagnostic regex rejected its valid fixture' >&2
            exit 2
          fi
          if [[ "${expected_initial} unexpected_suffix" =~ $initial_pattern ]]; then
            echo 'safe diagnostic regex accepted a suffix' >&2
            exit 2
          fi
          initial_lines="$(grep -E "$initial_pattern" "$run_log" || true)"
          replay_lines="$(grep -E "$replay_pattern" "$run_log" || true)"
          reconciliation_diagnostic="${initial_lines%%$'\n'*}"
          replay_diagnostic="${replay_lines%%$'\n'*}"
          reconciliation_diagnostic="${reconciliation_diagnostic:-NOT_REACHED}"
          replay_diagnostic="${replay_diagnostic:-NOT_REACHED}"
          if [[ "$initial_lines" == "$expected_initial" && "$replay_lines" == "$expected_replay" ]]; then
            contract_guard=PASS
          else
            contract_guard=FAIL
          fi

          selected_test_count="$(grep -Fxc 'running 1 test' "$run_log" || true)"
          if [[ "$selected_test_count" == 1 ]]; then
            selector_guard=PASS
          else
            selector_guard=FAIL
          fi
          if [[ "$cargo_exit_code" == 0 && "$selector_guard" == PASS && "$contract_guard" == PASS ]]; then
            test_result=PASS
          else
            test_result=FAIL
          fi
          if [[ "$cargo_exit_code" != 0 ]]; then
            workflow_exit_code=$cargo_exit_code
          elif [[ "$selector_guard" != PASS || "$contract_guard" != PASS ]]; then
            workflow_exit_code=1
          else
            workflow_exit_code=0
          fi

          write_summary
          exit "$workflow_exit_code"

      - name: Upload sanitized selector status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-recovery-status-${{ github.sha }}
          path: ${{ runner.temp }}/g09-test-summary.txt
          if-no-files-found: ignore
          retention-days: 14
