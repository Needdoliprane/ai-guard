name: G06 MySQL startup refusal by feature mode

on:
  push:
    branches: ['claude/v1-g06-startup-oracle-modes-check-20261122']

permissions:
  contents: read

concurrency:
  group: g06-startup-oracle-modes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-oracle:
    name: startup refusal (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [default, no-default-features]
    env:
      AI_GUARD_BUILD_REVISION: 3e8d1b2a58a154db28e46f90f810c58aac98d7f5
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize the closed mode receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g06-startup-oracle-$MODE.txt"
          printf 'source_sha=3e8d1b2a58a154db28e46f90f810c58aac98d7f5\nworkflow_sha=%s\nworkflow_parent_sha=3e8d1b2a58a154db28e46f90f810c58aac98d7f5\nfeature_mode=%s\ntarget=mysql_gateway_startup\nselector=valid_mysql_profiles_refuse_before_credentials_or_storage_effects\nsource_check=NOT_RUN\nworkflow_check=NOT_RUN\ntoolchain=NOT_RUN\ntoolchain_version=unknown\ndependency_fetch=NOT_RUN\ntest_verdict=NOT_RUN\ntest_selected=unknown\ntest_passed=unknown\ntest_failed=unknown\ntest_ignored=unknown\ntest_exit=unknown\nlast_phase=initialized\n' "$WORKFLOW_SHA" "$MODE" > "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact source, mode oracle, and workflow-only commit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g06-startup-oracle-${{ matrix.mode }}.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source=3e8d1b2a58a154db28e46f90f810c58aac98d7f5
          parent=72fa713f7c0295d9582fa4439e88e5250c4ac8b5
          test_source=tests/mysql_gateway_startup.rs
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g06-startup-oracle-modes-check-20261122 &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git rev-parse HEAD^)" == "$source" && "$(git rev-parse "$source^")" == "$parent" &&
                "$(git diff --name-only "$parent" "$source")" == "$test_source" &&
                "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             git merge-base --is-ancestor "$source" HEAD &&
             grep -Fq 'async fn valid_mysql_profiles_refuse_before_credentials_or_storage_effects()' "$test_source" &&
             grep -Fq '#[cfg(feature = "mysql-storage")]' "$test_source" &&
             grep -Fq '#[cfg(not(feature = "mysql-storage"))]' "$test_source" &&
             grep -Fq '.env_clear()' "$test_source" &&
             grep -Fq 'args(["gateway", "--listen", "127.0.0.1:0", "--tenants-file"])' "$test_source" &&
             grep -Fq 'assert_eq!(entries(root), before);' "$test_source" &&
             grep -Fq 'channel = "1.99.1"' rust-toolchain.toml; then
            set_field source_check PASS
            set_field workflow_check PASS
            set_field last_phase source_verified
          else
            set_field source_check FAIL
            set_field workflow_check FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Install and verify Rust 1.99.1
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g06-startup-oracle-${{ matrix.mode }}.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rustup_toolchain_install
          rustup toolchain install 1.99.1 --profile minimal --no-self-update > "$RUNNER_TEMP/g06-rustup.log" 2>&1
          version="$(rustc +1.99.1 --version | awk '{print $2}')"
          [[ "$version" == 1.99.1 ]]
          set_field toolchain PASS
          set_field toolchain_version "$version"
          set_field last_phase toolchain_verified

      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g06-startup-oracle-${{ matrix.mode }}.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase dependency_fetch
          if cargo +1.99.1 fetch --locked > "$RUNNER_TEMP/g06-fetch.log" 2>&1; then
            set_field dependency_fetch PASS
            set_field last_phase dependencies_fetched
          else
            rc=$?
            set_field dependency_fetch FAIL
            set_field last_phase dependency_fetch_failed
            exit "$rc"
          fi

      - name: Run one exact local startup refusal
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g06-startup-oracle-$MODE.txt"
          log="$RUNNER_TEMP/g06-startup-oracle-$MODE-test.log"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector=valid_mysql_profiles_refuse_before_credentials_or_storage_effects
          set_field last_phase exact_test
          if [[ "$MODE" == default ]]; then
            if timeout --signal=TERM --kill-after=10s 20m cargo +1.99.1 test --locked --offline \
                --test mysql_gateway_startup -- --exact --test-threads=1 "$selector" > "$log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
          elif [[ "$MODE" == no-default-features ]]; then
            if timeout --signal=TERM --kill-after=10s 20m cargo +1.99.1 test --locked --offline --no-default-features \
                --test mysql_gateway_startup -- --exact --test-threads=1 "$selector" > "$log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
          else
            set_field last_phase invalid_mode
            exit 1
          fi
          selected=0
          passed=0
          failed=0
          ignored=0
          grep -Fqx "test $selector ... ok" "$log" && { selected=1; passed=1; } || true
          grep -Fqx "test $selector ... FAILED" "$log" && { selected=1; failed=1; } || true
          summary=$(grep -E '^test result:' "$log" | tail -n 1 | sed -E 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/' || true)
          if [[ "$summary" =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then
            read -r passed failed ignored <<< "$summary"
          fi
          if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then
            verdict=PASS
            phase=one_exact_test_passed
          else
            verdict=FAIL
            phase=exact_test_failed_or_unconfirmed
          fi
          set_field test_verdict "$verdict"
          set_field test_selected "$selected"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"
          set_field last_phase "$phase"
          [[ "$verdict" == PASS ]]

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g06-startup-oracle-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/g06-startup-oracle-${{ matrix.mode }}.txt
          if-no-files-found: error
          retention-days: 14
