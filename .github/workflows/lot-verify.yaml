name: G09 run-client loss recovery on rootful Docker

# One ignored Linux integration selector on a disposable GitHub-hosted runner.
# The test SIGKILLs only its own run-client process; the workload has no network
# or provider. Docker inventory is read-only and fixture resources are retained.
on:
  push:
    branches:
      - claude/v1-g09-run-client-recovery-check-r3-20261123

permissions:
  contents: read

concurrency:
  group: g09-run-client-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-client-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SOURCE_SHA: a947b5e1c179214fb65699b96ce7818ebeefd53f
      SOURCE_TREE: 0e02618510cdaf2ba1de5c67d3fc88a4ea50ee7d
      SOURCE_PARENTS: '881c7da73dc438d978beb01049cfe1e7464abd00 8a51fbc94b4d9f54c17be4771376343a771f193c'
      SOURCE_FIRST_PARENT_TREE: 76f98d4740fe7aa8c91943e760ed9ea701c68d52
      SOURCE_SECOND_PARENT_TREE: dde18d91b73f0fec0183ee14807226bec12afa10
      LOCK_SHA: 05847a300405860df8f860d5dc1c39ca423dfa0d
      EXPECTED_BRANCH: claude/v1-g09-run-client-recovery-check-r3-20261123
      SELECTOR: broker_run_cli_sigkill_preserves_original_deadline_without_second_start
      AI_GUARD_BUILD_REVISION: a947b5e1c179214fb65699b96ce7818ebeefd53f
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      DOCKER_HOST: unix:///var/run/docker.sock
      LC_ALL: C
    steps:
      - name: Initialize closed run-client receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          cat > "$receipt" <<EOF
          source_sha=$SOURCE_SHA
          source_tree=$SOURCE_TREE
          source_parents=$SOURCE_PARENTS
          workflow_sha=$WORKFLOW_SHA
          workflow_parent_sha=unknown
          source_guard=NOT_RUN
          rootful_preflight=NOT_RUN
          worker_image_build=NOT_RUN
          worker_image_uid=NOT_RUN
          provider_cli_versions=NOT_SELECTED
          worker_network=none
          dependency_fetch=NOT_RUN
          build_no_run=NOT_RUN
          build_exit=unknown
          libtest_sha256=unknown
          test_selector=$SELECTOR
          test_selected=unknown
          test_passed=unknown
          test_failed=unknown
          test_ignored=unknown
          test_exit=unknown
          test_verdict=NOT_RUN
          evidence_root=NOT_VERIFIED
          native_start=unknown
          worker_timeout_seconds=unknown
          run_cli_sigkill=unknown
          same_worker_attempt=unknown
          same_original_arm_deadline=unknown
          docker_start_events=unknown
          durable_terminal_result=unknown
          result_replay_identical=unknown
          one_allocation=unknown
          quota_held_workers=unknown
          quota_held_cpu_millis=unknown
          quota_held_memory_bytes=unknown
          worker_cleanup_removed=unknown
          worker_network_observed=unknown
          broker_live_after_replay=unknown
          gateway_active=unknown
          broker_closure=unknown
          gateway_closure=unknown
          fixture_retention=TEST_DECLARED_PRIVATE
          containers_before=unknown
          containers_after=unknown
          containers_new=unknown
          volumes_before=unknown
          volumes_after=unknown
          volumes_new=unknown
          images_before=unknown
          images_after=unknown
          images_new=unknown
          engine_cleanup=NOT_PERFORMED
          receipt_closed=NO
          last_phase=initialized
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify source and exact workflow child
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          first_parent=881c7da73dc438d978beb01049cfe1e7464abd00
          second_parent=8a51fbc94b4d9f54c17be4771376343a771f193c
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git show -s --format=%P HEAD)" == "$SOURCE_SHA" &&
                "$(git rev-parse "$SOURCE_SHA^{tree}")" == "$SOURCE_TREE" &&
                "$(git show -s --format=%P "$SOURCE_SHA")" == "$SOURCE_PARENTS" &&
                "$(git rev-parse "$first_parent^{tree}")" == "$SOURCE_FIRST_PARENT_TREE" &&
                "$(git rev-parse "$second_parent^{tree}")" == "$SOURCE_SECOND_PARENT_TREE" &&
                "$(git rev-parse "$SOURCE_SHA:Cargo.lock")" == "$LOCK_SHA" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse --is-shallow-repository)" == true &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             grep -Fq "async fn $SELECTOR() -> Result<()>" tests/broker_runtime.rs &&
             grep -Fq 'let killed_status = run_cli.kill_owned()?;' tests/broker_runtime.rs &&
             grep -Fq 'broker_live_after_result_replay":true' tests/broker_runtime.rs &&
             grep -Fq 'items.len() == 1' tests/broker_runtime.rs &&
             grep -Fq 'quota.held_workers == 0' tests/broker_runtime.rs &&
             grep -Fq 'broker_exit.success()' tests/broker_runtime.rs &&
             grep -Fq 'gateway.terminate_owned()?.success()' tests/broker_runtime.rs &&
             grep -Fq '"network":"none"' tests/broker_runtime.rs &&
             grep -Fq 'retain enforcer, workspace and evidence' tests/broker_runtime.rs; then
            set_field workflow_parent_sha "$SOURCE_SHA"
            set_field source_guard PASS
            set_field last_phase source_verified
          else
            set_field source_guard FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Prepare private Cargo scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=private_scratch_prepare/' "$receipt"
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private"
          canonical="$(realpath -- "$private")"
          [[ "$canonical" == "$private" && "$(stat -c '%a' "$private")" == 700 ]]
          mkdir -m 700 "$private/target" "$private/tmp"
          [[ "$(realpath -- "$private/target")" == "$private/target" && "$(stat -c '%a' "$private/target")" == 700 ]]
          [[ "$(realpath -- "$private/tmp")" == "$private/tmp" && "$(stat -c '%a' "$private/tmp")" == 700 ]]
          printf 'G09_PRIVATE=%s\nTMPDIR=%s\nCARGO_TARGET_DIR=%s/target\n' "$private" "$private/tmp" "$private" >> "$GITHUB_ENV"
          sed -i 's/^last_phase=.*/last_phase=private_scratch_ready/' "$receipt"

      - name: Verify rootful Docker and inventory existing resources
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rootful_preflight
          endpoint="$(docker context inspect --format '{{.Endpoints.docker.Host}}' default)"
          security="$(docker info --format '{{json .SecurityOptions}}')"
          platform="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')"
          if [[ -S /var/run/docker.sock && "$endpoint" == unix:///var/run/docker.sock && "$platform" == linux/amd64 ]] &&
             jq -e 'all(.[]; (ascii_downcase | contains("rootless")) | not)' <<< "$security" >/dev/null; then
            docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$G09_PRIVATE/containers.before"
            docker volume ls -q | LC_ALL=C sort -u > "$G09_PRIVATE/volumes.before"
            docker image ls -q --no-trunc | LC_ALL=C sort -u > "$G09_PRIVATE/images.before"
            set_field containers_before "$(wc -l < "$G09_PRIVATE/containers.before" | tr -d ' ')"
            set_field volumes_before "$(wc -l < "$G09_PRIVATE/volumes.before" | tr -d ' ')"
            set_field images_before "$(wc -l < "$G09_PRIVATE/images.before" | tr -d ' ')"
            set_field rootful_preflight PASS
            set_field last_phase rootful_preflight_complete
          else
            set_field rootful_preflight FAIL
            set_field last_phase rootful_preflight_failed
            exit 1
          fi

      - name: Build the private UID 1000 worker image without provider clients
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          tag="ai-guard-g09-run-client:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field last_phase worker_image_build
          if docker build --file images/worker.Dockerfile --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= --tag "$tag" . > "$G09_PRIVATE/worker-build.log" 2>&1; then
            image_id="$(docker image inspect --format '{{.Id}}' "$tag")"
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$(docker image inspect --format '{{.Config.User}}' "$image_id")" == 1000:1000 ]]
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image_id")" == linux/amd64 ]]
            printf '%s\n' "$image_id" > "$G09_PRIVATE/image.id"
            printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_ALLOW_ROOTFUL=1\nAGENTSANDBOX_TEST_RETAIN_ENFORCER=1\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=unix:///var/run/docker.sock\nAGENTSANDBOX_TEST_IMAGE=%s\nAGENTSANDBOX_TEST_BROKER_NATIVE_START=1\nAGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS=30\n' "$image_id" >> "$GITHUB_ENV"
            set_field worker_image_build PASS
            set_field worker_image_uid 1000:1000
            set_field worker_image_arch linux/amd64
            set_field provider_cli_versions NONE_SELECTED
            set_field last_phase worker_image_verified
          else
            set_field worker_image_build FAIL
            set_field last_phase worker_image_build_failed
            exit 1
          fi

      - name: Fetch locked Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=dependency_fetch/' "$receipt"
          if cargo fetch --locked > "$G09_PRIVATE/fetch.log" 2>&1; then
            sed -i 's/^dependency_fetch=NOT_RUN$/dependency_fetch=PASS/' "$receipt" || true
            sed -i 's/^last_phase=.*/last_phase=dependencies_fetched/' "$receipt"
          else
            rc=$?
            sed -i 's/^dependency_fetch=NOT_RUN$/dependency_fetch=FAIL/' "$receipt" || true
            sed -i "s/^last_phase=.*/last_phase=dependency_fetch_failed_exit_${rc}/" "$receipt"
            exit "$rc"
          fi

      - name: Compile exactly one broker runtime libtest executable
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase libtest_no_run
          if cargo test --locked --offline --test broker_runtime --no-run --message-format=json > "$G09_PRIVATE/build.jsonl" 2> "$G09_PRIVATE/build.stderr"; then
            libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "broker_runtime" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl" 2>/dev/null || true)"
            [[ -n "$libtest" && -x "$libtest" ]]
            set_field libtest_sha256 "$(sha256sum "$libtest" | awk '{print $1}')"
            set_field build_no_run PASS
            set_field build_exit 0
            printf '%s\n' "$libtest" > "$G09_PRIVATE/libtest.path"
            set_field last_phase compiled_no_run
          else
            rc=$?
            set_field build_no_run FAIL
            set_field build_exit "$rc"
            set_field last_phase no_run_build_failed
            exit "$rc"
          fi

      - name: Run the single run-client SIGKILL recovery selector
        shell: bash
        env:
          AGENTSANDBOX_TEST_RUNTIME: docker
          AGENTSANDBOX_TEST_ALLOW_ROOTFUL: '1'
          AGENTSANDBOX_TEST_RETAIN_ENFORCER: '1'
          AGENTSANDBOX_TEST_RUNTIME_PROGRAM: /usr/bin/docker
          AGENTSANDBOX_TEST_RUNTIME_ENDPOINT: unix:///var/run/docker.sock
          AGENTSANDBOX_TEST_BROKER_NATIVE_START: '1'
          AGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS: '30'
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector="$SELECTOR"
          log="$G09_PRIVATE/test.log"
          set_field last_phase targeted_run_client_recovery
          libtest="$(<"$G09_PRIVATE/libtest.path")"
          if timeout --signal=TERM --kill-after=30s 660s "$libtest" "$selector" --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1; then rc=0; else rc=$?; fi
          selected=0 passed=0 failed=0 ignored=0 summary_passed=0 summary_failed=0 summary_ignored=0
          [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] && selected=1 || true
          summary_lines="$(grep -Ec '^test result:' "$log" || true)"
          summary="$(grep -E '^test result:' "$log" | sed -E 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/' || true)"
          summary_ok=0
          if [[ "$summary_lines" == 1 ]] &&
             grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9]+(\.[0-9]+)?s$' "$log"; then summary_ok=1; fi
          if [[ "$summary_lines" == 1 && "$summary" =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then read -r summary_passed summary_failed summary_ignored <<< "$summary"; fi
          failed="$summary_failed"
          ignored="$summary_ignored"
          if [[ "$(grep -Fxc "test $selector ... FAILED" "$log" || true)" == 1 ]]; then failed=1; fi
          set_field test_selected "$selected"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"

          evidence_root="$(sed -nE "s|^test $selector \.\.\. retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\\1|p; s|^retained broker runtime evidence: (/tmp/br-[[:alnum:]]{6})$|\\1|p" "$log" | LC_ALL=C sort -u)"
          inline_passes="$(grep -Fxc "test $selector ... ok" "$log" || true)"
          retained_passes=0
          if [[ "$(printf '%s\n' "$evidence_root" | sed '/^$/d' | wc -l | tr -d ' ')" == 1 &&
                "$evidence_root" =~ ^/tmp/br-[[:alnum:]]{6}$ ]]; then
            retained_line="test $selector ... retained broker runtime evidence: $evidence_root"
            if [[ "$(grep -Fxc "$retained_line" "$log" || true)" == 1 &&
                  "$(grep -Fxc 'ok' "$log" || true)" == 1 ]]; then
              retained_passes=1
            fi
          fi
          if (( inline_passes + retained_passes == 1 )) &&
             [[ "$summary_ok" == 1 && "$summary_passed" == 1 && "$summary_failed" == 0 && "$summary_ignored" == 0 ]]; then passed=1; fi
          set_field test_passed "$passed"
          evidence_ok=0
          if [[ "$(printf '%s\n' "$evidence_root" | sed '/^$/d' | wc -l | tr -d ' ')" == 1 &&
                "$evidence_root" =~ ^/tmp/br-[[:alnum:]]{6}$ && -d "$evidence_root" && ! -L "$evidence_root" &&
                "$(realpath -- "$evidence_root")" == "$evidence_root" &&
                "$(stat -c '%u %a' "$evidence_root")" == "$(id -u) 700" ]]; then
            evidence_ok=1
            set_field evidence_root VERIFIED_PRIVATE
            read_json() {
              local file=$1
              [[ -f "$evidence_root/$file" && ! -L "$evidence_root/$file" &&
                 "$(realpath -- "$evidence_root/$file")" == "$evidence_root/$file" &&
                 "$(stat -c '%u %a' "$evidence_root/$file")" == "$(id -u) 600" ]] || return 1
              jq -es 'if length == 1 then .[0] else empty end' "$evidence_root/$file" 2>/dev/null
            }
            if read_json result.json | jq -e '.runtime_test == "PASS" and .fault == "owned_run_cli_sigkill" and .native_start == true and .timeout_seconds == 30' >/dev/null 2>&1; then
              set_field native_start true
              set_field worker_timeout_seconds 30
              set_field fixture_runtime_result PASS
            else
              set_field fixture_runtime_result FAIL_OR_UNKNOWN
            fi
            if read_json run-cli-killed.json | jq -e '.signal == 9' >/dev/null 2>&1; then set_field run_cli_sigkill SIGKILL; else set_field run_cli_sigkill UNKNOWN; fi
            if read_json cli-job-result.json | jq -e '.cancel_requested == false and .outcome.state == "terminal" and .outcome.result.exit_code == 137 and .outcome.result.oom_killed == false and .outcome.result.changed_files == 0 and .outcome.result.output_captured == false' >/dev/null 2>&1; then
              set_field durable_terminal_result PASS
            else
              set_field durable_terminal_result FAIL_OR_UNKNOWN
            fi
            if read_json reconciled.json | jq -e '.broker_live_after_result_replay == true and .quota.held_workers == 0 and .quota.held_cpu_millis == 0 and .quota.held_memory_bytes == 0 and .allocation.billable == false and (.allocation.duration_ns | type == "string" and test("^[1-9][0-9]*$")) and .integrity.valid == true' >/dev/null 2>&1; then
              set_field result_replay_identical PASS
              set_field broker_live_after_replay true
              set_field quota_held_workers 0
              set_field quota_held_cpu_millis 0
              set_field quota_held_memory_bytes 0
              set_field one_allocation ONE_ASSERTED
            else
              set_field result_replay_identical FAIL_OR_UNKNOWN
              set_field broker_live_after_replay UNKNOWN
            fi
            if read_json worker.json > "$G09_PRIVATE/worker-before.json" && read_json worker-after.json > "$G09_PRIVATE/worker-after.safe.json" &&
               jq -e -n --slurpfile before "$G09_PRIVATE/worker-before.json" --slurpfile after "$G09_PRIVATE/worker-after.safe.json" '
                 ($before|length)==1 and ($after|length)==1 and
                 $before[0].worker_id == $after[0].worker_id and
                 $before[0].attempt.attempt_id == $after[0].attempt.attempt_id and
                 $before[0].attempt.container_id == $after[0].attempt.container_id and
                 $after[0].state == "terminal" and $after[0].quota_held == false and
                 $after[0].cleanup_removed == true and $after[0].last_observation.running == false and
                 $after[0].last_observation.restart_count == 0 and $after[0].last_observation.exit_code == 137 and
                 $after[0].last_observation.oom_killed == false' >/dev/null 2>&1; then
              set_field same_worker_attempt PASS
              set_field worker_cleanup_removed true
            else
              set_field same_worker_attempt FAIL_OR_UNKNOWN
              set_field worker_cleanup_removed unknown
            fi
            if read_json recovery-before.json > "$G09_PRIVATE/recovery-before.safe.json" && read_json recovery-after.json > "$G09_PRIVATE/recovery-after.safe.json" &&
               jq -e -n --slurpfile before "$G09_PRIVATE/recovery-before.safe.json" --slurpfile after "$G09_PRIVATE/recovery-after.safe.json" '
                 ($before|length)==1 and ($after|length)==1 and
                 ($before[0].known_arms | map(select(.subject.kind == "worker"))) as $b
                 | ($after[0].known_arms | map(select(.subject.kind == "worker"))) as $a
                 | ($b|length)==1 and ($a|length)==1 and
                   $b[0].arm_id == $a[0].arm_id and $b[0].worker_id == $a[0].worker_id and
                   $b[0].attempt_id == $a[0].attempt_id and $b[0].original_clock == $a[0].original_clock and
                   $b[0].original_timeout_seconds == $a[0].original_timeout_seconds and
                   $b[0].original_deadline_ns_decimal == $a[0].original_deadline_ns_decimal and
                   $b[0].cancel_command_id == $a[0].cancel_command_id' >/dev/null 2>&1; then
              set_field same_original_arm_deadline PASS
            else
              set_field same_original_arm_deadline FAIL_OR_UNKNOWN
            fi
            if read_json control-identity.json | jq -e '.schema_version == 3 and .active == true and .role == "runner" and .tenant_id == "local"' >/dev/null 2>&1; then set_field gateway_active PASS; else set_field gateway_active UNKNOWN; fi
            if read_json docker-running.json | jq -e '.network == "none" and .privileged == false and .restarts == 0' >/dev/null 2>&1; then set_field worker_network_observed none; else set_field worker_network_observed UNKNOWN; fi
            if read_json docker-cli-worker-events.json > "$G09_PRIVATE/worker-events.safe.json" &&
               jq -e 'type == "array" and ([.[] | select(.action == "start")] | length == 1) and
                 ([.[] | select(.action == "kill")] | length == 1) and
                 ([.[] | select(.action == "die")] | length == 1) and
                 ([.[] | select(.action == "destroy")] | length == 1) and
                 ([.[] | select(.action == "restart" or .action == "oom")] | length == 0)' "$G09_PRIVATE/worker-events.safe.json" >/dev/null 2>&1; then
              set_field docker_start_events 1
            else
              set_field docker_start_events UNKNOWN
            fi
            if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 &&
                  "$(grep '^fixture_runtime_result=' "$receipt" | cut -d= -f2)" == PASS &&
                  "$(grep '^run_cli_sigkill=' "$receipt" | cut -d= -f2)" == SIGKILL &&
                  "$(grep '^same_worker_attempt=' "$receipt" | cut -d= -f2)" == PASS &&
                  "$(grep '^same_original_arm_deadline=' "$receipt" | cut -d= -f2)" == PASS &&
                  "$(grep '^durable_terminal_result=' "$receipt" | cut -d= -f2)" == PASS &&
                  "$(grep '^result_replay_identical=' "$receipt" | cut -d= -f2)" == PASS &&
                  "$(grep '^one_allocation=' "$receipt" | cut -d= -f2)" == ONE_ASSERTED &&
                  "$(grep '^worker_cleanup_removed=' "$receipt" | cut -d= -f2)" == true &&
                  "$(grep '^gateway_active=' "$receipt" | cut -d= -f2)" == PASS &&
                  "$(grep '^worker_network_observed=' "$receipt" | cut -d= -f2)" == none &&
                  "$(grep '^docker_start_events=' "$receipt" | cut -d= -f2)" == 1 ]]; then
              set_field test_verdict PASS_1_0_0
              set_field test_process_closure PASS
              set_field broker_closure PASS
              set_field gateway_closure PASS
            else
              set_field test_verdict FAIL_OR_INCOMPLETE
              set_field test_process_closure UNKNOWN
              set_field broker_closure UNKNOWN
              set_field gateway_closure UNKNOWN
              exit 1
            fi
          else
            set_field evidence_root UNKNOWN
            set_field test_verdict FAIL_OR_INCOMPLETE
            exit 1
          fi
          set_field test_exit "$rc"
          set_field last_phase targeted_test_complete

      - name: Record read-only Docker inventory and close receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-run-client-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "$private" && -f "$private/containers.before" && -f "$private/volumes.before" && -f "$private/images.before" ]] && docker info >/dev/null 2>&1; then
            if docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.after" &&
               docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.after" &&
               docker image ls -q --no-trunc | LC_ALL=C sort -u > "$private/images.after" &&
               comm -13 "$private/containers.before" "$private/containers.after" > "$private/containers.new" &&
               comm -13 "$private/volumes.before" "$private/volumes.after" > "$private/volumes.new" &&
               comm -13 "$private/images.before" "$private/images.after" > "$private/images.new"; then
              set_field containers_after "$(wc -l < "$private/containers.after" | tr -d ' ')"
              set_field containers_new "$(wc -l < "$private/containers.new" | tr -d ' ')"
              set_field volumes_after "$(wc -l < "$private/volumes.after" | tr -d ' ')"
              set_field volumes_new "$(wc -l < "$private/volumes.new" | tr -d ' ')"
              set_field images_after "$(wc -l < "$private/images.after" | tr -d ' ')"
              set_field images_new "$(wc -l < "$private/images.new" | tr -d ' ')"
            else
              set_field containers_after unknown
              set_field containers_new unknown
              set_field volumes_after unknown
              set_field volumes_new unknown
              set_field images_after unknown
              set_field images_new unknown
            fi
          else
            set_field containers_after unknown
            set_field containers_new unknown
            set_field volumes_after unknown
            set_field volumes_new unknown
            set_field images_after unknown
            set_field images_new unknown
          fi
          set_field engine_cleanup NOT_PERFORMED
          set_field receipt_closed YES
          {
            printf 'G09 run-client recovery selector=%s source=%s\n' \
              "$(grep '^test_verdict=' "$receipt" | cut -d= -f2)" "$SOURCE_SHA"
            printf 'selected=%s passed=%s failed=%s ignored=%s worker_start_events=%s quota_held_workers=%s cleanup=%s retained=%s\n' \
              "$(grep '^test_selected=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_passed=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_failed=' "$receipt" | cut -d= -f2)" \
              "$(grep '^test_ignored=' "$receipt" | cut -d= -f2)" \
              "$(grep '^docker_start_events=' "$receipt" | cut -d= -f2)" \
              "$(grep '^quota_held_workers=' "$receipt" | cut -d= -f2)" \
              "$(grep '^worker_cleanup_removed=' "$receipt" | cut -d= -f2)" \
              "$(grep '^fixture_retention=' "$receipt" | cut -d= -f2)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-run-client-recovery-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/g09-run-client-recovery-receipt.txt
          if-no-files-found: error
          retention-days: 14
