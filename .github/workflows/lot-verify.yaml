name: G06 safety selector checks

on:
  push:
    branches: ['claude/v1-g06-safety-selectors-check-20261122']

permissions:
  contents: read

concurrency:
  group: g06-safety-selectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-selectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7d468e5921285f645eaf4e55187f8950cdacd755
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize sanitized SQLite receipt
        shell: bash
        run: |
          printf 'candidate=7d468e5921285f645eaf4e55187f8950cdacd755\nparent=0bcf84c697c9f8f9906d2d08625f21947378c5f2\nprofile=sqlite\nmode=--no-default-features\npreflight=NOT_RUN\nfetch=NOT_RUN\nbuild=NOT_RUN\nartifact_resolution=NOT_RUN\nselectors=NOT_RUN\n' > "$RUNNER_TEMP/g06-sqlite-receipt.txt"
      - name: Verify frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7d468e5921285f645eaf4e55187f8950cdacd755
          test "$(git rev-parse HEAD^)" = 0bcf84c697c9f8f9906d2d08625f21947378c5f2
          test -f tests/audit_retention.rs
          grep -Fq 'fn egress_store_retention_preserves_decision_and_channel_receipts()' src/audit/egress_decisions_tests.rs
          grep -Fq 'fn sqlite_sibling_keeps_egress_policy_when_gateway_expands_redaction()' src/audit/egress_decisions_tests.rs
          grep -Fq 'fn sibling_preparation_requires_the_retained_main_identity()' src/audit/storage.rs
          grep -Fq 'async fn expected_scope_conflicts_before_fresh_and_replayed_policy_with_no_neighbor_sql()' src/api/human_sources/owned_policy_tests.rs
          grep -Fq 'async fn binding_revoked_after_real_policy_commit_cannot_publish_a_receipt()' src/api/human_sources/owned_policy_tests.rs
          grep -Fq 'async fn batch_at_the_archived_horizon_rolls_back_and_keeps_the_typed_conflict()' tests/audit_retention.rs
          echo 'preflight=PASS' >> "$RUNNER_TEMP/g06-sqlite-receipt.txt"
      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if cargo fetch --locked > "$RUNNER_TEMP/g06-sqlite-fetch.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'fetch=%s exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g06-sqlite-receipt.txt"
          exit "$rc"
      - name: Compile SQLite libtest and audit_retention once
        id: build
        shell: bash
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/g06-sqlite-private"
          mkdir -m 700 "$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          cargo test --locked --offline --no-default-features --lib --test audit_retention \
            --no-run --message-format=json > "$scratch/build.jsonl" 2> "$scratch/build.stderr"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          printf 'build=%s exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g06-sqlite-receipt.txt"
          if [ "$rc" -eq 0 ]; then
            libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/build.jsonl")"
            retention="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "audit_retention" and .target.kind == ["test"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/build.jsonl")"
            if [[ -x "$libtest" && -x "$retention" ]]; then
              echo 'artifact_resolution=PASS' >> "$RUNNER_TEMP/g06-sqlite-receipt.txt"
            else
              echo 'artifact_resolution=FAIL' >> "$RUNNER_TEMP/g06-sqlite-receipt.txt"
              exit 1
            fi
            echo "libtest=$libtest" >> "$GITHUB_OUTPUT"
            echo "retention=$retention" >> "$GITHUB_OUTPUT"
            echo "libtest_sha256=$(sha256sum "$libtest" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "retention_sha256=$(sha256sum "$retention" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
            printf 'libtest_sha256=%s\nretention_sha256=%s\n' "$(sha256sum "$libtest" | cut -d ' ' -f1)" "$(sha256sum "$retention" | cut -d ' ' -f1)" >> "$RUNNER_TEMP/g06-sqlite-receipt.txt"
          fi
          exit "$rc"
      - name: Run six exact SQLite selectors
        id: selectors
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          LIBTEST: ${{ steps.build.outputs.libtest }}
          RETENTION: ${{ steps.build.outputs.retention }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$RUNNER_TEMP/g06-sqlite-private"
          receipt="$RUNNER_TEMP/g06-sqlite-receipt.txt"
          failed=0
          checked=0
          passed=0
          ignored_total=0
          record_selector() {
            local label="$1" exe="$2" selector="$3" log="$scratch/$1.log" rc=0
            timeout --kill-after=5s 240s "$exe" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1 || rc=$?
            local banners selected cases results ignored pass fail status location
            banners="$(grep -Ec '^running [0-9]+ tests?$' "$log" || true)"
            selected="$(awk '/^running [0-9]+ tests?$/ { count += $2 } END { print count + 0 }' "$log")"
            cases="$(grep -Ec '^test .+ \.\.\. (ok|FAILED|ignored)(,.*)?$' "$log" || true)"
            results="$(grep -c '^test result: ' "$log" || true)"
            ignored="$(grep -Ec '^test .* \.\.\. ignored(,.*)?$' "$log" || true)"
            pass=0
            fail=0
            status=FAIL
            if grep -Fqx "test $selector ... ok" "$log"; then pass=1; fi
            if grep -Fqx "test $selector ... FAILED" "$log"; then fail=1; fi
            location="$(sed -nE 's/^thread .* panicked at ((src|tests)\/([A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.rs:[0-9]+:[0-9]+):.*/\1/p' "$log" | sort -u | awk 'NR <= 3' | paste -sd ';' -)"
            if [[ "$rc" == 0 && "$banners" == 1 && "$selected" == 1 && "$cases" == 1 && "$results" == 1 && "$ignored" == 0 && "$pass" == 1 && "$fail" == 0 ]] &&
                grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out(; finished in [0-9]+(\.[0-9]+)?s)?$' "$log"; then
              status=PASS
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
            fi
            checked=$((checked + 1))
            ignored_total=$((ignored_total + ignored))
            printf 'selector=%s status=%s exit=%s selected=%s passed=%s failed=%s ignored=%s panic_spans=%s\n' \
              "$label" "$status" "$rc" "$selected" "$pass" "$fail" "$ignored" "${location:-none}" >> "$receipt"
          }
          record_selector egress_retention "$LIBTEST" 'audit::egress_decisions::tests::egress_store_retention_preserves_decision_and_channel_receipts'
          record_selector egress_sibling_redaction "$LIBTEST" 'audit::egress_decisions::tests::sqlite_sibling_keeps_egress_policy_when_gateway_expands_redaction'
          record_selector sibling_main_identity "$LIBTEST" 'audit::storage::tests::sibling_preparation_requires_the_retained_main_identity'
          record_selector owned_scope_conflicts "$LIBTEST" 'api::human_sources::owned_policy_tests::expected_scope_conflicts_before_fresh_and_replayed_policy_with_no_neighbor_sql'
          record_selector owned_revocation "$LIBTEST" 'api::human_sources::owned_policy_tests::binding_revoked_after_real_policy_commit_cannot_publish_a_receipt'
          record_selector archived_horizon "$RETENTION" 'batch_at_the_archived_horizon_rolls_back_and_keeps_the_typed_conflict'
          verdict=FAIL
          if [[ "$checked" == 6 && "$passed" == 6 && "$failed" == 0 && "$ignored_total" == 0 ]]; then verdict=PASS; fi
          printf 'checked=%s passed=%s failed=%s ignored=%s verdict=%s\n' "$checked" "$passed" "$failed" "$ignored_total" "$verdict" >> "$receipt"
          printf 'selectors=%s\n' "$verdict" >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          test "$verdict" = PASS
      - name: Upload sanitized SQLite receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g06-sqlite-selector-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/g06-sqlite-receipt.txt
          if-no-files-found: warn
          retention-days: 14

  mysql-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7d468e5921285f645eaf4e55187f8950cdacd755
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize sanitized MySQL receipt
        shell: bash
        run: |
          printf 'candidate=7d468e5921285f645eaf4e55187f8950cdacd755\nparent=0bcf84c697c9f8f9906d2d08625f21947378c5f2\nprofile=mysql-storage\nmode=--no-default-features --features mysql-storage\npreflight=NOT_RUN\nfetch=NOT_RUN\nbuild=NOT_RUN\nartifact_resolution=NOT_RUN\nselector=NOT_RUN\n' > "$RUNNER_TEMP/g06-mysql-receipt.txt"
      - name: Verify frozen candidate and fixture-only selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7d468e5921285f645eaf4e55187f8950cdacd755
          test "$(git rev-parse HEAD^)" = 0bcf84c697c9f8f9906d2d08625f21947378c5f2
          grep -Fq 'fn mysql_preflight_refuses_sqlite_only_kubernetes_policies()' src/gateway_config.rs
          grep -Fq 'let (dir, path, registry) = fixture();' src/gateway_config.rs
          grep -Fq 'assert!(!dir.path().join("a.sqlite").exists());' src/gateway_config.rs
          echo 'preflight=PASS' >> "$RUNNER_TEMP/g06-mysql-receipt.txt"
      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if cargo fetch --locked > "$RUNNER_TEMP/g06-mysql-fetch.log" 2>&1; then rc=0; else rc=$?; fi
          printf 'fetch=%s exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g06-mysql-receipt.txt"
          exit "$rc"
      - name: Compile MySQL bin test executable once
        id: build
        shell: bash
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/g06-mysql-private"
          mkdir -m 700 "$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          cargo test --locked --offline --no-default-features --features mysql-storage \
            --bin agentsandbox --no-run --message-format=json \
            > "$scratch/build.jsonl" 2> "$scratch/build.stderr"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          printf 'build=%s exit=%s\n' "$([[ "$rc" == 0 ]] && echo PASS || echo FAIL)" "$rc" >> "$RUNNER_TEMP/g06-mysql-receipt.txt"
          if [ "$rc" -eq 0 ]; then
            binary="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["bin"] and .profile.test == true and (.features | index("mysql-storage") != null) and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$scratch/build.jsonl")"
            if [[ -x "$binary" ]]; then
              echo 'artifact_resolution=PASS' >> "$RUNNER_TEMP/g06-mysql-receipt.txt"
            else
              echo 'artifact_resolution=FAIL' >> "$RUNNER_TEMP/g06-mysql-receipt.txt"
              exit 1
            fi
            echo "binary=$binary" >> "$GITHUB_OUTPUT"
            echo "sha256=$(sha256sum "$binary" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
            printf 'bin_test_sha256=%s\n' "$(sha256sum "$binary" | cut -d ' ' -f1)" >> "$RUNNER_TEMP/g06-mysql-receipt.txt"
          fi
          exit "$rc"
      - name: Run exact MySQL configuration selector
        id: selector
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        env:
          TEST_BINARY: ${{ steps.build.outputs.binary }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$RUNNER_TEMP/g06-mysql-private"
          log="$scratch/mysql-selector.log"
          receipt="$RUNNER_TEMP/g06-mysql-receipt.txt"
          selector='gateway_config::tests::mysql_preflight_refuses_sqlite_only_kubernetes_policies'
          if timeout --kill-after=5s 240s "$TEST_BINARY" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1; then rc=0; else rc=$?; fi
          banners="$(grep -Ec '^running [0-9]+ tests?$' "$log" || true)"
          selected="$(awk '/^running [0-9]+ tests?$/ { count += $2 } END { print count + 0 }' "$log")"
          cases="$(grep -Ec '^test .+ \.\.\. (ok|FAILED|ignored)(,.*)?$' "$log" || true)"
          results="$(grep -c '^test result: ' "$log" || true)"
          ignored="$(grep -Ec '^test .* \.\.\. ignored(,.*)?$' "$log" || true)"
          pass=0; fail=0; status=FAIL
          if grep -Fqx "test $selector ... ok" "$log"; then pass=1; fi
          if grep -Fqx "test $selector ... FAILED" "$log"; then fail=1; fi
          location="$(sed -nE 's/^thread .* panicked at ((src|tests)\/([A-Za-z0-9_-]+\/)*[A-Za-z0-9_-]+\.rs:[0-9]+:[0-9]+):.*/\1/p' "$log" | sort -u | awk 'NR <= 3' | paste -sd ';' -)"
          if [[ "$rc" == 0 && "$banners" == 1 && "$selected" == 1 && "$cases" == 1 && "$results" == 1 && "$ignored" == 0 && "$pass" == 1 && "$fail" == 0 ]] &&
              grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out(; finished in [0-9]+(\.[0-9]+)?s)?$' "$log"; then status=PASS; fi
          printf 'selector=mysql_preflight_refuses_sqlite_only_kubernetes_policies status=%s exit=%s selected=%s passed=%s failed=%s ignored=%s panic_spans=%s\n' \
            "$status" "$rc" "$selected" "$pass" "$fail" "$ignored" "${location:-none}" >> "$receipt"
          printf 'verdict=%s\n' "$status" >> "$receipt"
          printf 'selector_status=%s\n' "$status" >> "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$status" >> "$GITHUB_OUTPUT"
          test "$status" = PASS
      - name: Upload sanitized MySQL receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g06-mysql-selector-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/g06-mysql-receipt.txt
          if-no-files-found: warn
          retention-days: 14
