name: G08 owned event detail browser recovery

# Re-run only the owned run-v1 browser fixture. The three SQLite Rust oracles
# are attributed to the prior G08 run; this recovery does not execute them.
on:
  push:
    branches:
      - claude/v1-g08-owned-event-detail-browser-check-20261122

permissions:
  contents: read

concurrency:
  group: g08-owned-event-detail-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-browser-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SOURCE_SHA: 076d69add0efcae7f9870630a47c110bc89373c2
      PRIOR_G08_RUN: '45065932029'
      PRIOR_G08_WORKFLOW_SHA: 4efc71137dde9fe62be109fb5fb4d48b74b43ca7
      BROWSER_FIXTURE_FQN: api::human_sources::tests::owned_browser_fixture::serve_owned_browser_fixture
      PLAYWRIGHT_VERSION: '1.65.1'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /opt/google/chrome/chrome
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Initialize closed browser recovery receipt
        shell: bash
        run: |
          umask 077
          receipt="$RUNNER_TEMP/g08-owned-event-detail-browser-receipt.txt"
          cat > "$receipt" <<'EOF'
          source_sha=076d69add0efcae7f9870630a47c110bc89373c2
          workflow_sha=NOT_RUN
          source_guard=NOT_RUN
          prior_g08_run=45065932029
          prior_g08_workflow_sha=4efc71137dde9fe62be109fb5fb4d48b74b43ca7
          prior_format14_bff=PASS_1_1
          prior_format14_journal=PASS_1_1
          prior_e1_format15=PASS_1_1
          rustc_version=NOT_RUN
          node_version=NOT_RUN
          playwright_version=NOT_RUN
          chrome_version=NOT_RUN
          dependency_fetch=NOT_RUN
          frontend_build=NOT_RUN
          libtest_compile=NOT_RUN
          fixture_fqn=api::human_sources::tests::owned_browser_fixture::serve_owned_browser_fixture
          fixture_fqn_inventory=NOT_RUN
          staged_node=NOT_RUN
          staged_libtest=NOT_RUN
          staged_scripts=NOT_RUN
          staged_bundle=NOT_RUN
          staged_playwright=NOT_RUN
          uid1000_access=NOT_RUN
          uid1000_failed_entry=NOT_RUN
          browser_fixture_selected=NOT_RUN
          browser_status=NOT_RUN
          browser_scenarios=NOT_RUN
          browser_exit=NOT_RUN
          browser_failure_phase=NOT_RUN
          browser_cleanup=NOT_RUN
          private_scratch_cleanup=NOT_RUN
          last_phase=NOT_RUN
          result=NOT_RUN
          scope=run-v1 owned SQLite browser only; prior Rust selectors attributed, not rerun
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Run only the bounded owned browser recovery
        id: verify
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 022
          receipt="$RUNNER_TEMP/g08-owned-event-detail-browser-receipt.txt"
          private_root=
          cargo_target=
          playwright_install=
          public_root=
          browser_root=
          frontend_touched=0
          stage=source_guard
          result=FAIL
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            chmod 600 "$receipt.tmp"
            mv -- "$receipt.tmp" "$receipt"
          }
          finish() {
            local code=$? cleanup_rc=0 final_phase
            trap - EXIT
            set +e
            if [[ -n "$private_root" && "$private_root" == "$RUNNER_TEMP"/g08-browser-private.* ]]; then
              rm -rf -- "$private_root" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$private_root" ]] || cleanup_rc=1
            fi
            if [[ -n "$cargo_target" && "$cargo_target" == "$GITHUB_WORKSPACE/target" ]]; then
              rm -rf -- "$cargo_target" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$cargo_target" ]] || cleanup_rc=1
            fi
            if [[ -n "$playwright_install" && "$playwright_install" == /tmp/g08-playwright-install-* ]]; then
              rm -rf -- "$playwright_install" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$playwright_install" ]] || cleanup_rc=1
            fi
            if [[ -n "$public_root" && "$public_root" == /tmp/g08-browser-public.* ]]; then
              rm -rf -- "$public_root" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$public_root" ]] || cleanup_rc=1
            fi
            if (( frontend_touched )); then
              rm -rf -- "$GITHUB_WORKSPACE/front/node_modules" "$GITHUB_WORKSPACE/front/dist" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$GITHUB_WORKSPACE/front/node_modules" && ! -e "$GITHUB_WORKSPACE/front/dist" ]] || cleanup_rc=1
            fi
            if [[ -n "$browser_root" && "$browser_root" == /tmp/g08-browser-run.* ]]; then
              sudo -n rm -rf -- "$browser_root" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$browser_root" ]] || cleanup_rc=1
            fi
            case "$stage" in
              source_guard|toolchain|private_setup|playwright_install|frontend_build|cargo_fetch|libtest_compile|fixture_inventory|public_input_stage|uid1000_preflight|browser_fixture|complete)
                final_phase="$stage" ;;
              *) final_phase=unknown ;;
            esac
            if (( cleanup_rc != 0 )); then final_phase=private_scratch_cleanup; fi
            if (( cleanup_rc == 0 )); then set_receipt private_scratch_cleanup PASS; else set_receipt private_scratch_cleanup FAIL; fi
            if (( code == 0 && cleanup_rc != 0 )); then code=1; fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; else result=FAIL; fi
            set_receipt last_phase "$final_phase"
            set_receipt result "$result"
            {
              printf 'G08 browser recovery=%s prior_run=%s\n' "$result" "$PRIOR_G08_RUN"
              printf 'prior_rust=PASS(1/1),PASS(1/1),PASS(1/1); not rerun\n'
              printf 'fixture_inventory=%s selected=%s browser=%s scenarios=%s exit=%s failure_phase=%s cleanup=%s\n' \
                "$(awk -F= '$1=="fixture_fqn_inventory"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="browser_fixture_selected"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="browser_status"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="browser_scenarios"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="browser_exit"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="browser_failure_phase"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="private_scratch_cleanup"{print $2}' "$receipt")"
              printf 'last_phase=%s\n' "$final_phase"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
          trap finish EXIT

          source_sha=$SOURCE_SHA
          expected_ref=refs/heads/claude/v1-g08-owned-event-detail-browser-check-20261122
          set_receipt workflow_sha "$GITHUB_SHA"
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
             "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "$expected_ref" &&
             "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
             "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" &&
             "$(git show -s --format=%P HEAD 2>/dev/null)" == "$source_sha" &&
             "$(git diff --name-only "$source_sha" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml ]] || {
              set_receipt source_guard FAIL
              echo 'G08 browser recovery source/ref guard failed; details omitted.' >&2
              exit 1
          }
          set_receipt source_guard PASS

          stage=toolchain
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]] || { set_receipt rustc_version MISMATCH; exit 1; }
          set_receipt rustc_version 1.99.1
          node_line="$(node --version 2>/dev/null)" || node_line=''
          [[ "$node_line" == v24.22.2 ]] || { set_receipt node_version MISMATCH; exit 1; }
          set_receipt node_version 24.22.2
          chrome_version="$(timeout --kill-after=5s 10s "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" --product-version 2>/dev/null)" || chrome_version=''
          [[ "$chrome_version" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { set_receipt chrome_version MISSING; exit 1; }
          set_receipt chrome_version "$chrome_version"

          stage=private_setup
          private_root="$(mktemp -d "$RUNNER_TEMP/g08-browser-private.XXXXXX")" || exit 1
          chmod 700 "$private_root"
          cargo_target="$GITHUB_WORKSPACE/target"
          playwright_install="/tmp/g08-playwright-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -e "$cargo_target" && ! -e "$playwright_install" &&
             ! -e "$GITHUB_WORKSPACE/front/node_modules" && ! -e "$GITHUB_WORKSPACE/front/dist" ]] || exit 1
          mkdir -m 755 "$cargo_target" "$playwright_install"
          export CARGO_TARGET_DIR="$cargo_target" AI_GUARD_BUILD_REVISION="$source_sha"
          export npm_config_cache="$private_root/npm-cache" npm_config_userconfig=/dev/null

          stage=playwright_install
          if timeout --kill-after=5s 10m npm install --prefix "$playwright_install" --ignore-scripts --no-audit --no-fund \
              --save-exact "playwright@$PLAYWRIGHT_VERSION" > "$private_root/playwright.log" 2>&1; then
            set_receipt playwright_version "$PLAYWRIGHT_VERSION"
          else
            set_receipt playwright_version FAIL
            exit 1
          fi

          stage=frontend_build
          frontend_touched=1
          if timeout --kill-after=5s 10m npm ci --prefix "$GITHUB_WORKSPACE/front" --no-audit --no-fund \
              > "$private_root/frontend-install.log" 2>&1 &&
             timeout --kill-after=5s 10m npm --prefix "$GITHUB_WORKSPACE/front" run build \
              > "$private_root/frontend-build.log" 2>&1 &&
             [[ -s "$GITHUB_WORKSPACE/front/dist/index.html" ]]; then
            set_receipt frontend_build PASS
          else
            set_receipt frontend_build FAIL
            echo 'Pinned Vite bundle build failed; raw output omitted.' >&2
            exit 1
          fi

          stage=cargo_fetch
          if timeout --kill-after=10s 10m cargo fetch --locked > "$private_root/cargo-fetch.log" 2>&1; then
            set_receipt dependency_fetch PASS
          else
            set_receipt dependency_fetch FAIL
            exit 1
          fi
          stage=libtest_compile
          build_json="$private_root/libtest.jsonl"
          if timeout --kill-after=15s 40m cargo test --locked --offline --no-default-features --lib --no-run \
              --message-format=json > "$build_json" 2> "$private_root/libtest.stderr"; then
            libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and
                .target.name == "agentsandbox" and .target.kind == ["lib"] and
                .profile.test == true and .features == [] and .executable != null) |
                .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
            [[ -n "$libtest" && -x "$libtest" ]] || { set_receipt libtest_compile ARTIFACT_MISMATCH; exit 1; }
            set_receipt libtest_compile PASS
          else
            set_receipt libtest_compile FAIL
            exit 1
          fi

          stage=fixture_inventory
          list="$private_root/libtest.list"
          if env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$private_root" TMPDIR="$private_root" \
              "$libtest" --list > "$list" 2> "$private_root/list.stderr" &&
             [[ "$(grep -Fxc "$BROWSER_FIXTURE_FQN: test" "$list" || true)" == 1 ]]; then
            set_receipt fixture_fqn_inventory PASS
            set_receipt browser_fixture_selected 1
          else
            set_receipt fixture_fqn_inventory FAIL
            set_receipt browser_fixture_selected 0
            exit 1
          fi

          stage=public_input_stage
          public_root="$(mktemp -d /tmp/g08-browser-public.XXXXXX)" || exit 1
          chmod 755 "$public_root"
          mkdir -p "$public_root/front/tests" "$public_root/front/dist" "$public_root/node_modules"
          node_bin="$(readlink -f "$(command -v node)")"
          cp -- "$node_bin" "$public_root/node"
          cp -- "$libtest" "$public_root/libtest"
          cp -- "$GITHUB_WORKSPACE/front/tests/browser_owned_snapshot.mjs" "$public_root/front/tests/browser_owned_snapshot.mjs"
          cp -- "$GITHUB_WORKSPACE/front/tests/browser_failure.mjs" "$public_root/front/tests/browser_failure.mjs"
          cp -R -- "$GITHUB_WORKSPACE/front/dist/." "$public_root/front/dist/"
          cp -a -- "$playwright_install/node_modules/." "$public_root/node_modules/"
          if find "$GITHUB_WORKSPACE/front/dist" -type l -print -quit | grep -q .; then
            set_receipt staged_bundle FAIL_SYMLINK
            exit 1
          fi
          chmod 755 "$public_root/node" "$public_root/libtest"
          chmod -R a+rX "$public_root"
          cmp -s "$node_bin" "$public_root/node" || { set_receipt staged_node FAIL; exit 1; }
          set_receipt staged_node PASS
          cmp -s "$libtest" "$public_root/libtest" || { set_receipt staged_libtest FAIL; exit 1; }
          set_receipt staged_libtest PASS
          cmp -s "$GITHUB_WORKSPACE/front/tests/browser_owned_snapshot.mjs" "$public_root/front/tests/browser_owned_snapshot.mjs" &&
            cmp -s "$GITHUB_WORKSPACE/front/tests/browser_failure.mjs" "$public_root/front/tests/browser_failure.mjs" || {
              set_receipt staged_scripts FAIL
              exit 1
          }
          set_receipt staged_scripts PASS
          diff -qr "$GITHUB_WORKSPACE/front/dist" "$public_root/front/dist" > /dev/null || {
            set_receipt staged_bundle FAIL
            exit 1
          }
          set_receipt staged_bundle PASS
          diff -qr "$playwright_install/node_modules" "$public_root/node_modules" > /dev/null || {
            set_receipt staged_playwright FAIL
            exit 1
          }
          set_receipt staged_playwright PASS

          stage=uid1000_preflight
          browser_root="$(mktemp -d /tmp/g08-browser-run.XXXXXX)" || exit 1
          sudo -n chown 1000:1000 "$browser_root" && sudo -n chmod 700 "$browser_root" || exit 1
          sudo -n install -d -o 1000 -g 1000 -m 700 \
            "$browser_root/home" "$browser_root/tmp" "$browser_root/tmp/control" "$browser_root/tmp/artifacts" || exit 1
          uid1000_can_access() {
            sudo -n setpriv --reuid=1000 --regid=1000 --clear-groups -- \
              /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin /usr/bin/test "$2" "$3"
          }
          uid1000_check() {
            if uid1000_can_access "$1" "$2" "$3"; then
              set_receipt "uid_access_$1" PASS
            else
              set_receipt "uid_access_$1" FAIL
              set_receipt uid1000_access FAIL
              set_receipt uid1000_failed_entry "$1"
              return 1
            fi
          }
          uid1000_check node -x "$public_root/node"
          uid1000_check libtest -x "$public_root/libtest"
          uid1000_check fixture_script -r "$public_root/front/tests/browser_owned_snapshot.mjs"
          uid1000_check failure_helper -r "$public_root/front/tests/browser_failure.mjs"
          uid1000_check bundle_dir -x "$public_root/front/dist"
          uid1000_check bundle_index -r "$public_root/front/dist/index.html"
          uid1000_check playwright_dir -x "$public_root/node_modules/playwright"
          uid1000_check playwright_package -r "$public_root/node_modules/playwright/package.json"
          uid1000_check playwright_core_package -r "$public_root/node_modules/playwright-core/package.json"
          uid1000_check chrome -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE"
          # Verify every staged public path using the UID that will run Node
          # and Chromium; never expose an inaccessible path in logs or receipt.
          while IFS= read -r -d '' public_entry; do
            if [[ -d "$public_entry" ]]; then
              if ! uid1000_can_access public_tree_path -r "$public_entry" ||
                 ! uid1000_can_access public_tree_path -x "$public_entry"; then
                set_receipt uid1000_access FAIL
                set_receipt uid1000_failed_entry public_tree_path
                exit 1
              fi
            elif [[ -e "$public_entry" ]]; then
              if ! uid1000_can_access public_tree_path -r "$public_entry"; then
                set_receipt uid1000_access FAIL
                set_receipt uid1000_failed_entry public_tree_path
                exit 1
              fi
            else
              set_receipt uid1000_access FAIL
              set_receipt uid1000_failed_entry public_tree_path
              exit 1
            fi
          done < <(find "$public_root" -print0)
          set_receipt uid1000_access PASS
          set_receipt uid1000_failed_entry none

          stage=browser_fixture
          browser_rc=0
          sudo -n setpriv --reuid=1000 --regid=1000 --clear-groups -- \
            /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$browser_root/home" TMPDIR="$browser_root/tmp" \
            CODEX_PRIMARY_RUNTIME_NODE_MODULES="$public_root/node_modules" \
            PLAYWRIGHT_CHROMIUM_EXECUTABLE="$PLAYWRIGHT_CHROMIUM_EXECUTABLE" \
            AI_GUARD_OWNED_BROWSER_FIXTURE=run-v1 AI_GUARD_OWNED_BROWSER_LIBTEST="$public_root/libtest" \
            AI_GUARD_OWNED_BROWSER_DIST="$public_root/front/dist" \
            AI_GUARD_OWNED_BROWSER_CONTROL="$browser_root/tmp/control" \
            AI_GUARD_OWNED_BROWSER_ARTIFACTS="$browser_root/tmp/artifacts" \
            AI_GUARD_OWNED_BROWSER_SECONDS=300 \
            timeout --kill-after=10s 360s "$public_root/node" "$public_root/front/tests/browser_owned_snapshot.mjs" \
            > "$private_root/browser.stdout" 2> "$private_root/browser.stderr" || browser_rc=$?
          set_receipt browser_exit "$browser_rc"
          browser_result="$browser_root/tmp/artifacts/RESULT.json"
          browser_summary=unknown
          if sudo -n setpriv --reuid=1000 --regid=1000 --clear-groups -- \
              /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/test -f "$browser_result"; then
            result_metadata="$(sudo -n stat -c '%u %g %a %s' "$browser_result" 2>/dev/null)" || result_metadata=''
            read -r result_uid result_gid result_mode result_size <<< "$result_metadata"
            [[ "$result_uid" == 1000 && "$result_gid" == 1000 && "$result_mode" == 600 &&
               "$result_size" =~ ^[0-9]+$ ]] || { set_receipt browser_status RESULT_METADATA_INVALID; exit 1; }
            (( result_size <= 524288 )) || { set_receipt browser_status RESULT_SIZE_INVALID; exit 1; }
            browser_summary="$(sudo -n setpriv --reuid=1000 --regid=1000 --clear-groups -- \
              /usr/bin/jq -er '
                select(.version == 1 and
                  (.status == "PASS_THREE_BOUNDED_OWNED_SCENARIOS" or .status == "FAIL_NOT_QUALIFIED" or .status == "BLOCKED_NOT_RUN") and
                  (.interrupted | type == "boolean") and (.observed | type == "object") and
                  (.captures | type == "array") and (.page_errors | type == "array") and
                  (.external_destinations | type == "array") and (.fixture_exit | type == "object")) |
                [.status, (if .observed.scenario1 == "real_login_metadata_receipt_refresh_and_no_automatic_journal_traffic" and
                               .observed.scenario2 == "real_metadata_detail_with_grants_unchanged_closed_content_export_and_keyboard_focus" and
                               .observed.scenario3 == "actual_sqlite_lock_503_withdrawal_restrictive_fact_and_explicit_200_recovery"
                           then 3 else 0 end),
                 (.page_errors | length), (.external_destinations | length),
                 (if .interrupted == false and .failure == null and .cleanup_failure == null and
                     .fixture_exit.code == 0 and .fixture_exit.signal == null then "CLOSED" else "NOT_CLOSED" end),
                 (if .failure == null then "none" else (.failure.stage // "unknown" |
                   if . == "preconditions" or . == "fixture_start" or . == "browser_start" or
                      . == "login_and_snapshot" or . == "navigation_and_coverage" or
                      . == "real_sqlite_busy_and_recovery" then . else "unknown" end) end)] | @tsv' \
              "$browser_result" 2>/dev/null || true)"
          fi
          if [[ "$browser_summary" =~ ^([A-Z_]+)[[:space:]]([0-9]+)[[:space:]]([0-9]+)[[:space:]]([0-9]+)[[:space:]](CLOSED|NOT_CLOSED)[[:space:]]([A-Za-z0-9_]+)$ ]]; then
            browser_status="${BASH_REMATCH[1]}"
            scenario_count="${BASH_REMATCH[2]}"
            page_error_count="${BASH_REMATCH[3]}"
            external_count="${BASH_REMATCH[4]}"
            browser_closed="${BASH_REMATCH[5]}"
            failure_phase="${BASH_REMATCH[6]}"
            set_receipt browser_failure_phase "$failure_phase"
            set_receipt browser_scenarios "$scenario_count"
            if [[ "$browser_status" == PASS_THREE_BOUNDED_OWNED_SCENARIOS && "$scenario_count" == 3 &&
                  "$page_error_count" == 0 && "$external_count" == 0 && "$browser_closed" == CLOSED && "$browser_rc" == 0 ]]; then
              set_receipt browser_status PASS
              set_receipt browser_cleanup PASS
            else
              set_receipt browser_status "$browser_status"
              set_receipt browser_cleanup "$browser_closed"
              exit 1
            fi
          else
            set_receipt browser_status UNKNOWN
            set_receipt browser_failure_phase unknown
            exit 1
          fi
          stage=complete

      - name: Upload only the closed browser recovery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g08-owned-event-detail-browser-${{ github.sha }}
          path: ${{ runner.temp }}/g08-owned-event-detail-browser-receipt.txt
          if-no-files-found: warn
          retention-days: 14
