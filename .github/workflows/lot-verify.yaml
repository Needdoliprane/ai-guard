name: G09 terminal cleanup RED

on:
  push:
    branches:
      - claude/v1-g09-terminal-cleanup-red-check-20261123

permissions:
  contents: read

concurrency:
  group: g09-terminal-cleanup-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terminal-cleanup-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_BRANCH: claude/v1-g09-terminal-cleanup-red-check-20261123
      SOURCE_SHA: aec9cf8fbb16cf9e193c79592879c07ef727cbb5
      SOURCE_TREE: 68fa017934c14d46967ef50c096b4570e19cbbb3
      EXECUTOR_SHA: 706e3ff4035a87a43e60fdd87b2923c670ae8a1a
      EXECUTOR_TREE: eb4fa9dd9a8f49da35eb3b345ed23d3cbe98e3b3
      SERVICE_SHA: db8a11f8514ea611b0c585a4b3729c6adc56df81
      SERVICE_TREE: 1f503f8bbab23ad42fa6aeb835c727b506e74571
      BASE_SHA: 84a968455a5befd9fa9770a8e02258a134121ba7
      BASE_TREE: f3559fee4c671a42e441c9fd775ff85d9a14a781
      LOCK_SHA256: 7220693670750b775de6b4a4380101ff86165c976e4b520b9ac7037ac2b5e40c
      TOOLCHAIN_SHA256: d13306be0ecda81ce779baa290ffb417380d525928477f16200884b5169cca33
      EXECUTOR_SELECTOR: runner::broker::executor::journal::tests::cancelled_recovery_tests::resumed_terminal_worker_reconciles_cleanup_only_for_its_observed_container
      SERVICE_SELECTOR: broker::service::server::full_owner_tests::acknowledged_result_and_scan_leave_recovery_eligible_until_cleanup_is_confirmed
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '0'
      RUST_MIN_STACK: '8388608'
      LC_ALL: C
    steps:
      - name: Checkout the exact workflow and source ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Build one library test executable and classify both REDs
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-terminal-cleanup-red.txt"
          scratch=""
          result=FAIL
          {
            printf 'schema=1\nprofile=default_mysql_storage\nscope=synthetic_fixture_library_tests\n'
            printf 'source_sha=%s\nsource_tree=%s\nexecutor_sha=%s\nexecutor_tree=%s\nservice_sha=%s\nservice_tree=%s\nbase_sha=%s\nbase_tree=%s\n' \
              "$SOURCE_SHA" "$SOURCE_TREE" "$EXECUTOR_SHA" "$EXECUTOR_TREE" "$SERVICE_SHA" "$SERVICE_TREE" "$BASE_SHA" "$BASE_TREE"
            printf 'executor_selector=%s\nservice_selector=%s\n' "$EXECUTOR_SELECTOR" "$SERVICE_SELECTOR"
            printf 'workflow_sha=unknown\nworkflow_tree=unknown\nsource_guard=NOT_RUN\nshallow_guard=NOT_RUN\nlock_guard=NOT_RUN\ntoolchain_guard=NOT_RUN\ndisk_guard=NOT_RUN\n'
            printf 'fetch_exit=NOT_RUN\nbuild_exit=NOT_RUN\nlibtest_guard=NOT_RUN\nlibtest_sha256=unknown\n'
            printf 'executor_exit=NOT_RUN\nexecutor_selection=NOT_RUN\nexecutor_assertion=NOT_RUN\nexecutor_result=NOT_RUN\n'
            printf 'service_exit=NOT_RUN\nservice_selection=NOT_RUN\nservice_assertion=NOT_RUN\nservice_result=NOT_RUN\nscratch_cleanup=NOT_RUN\nresult=NOT_RUN\n'
          } > "$receipt"

          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.next" &&
              mv -- "$receipt.next" "$receipt"
          }

          finish() {
            local code=$?
            trap - EXIT
            set +e
            if [[ -n "$scratch" ]]; then
              if [[ "$scratch" == /tmp/g09-red.* ]] && rm -rf -- "$scratch" >/dev/null 2>&1 && [[ ! -e "$scratch" ]]; then
                set_field scratch_cleanup PASS
              else
                set_field scratch_cleanup FAIL
                result=FAIL
                code=1
              fi
            fi
            set_field result "$result" || code=1
            grep -E '^(source_guard|shallow_guard|lock_guard|toolchain_guard|disk_guard|fetch_exit|build_exit|libtest_guard|executor_(selection|exit|assertion|result)|service_(selection|exit|assertion|result)|scratch_cleanup|result)=' \
              "$receipt" >> "$GITHUB_STEP_SUMMARY" || code=1
            exit "$code"
          }
          trap finish EXIT

          verify_source() {
            local workflow=.github/workflows/lot-verify.yaml
            [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
              "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
              "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/$workflow@$GITHUB_REF" &&
              "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ &&
              "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
              "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" &&
              "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
              "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == "$workflow" &&
              "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
              "$(git show -s --format=%P "$SOURCE_SHA" 2>/dev/null)" == "$EXECUTOR_SHA $SERVICE_SHA" &&
              "$(git rev-parse "$EXECUTOR_SHA^{tree}" 2>/dev/null)" == "$EXECUTOR_TREE" &&
              "$(git rev-parse "$SERVICE_SHA^{tree}" 2>/dev/null)" == "$SERVICE_TREE" &&
              "$(git show -s --format=%P "$EXECUTOR_SHA" 2>/dev/null)" == "$BASE_SHA" &&
              "$(git show -s --format=%P "$SERVICE_SHA" 2>/dev/null)" == "$BASE_SHA" &&
              "$(git rev-parse "$BASE_SHA^{tree}" 2>/dev/null)" == "$BASE_TREE" ]]
          }

          verify_shallow() {
            local shallow_file
            shallow_file="$(git rev-parse --git-path shallow 2>/dev/null)" || return 1
            [[ "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
              -f "$shallow_file" && "$(< "$shallow_file")" == "$BASE_SHA" ]]
          }

          if verify_shallow; then set_field shallow_guard PASS; else set_field shallow_guard FAIL; exit 1; fi
          if verify_source; then set_field source_guard PASS; else set_field source_guard FAIL; exit 1; fi
          set_field workflow_sha "$GITHUB_SHA"
          set_field workflow_tree "$(git rev-parse HEAD^{tree})"

          if [[ "$(sha256sum Cargo.lock | cut -d ' ' -f 1)" == "$LOCK_SHA256" &&
                "$(sha256sum rust-toolchain.toml | cut -d ' ' -f 1)" == "$TOOLCHAIN_SHA256" ]]; then
            set_field lock_guard PASS
          else
            set_field lock_guard FAIL
            exit 1
          fi
          rustc_version="$(rustc --version 2>/dev/null)" || rustc_version=''
          cargo_version="$(cargo --version 2>/dev/null)" || cargo_version=''
          if [[ "$rustc_version" =~ ^rustc[[:space:]]1\.99\.1([[:space:]]|$) &&
                "$cargo_version" =~ ^cargo[[:space:]]1\.99\.1([[:space:]]|$) ]]; then
            set_field toolchain_guard PASS
          else
            set_field toolchain_guard FAIL
            exit 1
          fi
          free_kib="$(df -Pk /tmp | awk 'NR == 2 { print $4 }')"
          if [[ "$free_kib" =~ ^[0-9]+$ ]] && (( free_kib >= 5242880 )); then
            set_field disk_guard PASS
          else
            set_field disk_guard FAIL
            exit 1
          fi

          scratch="$(mktemp -d /tmp/g09-red.XXXXXX)"
          mkdir -m 700 -- "$scratch/tmp"
          export TMPDIR="$scratch/tmp" CARGO_TARGET_DIR="$scratch/target" AI_GUARD_BUILD_REVISION="$SOURCE_SHA"
          fetch_exit=0
          timeout --kill-after=10s 20m cargo fetch --locked > "$scratch/fetch.log" 2>&1 || fetch_exit=$?
          set_field fetch_exit "$fetch_exit"
          (( fetch_exit == 0 ))

          build_exit=0
          timeout --kill-after=10s 35m cargo test --locked --offline --lib --no-run --message-format=json \
            > "$scratch/build.jsonl" 2> "$scratch/build.stderr" || build_exit=$?
          set_field build_exit "$build_exit"
          (( build_exit == 0 ))
          if ! libtest="$(jq -ers '
            [.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and
              .target.kind == ["lib"] and .profile.test == true and (.features | index("mysql-storage") != null) and
              (.executable | type == "string")) | .executable]
            | if length == 1 then .[0] else empty end
          ' "$scratch/build.jsonl" 2>/dev/null)" ||
             [[ "$libtest" != "$scratch/target/debug/deps/agentsandbox-"* || ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            set_field libtest_guard FAIL
            exit 1
          fi
          set_field libtest_guard PASS
          set_field libtest_sha256 "$(sha256sum "$libtest" | cut -d ' ' -f 1)"

          confirmed=0
          exercise_red() {
            local key=$1 selector=$2 location=$3 assertion=$4 left=$5 right=$6
            local log="$scratch/$key.log" code=0 status
            timeout --kill-after=10s 2m "$libtest" "$selector" --exact --test-threads=1 --color=never > "$log" 2>&1 || code=$?
            set_field "${key}_exit" "$code"
            if [[ "$code" == 124 || "$code" == 137 ]]; then
              status=TIMED_OUT
            elif [[ "$(grep -Fxc 'running 1 test' "$log" || true)" != 1 ]] ||
                 [[ "$(grep -Fxc -e "test $selector ... FAILED" -e "test $selector ... ok" "$log" || true)" != 1 ]]; then
              set_field "${key}_selection" FAIL
              status=SELECTOR_UNVERIFIED
            else
              set_field "${key}_selection" PASS
              if (( code == 101 )) &&
                 [[ "$(grep -Fxc "test $selector ... FAILED" "$log" || true)" == 1 &&
                    "$(grep -Ecx '^test result: FAILED\. 0 passed; 1 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s$' "$log" || true)" == 1 ]] &&
                 awk -v heading="---- $selector stdout ----" -v location="$location:" \
                     -v assertion="$assertion" -v left="$left" -v right="$right" '
                   $0 == heading { within = 1; next }
                   within && / panicked at / && substr($0, length($0) - length(location) + 1) == location {
                     if (getline && $0 == assertion && getline && $0 == "  left: " left && getline && $0 == " right: " right) hits++
                     within = 0
                   }
                   END { exit(hits != 1) }
                 ' "$log"; then
                set_field "${key}_assertion" MATCHED
                status=RED_CONFIRMED
                (( confirmed += 1 ))
              elif (( code == 0 )) &&
                   [[ "$(grep -Fxc "test $selector ... ok" "$log" || true)" == 1 &&
                      "$(grep -Ecx '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s$' "$log" || true)" == 1 ]]; then
                status=UNEXPECTED_PASS
              else
                set_field "${key}_assertion" MISMATCH
                status=UNEXPECTED_FAILURE
              fi
            fi
            set_field "${key}_result" "$status"
          }
          assertion='assertion `left == right` failed'
          exercise_red executor "$EXECUTOR_SELECTOR" \
            'src/runner/broker/executor/cancelled_recovery_tests.rs:48:5' \
            "$assertion" 'Some(false)' 'Some(true)'
          exercise_red service "$SERVICE_SELECTOR" \
            'src/broker/service/full_owner_tests.rs:336:5' \
            "$assertion: only the confirmed removal settles the completed worker's remaining cleanup" \
            '[false, false, false]' '[true, true, false]'
          if (( confirmed == 2 )); then result=EXPECTED_RED; else exit 1; fi

      - name: Upload the closed RED receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-terminal-cleanup-red-${{ github.sha }}
          path: ${{ runner.temp }}/g09-terminal-cleanup-red.txt
          if-no-files-found: error
          retention-days: 14
