name: G09 Linux rootful Docker broker recovery

on:
  push:
    branches: ['claude/v1-g09-linux-rootful-broker-recovery-check-20261122']

permissions:
  contents: read

concurrency:
  group: g09-linux-rootful-broker-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AI_GUARD_BUILD_REVISION: 4b6ae87a712f782e28e035432967c0bed270e0fc
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Initialize a closed receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          printf 'source_sha=4b6ae87a712f782e28e035432967c0bed270e0fc\nsource_parent_1=bbe39996997332a8c6aed7a8551c45258abb8100\nsource_parent_2=076d69add0efcae7f9870630a47c110bc89373c2\nworkflow_sha=%s\nworkflow_parent_sha=unknown\nselector=broker_sigkill_preserves_original_deadline_without_second_start\nworker_scope=one\nworker_command=/bin/sleep\nworker_network=none\nmode=linux-x86_64-rootful-docker-unix:///var/run/docker.sock\nsource_check=NOT_RUN\nworkflow_check=NOT_RUN\nrootful_preflight=NOT_RUN\nworker_image_uid=NOT_RUN\nworker_image_id_sha256=unknown\nworker_image_tag_retained=NOT_RUN\nbuild_no_run=NOT_RUN\ntest_verdict=NOT_RUN\ntest_selected=unknown\ntest_passed=unknown\ntest_failed=unknown\ntest_ignored=unknown\ntest_exit=unknown\nfixture_init=NOT_ATTESTED\nworker_running=NOT_ATTESTED\nbroker_sigkill=NOT_ATTESTED\nworker_stopped=NOT_ATTESTED\nbroker_recovery=NOT_ATTESTED\ncontainers_before=unknown\ncontainers_after=unknown\ncontainers_new=unknown\nvolumes_before=unknown\nvolumes_after=unknown\nvolumes_new=unknown\nfixture_resources=NOT_CREATED\nworkflow_engine_cleanup=NOT_PERFORMED\nreceipt_closed=NOT_CLOSED\nlast_phase=initialized\n' "$WORKFLOW_SHA" > "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify exact merge source and one-file child
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source=4b6ae87a712f782e28e035432967c0bed270e0fc
          parent_1=bbe39996997332a8c6aed7a8551c45258abb8100
          parent_2=076d69add0efcae7f9870630a47c110bc89373c2
          selector=broker_sigkill_preserves_original_deadline_without_second_start
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g09-linux-rootful-broker-recovery-check-20261122 &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git rev-parse HEAD^)" == "$source" &&
                "$(git rev-parse "$source^1")" == "$parent_1" && "$(git rev-parse "$source^2")" == "$parent_2" &&
                "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             grep -Fq "async fn $selector() -> Result<()>" tests/broker_runtime.rs &&
             grep -Fq '#[ignore = "requires explicit Docker program/Unix endpoint/image/rootful opt-in; retains enforcer and QA resources"]' tests/broker_runtime.rs &&
             grep -Fq 'let argv = vec!["/bin/sleep".into(), sleep_seconds.to_string()];' tests/broker_runtime.rs &&
             grep -Fq '"network":"none"' tests/broker_runtime.rs &&
             grep -Fq 'broker.kill_owned()?' tests/broker_runtime.rs &&
             grep -Fq 'killed_status.signal() == Some(libc::SIGKILL)' tests/broker_runtime.rs &&
             grep -Fq 'restart_same_broker_and_registry' tests/broker_runtime.rs; then
            set_field workflow_parent_sha "$source"
            set_field source_check PASS
            set_field workflow_check PASS
            set_field last_phase source_verified
          else
            set_field source_check FAIL
            set_field workflow_check FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Prepare private short TMPDIR
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=private_tmp_prepare/' "$receipt"
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$private"
          canonical=$(realpath -- "$private")
          [[ "$canonical" == "$private" && ${#canonical} -le 80 ]]
          [[ "$(stat -c '%a' "$private")" == 700 ]]
          mkdir -m 700 "$private/tmp"
          [[ "$(realpath -- "$private/tmp")" == "$private/tmp" && "$(stat -c '%a' "$private/tmp")" == 700 ]]
          printf 'G09_PRIVATE=%s\nTMPDIR=%s\n' "$private" "$private/tmp" >> "$GITHUB_ENV"

      - name: Verify local rootful Docker and inventory existing resources
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rootful_docker_preflight
          endpoint=$(docker context inspect --format '{{.Endpoints.docker.Host}}' default)
          security=$(docker info --format '{{json .SecurityOptions}}')
          server_platform=$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')
          private="$G09_PRIVATE"
          if test -S /var/run/docker.sock &&
             [[ "$endpoint" == unix:///var/run/docker.sock && "$server_platform" == linux/amd64 ]] &&
             jq -e 'all(.[]; (ascii_downcase | contains("rootless")) | not)' <<< "$security" >/dev/null; then
            docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.before"
            docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.before"
            set_field containers_before "$(wc -l < "$private/containers.before" | tr -d ' ')"
            set_field volumes_before "$(wc -l < "$private/volumes.before" | tr -d ' ')"
            set_field rootful_preflight PASS
            set_field last_phase rootful_preflight_complete
          else
            set_field rootful_preflight FAIL
            set_field last_phase rootful_mode_verification
            exit 1
          fi

      - name: Build immutable UID 1000 worker image without providers
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          tag="ai-guard-g09-broker-recovery:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$tag" > "$G09_PRIVATE/image.tag"
          set_field last_phase worker_image_build
          if docker build --file images/worker.Dockerfile --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= --tag "$tag" . > "$G09_PRIVATE/worker-build.log" 2>&1; then
            worker_id=$(docker image inspect --format '{{.Id}}' "$tag")
            [[ "$worker_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$(docker image inspect --format '{{.Config.User}}' "$worker_id")" == 1000:1000 ]]
            [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$worker_id")" == linux/amd64 ]]
            printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_ALLOW_ROOTFUL=1\nAGENTSANDBOX_TEST_RETAIN_ENFORCER=1\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=unix:///var/run/docker.sock\nAGENTSANDBOX_TEST_IMAGE=%s\nAGENTSANDBOX_TEST_BROKER_NATIVE_START=1\nAGENTSANDBOX_TEST_BROKER_TIMEOUT_SECONDS=30\n' "$worker_id" >> "$GITHUB_ENV"
            printf '%s\n' "$worker_id" > "$G09_PRIVATE/image.id"
            set_field worker_image_uid PASS
            set_field worker_image_id_sha256 "${worker_id#sha256:}"
            set_field worker_image_tag_retained YES_EPHEMERAL_RUNNER
            set_field last_phase worker_image_verified
          else
            set_field worker_image_uid FAIL
            set_field last_phase worker_image_build_failed
            exit 1
          fi

      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          sed -i 's/^last_phase=.*/last_phase=dependency_fetch/' "$receipt"
          if cargo fetch --locked > "$G09_PRIVATE/fetch.log" 2>&1; then
            sed -i 's/^last_phase=.*/last_phase=dependencies_fetched/' "$receipt"
          else
            rc=$?
            sed -i "s/^last_phase=.*/last_phase=dependency_fetch_failed_exit_${rc}/" "$receipt"
            exit "$rc"
          fi

      - name: Compile the natural CLI and one libtest without running tests
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase libtest_no_run
          if cargo test --locked --offline --test broker_runtime --no-run --message-format=json > "$G09_PRIVATE/build.jsonl" 2> "$G09_PRIVATE/build.stderr"; then
            libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "broker_runtime" and .target.kind == ["test"] and .profile.test == true and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl")
            cli=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["bin"] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$G09_PRIVATE/build.jsonl")
            [[ -x "$libtest" && -x "$cli" ]]
            printf '%s\n' "$(sha256sum "$libtest" | awk '{print $1}')" > "$G09_PRIVATE/libtest.sha256"
            printf '%s\n' "$(sha256sum "$cli" | awk '{print $1}')" > "$G09_PRIVATE/cli.sha256"
            set_field build_no_run PASS
            set_field build_test_sha256 "$(<"$G09_PRIVATE/libtest.sha256")"
            set_field build_cli_sha256 "$(<"$G09_PRIVATE/cli.sha256")"
            set_field last_phase compiled_no_run
          else
            set_field build_no_run FAIL
            set_field last_phase no_run_build_failed
            exit 1
          fi

      - name: Run only the exact ignored broker-loss recovery test
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          selector=broker_sigkill_preserves_original_deadline_without_second_start
          log="$G09_PRIVATE/test.log"
          set_field last_phase targeted_runtime_test
          if cargo test --locked --offline --test broker_runtime "$selector" -- --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1; then rc=0; else rc=$?; fi
          selected=0; passed=0; failed=0; ignored=0
          grep -Fqx 'running 1 test' "$log" && selected=1 || true
          grep -Fqx "test $selector ... ok" "$log" && { selected=1; passed=1; } || true
          grep -Fqx "test $selector ... FAILED" "$log" && { selected=1; failed=1; } || true
          summary=$(grep -E '^test result:' "$log" | tail -n 1 | sed -E 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/' || true)
          if [[ "$summary" =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then read -r passed failed ignored <<< "$summary"; fi
          if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then verdict=PASS; phase=broker_recovery_test_complete; else verdict=FAIL; phase=broker_recovery_test_failed_or_unconfirmed; fi
          set_field test_verdict "$verdict"
          set_field test_selected "$selected"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"

          evidence_root=$(sed -n 's/^retained broker runtime evidence: //p' "$log" | tail -n 1 || true)
          if [[ "$evidence_root" =~ ^/tmp/br-[[:alnum:]]{6}$ ]] && [[ -d "$evidence_root" && "$(realpath -- "$evidence_root")" == "$evidence_root" ]]; then
            if [[ -f "$evidence_root/preflight.json" ]] && jq -e '.allow_rootful == true and .native_start == true and .timeout_seconds == 30 and .endpoint == "unix:///var/run/docker.sock" and .image.os == "linux"' "$evidence_root/preflight.json" >/dev/null; then set_field fixture_init ATTESTED; fi
            if [[ -f "$evidence_root/docker-running.json" ]] && jq -e '.running == true and .network == "none" and .privileged == false and .restarts == 0' "$evidence_root/docker-running.json" >/dev/null && [[ -f "$evidence_root/worker.json" ]]; then set_field worker_running ATTESTED; fi
            if [[ -f "$evidence_root/broker-killed.json" ]] && jq -e '.signal == 9' "$evidence_root/broker-killed.json" >/dev/null; then set_field broker_sigkill ATTESTED; fi
            if [[ -f "$evidence_root/docker-terminal-observed.json" ]] && jq -e '.running == false and (.status == "exited" or .status == "dead") and .exit_code == 137 and .oom_killed == false' "$evidence_root/docker-terminal-observed.json" >/dev/null; then set_field worker_stopped ATTESTED; fi
            if [[ -f "$evidence_root/recovery-after.json" && -f "$evidence_root/reconciled.json" && -f "$evidence_root/docker-broker-worker-events.json" ]] && jq -e '.runtime_test == "PASS"' "$evidence_root/result.json" >/dev/null 2>&1; then set_field broker_recovery ATTESTED; fi
            set_field fixture_resources RETAINED_PRIVATE_EVIDENCE_AND_GUARD
          fi
          set_field last_phase "$phase"
          [[ "$verdict" == PASS ]]

      - name: Record read-only resource inventory without cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g09-rootful-broker-recovery-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          private="$RUNNER_TEMP/g9-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set_field workflow_engine_cleanup INVENTORY_UNAVAILABLE
          if [[ -d "$private" && -f "$private/containers.before" && -f "$private/volumes.before" ]] && docker info >/dev/null 2>&1; then
            if docker container ls -aq --no-trunc | LC_ALL=C sort -u > "$private/containers.after" &&
               docker volume ls -q | LC_ALL=C sort -u > "$private/volumes.after" &&
               comm -13 "$private/containers.before" "$private/containers.after" > "$private/containers.new" &&
               comm -13 "$private/volumes.before" "$private/volumes.after" > "$private/volumes.new"; then
              set_field containers_after "$(wc -l < "$private/containers.after" | tr -d ' ')"
              set_field containers_new "$(wc -l < "$private/containers.new" | tr -d ' ')"
              set_field volumes_after "$(wc -l < "$private/volumes.after" | tr -d ' ')"
              set_field volumes_new "$(wc -l < "$private/volumes.new" | tr -d ' ')"
              set_field workflow_engine_cleanup NOT_PERFORMED
            fi
          fi
          set_field receipt_closed YES

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g09-linux-rootful-broker-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/g09-rootful-broker-recovery-receipt.txt
          if-no-files-found: error
          retention-days: 14
