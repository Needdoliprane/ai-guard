name: G11 scoped relay terminal observation canary

# One synthetic loopback relay fixture and one exact selector. No provider or
# external engine is called; the receipt contains only closed observations.
on:
  push:
    branches:
      - claude/v1-g11-relay-terminal-observation-check-20261122

permissions:
  contents: read

concurrency:
  group: g11-relay-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-relay-terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      AI_GUARD_BUILD_REVISION: '162ae44f4c9ea3dfbe9bdf422a1e5422db9f28ce'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Initialize closed relay receipt
        shell: bash
        run: |
          umask 077
          cat > g11-relay-terminal-receipt.txt <<'EOF'
          candidate_source=162ae44f4c9ea3dfbe9bdf422a1e5422db9f28ce
          workflow_ref_guard=NOT_RUN
          workflow_sha_negative=NOT_RUN
          source_checkout=NOT_RUN
          rustc_version=NOT_RUN
          dependency_fetch=NOT_RUN
          compile_exit_code=NOT_RUN
          test_fqn=software_broker_scoped_relay_ipc_refuses_before_private_detail
          test_inventory=NOT_RUN
          selected=NOT_RUN
          passed=NOT_RUN
          failed=NOT_RUN
          ignored=NOT_RUN
          test_exit_code=NOT_RUN
          test_result=NOT_RUN
          terminal_a_phase=unknown
          terminal_a_wait=unknown
          terminal_a_store=unknown
          terminal_a_state=unknown
          terminal_a_quota_held=unknown
          terminal_a_same_attempt=unknown
          terminal_a_witness=unknown
          scope=single synthetic loopback relay fixture; no provider or external engine
          EOF
          chmod 600 g11-relay-terminal-receipt.txt

      - name: Guard workflow commit and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          receipt=g11-relay-terminal-receipt.txt
          expected_source=162ae44f4c9ea3dfbe9bdf422a1e5422db9f28ce
          expected_ref=refs/heads/claude/v1-g11-relay-terminal-observation-check-20261122
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          verify_workflow_sha() {
            local candidate="$1" parent changed
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || return 1
            parent="$(git rev-parse "$candidate^" 2>/dev/null)" || return 1
            [[ "$parent" == "$expected_source" ]] || return 1
            changed="$(git diff-tree --no-commit-id --name-only -r "$candidate" 2>/dev/null)" || return 1
            [[ "$changed" == '.github/workflows/lot-verify.yaml' ]]
          }
          actual_head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" != "$expected_ref" || "$actual_head" != "$GITHUB_SHA" ]] \
              || ! verify_workflow_sha "$GITHUB_SHA"; then
            set_receipt workflow_ref_guard FAIL
            echo 'Workflow ref/source guard failed; details omitted.' >&2
            exit 1
          fi
          if verify_workflow_sha "$expected_source"; then
            set_receipt workflow_sha_negative FAIL
            echo 'Workflow SHA guard accepted the candidate commit.' >&2
            exit 1
          fi
          set_receipt workflow_sha_negative REJECTED
          git checkout --detach "$expected_source" >/dev/null 2>&1
          [[ "$(git rev-parse HEAD)" == "$expected_source" ]]
          set_receipt source_checkout PASS
          set_receipt workflow_ref_guard PASS

      - name: Fetch, compile one relay target and run one exact selector
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          receipt="$GITHUB_WORKSPACE/g11-relay-terminal-receipt.txt"
          scratch="$(mktemp -d "$RUNNER_TEMP/g11-relay.XXXXXX")"
          chmod 700 "$scratch"
          trap 'rm -rf "$scratch"' EXIT
          source_sha=162ae44f4c9ea3dfbe9bdf422a1e5422db9f28ce
          selector=software_broker_scoped_relay_ipc_refuses_before_private_detail
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            mv "$receipt.tmp" "$receipt"
          }
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            set_receipt source_checkout FAIL
            echo 'Pinned source checkout failed; details omitted.' >&2
            exit 1
          fi
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]]; then
            set_receipt rustc_version 1.99.1
          else
            set_receipt rustc_version MISMATCH
            exit 1
          fi
          if cargo fetch --locked > "$scratch/fetch.stdout" 2> "$scratch/fetch.stderr"; then
            set_receipt dependency_fetch PASS
          else
            set_receipt dependency_fetch FAIL
            exit 1
          fi

          build_json="$scratch/broker-relay-handoff.jsonl"
          build_rc=0
          cargo test --locked --offline --no-default-features --test broker_relay_handoff \
            --no-run --message-format=json > "$build_json" 2> "$scratch/build.stderr" || build_rc=$?
          set_receipt compile_exit_code "$build_rc"
          if (( build_rc != 0 )); then
            set_receipt test_inventory NOT_RUN
            echo 'Single relay target compilation failed; raw output omitted.' >&2
            exit 1
          fi

          test_bin="$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "broker_relay_handoff" and .target.kind == ["test"]
              and .profile.test == true and .features == [] and .executable != null)
              | .executable] | unique | if length == 1 then .[0] else empty end' "$build_json" 2>/dev/null || true)"
          if [[ ! -x "$test_bin" ]]; then
            set_receipt test_inventory FAIL
            exit 1
          fi
          test_list="$scratch/test-list.txt"
          if "$test_bin" --list > "$test_list" 2> "$scratch/list.stderr" \
              && [[ "$(grep -Fxc "$selector: test" "$test_list" || true)" == 1 ]]; then
            set_receipt test_inventory PASS
          else
            set_receipt test_inventory FAIL
            exit 1
          fi

          test_log="$scratch/selector.log"
          test_rc=0
          timeout --kill-after=5s 180s "$test_bin" "$selector" --exact --test-threads=1 --color=never \
            > "$test_log" 2>&1 || test_rc=$?
          selected="$(grep -Fxc 'running 1 test' "$test_log" || true)"
          counts="$(sed -nE 's/^test result: [^ ]+\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/p' "$test_log" | tail -n 1)"
          passed=unknown
          failed=unknown
          ignored=unknown
          if [[ -n "$counts" ]]; then read -r passed failed ignored <<< "$counts"; fi
          set_receipt selected "${selected:-0}"
          set_receipt passed "$passed"
          set_receipt failed "$failed"
          set_receipt ignored "$ignored"
          set_receipt test_exit_code "$test_rc"
          result_ok=0
          if (( test_rc == 0 )) && [[ "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]] \
              && grep -Fqx "test $selector ... ok" "$test_log" \
              && grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$test_log"; then
            result_ok=1
            set_receipt test_result PASS
          else
            set_receipt test_result FAIL
          fi

          # Parse only one exact, source-defined marker after an exact selection
          # returned failure. Never copy raw test output into the receipt.
          if (( result_ok == 0 )) && [[ "$selected" == 1 ]]; then
            marker_count="$(grep -c '^g11_relay_terminal_a' "$test_log" || true)"
            if [[ "$marker_count" == 1 ]]; then
              marker="$(grep -E '^g11_relay_terminal_a wait=(timeout|read_failed) store=' "$test_log")"
              if [[ "$marker" =~ ^g11_relay_terminal_a[[:space:]]wait=(timeout|read_failed)[[:space:]]store=present[[:space:]]state=([A-Za-z]+)[[:space:]]quota_held=(true|false)[[:space:]]same_attempt=(true|false)[[:space:]]witness=(created|running|terminal|absent|unknown)$ ]]; then
                state="${BASH_REMATCH[2]}"
                case "$state" in Reserved|Preparing|Created|StartIssued|Running|Stopping|Terminal|InDoubt|Cancelled) ;; *) state=unknown ;; esac
                set_receipt terminal_a_phase wait_failed
                set_receipt terminal_a_wait "${BASH_REMATCH[1]}"
                set_receipt terminal_a_store present
                set_receipt terminal_a_state "$state"
                set_receipt terminal_a_quota_held "${BASH_REMATCH[3]}"
                set_receipt terminal_a_same_attempt "${BASH_REMATCH[4]}"
                set_receipt terminal_a_witness "${BASH_REMATCH[5]}"
              elif [[ "$marker" =~ ^g11_relay_terminal_a[[:space:]]wait=(timeout|read_failed)[[:space:]]store=(absent|error|unknown)[[:space:]]witness=unknown$ ]]; then
                set_receipt terminal_a_phase wait_failed
                set_receipt terminal_a_wait "${BASH_REMATCH[1]}"
                set_receipt terminal_a_store "${BASH_REMATCH[2]}"
                set_receipt terminal_a_witness unknown
              fi
            fi
          fi
          if (( result_ok == 0 )); then
            echo 'Exact relay selector failed; only closed counts and a validated synthetic marker are retained.' >&2
            exit 1
          fi

      - name: Add closed relay receipt to run summary
        if: always()
        shell: bash
        run: |
          if [[ -f g11-relay-terminal-receipt.txt ]]; then
            {
              echo '### G11 scoped relay terminal observation canary'
              echo
              echo '```text'
              cat g11-relay-terminal-receipt.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload closed relay receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g11-relay-terminal-${{ github.sha }}
          path: g11-relay-terminal-receipt.txt
          if-no-files-found: warn
          retention-days: 14
