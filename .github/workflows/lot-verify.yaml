name: G08 pre-implementation membership route discriminator

# One exact, local synthetic RED oracle. It verifies the pre-implementation
# response to the valid BFF POST; it does not exercise a provider or engine.
on:
  push:
    branches:
      - claude/v1-g08-membership-red-discriminator-check-20261123

permissions:
  contents: read

concurrency:
  group: g08-membership-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-implementation-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SOURCE_SHA: 2edb3211d143a6729ca3cfbe07369602bf3f89ff
      SOURCE_TREE: ffb15cb3d7608545734671bab8426fdbf207dd3b
      SOURCE_PARENT: d0a2cbed1c46a7c550bbb3e978be9a8983162e4f
      SOURCE_PARENT_TREE: 0a08888593b2f3be95485159df3deddb05fd6d0c
      SOURCE_REVIEW_TEST_SHA: d969f6333ad6a4400e0ee5ae7a138c624dcea049
      SOURCE_REVIEW_TEST_TREE: 996783b1993fa5c79af633743381eec6cdcae2b5
      SOURCE_PROFILE_TEST_SHA: 9043f80b0e83119d0cbe2f983146e22705a5535a
      SOURCE_BODY_IMPL_SHA: 9524c67bffc4d203f2d362ea82fd53151eebe7f4
      SOURCE_BODY_TEST_SHA: 6ee930ccceabf10ca82a9afe4f55f14bc14c6605
      SOURCE_PREVIOUS_GREEN_SHA: 2820359d6fe9330baad820e39439045c21b37e1e
      SOURCE_PREVIOUS_GREEN_TREE: 5bc37fc250ab48712872f9526f4e2e2bb70681a6
      SOURCE_PRODUCT_SHA: 928ff1387946b83a45da80d63914a658ed14b463
      SOURCE_PRODUCT_TREE: d1f450d9c80eee464c48c4b0a36e093df9478a3d
      SOURCE_RED_SHA: aa4d3dc5bef2d54492767b99ffafc5ec17b276c1
      SOURCE_RED_TREE: 291acea0b3f6676e8522a98b1b8bf5ca7301eb64
      SOURCE_RED_PARENT: de4abcdeb5677729a072df479939543e9a4dcfc3
      SOURCE_RED_PARENT_TREE: 2d3d42755f760acdac512810e4bf7d85be8811c6
      SOURCE_BASE_SHA: 881c7da73dc438d978beb01049cfe1e7464abd00
      SOURCE_BASE_TREE: 76f98d4740fe7aa8c91943e760ed9ea701c68d52
      LOCK_SHA: 05847a300405860df8f860d5dc1c39ca423dfa0d
      EXPECTED_BRANCH: claude/v1-g08-membership-red-discriminator-check-20261123
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'
    steps:
      - name: Initialize closed RED discriminator receipt
        shell: bash
        run: |
          umask 077
          receipt="$RUNNER_TEMP/g08-membership-red-receipt.txt"
          cat > "$receipt" <<'EOF'
          source_sha=2edb3211d143a6729ca3cfbe07369602bf3f89ff
          source_tree=ffb15cb3d7608545734671bab8426fdbf207dd3b
          red_oracle_sha=aa4d3dc5bef2d54492767b99ffafc5ec17b276c1
          workflow_sha=NOT_RUN
          source_guard=NOT_RUN
          checkout_shallow=NOT_RUN
          toolchain=NOT_RUN
          dependency_fetch=NOT_RUN
          red_build=NOT_RUN
          red_libtest_sha256=unknown
          red_selector=NOT_RUN
          selected=0
          actual_status=unknown
          expected_status=200
          failure_phase=unknown
          red_classification=NOT_RUN
          upstream_fixture=synthetic_loopback
          raw_output_retained=no
          private_cleanup=NOT_RUN
          last_phase=NOT_RUN
          result=NOT_RUN
          scope=one exact valid POST status assertion against the pre-implementation route; no provider, engine, external service, or real tenant
          EOF
          chmod 600 "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 12

      - name: Build and classify the single synthetic RED selector
        id: verify
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g08-membership-red-receipt.txt"
          private_root=
          phase=source_guard
          result=FAIL
          set_receipt() {
            awk -F= -v key="$1" -v value="$2" '$1 == key { $0 = key "=" value } { print }' "$receipt" > "$receipt.tmp"
            chmod 600 "$receipt.tmp"
            mv -- "$receipt.tmp" "$receipt"
          }
          finish() {
            local code=$? cleanup_rc=0 final_phase
            trap - EXIT
            set +e
            if [[ -n "$private_root" && "$private_root" == /tmp/g08rd.* ]]; then
              rm -rf -- "$private_root" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$private_root" ]] || cleanup_rc=1
            fi
            case "$phase" in
              source_guard|toolchain|scratch_setup|dependency_fetch|red_compile|red_selector|complete)
                final_phase="$phase" ;;
              *) final_phase=unknown ;;
            esac
            if (( cleanup_rc != 0 )); then final_phase=private_cleanup; fi
            if (( cleanup_rc == 0 )); then set_receipt private_cleanup PASS; else set_receipt private_cleanup FAIL; fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; else result=FAIL; fi
            set_receipt last_phase "$final_phase"
            set_receipt result "$result"
            {
              printf 'G08 pre-implementation route discriminator=%s source=%s\n' "$result" "$SOURCE_SHA"
              printf 'selector=%s actual=%s expected=%s phase=%s cleanup=%s\n' \
                "$(awk -F= '$1=="red_classification"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="actual_status"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="expected_status"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="failure_phase"{print $2}' "$receipt")" \
                "$(awk -F= '$1=="private_cleanup"{print $2}' "$receipt")"
            } >> "$GITHUB_STEP_SUMMARY"
            if (( code == 0 && cleanup_rc != 0 )); then code=1; fi
            exit "$code"
          }
          trap finish EXIT

          set_receipt workflow_sha "$GITHUB_SHA"
          red_paths_expected=$'src/api/human_sources/journal_tests/dashboard.rs\nsrc/api/human_sources/journal_tests/owned_admin_reads.rs'
          source_paths_expected=$'src/api.rs\nsrc/api/human.rs\nsrc/api/human/admin.rs\nsrc/api/human_sources.rs\nsrc/api/human_sources/journal_tests.rs\nsrc/api/human_sources/journal_tests/dashboard.rs\nsrc/api/human_sources/journal_tests/owned_admin_reads.rs\nsrc/api/human_sources/tests.rs'
          red_paths_actual="$(git diff --name-only "$SOURCE_RED_PARENT" "$SOURCE_RED_SHA" 2>/dev/null | sort)"
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
             "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
             "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
             "$(git show -s --format=%P HEAD 2>/dev/null)" == "$SOURCE_SHA" &&
             "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true &&
             "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE" &&
             "$(git show -s --format=%P "$SOURCE_SHA" 2>/dev/null)" == "$SOURCE_PARENT" &&
             "$(git rev-parse "$SOURCE_PARENT^{tree}" 2>/dev/null)" == "$SOURCE_PARENT_TREE" &&
             "$(git show -s --format=%P "$SOURCE_PARENT" 2>/dev/null)" == "$SOURCE_REVIEW_TEST_SHA" &&
             "$(git rev-parse "$SOURCE_REVIEW_TEST_SHA^{tree}" 2>/dev/null)" == "$SOURCE_REVIEW_TEST_TREE" &&
             "$(git show -s --format=%P "$SOURCE_REVIEW_TEST_SHA" 2>/dev/null)" == "$SOURCE_PROFILE_TEST_SHA" &&
             "$(git show -s --format=%P "$SOURCE_PROFILE_TEST_SHA" 2>/dev/null)" == "$SOURCE_BODY_IMPL_SHA" &&
             "$(git show -s --format=%P "$SOURCE_BODY_IMPL_SHA" 2>/dev/null)" == "$SOURCE_BODY_TEST_SHA" &&
             "$(git show -s --format=%P "$SOURCE_BODY_TEST_SHA" 2>/dev/null)" == "$SOURCE_PREVIOUS_GREEN_SHA" &&
             "$(git rev-parse "$SOURCE_PREVIOUS_GREEN_SHA^{tree}" 2>/dev/null)" == "$SOURCE_PREVIOUS_GREEN_TREE" &&
             "$(git show -s --format=%P "$SOURCE_PREVIOUS_GREEN_SHA" 2>/dev/null)" == "$SOURCE_PRODUCT_SHA" &&
             "$(git rev-parse "$SOURCE_PRODUCT_SHA^{tree}" 2>/dev/null)" == "$SOURCE_PRODUCT_TREE" &&
             "$(git show -s --format=%P "$SOURCE_PRODUCT_SHA" 2>/dev/null)" == "$SOURCE_RED_SHA" &&
             "$(git rev-parse "$SOURCE_RED_SHA^{tree}" 2>/dev/null)" == "$SOURCE_RED_TREE" &&
             "$(git show -s --format=%P "$SOURCE_RED_SHA" 2>/dev/null)" == "$SOURCE_RED_PARENT" &&
             "$(git rev-parse "$SOURCE_RED_PARENT^{tree}" 2>/dev/null)" == "$SOURCE_RED_PARENT_TREE" &&
             "$(git show -s --format=%P "$SOURCE_RED_PARENT" 2>/dev/null)" == "$SOURCE_BASE_SHA" &&
             "$(git rev-parse "$SOURCE_BASE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_BASE_TREE" &&
             "$(git diff --name-only "$SOURCE_PREVIOUS_GREEN_SHA" "$SOURCE_SHA" 2>/dev/null | sort)" == "$source_paths_expected" &&
             "$(git rev-parse "$SOURCE_RED_SHA:Cargo.lock" 2>/dev/null)" == "$LOCK_SHA" &&
             "$(git rev-parse "$SOURCE_SHA:Cargo.lock" 2>/dev/null)" == "$LOCK_SHA" &&
             "$red_paths_actual" == "$red_paths_expected" &&
             "$(git diff --name-only "$SOURCE_RED_SHA" "$SOURCE_PRODUCT_SHA" 2>/dev/null | sort)" == $'src/api.rs\nsrc/api/human_sources.rs' &&
             "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
             "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" ]] || {
            set_receipt source_guard FAIL
            echo 'G08 source/ref guard failed; details omitted.' >&2
            exit 1
          }
          set_receipt source_guard PASS
          set_receipt checkout_shallow PASS

          phase=toolchain
          rustc_line="$(rustc --version 2>/dev/null || true)"
          [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) ]] || { set_receipt toolchain MISMATCH; exit 1; }
          set_receipt toolchain 1.99.1

          phase=scratch_setup
          private_root="$(mktemp -d /tmp/g08rd.XXXXXX)" || exit 1
          private_root="$(realpath -e "$private_root")" || exit 1
          chmod 700 "$private_root"
          mkdir -m 700 "$private_root/target" "$private_root/tmp"
          export TMPDIR="$private_root/tmp" CARGO_TARGET_DIR="$private_root/target"

          phase=dependency_fetch
          if cargo fetch --locked > "$private_root/fetch.log" 2>&1; then
            set_receipt dependency_fetch PASS
          else
            set_receipt dependency_fetch FAIL
            exit 1
          fi

          phase=red_compile
          if git switch --detach "$SOURCE_RED_SHA" >/dev/null 2>&1 &&
             AI_GUARD_BUILD_REVISION="$SOURCE_RED_SHA" timeout --kill-after=15s 45m \
               cargo test --locked --offline --no-default-features --lib --no-run --message-format=json \
               > "$private_root/red-build.jsonl" 2> "$private_root/red-build.stderr"; then
            red_libtest="$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox" and .target.kind == ["lib"] and .profile.test == true and .features == [] and .executable != null) | .executable] | unique | if length == 1 then .[0] else empty end' "$private_root/red-build.jsonl" 2>/dev/null || true)"
            [[ -n "$red_libtest" && -x "$red_libtest" ]] || { set_receipt red_build ARTIFACT_MISMATCH; exit 1; }
            set_receipt red_build PASS
            set_receipt red_libtest_sha256 "$(sha256sum "$red_libtest" | awk '{print $1}')"
          else
            set_receipt red_build FAIL
            exit 1
          fi

          phase=red_selector
          selector=api::human_sources::journal_tests::dashboard::owned_dashboard_relays_the_delegated_membership_change_and_gateway_receipt
          test_log="$private_root/red-test.log"
          test_rc=0
          timeout --kill-after=5s 300s "$red_libtest" "$selector" --exact --test-threads=1 > "$test_log" 2>&1 || test_rc=$?
          selected=0
          [[ "$(grep -Fxc 'running 1 test' "$test_log" || true)" == 1 ]] && selected=1 || true
          summary="$(grep -E '^test result: ' "$test_log" | tail -n 1 || true)"
          actual="$(sed -nE 's/^[[:space:]]*left: ([0-9]{3})([[:space:]].*)?$/\1/p' "$test_log" | head -n 1 || true)"
          expected="$(sed -nE 's/^[[:space:]]*right: ([0-9]{3})([[:space:]].*)?$/\1/p' "$test_log" | head -n 1 || true)"
          fail_line=0
          [[ "$(grep -Fxc "test $selector ... FAILED" "$test_log" || true)" == 1 ]] && fail_line=1 || true
          set_receipt selected "$selected"
          set_receipt actual_status "${actual:-unknown}"
          set_receipt expected_status "${expected:-unknown}"
          if [[ "$test_rc" != 0 && "$selected" == 1 && "$fail_line" == 1 && "$actual" =~ ^(404|405)$ && "$expected" == 200 &&
                "$summary" =~ ^test\ result:\ FAILED\.\ 0\ passed\;\ 1\ failed\;\ 0\ ignored\; ]]; then
            set_receipt failure_phase first_valid_post_status_assertion
            set_receipt red_classification PRE_IMPL_ROUTE_NOT_ACCEPTED
          else
            set_receipt failure_phase unknown
            set_receipt red_classification INCONCLUSIVE
            echo 'G08 RED discriminator did not match the closed expected response; details omitted.' >&2
            exit 1
          fi
          phase=complete

      - name: Upload only the closed RED receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g08-membership-red-${{ github.sha }}
          path: ${{ runner.temp }}/g08-membership-red-receipt.txt
          if-no-files-found: error
          retention-days: 14
