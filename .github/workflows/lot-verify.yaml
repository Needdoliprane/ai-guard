name: G03 Linux rootless export check

on:
  push:
    branches: ['claude/v1-g03-linux-rootless-apt-recheck-20261122']

permissions:
  contents: read

concurrency:
  group: g03-linux-rootless-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AI_GUARD_BUILD_REVISION: 72fa713f7c0295d9582fa4439e88e5250c4ac8b5
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Initialize a closed receipt
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          printf 'source_sha=72fa713f7c0295d9582fa4439e88e5250c4ac8b5\nselector=real_cli_copies_a_project_and_exports_after_one_audited_worker\nworkflow_sha=%s\nworkflow_parent_sha=72fa713f7c0295d9582fa4439e88e5250c4ac8b5\nsource_check=NOT_RUN\nworkflow_check=NOT_RUN\nrootless_prerequisite=NOT_RUN\nprerequisite_source=unknown\nrunner_platform=unknown\nengine_package_version=unknown\nrequired_extras_version=unknown\nextras_package_version=unknown\ntools_present=NOT_RUN\napparmor_scope=rootlesskit\nprerequisite_reason=not_checked\nprerequisite_exit=unknown\nrootless_preflight=NOT_RUN\nworker_image_uid=NOT_RUN\nworker_image_id_sha256=unknown\nlibtest=NOT_RUN\ntest_selected=unknown\ntest_passed=unknown\ntest_failed=unknown\ntest_ignored=unknown\ntest_exit=unknown\nengine_cleanup=NOT_STARTED\nlast_phase=initialized\n' "$WORKFLOW_SHA" > "$receipt"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact source and workflow-only commit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          source=72fa713f7c0295d9582fa4439e88e5250c4ac8b5
          selector=real_cli_copies_a_project_and_exports_after_one_audited_worker
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/claude/v1-g03-linux-rootless-apt-recheck-20261122 &&
                "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" &&
                "$(git rev-parse HEAD^)" == "$source" && "$(git rev-parse "$source^")" == e7ace9772bc8e8399bb57e5688d147dcd8ca66ac &&
                "$(git diff --name-only "$source" HEAD)" == .github/workflows/lot-verify.yaml &&
                -z "$(git status --porcelain=v1 --untracked-files=all)" ]] &&
             git merge-base --is-ancestor "$source" HEAD &&
             grep -Fq 'async fn real_cli_copies_a_project_and_exports_after_one_audited_worker()' tests/runtime_user_journey.rs &&
             grep -Fq 'run.args(["--", "/usr/bin/id"]);' tests/runtime_user_journey.rs &&
             grep -Fq 'assert_eq!(worker["launch"]["network"], "none");' tests/runtime_user_journey.rs &&
             grep -Fq 'assert_eq!(worker["launch"]["image_id"], image);' tests/runtime_user_journey.rs &&
             grep -Fq 'stdout.contains("uid=1000")' tests/runtime_user_journey.rs &&
             grep -Fq 'USER 1000:1000' images/worker.Dockerfile &&
             grep -Fq '"--network",' tests/runtime_user_journey.rs; then
            set_field source_check PASS
            set_field workflow_check PASS
            set_field last_phase source_verified
          else
            set_field source_check FAIL
            set_field workflow_check FAIL
            set_field last_phase source_guard_failed
            exit 1
          fi

      - name: Prepare the private runner evidence area
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/g03-rootless-export"
          mkdir -m 700 "$private" "$private/tmp"
          printf 'G03_PRIVATE=%s\nTMPDIR=%s\n' "$private" "$private/tmp" >> "$GITHUB_ENV"
          printf 'ENGINE_PID_FILE=%s/engine.pid\n' "$private" >> "$GITHUB_ENV"
          sudo install -d -o "$(id -un)" -m 700 "/run/user/$(id -u)"
          printf 'DOCKER_HOST=unix:///run/user/%s/g03-rootless-export/docker.sock\n' "$(id -u)" >> "$GITHUB_ENV"
          mkdir -m 700 "/run/user/$(id -u)/g03-rootless-export"
          printf 'XDG_RUNTIME_DIR=/run/user/%s/g03-rootless-export\n' "$(id -u)" >> "$GITHUB_ENV"

      - name: Install rootless Docker prerequisites
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          rootless_result=BLOCKED
          rootless_source=unavailable
          rootless_reason=preflight_not_complete
          rootless_exit=0
          engine_version=unknown
          required_extras_version=unknown
          extras_version=unknown
          tools_present=false
          finish_prerequisite_receipt() {
            rc=$?
            if [[ "$rootless_result" != PASS && "$rc" != 0 ]]; then rootless_exit=$rc; fi
            set_field rootless_prerequisite "$rootless_result"
            set_field prerequisite_source "$rootless_source"
            set_field engine_package_version "$engine_version"
            set_field required_extras_version "$required_extras_version"
            set_field extras_package_version "$extras_version"
            if [[ "$tools_present" == true ]]; then set_field tools_present PASS; else set_field tools_present FAIL; fi
            set_field apparmor_scope rootlesskit
            set_field prerequisite_reason "$rootless_reason"
            set_field prerequisite_exit "$rootless_exit"
            set_field last_phase rootless_prerequisites
            if [[ "$rootless_result" != PASS ]]; then set_field rootless_preflight BLOCKED; fi
          }
          trap finish_prerequisite_receipt EXIT

          . /etc/os-release
          architecture=$(dpkg --print-architecture)
          if [[ "$ID" != ubuntu || "$VERSION_ID" != 24.04 || "$VERSION_CODENAME" != noble || "$architecture" != amd64 ]]; then
            rootless_reason=unsupported_ubuntu_platform
            exit 1
          fi
          set_field runner_platform ubuntu/24.04/noble/amd64
          engine_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce 2>/dev/null || true)
          observed_engine_version=unknown
          if [[ "$engine_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then
            candidate_engine_version=${BASH_REMATCH[1]}
            if [[ "$candidate_engine_version" =~ ^5:[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.~+_-]+~ubuntu\.24\.04~noble$ ]]; then
              observed_engine_version=$candidate_engine_version
              engine_version=$candidate_engine_version
            fi
          fi
          if [[ "$engine_version" == unknown ]]; then
            rootless_reason=compatible_docker_ce_package_absent
            exit 1
          fi
          required_extras_version="$engine_version"
          extras_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce-rootless-extras 2>/dev/null || true)
          if [[ "$extras_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then
            candidate_extras_version=${BASH_REMATCH[1]}
            if [[ "$candidate_extras_version" =~ ^5:[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.~+_-]+~ubuntu\.24\.04~noble$ ]]; then
              extras_version=$candidate_extras_version
            fi
          fi
          rootless_tools=(/usr/bin/dockerd-rootless.sh /usr/bin/dockerd-rootless-setuptool.sh /usr/bin/rootlesskit)
          tools_present=true
          for tool in "${rootless_tools[@]}"; do [[ -x "$tool" ]] || tools_present=false; done
          if [[ "$extras_version" == "$required_extras_version" && "$tools_present" == true ]]; then
            rootless_source=runner-preinstalled
            rootless_reason=runner_package_matches_installed_engine
            if ! sudo apt-get update > "$RUNNER_TEMP/g03-rootless-prerequisites.log" 2>&1; then
              rootless_reason=ubuntu_package_index_update_failed
              exit 1
            fi
            if ! sudo apt-get install --yes --no-install-recommends --no-upgrade \
              uidmap dbus-user-session slirp4netns fuse-overlayfs apparmor >> "$RUNNER_TEMP/g03-rootless-prerequisites.log" 2>&1; then
              rootless_reason=base_prerequisites_install_failed
              exit 1
            fi
          elif [[ "$extras_version" != unknown ]]; then
            rootless_reason=installed_rootless_extras_version_mismatch
            exit 1
          else
            rootless_source=official-signed-apt
            rootless_reason=checking_signed_candidate
            if ! sudo apt-get update > "$RUNNER_TEMP/g03-rootless-apt.log" 2>&1; then
              rootless_reason=ubuntu_package_index_update_failed
              exit 1
            fi
            if ! sudo apt-get install --yes --no-install-recommends --no-upgrade \
              uidmap dbus-user-session slirp4netns fuse-overlayfs apparmor ca-certificates curl gnupg \
              > "$RUNNER_TEMP/g03-rootless-apt-install.log" 2>&1; then
              rootless_reason=base_prerequisites_install_failed
              exit 1
            fi
            key="$RUNNER_TEMP/docker-g03.asc"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://download.docker.com/linux/ubuntu/gpg --output "$key" 2>> "$RUNNER_TEMP/g03-rootless-apt.log"
            test -s "$key"
            gpg --show-keys --with-colons "$key" > "$RUNNER_TEMP/docker-g03-key-metadata" 2>/dev/null
            test "$(grep -c '^pub:' "$RUNNER_TEMP/docker-g03-key-metadata")" = 1
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo install -m 0644 "$key" /etc/apt/keyrings/docker-g03.asc
            sudo tee /etc/apt/sources.list.d/docker-g03.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: noble
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker-g03.asc
          EOF
            if ! sudo apt-get update >> "$RUNNER_TEMP/g03-rootless-apt.log" 2>&1; then
              rootless_reason=signed_docker_repository_metadata_failed
              exit 1
            fi
            apt-cache madison docker-ce-rootless-extras > "$RUNNER_TEMP/g03-rootless-candidates"
            awk -v version="$required_extras_version" \
              '$3 == version && $5 == "https://download.docker.com/linux/ubuntu" { found=1 } END { exit !found }' \
              "$RUNNER_TEMP/g03-rootless-candidates" || {
                rootless_reason=signed_candidate_matching_engine_unavailable
                exit 1
              }
            plan="$RUNNER_TEMP/g03-rootless-install-plan"
            if ! sudo apt-get --simulate install --yes --no-install-recommends --no-upgrade \
              "docker-ce-rootless-extras=$required_extras_version" > "$plan" 2>&1; then
              rootless_reason=apt_plan_failed
              exit 1
            fi
            if grep -Eq '^(Inst|Remv) (docker-ce|docker-ce-cli|containerd.io)([[:space:]]|$)' "$plan"; then
              rootless_reason=apt_plan_would_change_existing_engine
              exit 1
            fi
            if ! sudo apt-get install --yes --no-install-recommends --no-upgrade \
              "docker-ce-rootless-extras=$required_extras_version" >> "$RUNNER_TEMP/g03-rootless-apt.log" 2>&1; then
              rootless_reason=matching_extras_install_failed
              exit 1
            fi
            extras_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce-rootless-extras 2>/dev/null || true)
            if [[ "$extras_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then
              candidate_extras_version=${BASH_REMATCH[1]}
              if [[ "$candidate_extras_version" =~ ^5:[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.~+_-]+~ubuntu\.24\.04~noble$ ]]; then
                extras_version=$candidate_extras_version
              fi
            fi
            current_engine_status=$(dpkg-query -W -f='${db:Status-Abbrev}\t${Version}' docker-ce 2>/dev/null || true)
            current_engine_version=unknown
            if [[ "$current_engine_status" =~ ^ii[[:space:]]+([^[:space:]]+)$ ]]; then current_engine_version=${BASH_REMATCH[1]}; fi
            tools_present=true
            for tool in "${rootless_tools[@]}"; do [[ -x "$tool" ]] || tools_present=false; done
            if [[ "$extras_version" != "$required_extras_version" || "$current_engine_version" != "$engine_version" || "$tools_present" != true ]]; then
              rootless_reason=installed_package_engine_or_tools_verification_failed
              exit 1
            fi
            rootless_reason=matching_official_package_installed
          fi
          if ! command -v apparmor_parser >/dev/null 2>&1; then
            rootless_reason=apparmor_parser_unavailable
            exit 1
          fi
          user=$(id -un)
          grep -q "^$user:" /etc/subuid || echo "$user:100000:65536" | sudo tee -a /etc/subuid >/dev/null
          grep -q "^$user:" /etc/subgid || echo "$user:100000:65536" | sudo tee -a /etc/subgid >/dev/null
          sudo install -d -o "$user" -m 700 "/run/user/$(id -u)"
          rootless_result=PASS
          tools_present=true

      - name: Allow user namespaces only for rootlesskit
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^last_phase=.*/last_phase=apparmor_rootlesskit_profile/' "$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          profile=qa-g03-rootlesskit
          {
            echo 'abi <abi/4.0>,'
            echo 'include <tunables/global>'
            echo 'profile qa-g03-rootlesskit /usr/bin/rootlesskit flags=(unconfined) {'
            echo '  userns,'
            echo '}'
          } | sudo tee "/etc/apparmor.d/$profile" >/dev/null
          sudo apparmor_parser -r "/etc/apparmor.d/$profile"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1

      - name: Start rootless Docker with the private socket
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase rootless_engine_start
          setsid dockerd-rootless.sh > "$G03_PRIVATE/dockerd.log" 2>&1 &
          echo "$!" > "$ENGINE_PID_FILE"
          ready=0
          for _ in $(seq 1 60); do
            if docker info >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            set_field rootless_preflight BLOCKED
            set_field last_phase rootless_engine_start
            exit 1
          fi
          if ! docker info --format '{{json .SecurityOptions}}' | jq -e 'any(.[]; contains("rootless"))' >/dev/null; then
            set_field rootless_preflight BLOCKED
            set_field last_phase rootless_mode_verification
            exit 1
          fi
          set_field rootless_preflight PASS
          set_field last_phase rootless_preflight_complete

      - name: Build and verify the immutable UID 1000 worker image
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase worker_image_build
          docker build --file images/worker.Dockerfile --build-arg CODEX_VERSION= --build-arg CLAUDE_CODE_VERSION= \
            --tag ai-guard-g03-worker:ci . > "$G03_PRIVATE/worker-build.log" 2>&1
          worker_id=$(docker image inspect --format '{{.Id}}' ai-guard-g03-worker:ci)
          [[ "$worker_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_user=$(docker image inspect --format '{{.Config.User}}' "$worker_id")
          [[ "$image_user" == 1000:1000 ]]
          printf 'AGENTSANDBOX_TEST_RUNTIME=docker\nAGENTSANDBOX_TEST_RUNTIME_PROGRAM=/usr/bin/docker\nAGENTSANDBOX_TEST_RUNTIME_ENDPOINT=%s\nDOCKER_HOST=%s\nAGENTSANDBOX_TEST_IMAGE=%s\n' \
            "$DOCKER_HOST" "$DOCKER_HOST" "$worker_id" >> "$GITHUB_ENV"
          set_field worker_image_uid PASS
          set_field worker_image_id_sha256 "${worker_id#sha256:}"
          set_field last_phase worker_image_verified

      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          set_field last_phase dependency_fetch
          if cargo fetch --locked > "$G03_PRIVATE/fetch.log" 2>&1; then
            set_field last_phase dependencies_fetched
          else
            rc=$?
            set_field dependency_fetch_exit "$rc"
            set_field last_phase dependency_fetch_failed
            exit "$rc"
          fi

      - name: Run the single local export journey
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          log="$G03_PRIVATE/test.log"
          selector=real_cli_copies_a_project_and_exports_after_one_audited_worker
          set_field last_phase targeted_libtest
          if timeout --signal=TERM --kill-after=15s 20m cargo test --locked --offline --test runtime_user_journey \
              -- --ignored --exact --test-threads=1 "$selector" > "$log" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          selected=0
          passed=0
          failed=0
          ignored=0
          grep -Fqx "test $selector ... ok" "$log" && { selected=1; passed=1; } || true
          grep -Fqx "test $selector ... FAILED" "$log" && { selected=1; failed=1; } || true
          summary=$(grep -E '^test result:' "$log" | tail -n 1 | sed -E 's/^test result:.* ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3/' || true)
          if [[ "$summary" =~ ^[0-9]+\ [0-9]+\ [0-9]+$ ]]; then
            read -r passed failed ignored <<< "$summary"
          fi
          if [[ "$rc" == 0 && "$selected" == 1 && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then
            verdict=PASS
            phase=export_journey_complete
          else
            verdict=FAIL
            phase=targeted_libtest_failed_or_unconfirmed
          fi
          set_field libtest "$verdict"
          set_field test_selected "$selected"
          set_field test_passed "$passed"
          set_field test_failed "$failed"
          set_field test_ignored "$ignored"
          set_field test_exit "$rc"
          set_field last_phase "$phase"
          [[ "$verdict" == PASS ]]

      - name: Stop only the rootless engine started by this job
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/g03-rootless-export-receipt.txt"
          [[ -f "$receipt" ]] || exit 0
          set_field() {
            local key=$1 value=$2
            awk -v p="$key=" -v r="$key=$value" 'index($0,p)==1 {print r; found=1; next} {print} END {if (!found) print r}' "$receipt" > "$receipt.pending"
            mv -- "$receipt.pending" "$receipt"
          }
          pid_file="$RUNNER_TEMP/g03-rootless-export/engine.pid"
          cleanup=NOT_STARTED
          if [[ -f "$pid_file" ]]; then
            pid=$(cat "$pid_file")
            pgid=$(ps -o pgid= -p "$pid" 2>/dev/null | tr -d ' ' || true)
            if [[ "$pid" =~ ^[0-9]+$ && "$pgid" == "$pid" ]]; then
              cleanup=CONFIRMED
              if kill -0 -- "-$pid" 2>/dev/null; then
                kill -TERM -- "-$pid" 2>/dev/null || true
                for _ in $(seq 1 10); do kill -0 -- "-$pid" 2>/dev/null || break; sleep 1; done
                kill -0 -- "-$pid" 2>/dev/null && cleanup=UNKNOWN
              fi
            else
              cleanup=UNKNOWN
            fi
          fi
          set_field engine_cleanup "$cleanup"

      - name: Upload the closed receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g03-rootless-export-${{ github.run_id }}
          path: ${{ runner.temp }}/g03-rootless-export-receipt.txt
          if-no-files-found: error
          retention-days: 14
