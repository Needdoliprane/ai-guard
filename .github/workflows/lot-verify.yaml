name: G07 provider batch lost receipt replay

on:
  push:
    branches:
      - claude/v1-g07-provider-batch-http-replay-check-20261123

permissions:
  contents: read

concurrency:
  group: g07-provider-batch-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SOURCE_SHA: 012a9d0e0212c3498861ac51805acd7479d51f96
      SOURCE_TREE_SHA: e02ca0da9e8afad1e2e949a74b568cf64cff75a2
      SOURCE_PARENT_SHA: a2b70dfdb64f593893fcc731f91abaabac0e16ad
      SOURCE_PARENT_TREE_SHA: 818b74ea130d28fc810b62ce0453a4e93db1f9d7
      EXPECTED_BRANCH: claude/v1-g07-provider-batch-http-replay-check-20261123
      SELECTOR: the_forwarder_recovers_a_lost_batch_receipt_after_reopening_spool_and_store
      AI_GUARD_BUILD_REVISION: ${{ github.sha }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
    steps:
      - name: Checkout exact Legacy SQLite source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Fetch locked dependencies and run the exact loopback regression
        id: regression
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          receipt="$RUNNER_TEMP/g07-provider-batch-replay-receipt.txt"
          scratch=""
          printf 'schema=1\nsource_sha=%s\nsource_tree_sha=%s\nsource_parent_sha=%s\nsource_parent_tree_sha=%s\nworkflow_sha=%s\nworkflow_parent=unknown\nselector=%s\nprofile=no-default-features\ncargo_lock_sha256=unknown\nrust_toolchain_sha256=unknown\ncheckout=NOT_RUN\nsource_guard=NOT_RUN\ndisk_preflight=NOT_RUN\nrustc_version=NOT_RUN\ncargo_version=NOT_RUN\ndependency_fetch=NOT_RUN\ndependency_fetch_exit=NOT_RUN\ncargo_test_exit=NOT_RUN\nlibtest_summary=NOT_RUN\nselected_tests=NOT_RUN\npassed_tests=NOT_RUN\nfailed_tests=NOT_RUN\nignored_tests=NOT_RUN\nexact_test_line=NOT_RUN\nrust_error_code_count=0\nrust_error_codes=none\nprivate_scratch_cleanup=NOT_RUN\nresult=NOT_RUN\nscope=single loopback regression; no engine, external network, or provider invoked\n' \
            "$SOURCE_SHA" "$SOURCE_TREE_SHA" "$SOURCE_PARENT_SHA" "$SOURCE_PARENT_TREE_SHA" "$GITHUB_SHA" "$SELECTOR" > "$receipt"
          chmod 600 "$receipt"
          result=FAIL
          set_field() {
            local key=$1 value=$2
            awk -F= -v key="$key" -v value="$value" '$1==key{$0=key "=" value} {print}' "$receipt" > "$receipt.next"
            mv -- "$receipt.next" "$receipt"
          }
          finish() {
            local code=$? cleanup_rc=0
            trap - EXIT
            set +e
            if [[ -n "$scratch" && "$scratch" == "$RUNNER_TEMP/g07-batch-replay."* ]]; then
              rm -rf -- "$scratch" >/dev/null 2>&1 || cleanup_rc=1
              [[ ! -e "$scratch" ]] || cleanup_rc=1
            fi
            if (( cleanup_rc == 0 )); then set_field private_scratch_cleanup PASS; else set_field private_scratch_cleanup FAIL; code=1; fi
            if (( code == 0 && cleanup_rc == 0 )); then result=PASS; fi
            set_field result "$result"
            {
              printf 'G07 provider batch replay result=%s\n' "$result"
              grep -E '^(source_guard|disk_preflight|rustc_version|cargo_version|dependency_fetch|dependency_fetch_exit|cargo_test_exit|libtest_summary|selected_tests|passed_tests|failed_tests|ignored_tests|exact_test_line|rust_error_code_count|rust_error_codes|private_scratch_cleanup|result)=' "$receipt"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          }
          trap finish EXIT

          workflow_parent="$(git show -s --format=%P HEAD 2>/dev/null || true)"
          set_field workflow_parent "$workflow_parent"
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$EXPECTED_BRANCH" &&
                "$(git rev-parse HEAD 2>/dev/null)" == "$GITHUB_SHA" &&
                "$(git status --porcelain=v1 --untracked-files=all 2>/dev/null)" == "" &&
                "$workflow_parent" == "$SOURCE_SHA" &&
                "$(git diff --name-only "$SOURCE_SHA" HEAD 2>/dev/null)" == .github/workflows/lot-verify.yaml &&
                "$(git rev-parse "$SOURCE_SHA^{tree}" 2>/dev/null)" == "$SOURCE_TREE_SHA" &&
                "$(git show -s --format=%P "$SOURCE_SHA" 2>/dev/null)" == "$SOURCE_PARENT_SHA" &&
                "$(git rev-parse "$SOURCE_PARENT_SHA^{tree}" 2>/dev/null)" == "$SOURCE_PARENT_TREE_SHA" &&
                "$(git rev-parse --is-shallow-repository 2>/dev/null)" == true ]]; then
            set_field source_guard PASS
            set_field checkout PASS
          else
            set_field source_guard FAIL
            exit 1
          fi

          lock_sha="$(git show "$SOURCE_SHA:Cargo.lock" | sha256sum | awk '{print $1}')"
          toolchain_sha="$(git show "$SOURCE_SHA:rust-toolchain.toml" | sha256sum | awk '{print $1}')"
          set_field cargo_lock_sha256 "$lock_sha"
          set_field rust_toolchain_sha256 "$toolchain_sha"
          if [[ "$lock_sha" == 7220693670750b775de6b4a4380101ff86165c976e4b520b9ac7037ac2b5e40c &&
                "$toolchain_sha" == d13306be0ecda81ce779baa290ffb417380d525928477f16200884b5169cca33 ]]; then
            :
          else
            set_field source_guard FAIL
            exit 1
          fi

          free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [[ "$free_kb" =~ ^[0-9]+$ ]] && (( free_kb >= 5242880 )); then set_field disk_preflight PASS; else set_field disk_preflight FAIL; exit 1; fi
          rustc_line="$(rustc --version 2>/dev/null)" || rustc_line=''
          cargo_line="$(cargo --version 2>/dev/null)" || cargo_line=''
          if [[ "$rustc_line" =~ ^rustc\ 1\.99\.1($|[[:space:]]) && "$cargo_line" =~ ^cargo\ 1\.99\.1($|[[:space:]]) ]]; then
            set_field rustc_version 1.99.1
            set_field cargo_version 1.99.1
          else
            set_field rustc_version MISMATCH
            set_field cargo_version MISMATCH
            exit 1
          fi

          scratch="$(mktemp -d "$RUNNER_TEMP/g07-batch-replay.XXXXXX")" || exit 1
          chmod 700 "$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          fetch_rc=0
          timeout --kill-after=10s 20m cargo fetch --locked > "$scratch/fetch.log" 2>&1 || fetch_rc=$?
          set_field dependency_fetch_exit "$fetch_rc"
          if (( fetch_rc == 0 )); then set_field dependency_fetch PASS; else set_field dependency_fetch FAIL; exit 1; fi

          test_rc=0
          timeout --kill-after=10s 25m cargo test --locked --offline --no-default-features --test provider_activity_live "$SELECTOR" -- --exact \
            > "$scratch/test.stdout" 2> "$scratch/test.stderr" || test_rc=$?
          set_field cargo_test_exit "$test_rc"
          error_codes="$scratch/rust-error-codes.txt"
          sed -nE 's/^error\[(E[0-9]{4})\].*/\1/p' "$scratch/test.stderr" | sort -u > "$error_codes" || true
          code_count="$(awk 'END {print NR+0}' "$error_codes")"
          codes=none
          if (( code_count > 0 )); then codes="$(paste -sd, "$error_codes")"; fi
          set_field rust_error_code_count "$code_count"
          set_field rust_error_codes "$codes"

          running="$(grep -Ecx '^running 1 test$' "$scratch/test.stdout" || true)"
          if [[ -z "$running" ]]; then running=0; fi
          passed_line="$(grep -Fxc "test $SELECTOR ... ok" "$scratch/test.stdout" || true)"
          summary="$(grep -E '^test result: (ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored; [0-9]+ measured; [0-9]+ filtered out; finished in [0-9.]+s$' "$scratch/test.stdout" | tail -n 1 || true)"
          if [[ -n "$summary" ]]; then
            set_field libtest_summary FOUND
            counts="$(printf '%s\n' "$summary" | sed -E 's/^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;.*/\1 \2 \3 \4/')"
            read -r outcome passed failed ignored <<< "$counts"
            set_field passed_tests "$passed"
            set_field failed_tests "$failed"
            set_field ignored_tests "$ignored"
          else
            set_field libtest_summary NOT_FOUND
            set_field passed_tests unknown
            set_field failed_tests unknown
            set_field ignored_tests unknown
            outcome=unknown
            passed=unknown
            failed=unknown
            ignored=unknown
          fi
          set_field selected_tests "$running"
          if (( test_rc == 0 )) && [[ "$running" == 1 && "$passed_line" == 1 &&
                "$outcome" == ok && "$passed" == 1 && "$failed" == 0 && "$ignored" == 0 ]]; then
            set_field exact_test_line PASS
            result=PASS
          else
            set_field exact_test_line FAIL
            exit 1
          fi

      - name: Upload only the closed test receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g07-provider-batch-replay-${{ github.sha }}
          path: ${{ runner.temp }}/g07-provider-batch-replay-receipt.txt
          if-no-files-found: error
          retention-days: 14
