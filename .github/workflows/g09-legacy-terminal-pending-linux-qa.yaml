name: G09 Legacy terminal pending Writer Linux QA

on:
  push:
    branches: [codex/g09-legacy-terminal-pending-linux-qa-20261128]
    paths: [.github/workflows/g09-legacy-terminal-pending-linux-qa.yaml]

permissions:
  contents: read

jobs:
  legacy-terminal-pending:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: bef88d1647c945f57df9cd85310d7117f5f7bf39
      SOURCE_TREE: a32658d5770102f655f34a7beeaebe9cb8e1e82a
      SERVICE_BLOB: ea1873934c73e30d04645643068f86fb31d17502
      ORACLE_BLOB: 2d8270ad7d4e432eb41a92814118d489ac1d679e
      WRITER_BLOB: 21d7b2b55938c7004ee621c8cff5e952b81fc840
      PROJECTION_BLOB: 03dde65d2d9edbbef111af70d3c1d084623536bd
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Build one libtest and verify the first retained Legacy terminal observation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          selector='broker::writer::legacy_worker_terminal_tests::stops_writer_retains_the_first_terminal_observation_across_later_stops'

          report_not_run() {
            printf 'test=%s status=NOT_RUN\n' "$selector"
          }

          if [[ "${GITHUB_REF:-}" != refs/heads/codex/g09-legacy-terminal-pending-linux-qa-20261128 ||
                "$(git rev-parse HEAD)" != "$SOURCE_SHA" ||
                "$(git rev-parse 'HEAD^{tree}')" != "$SOURCE_TREE" ||
                "$(git rev-parse HEAD:src/broker/service/legacy_worker_terminal.rs)" != "$SERVICE_BLOB" ||
                "$(git rev-parse HEAD:src/broker/writer/legacy_worker_terminal_tests.rs)" != "$ORACLE_BLOB" ||
                "$(git rev-parse HEAD:src/broker/writer.rs)" != "$WRITER_BLOB" ||
                "$(git rev-parse HEAD:src/broker/journal/recovery/legacy_worker_terminal.rs)" != "$PROJECTION_BLOB" ]]; then
            printf 'source=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'source=PASS\nsource_sha=%s\nsource_tree=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"
          printf 'service_blob=%s\noracle_blob=%s\nwriter_blob=%s\nprojection_blob=%s\n' "$SERVICE_BLOB" "$ORACLE_BLOB" "$WRITER_BLOB" "$PROJECTION_BLOB"
          export AI_GUARD_BUILD_REVISION="$SOURCE_SHA"

          emit_cargo_errors() {
            local report
            report=$(jq -cs '
              [.[] | select(.reason == "compiler-message" and .message.level == "error") | .message |
                {code: ((.code.code // "uncoded") | if test("^E[0-9]{4}$") then . else "uncoded" end),
                 site: ([.spans[]? | select(.is_primary == true
                     and (.file_name | test("^(src|tests)/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+[.]rs$"))
                     and (.file_name | length) <= 240
                     and (.line_start | type) == "number"
                     and (.column_start | type) == "number")
                   | {file: .file_name, line: .line_start, column: .column_start}] | .[0])}]
              | .[0:16]' "$1" 2>/dev/null) || return 1
            printf 'rust_diagnostics=%s\n' "$report"
          }

          # The synthetic Stops2 guardian binds a Unix socket below TMPDIR.
          scratch=$(mktemp -d /tmp/aig-g09.XXXXXX)
          trap 'rm -rf -- "$scratch"' EXIT
          export TMPDIR="$scratch"
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"

          if ! cargo fetch --locked >"$scratch/fetch.log" 2>&1; then
            printf 'fetch=FAIL\nbuild=NOT_RUN\n'
            report_not_run
            exit 1
          fi
          printf 'fetch=PASS\n'

          if cargo test --locked --offline -j1 --no-default-features --lib --no-run \
              --message-format=json >"$build_json" 2>"$scratch/build.stderr"; then
            printf 'build=PASS\n'
          else
            rc=$?
            printf 'build=FAIL\nbuild_exit=%s\n' "$rc"
            emit_cargo_errors "$build_json" || printf 'rust_diagnostics=unavailable\n'
            report_not_run
            exit 1
          fi

          if ! libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact"
              and .target.name == "agentsandbox" and .target.kind == ["lib"]
              and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$libtest" != "$CARGO_TARGET_DIR"/debug/deps/agentsandbox-* ||
                 ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          checksum=$(sha256sum -- "$libtest")
          libtest_sha=${checksum%% *}
          if [[ ! "$libtest_sha" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'libtest=PASS\nlibtest_sha256=%s\n' "$libtest_sha"

          log="$scratch/test.log"
          test_exit=0
          { timeout --kill-after=10s 180s "$libtest" --exact "$selector" --test-threads=1 \
            --color never; } >"$log" 2>&1 || test_exit=$?
          if [[ "$test_exit" == 0 ]] &&
              [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] &&
              [[ "$(grep -Fxc "test $selector ... ok" "$log" || true)" == 1 ]] &&
              [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$log" || true)" == 1 ]]; then
            printf 'test=%s status=PASS\ntest_exit=0\ntest_pass_count=1\ntest_fail_count=0\n' "$selector"
          else
            printf 'test=%s status=FAIL\ntest_exit=%s\n' "$selector" "$test_exit"
            grep -m 1 -Eo 'panicked at src/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+[.]rs:[0-9]+:[0-9]+' "$log" || true
            if grep -q '^Error: ' "$log"; then
              printf 'libtest_result_error=true\n'
            fi
            exit 1
          fi
