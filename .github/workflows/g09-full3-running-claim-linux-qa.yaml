name: G09 Full3 Running claim Linux QA

on:
  push:
    branches: [codex/g09-full3-running-claim-linux-qa-20261128]
    paths: [.github/workflows/g09-full3-running-claim-linux-qa.yaml]

permissions:
  contents: read

jobs:
  full3-running-claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 5ce07208a0719e4cb124ab9430c3f0d27957f4f5
      SOURCE_TREE: 8b111f931890a6b71dd75cb2de3dfda8f3aea1c0
      SOURCE_PUBLIC_BASE_SHA: ec0346a0a11314a5272fff23b9323d1d8a126d16
      JOURNAL_BLOB: 1f1b2f14aa5b7a48c837d6263b370b5e4ce3c3bd
      FIXTURE_BLOB: 45ac988c872d1321017918a3a3a251b262d4b480
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      LC_ALL: C
      RUST_MIN_STACK: '8388608'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 5
          persist-credentials: false

      - name: Build one libtest and verify Full3 Running claim recovery
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          selector=runner::broker::executor::journal::tests::cancelled_recovery_tests::fixture::full3_worker_claim_and_stop_survive_journal_reopen
          fixture_file=src/runner/broker/executor/cancelled_recovery_fixture.rs
          journal_file=src/broker/journal/recovery.rs
          report_not_run() {
            printf 'test=%s status=NOT_RUN\n' "$selector"
          }
          if [[ "${GITHUB_REF:-}" != refs/heads/codex/g09-full3-running-claim-linux-qa-20261128 ||
                "$(git rev-parse HEAD 2>/dev/null)" != "$SOURCE_SHA" ||
                "$(git rev-parse 'HEAD^{tree}' 2>/dev/null)" != "$SOURCE_TREE" ||
                "$(git rev-parse 'HEAD~4' 2>/dev/null)" != "$SOURCE_PUBLIC_BASE_SHA" ||
                "$(git rev-parse "HEAD:$journal_file" 2>/dev/null)" != "$JOURNAL_BLOB" ||
                "$(git rev-parse "HEAD:$fixture_file" 2>/dev/null)" != "$FIXTURE_BLOB" ||
                ! -f "$journal_file" || -L "$journal_file" ||
                ! -f "$fixture_file" || -L "$fixture_file" ||
                "$(git hash-object --no-filters -- "$journal_file" 2>/dev/null)" != "$JOURNAL_BLOB" ||
                "$(git hash-object --no-filters -- "$fixture_file" 2>/dev/null)" != "$FIXTURE_BLOB" ||
                "$RUST_MIN_STACK" != 8388608 ]]; then
            printf 'source=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'source=PASS\nsource_sha=%s\nsource_tree=%s\npublic_base_sha=%s\njournal_blob=%s\nfixture_blob=%s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" "$SOURCE_PUBLIC_BASE_SHA" "$JOURNAL_BLOB" "$FIXTURE_BLOB"
          printf 'test_stack_bytes=%s\n' "$RUST_MIN_STACK"
          export AI_GUARD_BUILD_REVISION="$SOURCE_SHA"

          # Keep both local peers and Unix sockets under a private short root.
          scratch=$(mktemp -d /tmp/aig-g09.XXXXXX)
          chmod 700 "$scratch"
          trap 'find "$scratch" -depth -mindepth 1 -delete; rmdir "$scratch"' EXIT
          export TMPDIR="$scratch" AI_GUARD_TEST_D5_IPC_ROOT="$scratch"
          legacy_endpoint="$scratch/cd-000000/enforcer/endpoints/i-0000000000000000/s"
          full3_endpoint="$scratch/f3r-000000/role/endpoints/i-0000000000000000/s"
          if [[ "$scratch" != "$(realpath -- "$scratch")" ]] ||
              (( ${#legacy_endpoint} > 103 || ${#full3_endpoint} > 103 )); then
            printf 'fixture_socket_path=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'fixture_socket_path=PASS\nlegacy_socket_bytes=%s\nfull3_socket_bytes=%s\n' \
            "${#legacy_endpoint}" "${#full3_endpoint}"
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"
          if ! cargo fetch --locked >"$scratch/fetch.log" 2>&1; then
            printf 'fetch=FAIL\nbuild=NOT_RUN\n'
            report_not_run
            exit 1
          fi
          printf 'fetch=PASS\n'
          if cargo test --locked --offline -j1 --no-default-features --lib --no-run \
              --message-format=json >"$build_json" 2>"$scratch/build.stderr"; then
            printf 'build=PASS\n'
          else
            rc=$?
            printf 'build=FAIL\nbuild_exit=%s\n' "$rc"
            jq -cs '[.[] | select(.reason == "compiler-message" and .message.level == "error") | .message |
              {code: ((.code.code // "uncoded") | if test("^E[0-9]{4}$") then . else "uncoded" end),
               site: ([.spans[]? | select(.is_primary == true and (.file_name | test("^(src|tests)(/[A-Za-z0-9_-]+)+[.]rs$"))
                 and (.line_start | type) == "number") | {file: .file_name, line: .line_start}] | .[0])}]
              | .[0:12]' "$build_json" 2>/dev/null | sed 's/^/compiler_diagnostic=/' || true
            report_not_run
            exit 1
          fi
          if ! libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox"
              and .target.kind == ["lib"] and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$libtest" != "$CARGO_TARGET_DIR"/debug/deps/agentsandbox-* || ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          checksum=$(sha256sum -- "$libtest")
          libtest_sha=${checksum%% *}
          if [[ ! "$libtest_sha" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'libtest=PASS\nlibtest_sha256=%s\n' "$libtest_sha"

          if ! timeout --kill-after=2s 15s "$libtest" --exact "$selector" --list --color never >"$scratch/selection.log" 2>&1 ||
              [[ "$(grep -Fxc "$selector: test" "$scratch/selection.log" || true)" != 1 ]]; then
            printf 'selection=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'selection=PASS\n'
          log="$scratch/test.log"
          test_exit=0
          timeout --kill-after=10s 300s "$libtest" --exact "$selector" --test-threads=1 --color never \
            >"$log" 2>&1 || test_exit=$?
          if [[ "$test_exit" == 0 ]] &&
              [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] &&
              [[ "$(grep -Fxc "test $selector ... ok" "$log" || true)" == 1 ]] &&
              [[ "$(grep -Ec '^test result: ok[.] 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$log" || true)" == 1 ]]; then
            printf 'test=%s status=PASS\ntest_exit=0\ntest_pass_count=1\ntest_fail_count=0\n' "$selector"
          else
            printf 'test=%s status=FAIL\ntest_exit=%s\n' "$selector" "$test_exit"
            grep -m 1 -Eo 'panicked at (src|tests)(/[A-Za-z0-9_-]+)+[.]rs:[0-9]+:[0-9]+' "$log" || true
            if grep -q '^Error: ' "$log"; then printf 'libtest_result_error=true\n'; fi
            exit 1
          fi
