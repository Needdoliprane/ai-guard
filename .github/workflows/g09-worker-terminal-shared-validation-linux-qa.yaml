name: G09 shared Worker terminal validation Linux QA

on:
  push:
    branches: [codex/g09-worker-terminal-shared-validation-linux-qa-20261128]
    paths: [.github/workflows/g09-worker-terminal-shared-validation-linux-qa.yaml]

permissions:
  contents: read

jobs:
  shared-worker-terminal-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 7dff1db5da8563ccd160be78fd2fc6145ee4f9f5
      SOURCE_TREE: 352889b421d77adef8e5f5c0912ff031d18708fe
      LEGACY_TERMINAL_BLOB: 0e49afc570669ff783e8bf117a0f7e7602785b69
      SERVER_BLOB: 29119459232f0ee980ba44b7bbf3f50cb43818d4
      TERMINAL_TESTS_BLOB: 20fe027b65de6c32a3b6974cbe726a1072411531
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      RUST_MIN_STACK: '8388608'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Build one libtest and verify shared terminal validation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          [[ "$RUST_MIN_STACK" == 8388608 ]]
          selectors=(
            broker::service::server::legacy_worker_terminal::tests::legacy_terminal_observation_must_match_the_retained_created_and_claim_facts
          )
          report_not_run() {
            local selector
            for selector in "${selectors[@]}"; do printf 'test=%s status=NOT_RUN\n' "$selector"; done
          }
          if [[ "${GITHUB_REF:-}" != refs/heads/codex/g09-worker-terminal-shared-validation-linux-qa-20261128 ||
                "$(git rev-parse HEAD)" != "$SOURCE_SHA" ||
                "$(git rev-parse 'HEAD^{tree}')" != "$SOURCE_TREE" ||
                "$(git rev-parse HEAD:src/broker/service/legacy_worker_terminal.rs)" != "$LEGACY_TERMINAL_BLOB" ||
                "$(git rev-parse HEAD:src/broker/service/server.rs)" != "$SERVER_BLOB" ||
                "$(git rev-parse HEAD:src/broker/service/legacy_worker_terminal_tests.rs)" != "$TERMINAL_TESTS_BLOB" ]]; then
            printf 'source=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'source=PASS\nsource_sha=%s\nsource_tree=%s\nlegacy_terminal_blob=%s\nserver_blob=%s\nterminal_tests_blob=%s\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" "$LEGACY_TERMINAL_BLOB" "$SERVER_BLOB" "$TERMINAL_TESTS_BLOB"
          export AI_GUARD_BUILD_REVISION="$SOURCE_SHA"

          # The native seed opens a Unix socket below this directory.
          scratch=$(mktemp -d /tmp/aig-g09.XXXXXX)
          chmod 700 "$scratch"
          trap 'find "$scratch" -depth -mindepth 1 -delete; rmdir "$scratch"' EXIT
          export TMPDIR="$scratch"
          fixture_endpoint="$TMPDIR/cd-000000/enforcer/endpoints/i-0000000000000000/s"
          if (( ${#fixture_endpoint} > 103 )); then
            printf 'fixture_socket_path=FAIL\n'
            report_not_run
            exit 1
          fi
          printf 'fixture_socket_path=PASS\n'
          export CARGO_TARGET_DIR="$scratch/target"
          build_json="$scratch/build.jsonl"
          if ! cargo fetch --locked >"$scratch/fetch.log" 2>&1; then
            printf 'fetch=FAIL\nbuild=NOT_RUN\n'
            report_not_run
            exit 1
          fi
          printf 'fetch=PASS\n'
          if cargo test --locked --offline -j1 --no-default-features --lib --no-run \
              --message-format=json >"$build_json" 2>"$scratch/build.stderr"; then
            printf 'build=PASS\n'
          else
            rc=$?
            printf 'build=FAIL\nbuild_exit=%s\n' "$rc"
            report=$(jq -cs '[.[] | select(.reason == "compiler-message" and .message.level == "error") | .message |
              {code: ((.code.code // "uncoded") | if test("^E[0-9]{4}$") then . else "uncoded" end),
               site: ([.spans[]? | select(.is_primary == true and (.file_name | test("^(src|tests)(/[A-Za-z0-9_-]+)+[.]rs$"))
                 and (.line_start | type) == "number" and (.column_start | type) == "number")
                 | {file: .file_name, line: .line_start, column: .column_start}] | .[0])}]
              | .[0:16]' "$build_json" 2>/dev/null) || report=unavailable
            printf 'rust_diagnostics=%s\n' "$report"
            report_not_run
            exit 1
          fi
          if ! libtest=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .target.name == "agentsandbox"
              and .target.kind == ["lib"] and .profile.test == true and (.executable | type) == "string") | .executable]
              | unique | select(length == 1) | .[0]' "$build_json" 2>/dev/null) ||
              [[ "$libtest" != "$CARGO_TARGET_DIR"/debug/deps/agentsandbox-* || ! -f "$libtest" || ! -x "$libtest" || -L "$libtest" ]]; then
            printf 'libtest=FAIL\n'
            report_not_run
            exit 1
          fi
          checksum=$(sha256sum -- "$libtest")
          libtest_sha=${checksum%% *}
          if [[ ! "$libtest_sha" =~ ^[0-9a-f]{64}$ ]]; then printf 'libtest=FAIL\n'; report_not_run; exit 1; fi
          printf 'libtest=PASS\nlibtest_sha256=%s\n' "$libtest_sha"

          failed=0
          for selector in "${selectors[@]}"; do
            log="$scratch/test.log"
            test_exit=0
            { timeout --kill-after=10s 180s "$libtest" --exact "$selector" --test-threads=1 --color never; } \
              >"$log" 2>&1 || test_exit=$?
            if [[ "$test_exit" == 0 ]] &&
                [[ "$(grep -Fxc 'running 1 test' "$log" || true)" == 1 ]] &&
                [[ "$(grep -Fxc "test $selector ... ok" "$log" || true)" == 1 ]] &&
                [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+([.][0-9]+)?s$' "$log" || true)" == 1 ]]; then
              printf 'test=%s status=PASS\ntest_exit=0\ntest_pass_count=1\ntest_fail_count=0\n' "$selector"
            else
              printf 'test=%s status=FAIL\ntest_exit=%s\n' "$selector" "$test_exit"
              grep -m 1 -Eo 'panicked at (src|tests)(/[A-Za-z0-9_-]+)+[.]rs:[0-9]+:[0-9]+' "$log" || true
              if grep -q '^Error: ' "$log"; then printf 'libtest_result_error=true\n'; fi
              failed=1
            fi
          done
          exit "$failed"
