[package]
name = "agentsandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local container sandbox and verifiable agent supervision"
license = "Apache-2.0"
publish = false
default-run = "agentsandbox"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["json", "query", "tokio", "http1"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "=0.12.1"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
