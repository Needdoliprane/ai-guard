[package]
name = "agentsandbox"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
description = "Local container sandbox and verifiable agent supervision"
license = "Apache-2.0"
publish = false
default-run = "agentsandbox"

[features]
mysql-storage = ["dep:mysql_async"]

[dependencies]
anyhow = "1"
arc-swap = { version = "=1.9.4", default-features = false }
async-stream = "0.3"
base64 = "=0.22.1"
axum = { version = "0.8.9", features = ["json", "query", "tokio", "http1"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hmac = "=0.12.1"
httparse = "=1.10.1"
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "service", "tokio"] }
libc = "0.2"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"], optional = true }
openidconnect = { version = "=4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "=0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "=0.7.1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[example]]
name = "mysql_storage_probe"
required-features = ["mysql-storage"]

[[test]]
name = "mysql_audit_store"
required-features = ["mysql-storage"]

[profile.release]
lto = "thin"
strip = true
